    // BLOQUE 1: Anatomía, Fisiología y Patología del Sistema Biliar / Apéndice (1-20)
    {
        id: 1, 
        question: "En Epidemiología, ¿cuál es la incidencia acumulada de apendicitis aguda a lo largo de la vida en hombres de acuerdo a la GPC?", 
        options: ["8.6%", "6.7%", "12.1%", "5.3%"],

        justification: "Justificación: De acuerdo al libro de Principios de Cirugía de Schwartz, la apendicitis aguda es una de las emergencias abdominales más comunes a nivel mundial. Presenta diferencias epidemiológicas claras por sexo; tiene una incidencia acumulada a lo largo de la vida del 8.6% en hombres y de 6.7% en mujeres. La mayor tasa de presentación ocurre en la segunda y tercera décadas de la vida.<br><br>Perla Quirúrgica: La inflamación del apéndice es un problema importante de salud pública con una incidencia a lo largo de la vida del 8.6% en hombres y del 6.7% en mujeres, con la mayor incidencia en la segunda y tercera década de la vida.<br><br>Análisis de Distractores: La opción B representa la incidencia acumulada a lo largo de la vida en el sexo femenino, no en el masculino. Las opciones C y D son porcentajes ficticios no descritos en la epidemiología clásica de la GPC.", 
        source: "Schwartz Principios de Cirugía, 11.ª edición, 2019, Capítulo 30: El Apéndice, Página 1."

    {
        id: 2,

        answer: 0, 
        justification: "Justificación: El apéndice cecal se origina del intestino medio embrionario, junto con el íleon y el colon. De acuerdo al libro de Principios de Cirugía de Schwartz, el esbozo apendicular aparece por primera vez a la semana 8 de gestación. Conforme ocurre la rotación medial del intestino, el ciego se fija en el cuadrante inferior derecho, determinando la ubicación anatómica final del órgano.<br><br>Perla Quirúrgica: El apéndice, junto con el íleon y el colon, se desarrolla a partir del intestino medio y aparece por primera vez a las 8 semanas de gestación.<br><br>Análisis de Distractores: La opción B es incorrecta pues en la semana 4 solo se ha delimitado el tubo intestinal primitivo. La opción C es falsa, a la semana 12 ya se completó el retorno del asa herniada. La opción D corresponde al inicio de la herniación fisiológica del intestino medio.", 
        source: "Schwartz Principios de Cirugía, 11.ª edición, 2019, Capítulo 30: El Apéndice, Página 1."

    {
        id: 3, 
        question: "En Anatomía, ¿cuál es la longitud promedio habitual del apéndice cecal en el paciente adulto de acuerdo a la GPC?",

        justification: "Justificación: El apéndice cecal es un verdadero divertículo del ciego que posee todas las capas histológicas colónicas. De acuerdo al libro de Principios de Cirugía de Schwartz, el apéndice cecal adulto normal mide en promedio de 6 a 9 cm de longitud.<br><br>Perla Quirúrgica: El apéndice promedio mide de 6 a 9 cm y deriva su suministro de sangre de la rama apendicular de la arteria ileocólica.<br><br>Análisis de Distractores: La opción B corresponde a un órgano anormalmente hipoplásico o corto. Las opciones C y D representan longitudes que exceden el rango promedio del apéndice, clasificándose como dolicoapéndices.", 
        source: "Schwartz Principios de Cirugía, 11.ª edición, 2019, Capítulo 30: El Apéndice, Página 1." 
    },
    {
        id: 4, 
        question: "En Anatomía, ¿de qué rama arterial deriva directamente el suministro vascular del apéndice cecal de acuerdo a la GPC?", 
        options: ["Arteria ileocólica", "Arteria cólica derecha", "Arteria mesentérica inferior", "Arteria cólica media"], 
        answer: 0, 
        justification: "Justificación: La irrigación arterial apendicular corre a cargo de la arteria apendicular. De acuerdo al libro de Principios de Cirugía de Schwartz, esta arteria es una rama directa de la arteria ileocólica, la cual proviene de la arteria mesentérica superior (eje del intestino medio).<br><br>Perla Quirúrgica: El apéndice promedio mide de 6 a 9 cm y deriva su suministro de sangre de la rama apendicular de la arteria ileocólica.<br><br>Análisis de Distractores: La opción B irriga el colon ascendente y no emite la arteria apendicular. La opción C irriga el colon izquierdo, derivado del intestino posterior. La opción D irriga el colon transverso y carece de relación anatómica directa con el apéndice.", 
        source: "Schwartz Principios de Cirugía, 11.ª edición, 2019, Capítulo 30: El Apéndice, Página 1." 
    },
    {
        id: 5, 
        question: "En Anatomía, ¿cuál es el porcentaje de localización retroperitoneal que puede presentar el apéndice cecal de acuerdo a la GPC?", 
        options: ["7%", "30%", "65%", "12%"], 
        answer: 0, 
        justification: "Justificación: El apéndice es un órgano con múltiples variaciones de posición debido a la fijación incompleta del ciego. De acuerdo al libro de Principios de Cirugía de Schwartz, aunque lo más frecuente es que sea intraperitoneal y retrocecal, presenta una localización pélvica en el 30% de los casos y una localización retroperitoneal fija en el 7% de los pacientes.<br><br>Perla Quirúrgica: El apéndice es intraperitoneal y retrocecal en ubicación, pero puede ser pélvico (30%) y retroperitoneal (7%).<br><br>Análisis de Distractores: La opción B es la frecuencia de localización pélvica. La opción C es un valor estadístico que algunas series clásicas atribuyen a la posición retrocecal libre, pero no a la retroperitoneal estricta. La opción D representa un distractor plausible sin correlación con la evidencia del libro de texto.", 
        source: "Schwartz Principios de Cirugía, 11.ª edición, 2019, Capítulo 30: El Apéndice, Página 1." 
    },
    {
        id: 6, 
        question: "En Inmunología, ¿cuál es el mecanismo inmunológico que explica la protección de una apendicectomía temprana contra el desarrollo de Colitis Ulcerosa de acuerdo a la GPC?", 
        options: ["Liberación de dímeros de IgA y respuesta Th2 mediada por IL-13", "Supresión de células secretoras de IgG y respuesta Th1", "Aumento local de IL-10 y respuesta de memoria Th17", "Producción sistémica de dímeros de IgM y respuesta por IL-4"], 
        answer: 0, 
        justification: "Justificación: El apéndice participa en la maduración del tejido linfoide asociado al intestino (GALT). De acuerdo al libro de Principios de Cirugía de Schwartz, se ha propuesto que la extirpación apendicular temprana altera favorablemente la inmunidad mucosa intestinal contra la colitis ulcerosa. Este efecto protector se asocia a la liberación de formas diméricas de IgA de las células plasmáticas B y una respuesta inmunitaria regulada tipo Th2, mediada por la citocina IL-13 de células T asesinas naturales.<br><br>Perla Quirúrgica: El efecto protector de una apendicectomía temprana contra el desarrollo de colitis ulcerosa se ha propuesto que está mecánicamente ligado a la liberación de formas diméricas de IgA de las células plasmáticas B y la respuesta Th2 mediada por células T asesinas naturales productoras de IL-13.<br><br>Análisis de Distractores: La opción B es incorrecta ya que la interrelación con el apéndice no se explica por la supresión de IgG ni respuesta Th1. Las opciones C y D involucran citocinas y mediadores (IL-10, Th17, IgM) ajenos a la vía fisiopatológica apéndice-colitis ulcerosa descrita en Schwartz.",

    },
    {
        id: 7, 
        question: "En Fisiopatología, ¿cuál es la causa principal de obstrucción de la luz apendicular en la población pediátrica de acuerdo a la GPC?",

        answer: 0, 
        justification: "Justificación: La fisiopatología de la apendicitis aguda inicia con la oclusión del lumen apendicular. De acuerdo al libro de Principios de Cirugía de Schwartz, la etiología de la obstrucción varía según el grupo etario; la hiperplasia linfoide submucosa es la causa principal en pacientes pediátricos, mientras que los fecalitos dominan en los adultos.<br><br>Perla Quirúrgica: La etiología de la apendicitis se debe quizás a la obstrucción luminal que ocurre como resultado de la hiperplasia linfoide en poblaciones pediátricas; en adultos, puede deberse a fecalitos, fibrosis, cuerpos extraños o neoplasia.<br><br>Análisis de Distractores: La opción B constituye la causa más común de obstrucción luminal en adultos, no en niños. Las opciones C y D son causas descritas con menor frecuencia, inapropiadas como respuesta principal en pediatría.", 
        source: "Schwartz Principios de Cirugía, 11.ª edición, 2019, Capítulo 30: El Apéndice, Página 1." 
    },
    {
        id: 8, 
        question: "En Microbiología, ¿cuáles son las bacterias aerobia y anaerobia más comúnmente aisladas en los casos de Apendicitis Aguda perforada de acuerdo a la GPC?", 
        options: ["Escherichia coli y Bacteroides fragilis", "Pseudomonas aeruginosa y Clostridium perfringens", "Klebsiella pneumoniae e Fusobacterium nucleatum", "Streptococcus viridans y Peptostreptococcus micros"], 
        answer: 0, 
        justification: "Justificación: El estasis luminal favorece el sobrecrecimiento bacteriano rápido. De acuerdo al libro de Principios de Cirugía de Schwartz, conforme la isquemia progresa a gangrena y perforación, se aísla una flora bacteriana mixta. Los microorganismos más comunes aislados de forma consistente en procesos perforados son Escherichia coli (aerobio) y Bacteroides fragilis (anaerobio).<br><br>Perla Quirúrgica: Escherichia coli y Bacteroides fragilis son las bacterias aeróbicas y anaeróbicas más comúnmente aisladas en la apendicitis perforada.<br><br>Análisis de Distractores: Las opciones B, C y D representan bacterias pertenecientes a la microbiota gastrointestinal o patógenos que pueden colonizar la cavidad abdominal en infecciones polimicrobianas, pero son superados en frecuencia de aislamiento por la combinación de E. coli y B. fragilis.", 
        source: "Schwartz Principios de Cirugía, 11.ª edición, 2019, Capítulo 30: El Apéndice, Página 2." 
    },
    {
        id: 9, 
        question: "En Diagnóstico Clínico, ¿cuál es el epónimo del signo físico caracterizado por dolor en el cuadrante inferior derecho inducido por la rotación interna pasiva de la cadera derecha flexionada de acuerdo a la GPC?",

        answer: 0, 
        justification: "Justificación: De acuerdo al libro de Principios de Cirugía de Schwartz, el examen físico minucioso permite sugerir la ubicación anatómica del apéndice. El signo del obturador (dolor a la rotación interna pasiva de la cadera derecha) denota un apéndice localizado en la región pélvica, debido al contacto inflamatorio con el músculo obturador interno.<br><br>Perla Quirúrgica: Ciertos signos físicos con sus respectivos epónimos pueden ser útiles para discernir la ubicación del apéndice: Rovsing, dolor en el cuadrante inferior derecho después de liberar presión en el cuadrante inferior izquierdo; Dunphy, dolor al toser (retrocecal); obturador, dolor con la rotación interna de la cadera (pélvico); iliopsoas, dolor con la flexión/extensión de la cadera (retrocecal).<br><br>Análisis de Distractores: La opción B se caracteriza por dolor en fosa iliaca derecha al ejercer presión o descompresión en fosa iliaca izquierda. La opción C consiste en dolor en fosa iliaca derecha al realizar la extensión pasiva o flexión activa de la cadera contra resistencia. La opción D es el dolor agudo en fosa iliaca derecha desencadenado específicamente por la tos.",

        answer: 0, 
        justification: "Justificación: De acuerdo al libro de Principios de Cirugía de Schwartz, la tomografía computarizada (TC) contrastada es la modalidad de elección para resolver dilemas diagnósticos por su alto rendimiento. Presenta una sensibilidad de 0.96 (IC del 95%: 0.95-0.97) y una especificidad de 0.96 (IC del 95%: 0.93-0.97).<br><br>Perla Quirúrgica: Una tomografía computarizada con contraste tiene una sensibilidad de 0.96 (intervalo de confianza del 95% [IC] 0.95–0.97) y una especificidad de 0.96 (IC 95% 0.93–0.97) en el diagnóstico de apendicitis aguda.<br><br>Análisis de Distractores: La opción B corresponde a valores del ultrasonido con compresión graduada, operador dependiente. Las opciones C y D representan datos de sensibilidad y especificidad de ultrasonido reportados en metaanálisis específicos citados en el texto, incorrectos para TC.", 
        source: "Schwartz Principios de Cirugía, 11.ª edición, 2019, Capítulo 30: El Apéndice, Página 3." 
    },
    {

        question: "En Diagnóstico por Imagen, ¿cuál es el diámetro apendicular ultrasonográfico que, al correlacionarse con una pared fácilmente compresible, generalmente descarta el diagnóstico de Apendicitis Aguda de acuerdo a la GPC?",

        function setupEventListeners() {
            document.getElementById('module-search').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                document.querySelectorAll('.q-box-item').forEach(box => {
                    const id = parseInt(box.dataset.id);
                    const qObj = questionsData.find(q => q.id === id);
                    if(!qObj) return;
                    const matchText = qObj.question.toLowerCase().includes(term);
                    box.style.display = (term === '' || matchText || id.toString() === term) ? 'flex' : 'none';
                });
            });

            document.getElementById('cancel-reset').addEventListener('click', () => {
                const m = document.getElementById('reset-modal'); m.querySelector('div').classList.add('scale-95');
                setTimeout(()=>m.classList.add('hidden'),300);
            });
            document.getElementById('confirm-reset').addEventListener('click', () => {
                localStorage.removeItem('SchwartapendiceProgress');
                localStorage.removeItem('SchwartapendiceLastQId');
                window.location.reload();
            });
            
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const overlay = document.getElementById('sidebar-overlay');

            menuToggle.addEventListener('click', () => {
                if (window.innerWidth >= 1024) {
                    sidebar.classList.toggle('lg:translate-x-0');
                    mainContent.classList.toggle('lg:ml-80');
                    
                    // Reposicionar el botón del tablero dependiendo de si el sidebar está abierto
                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    sidebar.classList.toggle('-translate-x-full');
                    overlay.classList.toggle('hidden');
                }
            });
            
            overlay.addEventListener('click', () => {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            });

            document.getElementById('dark-mode-toggle').addEventListener('click', toggleDarkMode);
        }

        // Navegar a pregunta anterior

            const currentIndex = questionsData.findIndex(q => q.id === currentId);
            if (currentIndex > 0) {
                displayQuestion(questionsData[currentIndex - 1].id);
            } else {
                displayQuestion(null);

        function getQBoxClass(qId, isActive) {
            let base = "q-box-item flex items-center justify-center aspect-square rounded-md font-bold text-sm cursor-pointer transition-all select-none border ";
            
            if (isActive) base += "ring-4 ring-pink-500 shadow-md z-10 border-pink-500 dark:border-pink-400 ";

            const state = userProgress[qId];
            if (!state || !state.answered) {
                return base + "bg-slate-100 text-slate-500 border-slate-200 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-400 dark:border-slate-700 dark:hover:bg-slate-700";
            } else if (state.isCorrect) {
                return base + "bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-900/30 dark:text-emerald-400 dark:border-emerald-800";
            } else {
                return base + "bg-rose-100 text-rose-700 border-rose-300 dark:bg-rose-900/30 dark:text-rose-400 dark:border-rose-800";
            }
        }

        function renderGridHTML(isActiveIdContext = null) {
            return questionsData.map(q => 
                `<div class="${getQBoxClass(q.id, q.id === isActiveIdContext)}" data-id="${q.id}" onclick="displayQuestion(${q.id})">${q.id}</div>`
            ).join('');
        }

            document.getElementById('sidebar-q-grid').innerHTML = renderGridHTML(currentQuestionId);

            const successRate = total > 0 && ans > 0 ? Math.round((correct / ans) * 100) : 0;
            const isAllCompleted = ans === total && total > 0;
            
            let firstUncompletedId = questionsData.find(q => !userProgress[q.id]?.answered)?.id;
            
            let actionBtn = isAllCompleted 
                ? `<button onclick="document.getElementById('reset-modal').classList.remove('hidden')" class="w-full md:w-auto bg-white/20 hover:bg-white/30 text-white border border-white/30 px-8 py-3 rounded-xl font-bold transition-colors shadow-sm">Reiniciar Examen</button>`
                : `<button onclick="displayQuestion(${firstUncompletedId})" class="bg-gradient-to-r from-rose-500 to-pink-600 hover:from-pink-600 hover:to-rose-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-pink-900/30 transition-transform hover:-translate-y-0.5">Continuar Aprendiendo</button>`;

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-pink-50 dark:bg-pink-900/20 text-pink-600 dark:text-pink-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-pink-100 dark:border-pink-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-pink-50 has-[:checked]:border-pink-400 dark:has-[:checked]:bg-pink-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-pink-600 focus:ring-pink-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-pink-600 dark:hover:bg-pink-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-pink-600 to-rose-600 hover:from-rose-600 hover:to-pink-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('SchwartapendiceProgress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('SchwartapendiceLastQId', currentQuestionId);
                else localStorage.removeItem('SchwartapendiceLastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('SchwartapendiceProgress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>
