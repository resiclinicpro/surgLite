<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300 h-[100dvh] overflow-hidden">

    <div id="app-container" class="relative h-full lg:flex">
        
        <!-- SIDEBAR: MAPA DE PREGUNTAS -->

            <div class="flex justify-center mb-6 pt-2">

                <div id="sidebar-q-grid" class="grid grid-cols-[repeat(auto-fill,minmax(38px,1fr))] gap-1.5 p-1"></div>

            <div class="pt-4 border-t border-slate-200 dark:border-slate-800 mt-2 space-y-3">
                <button id="dark-mode-toggle" class="w-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700 font-semibold py-2.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-all flex items-center justify-center gap-2 text-sm shadow-sm">
                    <svg id="sun-icon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>

                    Alternar Tema
                </button>

                <button onclick="document.getElementById('reset-modal').classList.remove('hidden')" class="w-full bg-white dark:bg-slate-800 text-red-500 border border-red-200 dark:border-red-900/50 font-semibold py-2.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 transition-all flex items-center justify-center gap-2 text-sm shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Reiniciar Simulador
                </button>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main id="main-content" class="flex-1 h-[100dvh] overflow-y-auto overscroll-y-contain p-4 sm:p-6 lg:p-8 transition-all duration-300 relative bg-slate-50 dark:bg-slate-950">
            
            <button id="dashboard-button" onclick="displayQuestion(null)" class="hidden fixed top-4 left-4 lg:left-[22rem] bg-white dark:bg-slate-800 p-2.5 rounded-full shadow-md border border-slate-200 dark:border-slate-700 z-40 text-slate-500 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-300" title="Ver Tablero General">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                </svg>
            </button>

            <button id="menu-toggle" class="hidden fixed top-4 right-4 lg:right-8 bg-white dark:bg-slate-800 p-2.5 rounded-full shadow-md border border-slate-200 dark:border-slate-700 z-40 text-slate-500 hover:text-blue-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg>

            <!-- Barra de Progreso General -->

            </div>
            
            <div id="module-display" class="transition-opacity duration-300 pb-12"></div>
        </main>
        
        <div id="sidebar-overlay" class="hidden fixed inset-0 bg-slate-900/40 z-20 backdrop-blur-sm"></div>

    <!-- MODALES -->
    <div id="reset-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-300">
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Reiniciar Simulador</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 mb-6">Se borrará todo tu progreso y respuestas de los casos. ¿Deseas empezar desde cero?</p>
            <div class="flex gap-3">
                <button id="cancel-reset" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Cancelar</button>
                <button id="confirm-reset" class="flex-1 py-2 bg-red-500 text-white rounded-lg text-sm font-bold hover:bg-red-600 transition-colors">Sí, Reiniciar</button>
            </div>
        </div>
    </div>

    <div id="finish-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-300">
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Finalizar Simulador</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 mb-6">¿Estás seguro de que deseas terminar? Se evaluarán todas tus respuestas y se liberará la justificación médica.</p>
            <div class="flex gap-3">
                <button id="cancel-finish" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Seguir contestando</button>
                <button id="confirm-finish" class="flex-1 py-2 bg-emerald-500 text-white rounded-lg text-sm font-bold hover:bg-emerald-600 transition-colors">Sí, Calificar</button>
            </div>
        </div>
    </div>

    <script>

        const casesData = [



{
    id: 1,
    caseText: "Hombre de 42 años acude por cuadro de 8 meses de evolución caracterizado por disfagia progresiva tanto para líquidos como para sólidos, asociada a regurgitación de alimentos no digeridos de predominio nocturno y pérdida de peso de 6 kg en los últimos 3 meses. Refiere dolor torácico retroesternal esporádico. TA 110/70 mmHg, FC 78 lpm, FR 16 lpm, temperatura 36.8 °C. A la exploración física, tórax sin compromiso, abdomen blando, sin megalias. Se realiza un esofagograma con bario que reporta retención de contraste, dilatación del cuerpo esofágico y estrechamiento distal simétrico. Endoscopia superior descarta lesiones obstructivas mecánicas o neoplásicas en la unión esofagogástrica.",
    source: "Capítulo 25. Esófago y hernia diafragmática, Puntos Clave.",
    questions: [
        {
            question: "¿Cuál es la clasificación epidemiológica correcta de la patología que presenta este paciente según los trastornos de la motilidad?",
            options: [
                "Trastorno motor secundario a esclerodermia progresiva.",
                "Trastorno de la motilidad faríngea y del esfínter superior.",
                "Trastorno motor esofágico primario más común.",
                "Trastorno secundario a enfermedad por reflujo gastroesofágico."
            ],
            answer: 2,
            justification: "El cuadro clínico de disfagia progresiva a líquidos y sólidos con dilatación esofágica y terminación distal afilada (pico de pájaro) es patognomónico de acalasia, catalogada como la alteración motora primaria predominante del esófago. Su etiología idiopática afecta intrínsecamente la inervación inhibitoria del plexo mientérico.<br><br><b>Perla Quirúrgica:</b> La acalasia es el trastorno motor esofágico primario más común.<br><br><b>Análisis de Distractores:</b> La opción A es incorrecta porque la esclerodermia es un trastorno motor secundario caracterizado por aperistalsis distal pero con un esfínter hipotenso. La opción B es incorrecta ya que la alteración se encuentra en el cuerpo esofágico y el esfínter inferior. La opción D es incorrecta porque el reflujo gastroesofágico es una entidad de falla valvular por hipotonía."
        },
        {
            question: "¿Cuál es el hallazgo confirmatorio característico en el estudio de manometría esofágica de alta resolución para esta patología?",
            options: [
                "Aperistalsis del cuerpo esofágico y relajación incompleta del esfínter esofágico inferior.",
                "Contracciones simultáneas y presión del esfínter esofágico inferior normal.",
                "Peristalsis normal con presión del esfínter esofágico inferior menor a 6 mmHg.",
                "Amplitud peristáltica mayor a 180 mmHg y duración prolongada de las contracciones."
            ],
            answer: 0,
            justification: "El diagnóstico definitivo o gold standard de la acalasia se realiza mediante manometría esofágica, la cual objetiva la incapacidad del esfínter esofágico inferior para relajarse en respuesta a la deglución (relajación menor al 75%), sumado a una pérdida total de la actividad peristáltica propagada en el cuerpo esofágico.<br><br><b>Perla Quirúrgica:</b> Se caracteriza por la ausencia de peristalsis y un esfínter esofágico inferior hipertenso y no relajante.<br><br><b>Análisis de Distractores:</b> La opción B describe el espasmo esofágico difuso, donde se conservan algunas ondas peristálticas normales. La opción C corresponde a un esfínter mecánicamente defectuoso o incompetente, clásico de ERGE. La opción D define el esófago en cascanueces, caracterizado por contracciones hipertensivas pero peristalsis ordenada."
        },
        {
            question: "¿Cuál es el abordaje quirúrgico de primera elección y con mejores resultados funcionales a largo plazo para el manejo de esta patología?",
            options: [
                "Esofagectomía transhiatal con ascenso gástrico.",
                "Funduplicatura de Nissen de 360 grados.",
                "Dilatación neumática con balón fluoroscópico.",
                "Miotomía de Heller laparoscópica y funduplicatura parcial."
            ],
            answer: 3,
            justification: "La sección controlada de las fibras musculares circulares del esfínter esofágico inferior mediante laparoscopia (miotomía de Heller) alivia de forma inmediata la obstrucción funcional. Se debe añadir una funduplicatura parcial (tipo Dor o Toupet) para prevenir el reflujo iatrogénico posterior.<br><br><b>Perla Quirúrgica:</b> Su mejor tratamiento es la miotomía de Heller laparoscópica y la funduplicatura parcial.<br><br><b>Análisis de Distractores:</b> La opción A se reserva para megaesófago sigmoideo o carcinoma avanzado. La opción B está contraindicada, ya que un cierre de 360 grados en un esófago aperistáltico empeoraría la disfagia gravemente. La opción C es un tratamiento intervencionista endoscópico de segunda línea por su alta tasa de recidiva."
        },
        {
            question: "¿Cuál es el criterio manométrico de presión basal del esfínter esofágico inferior que define el componente hipertensivo en esta enfermedad?",
            options: [
                "Mayor a 180 mmHg.",
                "Mayor o igual a 26 mmHg.",
                "Menor a 6 mmHg.",
                "Entre 10 y 15 mmHg."
            ],
            answer: 1,
            justification: "El diagnóstico manométrico de la acalasia incluye un esfínter hipertensivo y no relajante. El límite establecido por los criterios manométricos para definir este estado hipertensivo en reposo es de 26 mmHg o superior.<br><br><b>Perla Quirúrgica:</b> Características manométricas de los trastornos primarios de la motilidad esofágica: Acalasia... Presión del esfínter esofágico inferior elevada mayor o igual a 26 mmHg.<br><br><b>Análisis de Distractores:</b> La opción A corresponde a la amplitud del cuerpo esofágico que define al esófago en cascanueces. La opción C es el criterio para un esfínter esofágico mecánicamente defectuoso. La opción D representa cifras dentro de los parámetros fisiológicos normales del esfínter basal sano."
        },
        {
            question: "¿Qué complicación neoplásica crónica se encuentra firmemente asociada a la evolución prolongada de esta enfermedad motora?",
            options: [
                "Adenocarcinoma de la unión esofagogástrica.",
                "Tumor del estroma gastrointestinal.",
                "Carcinoma escamoso del esófago.",
                "Sarcoma pleomórfico esofágico."
            ],
            answer: 2,
            justification: "La estasis alimentaria crónica, la putrefacción de detritos y la inflamación mucosa persistente en el esófago dilatado predisponen a una de degeneración neoplásica celular hacia carcinoma de células escamosas a largo plazo.<br><br><b>Perla Quirúrgica:</b> Otras asociaciones definitivas vinculan el carcinoma escamoso con la acalasia de larga evolución, estenosis por cáusticos y tilosis.<br><br><b>Análisis de Distractores:</b> La opción A es incorrecta porque el adenocarcinoma se asocia al Esófago de Barrett y a ERGE crónico. Las opciones B y D son tumores mesenquimales y sarcomas extremadamente infrecuentes en el esófago que no guardan relación demostrada con trastornos motores primarios."
        }
    ]
},
{
    id: 2,
    caseText: "Mujer de 68 años acude por cuadro de 12 meses de evolución con saciedad temprana, dolor epigástrico posprandial opresivo y disnea esporádica. Niega pérdida de peso. Antecedente de anemia ferropénica refractaria al tratamiento médico. TA 130/80 mmHg, FC 88 lpm, FR 18 lpm, temperatura 36.7 °C. Exploración física: palidez de tegumentos, tórax con ruidos respiratorios disminuidos en base izquierda, abdomen blando sin megalias. Laboratorios: hemoglobina 8.9 g/dl, volumen corpuscular medio de 72 fl. Se realiza endoscopia superior con maniobra de retroflexión intragástrica, evidenciando ascenso del cardias y del fondo gástrico por encima de los márgenes de los pilares diafragmáticos, conformando un gran saco herniario intratorácico.",
    source: "Capítulo 25. Esófago y hernia diafragmática, Evaluación de la función esofágica.",
    questions: [
        {
            question: "Ante la presencia endoscópica de este defecto herniario y el antecedente de anemia ferropénica, ¿qué lesión patológica se debe buscar de forma dirigida e intencionada dentro del saco herniario?",
            options: [
                "Esófago de Barrett sin displasia.",
                "Anillo de Schatzki circunferencial.",
                "Úlceras de Cameron o gastritis.",
                "Divertículo por tracción inflamatoria."
            ],
            answer: 2,
            justification: "En pacientes con hernias paraesofágicas gigantes (tipos II a IV), la isquemia crónica y el trauma mecánico por el cabalgamiento constante del estómago a través del anillo hiatal favorecen el desarrollo de erosiones lineales o úlceras isquémicas en la mucosa del saco herniario (úlceras de Cameron). Estas lesiones son una causa frecuente de sangrado digestivo oculto y anemia ferropénica.<br><br><b>Perla Quirúrgica:</b> Cuando se observa una hernia paraesofágica, se presta especial atención a excluir úlceras gástricas (de Cameron) o gastritis dentro de la bolsa.<br><br><b>Análisis de Distractores:</b> La opción A se asocia a reflujo gastroesofágico crónico secundario a incompetencia esfinteriana (hernias tipo I). La opción B genera cuadros de disfagia esporádica a sólidos pero no se ulceran ni causan pérdida hemática. La opción D ocurre por inflamación mediastínica externa, sin relación con el desplazamiento gástrico."
        },
        {
            question: "De acuerdo con la descripción anatómica de dislocación superior conjunta del cardias y el fondo gástrico, ¿cuál es la clasificación fisiopatológica correcta de este defecto?",
            options: [
                "Hernia hiatal tipo I (deslizamiento).",
                "Hernia hiatal tipo III (mixta).",
                "Hernia hiatal tipo II (paraesofágica pura).",
                "Hernia hiatal tipo IV (órgano adicional)."
            ],
            answer: 1,
            justification: "La hernia hiatal tipo III o mixta integra los componentes de los dos tipos iniciales. Se caracteriza por el desplazamiento cefálico directo de la unión esofagogástrica (cardias) hacia el mediastino, sumado al ascenso del fondo gástrico lateral al esófago.<br><br><b>Perla Quirúrgica:</b> La hernia combinada por deslizamiento-rodamiento o mixta, tipo III, se caracteriza por una luxación hacia arriba tanto del cardias como del fondo gástrico.<br><br><b>Análisis de Distractores:</b> La opción A indica que únicamente migra el cardias, manteniendo el fondo gástrico debajo del diafragma. La opción C sucede cuando el ligamento frenoesofágico retiene el cardias en posición normal, permitiendo que el fondo ruede. La opción D implica la incursión de otras vísceras (colon o bazo)."
        },
        {
            question: "¿Cuál es la estrategia terapéutica inicial de primera línea indicada en esta paciente para corregir su patología anatómica y hematológica?",
            options: [
                "Reducción abierta y gastroplastia de Collis obligatoria.",
                "Cierre primario simple de pilares diafragmáticos sin anclaje.",
                "Dilatación neumática graduada con balón fluoroscópico.",
                "Reparación laparoscópica de la hernia hiatal con funduplicatura."
            ],
            answer: 3,
            justification: "La presencia de una hernia hiatal paraesofágica gigante sintomática o asociada a complicaciones sistémicas (como la anemia ferropénica) exige corrección quirúrgica. El estándar de oro estipula que la reparación mínimamente invasiva (reducción, cierre crural) acoplada a una funduplicatura para anclaje proporciona el mayor éxito técnico.<br><br><b>Perla Quirúrgica:</b> La hernia hiatal gigante, también conocida como hernia paraesofágica, debe repararse cuando presenta síntomas o se asocia a anemia ferropénica. La reparación laparoscópica de la hernia hiatal con funduplicatura es el abordaje más común.<br><br><b>Análisis de Distractores:</b> La opción A es un recurso avanzado utilizado de rescate ante esófago corto verdadero. La opción B resulta en altas tasas de de recidiva debido a la de la ausencia de de un mecanismo estabilizador. La opción C es una modalidad para alteraciones espásticas del cardias, ineficaz para un defecto anatómico."
        },
        {
            question: "Durante el seguimiento a largo plazo de los pacientes sometidos a un abordaje laparoscópico para esta patología, ¿cuál es la causa más frecuente de falla terapéutica que amerita reoperación?",
            options: [
                "Migración transhiatal de la reparación y funduplicatura hacia el tórax.",
                "Necrosis gástrica fulminante secundaria a isquemia de vasos cortos.",
                "Deslizamiento de la envoltura quirúrgica hacia el cuerpo gástrico.",
                "Disrupción mecánica de los puntos de la válvula fundúplica."
            ],
            answer: 0,
            justification: "En los abordajes laparoscópicos, la tracción cráneo-caudal persistente del esófago y el de diferencial de presión toracoabdominal condicionan que la complicación y causa de fracaso líder sea la de protrusión de la de envoltura hacia el mediastino.<br><br><b>Perla Quirúrgica:</b> La hernia de la de reparación en el tórax es la causa más frecuente de fracaso después de un de procedimiento laparoscópico.<br><br><b>Análisis de Distractores:</b> La opción B es un evento anecdótico debido a la robusta red colateral del estómago. La de opción C (slipped Nissen) y la opción D se han reportado como los principales vectores de fallo tras abordajes laparotómicos tradicionales."
        },
        {
            question: "¿Cuál es la alteración morfológica en la fase de la etapa final (end stage) de las hernias que impone una grave morbilidad compresiva e isquémica?",
            options: [
                "Formación de un anillo fibroso rígido supradiafragmático.",
                "Crecimiento de un megaesófago redundante y descompesado.",
                "Rotación completa de 180 grados originando un estómago intratorácico.",
                "Metaplasia intestinal de carácter circunferencial extensa."

        function setupEventListeners() {

                    const globalId = parseInt(box.dataset.id);
                    const caseIdx = Math.floor((globalId - 1) / QUESTIONS_PER_CASE);
                    const qIdx = (globalId - 1) % QUESTIONS_PER_CASE;
                    const cData = casesData[caseIdx];
                    
                    if(!cData) return;
                    
                    const qData = cData.questions[qIdx];
                    const matchText = cData.caseText.toLowerCase().includes(term) || qData.question.toLowerCase().includes(term);
                    box.style.display = (term === '' || matchText || globalId.toString() === term) ? 'flex' : 'none';

        function navigateCase(currentCaseId, direction) {
            let targetCaseId = currentCaseId;
            if (direction === 'prev' && currentCaseId > 1) {
                targetCaseId = currentCaseId - 1;
            } else if (direction === 'next' && currentCaseId < casesData.length) {
                targetCaseId = currentCaseId + 1;
            } else {
                displayQuestion(null); 
                return;
            }
            const targetGlobalQId = (targetCaseId - 1) * QUESTIONS_PER_CASE + 1;
            displayQuestion(targetGlobalQId);
        }

        function getQBoxClass(globalId, isActive) {
            let base = "q-box-item flex items-center justify-center aspect-square rounded-md font-bold text-[10px] sm:text-xs cursor-pointer transition-all select-none border ";
            if (isActive) base += "ring-4 ring-blue-500 shadow-md z-10 border-blue-500 dark:border-blue-400 ";

            const state = userProgress[globalId];
            const caseIdx = Math.floor((globalId - 1) / QUESTIONS_PER_CASE);
            const qIdx = (globalId - 1) % QUESTIONS_PER_CASE;
            const cData = casesData[caseIdx];
            
            if (!cData) return base + "bg-slate-100 text-slate-300";

            if (!examState.isFinished) {
                if (!state || !state.answered) {
                    return base + "bg-slate-50 text-slate-400 border-slate-200 hover:bg-slate-200 dark:bg-slate-800/50 dark:text-slate-500 dark:border-slate-700/50 dark:hover:bg-slate-700";
                } else {
                    return base + "bg-slate-600 text-white border-slate-700 dark:bg-slate-700 dark:border-slate-600 shadow-inner";
                }
            } 
            else {
                if (!state || !state.answered) {
                    return base + "bg-slate-100 text-slate-400 border-slate-200 dark:bg-slate-800 dark:text-slate-500 dark:border-slate-700";
                } else {
                    const isCorrect = state.selectedOption === cData.questions[qIdx].answer;
                    if (isCorrect) {
                        return base + "bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-900/30 dark:text-emerald-400 dark:border-emerald-800";
                    } else {
                        return base + "bg-rose-100 text-rose-700 border-rose-300 dark:bg-rose-900/30 dark:text-rose-400 dark:border-rose-800";
                    }
                }
            }
        }

        function renderGridHTML(isActiveIdContext = null) {
            let boxes = [];

                boxes.push(`<div class="${getQBoxClass(i, i === isActiveIdContext)}" data-id="${i}" onclick="displayQuestion(${i})">${i}</div>`);
            }
            return boxes.join('');
        }

        function displayQuestion(globalId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = globalId ? parseInt(globalId) : null;
                
                if (currentQuestionId) {
                    localStorage.setItem('EFISER1LastQId', currentQuestionId);
                } else {
                    localStorage.removeItem('EFISER1LastQId');
                }

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                if (window.innerWidth >= 1024) {
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');
                    dashboardBtn.classList.add('lg:left-[22rem]');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const caseIdx = Math.floor((currentQuestionId - 1) / QUESTIONS_PER_CASE);
                const cData = casesData[caseIdx];
                
                if (!cData) return displayQuestion(null);
                
                renderCaseLayout(cData, currentQuestionId);
                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                setTimeout(() => {
                    const targetCard = document.getElementById(`q-card-${currentQuestionId}`);
                    if (targetCard) {
                        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    }
                }, 50);

            }, 150); 
        }

                <div class="flex flex-col gap-6 max-w-5xl mx-auto items-center">
                    
                    <!-- COLUMNA: TEXTO DEL CASO CLÍNICO -->
                    <div class="w-full bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-2xl shadow-md border border-slate-200 dark:border-slate-800 transition-all duration-300">
                        <div class="flex items-center justify-between mb-4">
                            <span class="inline-block bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg text-[10px] font-bold tracking-widest uppercase border border-blue-100 dark:border-blue-900/30">
                                Caso Clínico Seriado
                            </span>
                            <span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">
                                Bloque #${cData.id}
                            </span>
                        </div>
                        <p class="text-slate-800 dark:text-slate-200 text-sm sm:text-base leading-relaxed font-medium">
                            ${cData.caseText}
                        </p>
                        ${examState.isFinished ? `
                            <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 text-[10px] text-slate-400 font-bold uppercase tracking-widest">
                                <span class="text-slate-500">Bibliografía GPC:</span> ${cData.source}
                            </div>
                        ` : ''}
                    </div>

                    <!-- COLUMNA: BLOQUE DE LAS 5 PREGUNTAS ASOCIADAS -->
                    <div class="w-full space-y-5">
            `;

            cData.questions.forEach((q, idx) => {
                const globalQId = (cData.id - 1) * QUESTIONS_PER_CASE + idx + 1;
                const qState = userProgress[globalQId];
                const hasAnswered = qState && qState.answered;
                const userAnswer = hasAnswered ? qState.selectedOption : null;
                
                let cardStyle = "border-slate-200 dark:border-slate-800/80";
                if (globalQId === activeGlobalId) {
                    cardStyle = "border-blue-500 dark:border-blue-500 ring-2 ring-blue-500/10";
                }
                if (examState.isFinished && hasAnswered) {
                    cardStyle = (userAnswer === q.answer) ? "border-l-4 border-emerald-500" : "border-l-4 border-rose-500";
                }

                html += `
                    <div id="q-card-${globalQId}" class="bg-white dark:bg-slate-900 p-5 sm:p-6 rounded-2xl shadow-sm border ${cardStyle} transition-all">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-[9px] font-bold bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-2 py-0.5 rounded border border-slate-200 dark:border-slate-700">
                                PREGUNTA ${globalQId}
                            </span>
                        </div>
                        <h3 class="text-sm sm:text-base font-bold text-slate-800 dark:text-slate-100 mb-4 leading-snug">${q.question}</h3>
                        <form id="q-form-${globalQId}" class="space-y-2.5">
                `;

                q.options.forEach((opt, i) => {
                    if (examState.isFinished) {
                        let optClasses = "flex items-start p-3 border rounded-xl text-xs sm:text-sm ";
                        let icon = "";
                        
                        if (i === q.answer) {
                            optClasses += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 font-semibold";
                            icon = `<svg class="w-4 h-4 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;
                        } else if (i === userAnswer) {
                            optClasses += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                            icon = `<svg class="w-4 h-4 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                        } else {
                            optClasses += "bg-slate-50 border-slate-100 dark:bg-slate-800/30 dark:border-slate-800/50 opacity-50 text-slate-400";
                        }

                        html += `
                            <div class="${optClasses}">
                                <span class="leading-snug pr-3">${opt}</span>
                                ${icon}
                            </div>
                        `;
                    } else {
                        const checkedStr = (hasAnswered && userAnswer === i) ? 'checked' : '';
                        html += `
                            <label class="flex items-start p-3 border border-slate-200 dark:border-slate-800 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/40 has-[:checked]:bg-blue-50/80 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/20 text-xs sm:text-sm shadow-sm" onclick="autoSaveAnswer(${globalQId})">
                                <input type="radio" name="option" value="${i}" ${checkedStr} class="mt-0.5 h-3.5 w-3.5 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-700 cursor-pointer">
                                <span class="ml-2.5 text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `;
                    }
                });

                html += `</form>`;

                if (examState.isFinished) {
                    html += `
                        <div class="bg-blue-50/60 dark:bg-slate-800/50 border border-blue-100/50 dark:border-slate-800 rounded-xl p-4 text-xs sm:text-sm mt-4">
                            <h4 class="font-bold text-blue-800 dark:text-blue-400 mb-1 flex items-center gap-1 uppercase tracking-wider text-[10px]">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Justificación Médica GPC
                            </h4>
                            <p class="text-slate-600 dark:text-slate-300 leading-relaxed">${q.justification}</p>
                        </div>
                    `;
                }

                html += `</div>`;
            });

            const isLastCase = cData.id === casesData.length;

            html += `
                        <!-- CONTROLES DE FLUJO EN CASOS -->
                        <div class="flex justify-between items-center pt-4 mt-6 border-t border-slate-200 dark:border-slate-800">
                            <button onclick="navigateCase(${cData.id}, 'prev')" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                                Caso Anterior
                            </button>
                            
                            ${examState.isFinished ? `
                                ${!isLastCase ? `
                                    <button onclick="navigateCase(${cData.id}, 'next')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 px-6 rounded-xl transition-colors text-xs uppercase tracking-wider flex items-center gap-1.5 shadow-sm">
                                        Siguiente Caso <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                                    </button>
                                ` : `
                                    <button onclick="displayQuestion(null)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-6 rounded-xl transition-colors text-xs uppercase tracking-wider shadow-sm">
                                        Ver Calificaciones
                                    </button>
                                `}
                            ` : `
                                <button onclick="navigateCase(${cData.id}, 'next')" class="bg-blue-600 dark:bg-blue-500 text-white font-bold py-2.5 px-6 rounded-xl shadow-md hover:bg-blue-700 dark:hover:bg-blue-400 transition-colors text-xs uppercase tracking-wider flex items-center gap-1.5">
                                    Siguiente Caso <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('module-display').innerHTML = html;
        }

        function autoSaveAnswer(globalId) {
            if(examState.isFinished) return;
            const form = document.getElementById(`q-form-${globalId}`);
            if (!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (selected) {
                userProgress[globalId] = { answered: true, selectedOption: parseInt(selected.value) };
                saveState();
                updateProgressBar();
                renderSidebarGrid();
            }
        }

        function updateProgressBar() {
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = totalQuestions > 0 ? Math.round((ans / totalQuestions) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; 
            }
        }

        function saveState() {
            try { localStorage.setItem('EFISER1Progress', JSON.stringify(userProgress)); } catch(e) {}
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('EFISER1Progress');
                userProgress = saved ? JSON.parse(saved) : {};
                const savedState = localStorage.getItem('EFISER1ExamState');
                if (savedState) examState = JSON.parse(savedState);
            } catch(e) { userProgress = {}; examState = { isFinished: false }; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>
</body>
</html>
