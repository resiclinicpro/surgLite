<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador ENARM Lite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; }

            font-family: 'Inter', sans-serif;
            font-weight: 900;
            color: #004c8c;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }
        .logo-Lite {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            color: #70b93d;
        }
        .logo-Lite sup { font-size: 0.6em; top: -0.4em; position: relative; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300 h-[100dvh] overflow-hidden">

    <div id="app-container" class="relative h-full lg:flex">
        
        <!-- SIDEBAR: MAPA DE PREGUNTAS -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 w-80 p-5 flex flex-col transform -translate-x-full transition-transform duration-300 ease-in-out z-30 shadow-[4px_0_24px_rgba(0,0,0,0.05)] border-r border-slate-200 dark:border-slate-800">
            
            <div class="flex justify-center mb-6 pt-2">
                <div class="flex items-baseline gap-1 bg-slate-50 dark:bg-slate-800 px-4 py-1.5 rounded-full border border-slate-200 dark:border-slate-700">
                    <span class="logo-enarm text-base">ENARM</span>
                    <span class="logo-Lite text-sm">Lite<sup>®</sup></span>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto min-h-0 custom-scrollbar pr-1">
                <div class="mb-4 relative">
                    <input type="text" id="module-search" placeholder="Buscar en casos o preguntas..." class="w-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 rounded-lg py-2 pl-3 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 absolute right-3 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                </div>

                <!-- Rejilla de 280 preguntas continuas -->
                <div id="sidebar-q-grid" class="grid grid-cols-[repeat(auto-fill,minmax(38px,1fr))] gap-1.5 p-1"></div>
            </div>
            
            <div class="pt-4 border-t border-slate-200 dark:border-slate-800 mt-2 space-y-3">
                <button id="dark-mode-toggle" class="w-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700 font-semibold py-2.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-all flex items-center justify-center gap-2 text-sm shadow-sm">
                    <svg id="sun-icon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    <svg id="moon-icon" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                    Alternar Tema
                </button>

                <button onclick="document.getElementById('reset-modal').classList.remove('hidden')" class="w-full bg-white dark:bg-slate-800 text-red-500 border border-red-200 dark:border-red-900/50 font-semibold py-2.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 transition-all flex items-center justify-center gap-2 text-sm shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Reiniciar Simulador
                </button>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main id="main-content" class="flex-1 h-[100dvh] overflow-y-auto overscroll-y-contain p-4 sm:p-6 lg:p-8 transition-all duration-300 relative bg-slate-50 dark:bg-slate-950">
            
            <button id="dashboard-button" onclick="displayQuestion(null)" class="hidden fixed top-4 left-4 lg:left-[22rem] bg-white dark:bg-slate-800 p-2.5 rounded-full shadow-md border border-slate-200 dark:border-slate-700 z-40 text-slate-500 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-300" title="Ver Tablero General">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                </svg>
            </button>

            <button id="menu-toggle" class="hidden fixed top-4 right-4 lg:right-8 bg-white dark:bg-slate-800 p-2.5 rounded-full shadow-md border border-slate-200 dark:border-slate-700 z-40 text-slate-500 hover:text-blue-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg>
            </button>

            <!-- Barra de Progreso General -->
            <div id="progress-container" class="hidden w-full max-w-5xl mx-auto bg-slate-200 dark:bg-slate-800 rounded-full mb-6 mt-0 h-5 shadow-inner overflow-hidden relative">
                <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-indigo-600 h-full transition-all duration-500 flex items-center justify-center text-[10px] font-bold text-white leading-none relative z-10" style="width:0%">0%</div>
            </div>
            
            <div id="module-display" class="transition-opacity duration-300 pb-12"></div>
        </main>
        
        <div id="sidebar-overlay" class="hidden fixed inset-0 bg-slate-900/40 z-20 backdrop-blur-sm"></div>
    </div>
    
    <!-- MODALES -->
    <div id="reset-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-300">
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Reiniciar Simulador</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 mb-6">Se borrará todo tu progreso y respuestas de los casos. ¿Deseas empezar desde cero?</p>
            <div class="flex gap-3">
                <button id="cancel-reset" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Cancelar</button>
                <button id="confirm-reset" class="flex-1 py-2 bg-red-500 text-white rounded-lg text-sm font-bold hover:bg-red-600 transition-colors">Sí, Reiniciar</button>
            </div>
        </div>
    </div>

    <div id="finish-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-300">
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Finalizar Simulador</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 mb-6">¿Estás seguro de que deseas terminar? Se evaluarán todas tus respuestas y se liberará la justificación médica.</p>
            <div class="flex gap-3">
                <button id="cancel-finish" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Seguir contestando</button>
                <button id="confirm-finish" class="flex-1 py-2 bg-emerald-500 text-white rounded-lg text-sm font-bold hover:bg-emerald-600 transition-colors">Sí, Calificar</button>
            </div>
        </div>
    </div>

    <script>

        const casesData = [

[
    {
        id: 1,
        question: "En la Acalasia, ¿cuál es el valor de corte de la presión de relajación integrada en la manometría de alta resolución para establecer el diagnóstico?",
        options: ["> 10 mmHg", "> 15 mmHg", "> 20 mmHg", "> 25 mmHg"],
        answer: 1,
        justification: "Justificación: De acuerdo al libro de Trastornos de Motilidad Esofágica, la acalasia se define manométricamente por una relajación incompleta o defectuosa del esfínter esofágico inferior, objetivada por una presión de relajación integrada (IRP) mayor a 15 mmHg acompañada de ausencia de peristalsis normal.<br><br>Perla Quirúrgica: La presión de relajación integrada > 15 mmHg es el criterio manométrico indispensable exigido por la Clasificación de Chicago para diagnosticar cualquier obstrucción del tracto de salida esofagogástrico, incluyendo la acalasia.<br><br>Análisis de Distractores: Valores menores a 15 mmHg (A) descartan obstrucción del tracto de salida. Valores de 20 o 25 mmHg (C, D) son fuertemente positivos para acalasia, pero el punto de corte diagnóstico exacto y umbral validado internacionalmente es estricto en > 15 mmHg.",
        source: "Management of Disorders of Esophageal Motility, Classification of Disease, Página 26."
    },
    {
        id: 2,
        question: "En el Esófago de Barrett, ¿cuál es el tiempo de evolución mínimo de los síntomas de reflujo gastroesofágico para indicar tamizaje endoscópico en varones con factores de riesgo?",
        options: ["≥ 1 año", "≥ 3 años", "≥ 5 años", "≥ 10 años"],
        answer: 2,
        justification: "Justificación: De acuerdo al libro de Manejo del Esófago de Barrett, el tamizaje endoscópico está indicado en hombres con síntomas crónicos de reflujo gastroesofágico por 5 o más años y 2 o más factores de riesgo adicionales (edad ≥ 50, obesidad central, tabaquismo, historia familiar).<br><br>Perla Quirúrgica: El escrutinio de metaplasia intestinal debe realizarse exclusivamente en pacientes masculinos con ≥ 5 años de síntomas de reflujo gastroesofágico acompañados de sinergia de riesgo oncogénico.<br><br>Análisis de Distractores: Las opciones de 1 a 3 años (A, B) no cumplen con el tiempo de latencia inflamatoria crónica suficiente para indicar tamizaje rutinario. La opción de 10 años (D) retrasa el escrutinio oportuno establecido en las pautas internacionales, exponiendo al paciente al progreso silencioso del adenocarcinoma.",
        source: "Management of Barrett’s Esophagus, Screening, Página 2."
    },
    {
        id: 3,
        question: "En el Adenocarcinoma Esofágico superficial (T1a), ¿qué hallazgo histopatológico contraindicativa la resección endoscópica exclusiva por alto riesgo de metástasis ganglionar oculta?",
        options: ["Metaplasia intestinal", "Invasión linfovascular", "Displasia de bajo grado", "Células caliciformes"],
        answer: 1,
        justification: "Justificación: De acuerdo al libro de Cáncer Esofágico y Terapias, la presencia de invasión linfovascular, arquitectura tumoral pobremente diferenciada o invasión submucosa profunda (SM2/SM3) incrementan el riesgo de metástasis en ganglios linfáticos regionales hasta un 15-40%. En estos casos, la resección mucosa endoscópica es insuficiente oncológicamente, requiriendo esofagectomía.<br><br>Perla Quirúrgica: La invasión linfovascular documentada en un adenocarcinoma intraepitelial es un factor de alto riesgo que requiere intervención quirúrgica radical debido a su inevitable diseminación regional.<br><br>Análisis de Distractores: La metaplasia intestinal (A) y las células caliciformes (D) son los marcadores precursores del esófago de Barrett, no predictores de extensión oncológica metastásica. La displasia de bajo grado (C) requiere ablación o seguimiento, pero nunca confiere riesgo metastásico tisular al no violar la lámina propia.",
        source: "Management of Esophageal Cancer, Approach to Early-Stage Esophageal Cancer, Página 11."
    },
    {
        id: 4,
        question: "En la Enfermedad por Reflujo Gastroesofágico con evidencia manométrica de motilidad esofágica inefectiva preoperatoria, ¿qué técnica quirúrgica está indicada para minimizar la disfagia posterior?",
        options: ["Funduplicatura de Nissen", "Gastroplastia de Collis", "Funduplicatura de Toupet", "Esfinterectomía de Heller"],
        answer: 2,
        justification: "Justificación: De acuerdo al libro de Manejo Quirúrgico de ERGE, en pacientes con motilidad esofágica inefectiva (ausencia de contractilidad o alta prevalencia de contracciones débiles) se recomienda el uso de una funduplicatura parcial posterior de 270 grados (Toupet) en lugar de una funduplicatura total, previniendo así un bloqueo infranqueable para un cuerpo esofágico sin fuerza propulsiva.<br><br>Perla Quirúrgica: La funduplicatura parcial de Toupet es el procedimiento de elección en pacientes con enfermedad por reflujo y evidencia manométrica de aperistalsis o trastornos de depuración severos.<br><br>Análisis de Distractores: La funduplicatura de Nissen de 360 grados (A) representa un obstáculo de alta presión contraindicado en esófagos débiles. La gastroplastia de Collis (B) se usa para elongar un esófago corto fibroso. La miotomía de Heller (D) es un procedimiento destructivo reservado para liberar obstrucciones fisiológicas primarias (acalasia).",
        source: "Surgical Management of Gastroesophageal Reflux Disease, Surgical Technique, Página 5."
    },
    {
        id: 5,
        question: "En la Perforación Esofágica contenida y tratada de forma conservadora (no quirúrgica), ¿a las cuántas horas se debe realizar el estudio radiográfico con contraste para revaluar la terapia?",
        options: ["12 a 24 horas", "48 a 72 horas", "72 a 96 horas", "5 a 7 días"],
        answer: 2,
        justification: "Justificación: De acuerdo al libro de Manejo de Perforación Esofágica, en pacientes críticamente seleccionados para terapia médica estricta y ayuno absoluto, el control radiográfico para descartar filtración mediastínica franca e inicio seguro de dieta líquida se realiza obligatoriamente entre 72 y 96 horas posteriores a la lesión.<br><br>Perla Quirúrgica: El éxito o fracaso del manejo conservador en la perforación esofágica se determina de forma segura mediante un esofagograma contrastado entre los 3 y 4 días de observación clínica estricta.<br><br>Análisis de Distractores: Estudios a las 12 o 48 horas (A, B) son prematuros, ya que el tejido inflamatorio mediastínico local aún no ha provocado un sellado hermético confiable de la brecha mucosa. Posponer hasta 5 a 7 días (D) prolonga la inanición intraluminal incrementando morbilidad metabólica sin beneficios de cicatrización estadísticamente superiores.",
        source: "Management of Esophageal Perforation, Nonoperative Management, Página 11."
    },
    {
        id: 6,
        question: "En el Esófago en Martillo Neumático (Jackhammer), ¿cuál es el valor del integral contráctil distal que define exclusivamente a esta alteración manométrica?",
        options: ["> 4000 mmHg s cm", "> 5000 mmHg s cm", "> 8000 mmHg s cm", "> 10000 mmHg s cm"],
        answer: 2,
        justification: "Justificación: De acuerdo al libro de Trastornos de Motilidad Esofágica, el esófago en Jackhammer (hipercontractilidad) requiere para su diagnóstico formal de la presencia de al menos dos degluciones con un vigor contráctil sumamente elevado, el cual es medido e identificado cuando la integral contráctil distal (DCI) supera la barrera de los 8000 mmHg s cm.<br><br>Perla Quirúrgica: El esófago hipercontráctil tipo Jackhammer se diagnostica por manometría de alta resolución mediante un DCI > 8000 mmHg s cm con síntomas clásicos de dolor torácico obstructivo y disfagia.<br><br>Análisis de Distractores: Las contracciones con vigor entre 5000 y 8000 mmHg s cm (B) identifican al esófago en cascanueces (Nutcracker), una entidad clínica con diferente criterio. Las cifras de 4000 (A) o 10000 (D) son numéricamente aleatorias y carecen de un sustento diagnóstico en los algoritmos de Chicago versión 4.0.",
        source: "Management of Disorders of Esophageal Motility, Hypercontractile Disorders, Página 28."
    },
    {
        id: 7,
        question: "En la Hernia Paraesofágica, ¿qué estructuras anatómicas se encuentran desplazadas por encima del diafragma en el defecto tipo III?",
        options: ["Unión esofagogástrica de forma aislada", "Fundus gástrico con unión intraabdominal", "Unión esofagogástrica y fundus gástrico", "Estómago total y bazo concomitante"],
        answer: 2,
        justification: "Justificación: De acuerdo al libro de Reparación de Hernia Paraesofágica, la hernia hiatal tipo III se describe como un defecto mixto que resulta de la falla de tracción de la membrana frenoesofágica, donde existe un desplazamiento superior (deslizamiento) tanto de la unión esofagogástrica como de la bóveda del fundus gástrico de forma sincrónica hacia el mediastino posterior.<br><br>Perla Quirúrgica: La hernia paraesofágica mixta tipo III representa el defecto progresivo y letal que involucra la migración torácica de la unión y el fundus gástrico, propenso a vólvulo organoaxial catastrófico.<br><br>Análisis de Distractores: La opción A describe la hernia tipo I o por deslizamiento puro. La opción B define estrictamente a la verdadera hernia paraesofágica tipo II. La herniación visceral ajena al estómago (D) tipifica únicamente al defecto masivo tipo IV.",
        source: "Management of Paraesophageal Hernia Repair, Classification, Página 2."
    },
    {
        id: 8,
        question: "En el Divertículo de Zenker, ¿entre qué barreras musculares se origina fisiopatológicamente la zona de debilidad del triángulo de Killian?",
        options: ["Músculos tirofaríngeo y cricofaríngeo", "Constrictor superior y constrictor medio", "Fibras circulares y longitudinales", "Músculos esternocleidomastoideo y omohioideo"],
        answer: 0,
        justification: "Justificación: De acuerdo al libro de Manejo del Divertículo de Zenker, esta formación sacular por hiperpresión emerge a través del triángulo de Killian, localizado milimétricamente en la faringe posterior y delimitado superiormente por las fibras oblicuas del músculo tirofaríngeo (constrictor inferior) y en su borde caudal por las fibras transversales del músculo cricofaríngeo.<br><br>Perla Quirúrgica: El pseudodivertículo por pulsión de Zenker protruye clásicamente por una dehiscencia faríngea posterior conocida como triángulo de Killian, flanqueado por el tirofaríngeo y cricofaríngeo.<br><br>Análisis de Distractores: Los límites faríngeos superiores (B) describen espacios atípicos donde no ocurren hernias faringoesofágicas. Las capas histológicas esofágicas intrínsecas (C) y la musculatura anterior del cuello (D) carecen de participación en la arquitectura mecánica del esfínter superior.",
        source: "Management of Zenker’s, Pathophysiology, Página 1."
    },
    {
        id: 9,
        question: "En el escrutinio del Esófago de Barrett, ¿a qué intervalo exacto de distancia longitudinal se deben tomar las biopsias en cuatro cuadrantes de acuerdo al protocolo de Seattle?",
        options: ["Cada 0.5 a 1 cm", "Cada 1 a 2 cm", "Cada 3 a 4 cm", "Cada 5 a 6 cm"],
        answer: 1,
        justification: "Justificación: De acuerdo al libro de Manejo del Esófago de Barrett, la estrategia de escrutinio óptima para buscar displasia celular o tumores incipientes en la mucosa metaplásica exige emplear el protocolo de Seattle, obteniendo biopsias cada 1 a 2 cm distribuidas en los cuatro cuadrantes circunferenciales a lo largo del tracto anómalo.<br><br>Perla Quirúrgica: El estándar diagnóstico imperativo para mapeo aleatorizado endoscópico del esófago de Barrett es la adquisición sistemática de biopsias tisulares por cuadrante cada 1 a 2 cm anatómicos.<br><br>Análisis de Distractores: Los intervalos subcentimétricos (A) saturarían al patólogo y prolongarían el procedimiento inútilmente. Los espacios de 3 a 4 cm (C) o 5 a 6 cm (D) provocan brechas geográficas donde pueden esconderse adenocarcinomas intramucosos tempranos sin detectar.",
        source: "Management of Barrett’s Esophagus, Evaluation, Página 2."
    },
    {
        id: 10,
        question: "En la Ingestión de Cáusticos, ¿qué grado de la clasificación endoscópica de Zargar evidencia ulceraciones transmurales con tejido de necrosis extensa difusa?",
        options: ["Grado 2B", "Grado 3A", "Grado 3B", "Grado 4"],
        answer: 2,
        justification: "Justificación: De acuerdo al libro de Esófago, la escala de Zargar orienta la terapéutica frente al daño tisular por ingestión. Las úlceras transmurales acompañadas de placas de necrosis extensa o coloración gris-negruzca abarcan gran parte de la luz y caen en la categoría de Grado 3B.<br><br>Perla Quirúrgica: El hallazgo endoscópico temprano de un Zargar 3B (necrosis mucosa extensa o transmural) constituye una indicación formal para la exploración quirúrgica anticipada de control de daños ante el inminente riesgo de perforación.<br><br>Análisis de Distractores: El grado 2B (A) consiste en úlceras profundas circunferenciales aisladas pero exentas de tejido necrótico obvio. El grado 3A (B) alberga solo parches focales y solitarios de necrosis. El grado 4 (D) diagnostica la franca perforación en cavidad torácica o peritoneal.",
        source: "Esófago, Caustic Ingestion, Página 42."
    },
    {
        id: 11,
        question: "En la Estenosis Esofágica Benigna tratada con stents autoexpandibles biodegradables, ¿en qué lapso de tiempo exacto completan su hidrólisis o pérdida total de fuerza estructural sin necesitar retiro endoscópico?",
        options: ["1 a 2 semanas", "4 a 6 semanas", "8 a 12 semanas", "16 a 20 semanas"],
        answer: 2,

        options: ["Primera capa", "Segunda capa", "Tercera capa", "Cuarta capa"],

        justification: "Justificación: De acuerdo al libro de Esófago, los leiomiomas son los tumores benignos más frecuentes del esófago y derivan de las células del músculo liso. Su confirmación diagnóstica endosonográfica se basa en ubicar una masa hipoecoica dependiente de la muscularis propria, que anatómicamente se traduce como la cuarta capa sonográfica.<br><br>Perla Quirúrgica: En el ultrasonido endoscópico, los leiomiomas son hipoecoicos, tienen bordes regulares y surgen característicamente de la cuarta capa endosonográfica (muscularis propria).<br><br>Análisis de Distractores: Las lesiones de la primera o segunda capa (A, B) asientan en la mucosa profunda o muscularis mucosae. La tercera capa (C) representa la submucosa, origen típico de lipomas o quistes benignos aislados, no del músculo liso denso del leiomioma.",
        source: "Esófago, Benign Tumors of the Esophagus, Página 18."
    },
    {
        id: 29,
        question: "En el tratamiento endoscópico del Esófago de Barrett con displasia mediante ablación por radiofrecuencia (RFA), ¿cuál es la dosis de energía térmica estandarizada recomendada por sesión (administrada en dos pulsos dobles)?",

        source: "Esófago, Ablation, Página 24."
    },
    {
        id: 30,
        question: "Durante una funduplicatura por hernia hiatal gigante, si tras la movilización mediastínica extensa persiste un esófago corto, ¿cuántos centímetros de longitud intraabdominal adicional se logran clásicamente al seccionar ambos nervios vagos (vagotomía)?",

        source: "ERGE y Hernia de Hiato, Intraoperative Management of Short Esophagus, Página 11."
    },
    {
        id: 31,
        question: "En la epidemiología de la perforación esofágica, ¿qué porcentaje de los casos corresponde al síndrome de Boerhaave (ruptura espontánea o barogénica)?",

    {

    {

        justification: "Justificación: De acuerdo al libro de Manejo del Divertículo de Zenker, el factor patológico primario es el espasmo cricofaríngeo constrictor. Si la bolsa mucosa naciente es menor de 2 cm (pequeña), la simple sección de la compuerta muscular (miotomía) aplana la presión faríngea erradicando el problema sin necesidad de extirpación.<br><br>Perla Quirúrgica: En el caso de un divertículo pequeño (< 2 cm), la realización de una miotomía cricofaríngea y tirofaríngea aislada es a menudo suficiente.<br><br>Análisis de Distractores: Si el saco mide de 3 a 4 cm (C) o más de 5 cm (D), el tamaño condiciona un sumidero físico que retendrá comida por pura estasis a pesar de aflojar el esfínter. En estos sacos grandes, la extirpación (diverticulectomía) o fijación alta es quirúrgicamente obligatoria.",

    {

    {
        id: 35,
        question: "En la evaluación de la fisiología deglutoria esofágica, ¿cuál es el lapso de tiempo máximo fisiológico en el que el esfínter esofágico inferior (EEI) sufre su relajación postdeglutoria para permitir el paso del bolo?",

        justification: "Justificación: De acuerdo al libro de ERGE y Hernia de Hiato, la contracción tónica permanente del esfínter distal es el pilar de la contención ácida. Tras iniciarse una orden neurológica de deglución en la faringe, las fibras del EEI se relajan fisiológicamente rápido dentro del transcurso de los siguientes 500 milisegundos para recibir el bolo.<br><br>Perla Quirúrgica: La musculatura del esófago distal se encuentra en contracción tónica en reposo; dentro de los 500 milisegundos posteriores al inicio de un trago, estas fibras se relajan para permitir el paso de alimentos hacia la cavidad gástrica.<br><br>Análisis de Distractores: Relajaciones instantáneas de 100 ms (A) son mecánicamente insuficientes para el aclaramiento. Demoras de 1 a 3 segundos completos (B, D) generarían obstrucción temporal distal (espástica) provocando choque retrógrado de las presiones de bomba.",

        options: ["Tendón central del diafragma", "Pilar izquierdo diafragmático", "Pilar derecho diafragmático", "Ligamento arcuato medio aórtico"],

        justification: "Justificación: De acuerdo al libro de Reparación de Hernia Paraesofágica y a las guías de ERGE, cuando un hiato desestructurado no cede a los puntos de aproximación sin desgarrar músculo, los cirujanos efectúan una incisión liberadora paralela. Por seguridad de abordaje y exposición tisular, se prefiere el pilar derecho para liberar tensión y después cubrir esa brecha lateral con un parche biológico.<br><br>Perla Quirúrgica: En ocasiones donde la flexibilidad crural no permite el cierre primario, es preferible realizar la incisión de relajación sobre el pilar derecho y parchar el defecto resultante con malla biológica.<br><br>Análisis de Distractores: Atacar el pilar izquierdo (B) es técnicamente posible pero históricamente se asocia a mayor tasa de recidiva y eventración pleural, exigiendo mallas protésicas permanentes. El tendón central (A) destruiría la zona diafragmática vascular y el ligamento arcuato (D) rige la región del tronco celíaco, zona prohibitiva.",
        source: "Management of Paraesophageal Hernia Repair, Closure of the Esophageal Hiatus, Página 6."
    },
    {
        id: 37,
        question: "En el control endoscópico de pacientes cirróticos con hemorragia variceal esofágica refractaria (tratamiento de rescate), ¿cuál es el diámetro mínimo diseñado y requerido para los stents metálicos autoexpandibles?",

    },
    {

    {

        options: ["0.5% a 1%", "10% a 15%", "6% a 8%", "2% a 5%"],

        function setupEventListeners() {

                    const globalId = parseInt(box.dataset.id);
                    const caseIdx = Math.floor((globalId - 1) / QUESTIONS_PER_CASE);
                    const qIdx = (globalId - 1) % QUESTIONS_PER_CASE;
                    const cData = casesData[caseIdx];
                    
                    if(!cData) return;
                    
                    const qData = cData.questions[qIdx];
                    const matchText = cData.caseText.toLowerCase().includes(term) || qData.question.toLowerCase().includes(term);
                    box.style.display = (term === '' || matchText || globalId.toString() === term) ? 'flex' : 'none';
                });
            });

            const modalReset = document.getElementById('reset-modal');

            });

                localStorage.removeItem('EFISERhiatosabisProgress');
                localStorage.removeItem('EFISERhiatosabisLastQId');
                localStorage.removeItem('EFISERhiatosabisExamState');

        function navigateCase(currentCaseId, direction) {
            let targetCaseId = currentCaseId;
            if (direction === 'prev' && currentCaseId > 1) {
                targetCaseId = currentCaseId - 1;
            } else if (direction === 'next' && currentCaseId < casesData.length) {
                targetCaseId = currentCaseId + 1;
            } else {
                displayQuestion(null); 
                return;
            }
            const targetGlobalQId = (targetCaseId - 1) * QUESTIONS_PER_CASE + 1;
            displayQuestion(targetGlobalQId);
        }

        function getQBoxClass(globalId, isActive) {
            let base = "q-box-item flex items-center justify-center aspect-square rounded-md font-bold text-[10px] sm:text-xs cursor-pointer transition-all select-none border ";
            if (isActive) base += "ring-4 ring-blue-500 shadow-md z-10 border-blue-500 dark:border-blue-400 ";

            const state = userProgress[globalId];
            const caseIdx = Math.floor((globalId - 1) / QUESTIONS_PER_CASE);
            const qIdx = (globalId - 1) % QUESTIONS_PER_CASE;
            const cData = casesData[caseIdx];
            
            if (!cData) return base + "bg-slate-100 text-slate-300";

            if (!examState.isFinished) {
                if (!state || !state.answered) {
                    return base + "bg-slate-50 text-slate-400 border-slate-200 hover:bg-slate-200 dark:bg-slate-800/50 dark:text-slate-500 dark:border-slate-700/50 dark:hover:bg-slate-700";
                } else {
                    return base + "bg-slate-600 text-white border-slate-700 dark:bg-slate-700 dark:border-slate-600 shadow-inner";
                }
            } 
            else {
                if (!state || !state.answered) {
                    return base + "bg-slate-100 text-slate-400 border-slate-200 dark:bg-slate-800 dark:text-slate-500 dark:border-slate-700";
                } else {
                    const isCorrect = state.selectedOption === cData.questions[qIdx].answer;
                    if (isCorrect) {
                        return base + "bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-900/30 dark:text-emerald-400 dark:border-emerald-800";
                    } else {
                        return base + "bg-rose-100 text-rose-700 border-rose-300 dark:bg-rose-900/30 dark:text-rose-400 dark:border-rose-800";
                    }
                }
            }
        }

        function renderGridHTML(isActiveIdContext = null) {
            let boxes = [];

                boxes.push(`<div class="${getQBoxClass(i, i === isActiveIdContext)}" data-id="${i}" onclick="displayQuestion(${i})">${i}</div>`);

                : "La calificación definitiva y la retroalimentación por pregunta se mostrarán tras presionar 'Finalizar y Calificar'.";
            
            let actionBtn = "";
            if (examState.isFinished) {
                actionBtn = `<button onclick="document.getElementById('reset-modal').classList.remove('hidden')" class="w-full md:w-auto bg-white/20 hover:bg-white/30 text-white border border-white/30 px-8 py-3 rounded-xl font-bold transition-colors shadow-sm">Reiniciar Simulador</button>`;
            } else {
                actionBtn = `
                    <button onclick="displayQuestion(${firstUncompletedId})" class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-indigo-600 hover:to-blue-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-indigo-900/30 transition-transform hover:-translate-y-0.5 mr-3">
                        ${ans === 0 ? 'Iniciar Examen' : 'Continuar Simulador'}
                    </button>
                    <button onclick="document.getElementById('finish-modal').classList.remove('hidden')" class="bg-rose-500 hover:bg-rose-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-rose-900/30 transition-transform hover:-translate-y-0.5">
                        Finalizar y Calificar
                    </button>
                `;
            }

            let badgeText = examState.isFinished ? "RETROALIMENTACIÓN COMPLETA" : "ENARM 2026";
            let badgeClass = examState.isFinished ? "bg-emerald-500/20 border-emerald-500/30 text-emerald-300" : "bg-white/10 border-white/10 text-white";

            let statsHTML = examState.isFinished ? `
                <div class="grid grid-cols-3 gap-2 sm:gap-4 divide-x divide-white/20 w-full text-center">
                    <div>
                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Respondidas</p>
                        <p class="text-2xl sm:text-3xl font-black">${ans}<span class="text-xs sm:text-sm text-slate-500">/${totalQuestions}</span></p>
                    </div>
                    <div>
                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Correctas</p>
                        <p class="text-2xl sm:text-3xl font-black text-emerald-300">${correct}</p>
                    </div>
                    <div class="px-2">
                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Rendimiento</p>
                        <p class="text-2xl sm:text-3xl font-black text-yellow-300">${successRate}%</p>
                    </div>
                </div>
            ` : `
                <div class="w-full text-center py-4">
                    <p class="text-[10px] uppercase tracking-widest text-slate-400 font-bold mb-2">Avance Global del Examen</p>
                    <p class="text-4xl sm:text-5xl font-black text-white">${ans}<span class="text-xl sm:text-2xl text-slate-500">/${totalQuestions}</span></p>
                    <div class="w-full bg-slate-700/50 rounded-full h-2 mt-4 overflow-hidden">
                        <div class="bg-blue-400 h-2 rounded-full shadow-md transition-all duration-300" style="width: ${(ans/totalQuestions)*100}%"></div>
                    </div>
                </div>
            `;

            let legendHTML = examState.isFinished ? `
                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-emerald-100 dark:bg-emerald-900/40 border border-emerald-300 dark:border-emerald-800"></div> Correcta</div>
                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-rose-100 dark:bg-rose-900/40 border border-rose-300 dark:border-rose-800"></div> Incorrecta</div>
            ` : `
                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-slate-50 border border-slate-200 dark:bg-slate-800/50 dark:border-slate-700/50"></div> Pendiente</div>
                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-slate-600 border border-slate-700"></div> Respondida</div>
            `;

            displayArea.innerHTML = `
                <div class="flex flex-col gap-6 max-w-7xl mx-auto lg:mt-0">
                    <div class="flex justify-center sm:justify-start items-center mb-1 mt-4 lg:mt-0">
                        <span class="inline-flex items-center gap-2 text-slate-400 font-semibold text-sm select-none">
                            
                        </span>
                    </div>

                    <div class="relative bg-slate-900 dark:bg-slate-950 rounded-[2rem] p-8 md:p-12 shadow-xl text-white overflow-hidden border border-slate-800 transition-colors duration-500">
                        <div class="relative z-10 flex flex-col lg:flex-row justify-between items-center gap-8">
                            <div class="text-center lg:text-left w-full lg:w-3/5">
                                <span class="inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest mb-4 border ${badgeClass}">
                                    ${badgeText}
                                </span>
                                <h1 class="text-3xl md:text-4xl lg:text-4xl font-extrabold tracking-tight mb-3 ${examState.isFinished ? 'text-emerald-400' : ''}">${titleText}</h1>
                                <p class="text-slate-300 text-base md:text-lg font-medium mx-auto lg:mx-0">${descText}</p>
                                <div class="mt-8 flex justify-center lg:justify-start flex-wrap gap-4">
                                    ${actionBtn}
                                </div>
                            </div>
                            
                            <div class="flex-shrink-0 bg-slate-800/50 backdrop-blur-md border border-slate-700/50 rounded-2xl p-6 flex flex-col items-center shadow-2xl w-full lg:w-2/5">
                                ${statsHTML}
                            </div>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-900 rounded-[2rem] shadow-sm border border-slate-200/60 dark:border-slate-800 p-6 md:p-8">
                        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                Tablero del Examen (280 Preguntas)
                            </h2>
                            <div class="flex gap-4 text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                ${legendHTML}
                            </div>
                        </div>
                        <div class="grid gap-2 grid-cols-[repeat(auto-fill,minmax(40px,1fr))] p-1">
                            ${renderGridHTML(null)}
                        </div>
                    </div>
                </div>
            `;
        }

        function displayQuestion(globalId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = globalId ? parseInt(globalId) : null;
                
                if (currentQuestionId) {
                    localStorage.setItem('EFISERhiatosabisLastQId', currentQuestionId);
                } else {
                    localStorage.removeItem('EFISERhiatosabisLastQId');
                }

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                if (window.innerWidth >= 1024) {
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');
                    dashboardBtn.classList.add('lg:left-[22rem]');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const caseIdx = Math.floor((currentQuestionId - 1) / QUESTIONS_PER_CASE);
                const cData = casesData[caseIdx];
                
                if (!cData) return displayQuestion(null);
                
                renderCaseLayout(cData, currentQuestionId);
                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                setTimeout(() => {
                    const targetCard = document.getElementById(`q-card-${currentQuestionId}`);
                    if (targetCard) {
                        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    }
                }, 50);

            }, 150); 
        }

        function renderCaseLayout(cData, activeGlobalId) {
            let html = `
                <div class="flex flex-col gap-6 max-w-5xl mx-auto items-center">
                    
                    <!-- COLUMNA: TEXTO DEL CASO CLÍNICO -->
                    <div class="w-full bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-2xl shadow-md border border-slate-200 dark:border-slate-800 transition-all duration-300">
                        <div class="flex items-center justify-between mb-4">
                            <span class="inline-block bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg text-[10px] font-bold tracking-widest uppercase border border-blue-100 dark:border-blue-900/30">
                                Caso Clínico Seriado
                            </span>
                            <span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">
                                Bloque #${cData.id}
                            </span>
                        </div>
                        <p class="text-slate-800 dark:text-slate-200 text-sm sm:text-base leading-relaxed font-medium">
                            ${cData.caseText}
                        </p>
                        ${examState.isFinished ? `
                            <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 text-[10px] text-slate-400 font-bold uppercase tracking-widest">
                                <span class="text-slate-500">Bibliografía GPC:</span> ${cData.source}
                            </div>
                        ` : ''}
                    </div>

                    <!-- COLUMNA: BLOQUE DE LAS 5 PREGUNTAS ASOCIADAS -->
                    <div class="w-full space-y-5">
            `;

            cData.questions.forEach((q, idx) => {
                const globalQId = (cData.id - 1) * QUESTIONS_PER_CASE + idx + 1;
                const qState = userProgress[globalQId];
                const hasAnswered = qState && qState.answered;
                const userAnswer = hasAnswered ? qState.selectedOption : null;
                
                let cardStyle = "border-slate-200 dark:border-slate-800/80";
                if (globalQId === activeGlobalId) {
                    cardStyle = "border-blue-500 dark:border-blue-500 ring-2 ring-blue-500/10";
                }
                if (examState.isFinished && hasAnswered) {
                    cardStyle = (userAnswer === q.answer) ? "border-l-4 border-emerald-500" : "border-l-4 border-rose-500";
                }

                html += `
                    <div id="q-card-${globalQId}" class="bg-white dark:bg-slate-900 p-5 sm:p-6 rounded-2xl shadow-sm border ${cardStyle} transition-all">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-[9px] font-bold bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-2 py-0.5 rounded border border-slate-200 dark:border-slate-700">
                                PREGUNTA ${globalQId}
                            </span>
                        </div>
                        <h3 class="text-sm sm:text-base font-bold text-slate-800 dark:text-slate-100 mb-4 leading-snug">${q.question}</h3>
                        <form id="q-form-${globalQId}" class="space-y-2.5">
                `;

                q.options.forEach((opt, i) => {
                    if (examState.isFinished) {
                        let optClasses = "flex items-start p-3 border rounded-xl text-xs sm:text-sm ";
                        let icon = "";
                        
                        if (i === q.answer) {
                            optClasses += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 font-semibold";
                            icon = `<svg class="w-4 h-4 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;
                        } else if (i === userAnswer) {
                            optClasses += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                            icon = `<svg class="w-4 h-4 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                        } else {
                            optClasses += "bg-slate-50 border-slate-100 dark:bg-slate-800/30 dark:border-slate-800/50 opacity-50 text-slate-400";
                        }

                        html += `
                            <div class="${optClasses}">
                                <span class="leading-snug pr-3">${opt}</span>
                                ${icon}
                            </div>
                        `;
                    } else {
                        const checkedStr = (hasAnswered && userAnswer === i) ? 'checked' : '';
                        html += `
                            <label class="flex items-start p-3 border border-slate-200 dark:border-slate-800 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/40 has-[:checked]:bg-blue-50/80 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/20 text-xs sm:text-sm shadow-sm" onclick="autoSaveAnswer(${globalQId})">
                                <input type="radio" name="option" value="${i}" ${checkedStr} class="mt-0.5 h-3.5 w-3.5 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-700 cursor-pointer">
                                <span class="ml-2.5 text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `;
                    }
                });

                html += `</form>`;

                if (examState.isFinished) {
                    html += `
                        <div class="bg-blue-50/60 dark:bg-slate-800/50 border border-blue-100/50 dark:border-slate-800 rounded-xl p-4 text-xs sm:text-sm mt-4">
                            <h4 class="font-bold text-blue-800 dark:text-blue-400 mb-1 flex items-center gap-1 uppercase tracking-wider text-[10px]">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Justificación Médica GPC
                            </h4>
                            <p class="text-slate-600 dark:text-slate-300 leading-relaxed">${q.justification}</p>
                        </div>
                    `;
                }

                html += `</div>`;
            });

            const isLastCase = cData.id === casesData.length;

            html += `
                        <!-- CONTROLES DE FLUJO EN CASOS -->
                        <div class="flex justify-between items-center pt-4 mt-6 border-t border-slate-200 dark:border-slate-800">
                            <button onclick="navigateCase(${cData.id}, 'prev')" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                                Caso Anterior
                            </button>
                            
                            ${examState.isFinished ? `
                                ${!isLastCase ? `
                                    <button onclick="navigateCase(${cData.id}, 'next')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 px-6 rounded-xl transition-colors text-xs uppercase tracking-wider flex items-center gap-1.5 shadow-sm">
                                        Siguiente Caso <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                                    </button>
                                ` : `
                                    <button onclick="displayQuestion(null)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-6 rounded-xl transition-colors text-xs uppercase tracking-wider shadow-sm">
                                        Ver Calificaciones
                                    </button>
                                `}
                            ` : `
                                <button onclick="navigateCase(${cData.id}, 'next')" class="bg-blue-600 dark:bg-blue-500 text-white font-bold py-2.5 px-6 rounded-xl shadow-md hover:bg-blue-700 dark:hover:bg-blue-400 transition-colors text-xs uppercase tracking-wider flex items-center gap-1.5">
                                    Siguiente Caso <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('module-display').innerHTML = html;
        }

        function autoSaveAnswer(globalId) {
            if(examState.isFinished) return;
            const form = document.getElementById(`q-form-${globalId}`);
            if (!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (selected) {
                userProgress[globalId] = { answered: true, selectedOption: parseInt(selected.value) };
                saveState();
                updateProgressBar();
                renderSidebarGrid();
            }
        }

        function updateProgressBar() {
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = totalQuestions > 0 ? Math.round((ans / totalQuestions) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; 
            }
        }

        function saveState() {
            try { localStorage.setItem('EFISERhiatosabisProgress', JSON.stringify(userProgress)); } catch(e) {}
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('EFISERhiatosabisProgress');
                userProgress = saved ? JSON.parse(saved) : {};
                const savedState = localStorage.getItem('EFISERhiatosabisExamState');
                if (savedState) examState = JSON.parse(savedState);
            } catch(e) { userProgress = {}; examState = { isFinished: false }; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>
</body>
</html>
