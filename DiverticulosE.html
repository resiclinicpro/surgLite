    {
        id: 63,
        question: "En un paciente que se recupera exitosamente de su primer episodio de diverticulitis aguda no complicada, ¿bajo qué condición clínica está médicamente justificado omitir la colonoscopia diferida rutinaria?",
        options: ["Edad menor a 50 años sin factores genéticos", "Ausencia de sangrado digestivo bajo previo", "Colonoscopia de alta calidad en el último año", "Resolución del dolor en menos de 48 horas"],
        answer: 2,
        justification: "Justificación: El objetivo de la endoscopia diferida es descartar una neoplasia maligna subyacente que simule diverticulitis. De acuerdo GPC de la AGA 2022, si el paciente ya cuenta con un escrutinio oncológico reciente y negativo, el riesgo residual de cáncer de novo es estadísticamente nulo.<br><br>Perla Quirúrgica: La colonoscopia está recomendada tras un primer episodio de diverticulitis no complicada, pero puede diferirse si se realizó una colonoscopia de alta calidad en el plazo de 1 año previo.<br><br>Análisis de Distractores: A) Edad menor a 50 años sin factores genéticos: La edad joven no exime del tamizaje si nunca ha tenido una endoscopia, ya que el cáncer de colon de aparición temprana (early-onset) va en aumento. B) Ausencia de sangrado digestivo bajo previo: El cáncer colorrectal puede cursar oculto y asintomático sin hemorragia evidente, mimetizándose con el flemón peridiverticular. D) Resolución del dolor en menos de 48 horas: El alivio rápido del dolor responde al tratamiento médico antiinflamatorio, pero no descarta una obstrucción tumoral incipiente microperforada.",
        source: "AGA 2022 sobre el tratamiento médico de la diverticulitis colónica, 2022, Best Practice Advice 2, p. 907."
    },
    {
        id: 64,
        question: "En el manejo de pacientes con diverticulitis aguda no complicada tratados con régimen ambulatorio oral, ¿en qué intervalo de tiempo se recomienda realizar obligatoriamente la reevaluación clínica para descartar progresión?",
        options: ["A las 48 horas", "A los 14 días", "A los 21 días", "En los siguientes 7 días"],
        answer: 3,
        justification: "Justificación: El tratamiento ambulatorio exige asegurar que el proceso inflamatorio se limite de forma efectiva. De acuerdo GPC de la WSES 2020, la ventana crítica donde se evidencia la falla médica (intolerancia oral, persistencia de fiebre o empeoramiento del dolor) ocurre durante la primera semana.<br><br>Perla Quirúrgica: Los pacientes sin comorbilidades significativas y tolerancia a la vía oral pueden tratarse sintomáticamente de forma ambulatoria, debiendo reevaluarse en los siguientes 7 días o antes si presentan deterioro.<br><br>Análisis de Distractores: A) A las 48 horas: Es una reevaluación demasiado temprana para pacientes ambulatorios estables en quienes los reactantes de fase aguda y la dinámica intestinal toman de 3 a 5 días en normalizarse. B) A los 14 días: Representa el final del proceso inflamatorio tisular resolutivo; esperar tanto tiempo retrasaría peligrosamente el rescate de pacientes que progresaron a un absceso o microperforación. C) A los 21 días: Inaceptable en el monitoreo agudo de una infección intrabdominal en curso; es más bien un periodo propio para planificar estudios diferidos.",
        source: "WSES 2020 diverticulitis colónica aguda en urgencias, 2020, Tratamiento, p. 515."
    },
    {
        id: 65,
        question: "En pacientes sometidos a colectomía de emergencia por diverticulitis aguda complicada, ¿qué parámetro de laboratorio preoperatorio es un predictor independiente de alta mortalidad a 30 días, asociándose a un riesgo letal si se agrupa con otros factores?",
        options: ["Albúmina menor a 2.5 g/dl", "Creatinina menor a 1.0 mg/dl", "Leucocitosis mayor a 12,000", "Plaquetas menores a 150,000"],
        answer: 0,
        justification: "Justificación: La hipoalbuminemia refleja un estado de desnutrición severa, fragilidad sistémica y respuesta inflamatoria aguda catabólica, afectando críticamente la cicatrización tisular. De acuerdo GPC de JAMA 2024 Diverticulitis, un registro en NSQIP demostró que este déficit nutricional, sumado a la edad y falla renal, dispara exponencialmente la letalidad quirúrgica.<br><br>Perla Quirúrgica: Los predictores independientes de mortalidad a 30 días en cirugía de urgencia por diverticulitis incluyen edad > 80 años, clase ASA IV o V, creatinina > 1.2 mg/dl y albúmina < 2.5 g/dl.<br><br>Análisis de Distractores: B) Creatinina menor a 1.0 mg/dl: Este valor de creatinina es completamente normal y refleja una función renal conservada, lo cual es protector, no un factor letal. C) Leucocitosis mayor a 12,000: Es una respuesta inmunológica esperada (SIRS leve) ante la peritonitis diverticular; no posee el peso predictivo de mortalidad aguda como la falla orgánica o la hipoalbuminemia extrema. D) Plaquetas menores a 150,000: Aunque la trombocitopenia puede verse en la sepsis grave por consumo, el predictor aislado y estandarizado en los scores de riesgo operatorio colorrectal es la albúmina < 2.5 g/dl.",
        source: "JAMA 2024 Management-of-Diverticulitis, 2024, Emergency Surgery for Diverticulitis, p. 697."
    },
    {
        id: 66,
        question: "Debido a la similitud anatómica y topográfica de los signos clínicos, ¿cuál es el principal diagnóstico diferencial patológico en pacientes de origen asiático que se presentan con diverticulitis aguda del lado derecho?",
        options: ["Colecistitis aguda", "Apendicitis aguda", "Úlcera péptica perforada", "Isquemia mesentérica"],
        answer: 1,
        justification: "Justificación: En la anatomía de los pacientes asiáticos, los divertículos son habitualmente solitarios, congénitos (verdaderos) y se asientan sobre el ciego y el colon ascendente. De acuerdo GPC de Radiología Cabueñes 2024, la inflamación cecal produce dolor en fosa iliaca derecha, mimetizando por completo un cuadro inflamatorio apendicular agudo clásico.<br><br>Perla Quirúrgica: Especialmente la diverticulitis derecha localizada en el ciego es clínicamente muy difícil de distinguir de la apendicitis aguda debido a que sus síntomas y signos topográficos son idénticos.<br><br>Análisis de Distractores: A) Colecistitis aguda: Presenta dolor en hipocondrio derecho con signo de Murphy, relacionado con la ingesta de colecistoquinéticos, clínicamente más superior en el abdomen. C) Úlcera péptica perforada: Se caracteriza por dolor epigástrico súbito, abdomen en tabla (rigidez difusa) y neumoperitoneo subdiafragmático en radiografía. D) Isquemia mesentérica: El dolor es desproporcionado a los hallazgos físicos, de ubicación periumbilical o difusa, asociado a patología vascular y acidosis metabólica severa temprana.",
        source: "Clasificación WSES para el manejo de la diverticulitis aguda, 2024, Diverticulitis aguda del colon derecho (DACD), p. 50."
    },
    {
        id: 67,
        question: "Desde la perspectiva epidemiológica, ¿cuál es la tasa aproximada de recurrencia a lo largo de 10 años en pacientes que se recuperan médica y exitosamente de su primer episodio de diverticulitis aguda?",
        options: ["5%", "80%", "17%", "65%"],
        answer: 2,
        justification: "Justificación: A pesar de que los pacientes temen episodios continuos tras su primer ataque, la historia natural de la enfermedad demuestra una tendencia favorable. De acuerdo GPC de Antibióticos 2025, el primer evento condiciona una alteración local cicatricial que sólo desencadena un nuevo embate en menos de una quinta parte de los pacientes.<br><br>Perla Quirúrgica: Las tasas de recurrencia clínica a largo plazo se sitúan en aproximadamente un 17% después del primer episodio de diverticulitis, escalando hasta un 44% después del segundo episodio.<br><br>Análisis de Distractores: A) 5%: Es el riesgo estadístico general de desarrollar diverticulitis aguda a lo largo de toda la vida para una persona con diverticulosis asintomática incidental, no la recurrencia post-ataque. B) 80%: Esta cifra históricamente errónea motivaba las sigmoidectomías sistemáticas tras el primer evento, dogma actualmente rechazado por carecer de fundamento epidemiológico real. D) 65%: Es el porcentaje anatómico correspondiente a los pacientes occidentales cuya enfermedad afecta estrictamente el colon sigmoides, no a la tasa de recaídas a una década.",
        source: "Antibióticos para la diverticulitis aguda 2025, 2025, Context, p. 122."
    },
    {
        id: 68,
        question: "¿Cuál es la prevalencia esperada de presentar diverticulosis colónica estructural en la población adulta general que alcanza los 60 años de edad?",
        options: ["20%", "5%", "85%", "60%"],
        answer: 3,
        justification: "Justificación: La aparición de pseudodivertículos por pulsión es un proceso progresivo dependiente de la elastina y el envejecimiento de los haces de colágeno fibrilar colónico acoplado a las altas presiones del hemiclon izquierdo a lo largo de décadas. De acuerdo GPC de JAMA 2025 Diverticulitis, la prevalencia es linealmente proporcional a la edad.<br><br>Perla Quirúrgica: La prevalencia de diverticulosis aumenta significativamente con la edad biológica, pasando de menos de un 20% a la edad de 40 años hasta alcanzar aproximadamente el 60% a la edad de 60 años.<br><br>Análisis de Distractores: A) 20%: Corresponde a la prevalencia en pacientes jóvenes (alrededor de los 40 años), antes de que el deterioro en la matriz de colágeno y la distensibilidad segmentaria progresen de manera crónica. B) 5%: Representa la prevalencia aproximada en poblaciones muy jóvenes menores de 40 años o en sociedades rurales con ingestas extremadamente altas de fibra insoluble. C) 85%: Sobreestima la carga de enfermedad; este alto porcentaje sólo se aproxima a la prevalencia observada en ancianos de 80 años o mayores en los países industrializados.",
        source: "JAMA 2025 Diverticulitis A Review, 2025, Introduction, p. E2."
    },
    {
        id: 69,
        question: "En la estratificación de riesgo de urgencias, ¿cuál es el valor exacto de corte de proteína C reactiva documentado que predice de forma independiente la instauración de una diverticulitis aguda severa o complicada (Hinchey > Ib)?",
        options: ["170 mg/l", "50 mg/l", "100 mg/l", "250 mg/l"],
        answer: 0,
        justification: "Justificación: La inflamación extensa productora de pus (abscesos formales o peritonitis) excede la reactividad hepática basal. De acuerdo GPC de la WSES 2020, los análisis ROC (Receiver Operating Characteristic) demuestran que este umbral sérico discrimina flemones microperforados graves de inflamaciones simples con un altísimo poder estadístico y clínico.<br><br>Perla Quirúrgica: Un valor de corte de proteína C reactiva (PCR) de 170 mg/l discrimina significativamente la diverticulitis severa complicada (Hinchey > Ib) de la leve con una sensibilidad de 87.5% y especificidad de 91.1%.<br><br>Análisis de Distractores: B) 50 mg/l: Es el punto de corte clínico bajo que integra el score clínico de Andeweg para sugerir simplemente la \"presencia\" de enfermedad diverticular en urgencias, no para predecir gravedad avanzada. C) 100 mg/l: Se asocia a un cuadro infeccioso moderado, pero en diverticulitis el riesgo de falla de tratamiento o perforación abscedada se correlaciona con cifras mucho más elevadas en el rango sérico. D) 250 mg/l: Aunque este valor se observa en estadios III o IV de Hinchey con peritonitis fecal manifiesta, el punto de discriminación temprano que determina riesgo inicial es 170 mg/l.",
        source: "WSES 2020 diverticulitis colónica aguda en urgencias, 2020, Diagnóstico, p. 488."
    },
    {
        id: 70,
        question: "Al evaluar la tomografía de un paciente con diverticulitis aguda, ¿qué hallazgo morfológico radiológico eleva drásticamente la sospecha de una malignidad colónica subyacente simulando un flemón inflamatorio?",
        options: ["Ingurgitación vascular mesentérica", "Signo del hombro o bordes en estante", "Burbujas de gas pericólico a menos de 5 cm", "Engrosamiento circunferencial liso"],
        answer: 1,
        justification: "Justificación: El cáncer de colon microperforado induce una respuesta inflamatoria peritumoral que se superpone visualmente a la diverticulitis. De acuerdo GPC de la ASCRS 2020, las lesiones neoplásicas tienden a formar bordes abruptos asimétricos entre el colon sano y el tumor ulcerado, a diferencia del engrosamiento gradual edematoso espástico típicamente benigno.<br><br>Perla Quirúrgica: Los hallazgos tomográficos específicos asociados con una mayor probabilidad de malignidad oculta incluyen el signo del \"hombro\" (bordes principales de masa con apariencia de estante abrupto), obstrucción atípica y linfadenopatía regional extensa.<br><br>Análisis de Distractores: A) Ingurgitación vascular mesentérica: Conocido como el signo del \"peine\" (comb sign), es característico de los cuadros hiperémicos severos pero netamente inflamatorios o de isquemia mesentérica reactiva aguda venosa. C) Burbujas de gas pericólico a menos de 5 cm: Constituye el estadio benigno WSES 1A por perforación local exitosamente sellada sin absceso y no representa un estigma radiológico clásico de neoformación epitelial. D) Engrosamiento circunferencial liso: Típicamente indica una lesión inflamatoria benigna (flemón diverticular no complicado), por edema submucoso difuso regular reaccional, contrastando directamente con los bordes abruptos del tumor.",
        source: "Guías de práctica clínica de la ASCRS para el tratamiento de la diverticulitis colónica del lado izquierdo, 2020, Evaluation After Recovery From Acute Diverticulitis, p. 734."
    },
    {
        id: 71,
        question: "En el abordaje preventivo secundario de los pacientes que ya han padecido episodios previos de diverticulitis aguda, ¿qué combinación de terapias carece de evidencia sólida y no se recomienda rutinariamente para prevenir recurrencias?",
        options: ["Reducción de peso, fibra dietética y ejercicio", "Cesectomía de tabaco, estatinas e inhibidores SGLT2", "Mesalazina, probióticos y rifaximina", "Supresión de AINEs, aspirina y opioides"],
        answer: 2,
        justification: "Justificación: Múltiples metaanálisis han evaluado agentes antiinflamatorios mucosos y moduladores de la microbiota esperando reproducir el éxito visto en la Enfermedad Inflamatoria Intestinal, con resultados negativos para alterar la arquitectura biológica diverticular. De acuerdo GPC de la AGA 2022, el uso profiláctico prolongado de estos compuestos somete al paciente a costos financieros y riesgos de disbiosis sin beneficios demostrados sobre la recurrencia clínica.<br><br>Perla Quirúrgica: Los pacientes con antecedentes de diverticulitis no deben ser tratados empírica ni rutinariamente con ácido 5-aminosalicílico (mesalazina), probióticos o ciclos de rifaximina en el afán de prevenir nuevas recurrencias de diverticulitis aguda.<br><br>Análisis de Distractores: A) Reducción de peso, fibra dietética y ejercicio: Se trata de un conjunto de intervenciones de \"estilo de vida de bajo riesgo\" con probada y fuerte asociación en la prevención poblacional y primaria de la enfermedad. B) Cesectomía de tabaco, estatinas e inhibidores SGLT2: El abandono del tabaco sí disminuye los riesgos de perforación. Los otros fármacos tienen efecto neutro o nulo fisiológicamente comprobado sobre la pared entérica en este contexto. D) Supresión de AINEs, aspirina y opioides: Está altamente recomendado suprimir el consumo sistemático de AINEs y opiáceos por su demostrada etiología perforativa, a excepción del uso de aspirina como prevención cardiovascular.",
        source: "AGA 2022 sobre el tratamiento médico de la diverticulitis colónica, 2022, Best Practice Advice 11, p. 95."
    },
    {
        id: 72,
        question: "A nivel anatómico e histológico en el evento de hemorragia digestiva baja por enfermedad diverticular, ¿hacia qué segmento direccional específico de la arteria penetrante ocurre invariablemente la disrupción y rotura letal?",
        options: ["Hacia el borde seroso peritoneal", "En la capa muscular longitudinal", "Dentro de la submucosa rectal distal", "Margen antimesentérico"],
        answer: 3,
        justification: "Justificación: En la herniación, los vasa recta quedan cubiertos únicamente por una capa mínima de mucosa frente a la luz colónica con alto grado de microfricción mecánica y traumatismo por las heces duras deshidratadas. De acuerdo GPC de la WGO 2004, este entorno promueve la debilidad focal de la íntima en el ápice de la bóveda vascular hacia el interior hueco.<br><br>Perla Quirúrgica: La histología de los vasos sangrantes rotos demuestra que la ruptura asimétrica de los vasos rectos ocurre invariablemente hacia la luz del divertículo, a nivel de su cúpula, sobre el margen antimesentérico.<br><br>Análisis de Distractores: A) Hacia el borde seroso peritoneal: Falso. Si el vaso se rompiera hacia la cara serosa, el paciente experimentaría hemoperitoneo agudo masivo intraperitoneal, no un sangrado de tubo digestivo intraluminal. B) En la capa muscular longitudinal: Las capas musculares están inherentemente ausentes en el interior de un pseudodivertículo herniado en su fondo anatómico, la arteria discurre bajo la delgada membrana mucosa. C) Dentro de la submucosa rectal distal: El recto distal carece de formación diverticular por poseer capas musculares circunferenciales íntegras gruesas y tenias fusionadas que bloquean los vectores de hiperpresión local herniaria.",
        source: "WGO Practice Guidelines: Enfermedad Diverticular, 2004, Sangrado, p. 637."
    },
    {
        id: 73,
        question: "En el abordaje quirúrgico robótico de la diverticulitis comparando la realización de la anastomosis de forma intracorpórea frente a la anastomosis extracorpórea tradicional, ¿qué complicación a mediano plazo se reduce significativamente?",
        options: ["Hernia incisional", "Sangrado transoperatorio", "Isquemia del muñón rectal", "Fuga anastomótica"],
        answer: 0,
        justification: "Justificación: La técnica extracorpórea exige extraer mecánicamente el colon grueso y corto a través de una incisión de asistencia más amplia y tensar las fascias de la pared abdominal para suturar afuera, debilitando la aponeurosis a largo plazo. De acuerdo GPC de JAMA 2024 Diverticulitis, acoplar y cerrar la anastomosis mediante engrapadoras robóticas estrictamente dentro de la cavidad elimina el trauma de tracción de la incisión parietal de rescate en el pozo quirúrgico, reduciendo evisceraciones futuras.<br><br>Perla Quirúrgica: La resección robótica con anastomosis intracorpórea se asocia con tasas significativamente menores de hernia incisional (0% frente a 11%) en comparación con la anastomosis extracorpórea convencional.<br><br>Análisis de Distractores: B) Sangrado transoperatorio: No se han demostrado diferencias estadísticas vitales; el sangrado pélvico mesentérico obedece fundamentalmente a la complejidad fibrosa y adherencias de la patología y no al modo en que se abrocha la sutura luminal. C) Isquemia del muñón rectal: La viabilidad de irrigación de la anastomosis y muñón depende directamente de la movilización esplénica y control de la arteria mesentérica inferior (AMI), independientemente de la lateralización intracorpórea. D) Fuga anastomótica: Ni la anastomosis extracorpórea manual ni la intracorpórea mecánica han demostrado estadísticamente suprimir por completo o modificar dramáticamente la incidencia universal basal inherente de la dehiscencia isquémica en tejido contaminado pélvico por enfermedad peridiverticular.",
        source: "JAMA 2024 Management-of-Diverticulitis, 2024, Minimally Invasive Techniques, p. 699."
    },
    {
        id: 74,
        question: "Cuando se utiliza la resonancia magnética en urgencias como alternativa para pacientes con sospecha de diverticulitis y contraindicación de tomografía, ¿cuál es su desventaja y limitación radiológica principal confirmada en la patología complicada?",
        options: ["Incapacidad de observar engrosamiento mural", "Menor sensibilidad para detectar aire extraluminal libre", "Baja especificidad para delimitar un absceso", "Contraste gadolinio es nefrotóxico letal agudo"],
        answer: 1,
        justification: "Justificación: La física de protones magnéticos y spin de la RM carece de señal intrínseca al enfrentarse a gases vacíos por la nula densidad de hidrógeno (efecto de \"signal void\"), resultando ineficaz frente a fugas aéreas puntiformes. De acuerdo GPC de JAMA 2024 Diverticulitis, si el paciente cursa con una perforación microscópica u oculta (Hinchey Ia o superior), el aire no será captado con la precisión del haz tomográfico que distingue la radiolucidez aérea de inmediato.<br><br>Perla Quirúrgica: La resonancia magnética es sumamente sensible para los cambios en tejidos blandos pero está inherentemente limitada y es inferior para la evaluación y detección de aire libre extraluminal derivado de una perforación.<br><br>Análisis de Distractores: A) Incapacidad de observar engrosamiento mural: Falso; la RM tiene excelente y superior resolución para el contraste y realce de tejidos blandos, delineando perfectamente la mucosa engrosada y el edema de la pared colónica segmentaria. C) Baja especificidad para delimitar un absceso: Las secuencias de difusión por RM (DWI) aíslan la restricción purulenta líquida de los abscesos encapsulados con altísima fidelidad espacial en la pelvis menor o mesos. D) Contraste gadolinio es nefrotóxico letal agudo: Genera Fibrosis Sistémica Nefrogénica en pacientes preexistentes con anuria, pero no es universalmente nefrotóxico agudo letal ni contraindica inherentemente estudios sin contraste si así se prefiriera y evaluara.",
        source: "JAMA 2024 Management-of-Diverticulitis, 2024, Presentation and Diagnosis, p. 696."
    },
    {
        id: 75,
        question: "En la clasificación tomográfica WSES 2020 para la diverticulitis aguda complicada, ¿qué hallazgo radiológico anatómico define la instauración y diagnóstico exclusivo del estadio 1B?",
        options: ["Burbujas de gas pericólico sin pus", "Gas libre a distancia en el peritoneo", "Absceso menor o igual a 4 cm", "Absceso pélvico mayor a 4 cm"],
        answer: 2,
        justification: "Justificación: La contención de la infección bacteriana por omentalización exitosa resulta en colecciones encapsuladas que se subdividen en la clasificación mundial según la carga de pus para determinar la viabilidad de punción. De acuerdo GPC de Radiología Cabueñes 2024, las colecciones pequeñas obedecen en más del 90% a reabsorción farmacológica, por lo que separar milimétricamente su estadio evita intervenciones invasivas punzantes percutáneas en lechos peligrosos y fútiles.<br><br>Perla Quirúrgica: La clasificación WSES actualizada clasifica al absceso pericólico o encapsulado que mide menor o igual (<=) a 4 cm de diámetro como el estadio complicado 1B.<br><br>Análisis de Distractores: A) Burbujas de gas pericólico sin pus: Refleja un estadio WSES 1A o microperforación sellada muy confinada sin colección abscedada formalmente medible. B) Gas libre a distancia en el peritoneo: Determina la presentación de un estadio complicado WSES 2B, que alerta sobre fracaso de contención local y ruptura neumática intraperitoneal retroperitoneal. D) Absceso pélvico mayor a 4 cm: Esta colección voluminosa amerita obligatoriamente intervención de drenaje guiado por imagen, y define radiológicamente al paciente dentro de un estadio complicado 2A.",
        source: "Clasificación WSES para el manejo de la diverticulitis aguda, 2024, Tabla 2 Clasificación WSES, p. 30."
    },
    {
        id: 76,
        question: "De acuerdo con la ASCRS 2020, ¿cuál es la conducta actual respecto a la indicación de sigmoidectomía electiva profiláctica tras un primer episodio de diverticulitis no complicada en un paciente inmunosuprimido?",
        options: ["Está formalmente contraindicada por alto riesgo", "Debe individualizarse sin ser indicación quirúrgica absoluta", "Es indicación quirúrgica inmediata obligatoria al alta", "Sólo se justifica si requiere terapia de oxígeno"],
        answer: 1,
        justification: "Justificación: En el pasado, a estos pacientes se les retiraba el colon de forma dogmática asumiendo que un segundo ataque los fulminaría al carecer de macrófagos y cicatrización robusta. De acuerdo GPC de la ASCRS 2020 y cohortes contemporáneas, aunque presentan complicaciones si ameritan cirugía urgente, la tasa de ataques recidivantes conservadores es sorprendentemente baja (alrededor de 21%), invalidando extirpaciones intestinales indiscriminadas.<br><br>Perla Quirúrgica: El riesgo de recurrencia en pacientes inmunosuprimidos exitosamente manejados de forma no operatoria es bajo; la sigmoidectomía profiláctica no debe indicarse rutinariamente y la decisión debe individualizarse sopesando la fragilidad intrínseca del huésped.<br><br>Análisis de Distractores: A) Está formalmente contraindicada por alto riesgo: Aunque el riesgo anastomótico es mayor por la alteración fibroblástica, no hay una proscripción o contraindicación quirúrgica total que dicte no operar si el caso lo demanda lógicamente. C) Es indicación quirúrgica inmediata obligatoria al alta: El viejo paradigma exigía cirugía post-primer cuadro (recomendación 2014); los nuevos datos revirtieron este postulado absolviendo a la mayoría de una bolsa de colostomía y cirugía compleja. D) Sólo se justifica si requiere terapia de oxígeno: No hay relación entre requerimientos ventilatorios fisiológicos del paciente y la indicación estructural para realizar la excéresis sigmoidea profiláctica en un colon en remisión inflamatoria aguda.",
        source: "Guías de práctica clínica de la ASCRS para el tratamiento de la diverticulitis colónica del lado izquierdo, 2020, Elective Surgery for Acute Diverticulitis, p. 737."
    },
    {
        id: 77,
        question: "A nivel epidemiológico poblacional, ¿cuál es el porcentaje de los pacientes portadores de diverticulosis asintomática incidental que progresará hasta desarrollar diverticulitis aguda en algún momento de su vida?",
        options: ["1% a 4%", "25% a 30%", "50% a 55%", "10% a 15%"],
        answer: 0,
        justification: "Justificación: Un mito extendido es que los divertículos son patologías inflamatorias inminentes. La abrumadora mayoría de las bolsas mucosas senescentes nunca presentan erosión, retención de fecalito ni proliferación microbiana invasiva. De acuerdo GPC de JAMA 2025 Diverticulitis, poseer este desgaste del colágeno es un factor preexistente, pero el gatillo obstructivo inflamatorio activo incide únicamente en un segmento minúsculo estadístico.<br><br>Perla Quirúrgica: Del 100% de los pacientes diagnosticados incidentalmente con diverticulosis en un colon por edad, aproximadamente entre el 1% y el 4% desarrollarán diverticulitis aguda en el transcurso de su vida.<br><br>Análisis de Distractores: B) 25% a 30%: Era la estimación exagerada citada repetitivamente en la literatura anterior al año 2000, previo a que los análisis masivos de seguimiento endoscópico poblacionales corrigieran las bases de datos mundiales de incidencia verídica en portadores sanos de bolsas silentes a largo plazo. C) 50% a 55%: Resultaría un evento letal universal poblacional; el 60% de los sexagenarios posee divertículos y, bajo este porcentaje, los sistemas de salud hospitalarios colapsarían por emergencias abdominales diarias y colectomías urgentes inviables. D) 10% a 15%: Estas tasas elevadas estadísticamente se acercan al porcentaje de personas con diverticulosis de colon izquierdo que desarrollarán por trauma vascular silencioso sangrado de tubo digestivo bajo crónico, pero no diverticulitis infecciosa por pus.",
        source: "JAMA 2025 Diverticulitis A Review, 2025, Introduction, p. E1."
    },
    {
        id: 78,
        question: "En el escrutinio de la hemorragia de tubo digestivo bajo secundaria a enfermedad diverticular colónica masiva, ¿en qué ubicación anatómica se localiza o se asienta la fuente de este sangrado masivo en un 49% a 90% de las presentaciones?",
        options: ["Colon descendente", "Colon derecho", "Recto superior", "Ángulo esplénico"],
        answer: 1,
        justification: "Justificación: Paradójicamente a la distribución inflamatoria de la enfermedad, las paredes de los divertículos del colon ascendente exhiben cuellos o bases ostiales más anchas, exponiendo mayor superficie del vasa recta frágil al trauma íntimo directo por las contracciones. De acuerdo GPC de la WGO 2004, este cizallamiento asimétrico genera que, a pesar de que el hemiclon izquierdo es el campeón en peritonitis, la pérdida masiva de glóbulos rojos por sangrado profuso arterial sea del lado ciego y hepático.<br><br>Perla Quirúrgica: A pesar de que la inflamación afecta rutinariamente al sigmoides, hasta un 90% de los episodios de sangrado masivo diverticular colónico inferior asientan y se originan hemodinámicamente a partir del colon derecho.<br><br>Análisis de Distractores: A) Colon descendente: Si bien está atiborrado de divertículos adquiridos hipertróficos y sufre diverticulitis severa (Hinchey), el cizallamiento estricto hemorrágico masivo intraluminal es predominantemente menor de este lado respecto al derecho. C) Recto superior: Como se ha reafirmado, en la anatomía del canal rectal las tenias fusionadas y la gruesa y sólida capa muscular estriada circular longitudinal protegen mecánicamente a las estructuras mucosas y evitan la formación biológica de divertículos (y de su sangrado). D) Ángulo esplénico: No es una zona vascular per se caracterizada por la vulnerabilidad diverticular a sangrar, y los estudios angiográficos masivos rara vez aíslan este punto como la fístula arterial sangrante roja viva diverticular intraluminal masiva causal.",
        source: "WGO Practice Guidelines: Enfermedad Diverticular, 2004, Sangrado, p. 637."
    },
    {
        id: 79,
        question: "¿Qué complicación oncológica grave se asocia con mayor frecuencia al abordaje exclusivo con lavado peritoneal laparoscópico frente a la resección en diverticulitis perforada?",
        options: ["Diseminación metastásica peritoneal temprana", "Tumor sincrónico de intestino delgado", "Cáncer de colon inadvertido", "Transformación sarcomatosa mesentérica"],
        answer: 2,
        justification: "Justificación: En múltiples series clínicas (ensayo SCANDIV), el fracaso rotundo y catastrófico de un cirujano que opta por el lavado laparoscópico en un flemón destructivo pélvico, omitiendo extirpar y mandar la pieza anatomopatológicamente, es que una perforación neoplásica sea clasificada y tratada como benigna. De acuerdo GPC de la ASCRS 2020, estos pacientes mueren meses después por la persistencia y progresión in situ del adenocarcinoma ulcerado dejado in vivo falsamente tratado y lavado.<br><br>Perla Quirúrgica: El lavado laparoscópico en peritonitis purulenta está asociado consistentemente con un mayor riesgo documentado de desarrollar o ignorar un adenocarcinoma sigmoideo inadvertido al dejar el segmento inflamado patológicamente en el paciente.<br><br>Análisis de Distractores: A) Diseminación metastásica peritoneal temprana: La manipulación y neumoperitoneo por trocar no han demostrado provocar invariablemente implantes de metástasis letales en la cavidad, la falla consiste en dejar al tumor primario evolucionar libremente como absceso. B) Tumor sincrónico de intestino delgado: Falso, la patología originaria es colorrectal y las metástasis o tumores sincrónicos no surgen genéticamente a voluntad en asas ileales a partir de la manipulación hídrica del lavado endoscópico. D) Transformación sarcomatosa mesentérica: Imposibilidad embriológica; las neoplasias asociadas son del estirpe adenocarcionomatoso (epitelial), no de la estirpe mesenquimal del músculo o matriz del soporte abdominal general peridiverticular.",
        source: "Guías de práctica clínica de la ASCRS para el tratamiento de la diverticulitis colónica del lado izquierdo, 2020, Laparoscopic Lavage, p. 741."

    {
        id: 80,
        question: "En pacientes con enfermedad diverticular, ¿qué hallazgo anatómico endoscópico caracteriza clásicamente a la colitis segmentaria asociada a enfermedad diverticular (SCAD)?",
        options: ["Inflamación mucosa pancolónica", "Úlceras transmurales en ciego", "Infiltrado submucoso del íleon terminal", "Preservación absoluta de la mucosa del recto"],
        answer: 3,
        justification: "Justificación: El SCAND se ubica dentro de un cruce etiopatogénico y reaccional inmunológico cruzado con el espectro de la Enfermedad Inflamatoria Intestinal, inflamando crónicamente la mucosa peridiverticular con hiperemia y granularidad sin asociar dolor peritoneal abrupto. De acuerdo GPC de AGA 2022, el diagnóstico de este raro y subestimado síndrome histopatológico difiere totalmente de la Colitis Ulcerosa (CUCI) porque el recto siempre se encuentra endoscópicamente sano y no se involucra.<br><br>Perla Quirúrgica: La colitis segmentaria asociada a la enfermedad diverticular (SCAD) es una entidad endoscópica distinta dentro del espectro inflamatorio inmunológico que se caracteriza clínicamente por afectar la mucosa y respetar y preservar absolutamente el recto.<br><br>Análisis de Distractores: A) Inflamación mucosa pancolónica: Representa usualmente a la Colitis Ulcerosa universal grave activa en estallido (pancolitis) que recorre todo el marco estructural colónico sin limitarse focalmente al área de los divertículos. B) Úlceras transmurales en ciego: Corresponde al patrón inflamatorio penetrante característico (y grave en granulomas no caseificantes o úlceras aftosas) de la enfermedad de Crohn inicial. C) Infiltrado submucoso del íleon terminal: Se asocia a las disfunciones granulomatosas fibróticas distales (íleon terminal) en la enfermedad de Crohn pero el intestino delgado carece fisiopatológicamente de participación en el cuadro SCAD reaccional focal.",
        source: "AGA 2022 sobre el tratamiento médico de la diverticulitis colónica, 2022, Introduction, p. 907."
    },
    {
        id: 81,
        question: "En la evidencia epidemiológica de cohortes sobre modificaciones conductuales, ¿cuál es el componente dietético específico fuertemente asociado con un incremento en el riesgo incidente de desarrollar diverticulitis aguda?",
        options: ["Carbohidratos simples y refinados", "Lácteos enteros y fermentados", "Consumo elevado de carne roja", "Proteína de origen aviar"],
        answer: 2,
        justification: "Justificación: La ingesta de un patrón occidental caracterizado por bajo aporte de fibra y alto contenido de derivados cárnicos se ha documentado exhaustivamente como un promotor fisiopatológico del deterioro de la pared colónica y la disbiosis. De acuerdo GPC de la ASCRS 2020, los estudios de seguimiento en profesionales de la salud validaron que el consumo de estos alimentos incrementa significativamente el riesgo de inflamación al enlentecer el tránsito y alterar las presiones de segmentación.<br><br>Perla Quirúrgica: Un patrón dietético occidental (alto en carne roja y productos lácteos altos en grasa) se asocia con un mayor riesgo de diverticulitis, y se recomienda una reducción en el consumo de carne roja como intervención para disminuir el riesgo de la enfermedad.<br><br>Análisis de Distractores: A) Carbohidratos simples y refinados: Contribuyen a la obesidad global, pero en el análisis multivariable dietético directo de diverticulitis, la carne roja demostró la correlación causal patogénica más fuerte. B) Lácteos enteros y fermentados: Aunque forman parte de la dieta occidental, no se han aislado independientemente como el macronutriente agresor principal frente a la mucosa diverticular en los estudios longitudinales. D) Proteína de origen aviar: Su consumo no muestra la misma asociación nociva que las grasas y componentes inflamatorios inherentes a la alta ingesta de carne roja de res o cerdo.",
        source: "Guías de práctica clínica de la ASCRS para el tratamiento de la diverticulitis colónica del lado izquierdo, 2020, Medical Management, p. 733."

    {
        id: 82,
        question: "En un paciente inestable que requiere una resección de urgencia por peritonitis fecal, ¿qué factor logístico intrahospitalario duplica estadísticamente el riesgo de mortalidad posoperatoria al intentar una anastomosis primaria?",
        options: ["Procedimiento realizado en fin de semana", "Falta de preparación intestinal mecánica", "Cirugía con abordaje laparoscópico abierto", "Cirugía por cirujano no colorrectal"],
        answer: 3,
        justification: "Justificación: La anastomosis colorrectal en un lecho pélvico contaminado exige una movilización meticulosa del ángulo esplénico y una técnica de perfusión precisa. De acuerdo GPC de la ASCRS 2020, los análisis de bases de datos nacionales demostraron que la mortalidad posoperatoria se eleva drásticamente cuando esta reconstrucción de alto riesgo es ejecutada por cirujanos generales sin certificación específica en cirugía de colon y recto.<br><br>Perla Quirúrgica: Se ha demostrado un riesgo dos veces mayor de mortalidad posoperatoria (15% frente a 7.4%) cuando cirujanos no colorrectales realizan una anastomosis primaria de urgencia en comparación con cirujanos colorrectales certificados.<br><br>Análisis de Distractores: A) Procedimiento realizado en fin de semana: Aunque existe el \"efecto fin de semana\" en algunos estudios de trauma, la literatura validada en peritonitis diverticular aísla el entrenamiento del cirujano como la variable de mortalidad directa. B) Falta de preparación intestinal mecánica: En el escenario de peritonitis fecal (Hinchey IV), la preparación intestinal es imposible y está universalmente omitida, por lo que no es una variable discriminatoria de mortalidad inter-operador. C) Cirugía con abordaje laparoscópico abierto: La conversión a cirugía abierta ocurre habitualmente, pero el riesgo letal en la confección de la anastomosis radica en la destreza técnica disciplinaria, no en la simple incisión parietal.",
        source: "Guías de práctica clínica de la ASCRS para el tratamiento de la diverticulitis colónica del lado izquierdo, 2020, Emergency Surgery, p. 740."
    },
    {
        id: 83,
        question: "En pacientes con diverticulitis purulenta tratados quirúrgicamente, ¿qué beneficio clínico principal ofrece la resección con anastomosis primaria protegida con ileostomía frente al procedimiento de Hartmann tradicional?",
        options: ["Ausencia de fugas o dehiscencias", "Menor tasa de infecciones de sitio quirúrgico", "Menor morbilidad al revertir el estoma", "Disminución del sangrado intraoperatorio"],
        answer: 2,
        justification: "Justificación: Ambas estrategias controlan el foco séptico pélvico eficientemente, compartiendo cifras similares de mortalidad aguda. Sin embargo, el procedimiento de Hartmann exige una futura relaparotomía hostil para descender el colon. De acuerdo GPC de la ASCRS 2020, dejar el intestino empalmado (anastomosis) y solo derivar el tránsito con una ileostomía en asa convierte la segunda cirugía en un cierre local periférico, reduciendo drásticamente las lesiones iatrogénicas graves de la restitución.<br><br>Perla Quirúrgica: La anastomosis primaria con ileostomía de derivación no disminuye la mortalidad aguda frente a Hartmann, pero reduce significativamente las complicaciones mayores durante la reversión del estoma y aumenta las tasas de supervivencia libres de estoma a largo plazo.<br><br>Análisis de Distractores: A) Ausencia de fugas o dehiscencias: Totalmente falso; una anastomosis en peritonitis conlleva un riesgo inherente notable de fuga, motivo por el cual se protege proximalmente con la ileostomía. B) Menor tasa de infecciones de sitio quirúrgico: El riesgo de contaminación de la herida parietal por el pus intraabdominal inicial es equitativo en ambas técnicas de resección sigmoidea. D) Disminución del sangrado intraoperatorio: Los tiempos de coagulación y la resección del flemón mesentérico son virtualmente idénticos; la restitución no es una maniobra hemostática.",
        source: "Guías de práctica clínica de la ASCRS para el tratamiento de la diverticulitis colónica del lado izquierdo, 2020, Emergency Surgery, p. 739."
    },
    {
        id: 84,
        question: "En la evaluación no invasiva de pacientes con antecedentes de inflamación diverticular, ¿qué biomarcador en heces se encuentra asociado de forma independiente con un mayor riesgo de presentar una recurrencia clínica de la enfermedad?",
        options: ["Sangre oculta en heces positiva", "Calprotectina fecal elevada", "Lactoferrina fecal disminuida", "Coprocultivo positivo a enterobacterias"],
        answer: 1,
        justification: "Justificación: La calprotectina es una proteína citosólica de los neutrófilos que se libera hacia la luz intestinal durante los procesos inflamatorios transmurales o mucosos activos. De acuerdo GPC de la ASCRS 2020, su persistencia en niveles altos tras el supuesto enfriamiento clínico advierte que la cascada inmunológica a nivel microscópico sigue aberrante, sentando el terreno para un nuevo estallido flemónico.<br><br>Perla Quirúrgica: El incremento de la calprotectina fecal se asocia predictivamente con un mayor riesgo de recurrencia en la enfermedad diverticular colónica y permite monitorear inflamación subclínica.<br><br>Análisis de Distractores: A) Sangre oculta en heces positiva: El sangrado diverticular obedece a un microtrauma vascular directo sin inflamación de la pared, por lo que no es un marcador de reactividad inflamatoria recurrente. C) Lactoferrina fecal disminuida: Un descenso indicaría ausencia de inflamación (normalidad). Los marcadores que alertan recaída son aquellos que mantienen niveles crónicamente altos por migración leucocitaria. D) Coprocultivo positivo a enterobacterias: La enfermedad diverticular no es una gastroenteritis bacteriana infecciosa primaria cultivable; la flora siempre estará presente porque es el ecosistema nativo del paciente.",
        source: "Guías de práctica clínica de la ASCRS para el tratamiento de la diverticulitis colónica del lado izquierdo, 2020, Initial Evaluation, p. 730."
    },
    {
        id: 85,
        question: "Según la regla de decisión clínica validada de Laméris, ¿qué tríada clínica y de laboratorio permite establecer la sospecha fundada de diverticulitis aguda en urgencias con un 97% de certeza sin necesidad de tomografía inmediata?",
        options: ["Dolor generalizado, fiebre y leucocitosis", "Sensibilidad aislada en fosa iliaca izquierda, PCR mayor a 50 y ausencia de vómito", "Masa palpable, taquicardia y neutrofilia", "Dolor hipogástrico, rectorragia y PCR mayor a 100"],
        answer: 1,
        justification: "Justificación: Cuando el dolor se confina exclusivamente al trayecto sigmoideo, el hígado detecta inflamación local (PCR moderada) y no existe íleo paralítico reactivo ni obstrucción (ausencia de vómito), la presentación clásica flemónica es casi inconfundible. De acuerdo GPC de la WSES 2020, esta tríada identifica con altísima precisión los cuadros no complicados tempranos en pacientes típicos, ahorrando potencialmente recursos en entornos limitados.<br><br>Perla Quirúrgica: La combinación de sensibilidad dolorosa focalizada únicamente en el cuadrante inferior izquierdo, PCR > 50 mg/l y ausencia de vómito constituye un criterio predictivo positivo del 97% para el diagnóstico clínico de diverticulitis aguda.<br><br>Análisis de Distractores: A) Dolor generalizado, fiebre y leucocitosis: Esto representa un síndrome de respuesta inflamatoria con irritación peritoneal difusa, escenario que exige descartar múltiples catástrofes como isquemia y obliga siempre al uso de tomografía. C) Masa palpable, taquicardia y neutrofilia: Describe un absceso avanzado o flemón gigante con respuesta sistémica, y no una simple tríada clínica de inicio para evitar imágenes. D) Dolor hipogástrico, rectorragia y PCR mayor a 100: El sangrado activo visible y el dolor atípico inferior obligan a considerar patología maligna rectal, ginecológica o colitis isquémica descendente severa.",
        source: "WSES 2020 diverticulitis colónica aguda en urgencias, 2020, Diagnóstico, p. 488."

    {
        id: 86,
        question: "Ante la imposibilidad inicial de obtener una tomografía en un paciente inestable con sospecha de peritonitis, se realiza una radiografía simple de abdomen en bipedestación. ¿En qué porcentaje aproximado de los casos reales de diverticulitis aguda perforada se logra identificar el neumoperitoneo?",
        options: ["85%", "60%", "11%", "40%"],
        answer: 2,
        justification: "Justificación: Las microperforaciones diverticulares suelen expulsar cantidades minúsculas de gas que son rápidamente contenidas o absorbidas por la grasa mesentérica adyacente. De acuerdo GPC de la WGO 2004, la sensibilidad del rayo X simple es tan precaria que no puede dependerse de ella; la visualización del gas subdiafragmático clásico es la excepción anatómica en la inflamación sigmoidea, no la regla.<br><br>Perla Quirúrgica: Los hallazgos inespecíficos dominan en las placas convencionales; el neumoperitoneo visible en una radiografía simple de abdomen se presenta sorprendentemente solo en el 11% de los pacientes con diverticulitis aguda.<br><br>Análisis de Distractores: A) 85%: Representaría el escenario típico de una úlcera péptica duodenal perforada, la cual libera litros de aire gástrico retenido directamente bajo las cúpulas. B) 60%: Cifra ampliamente sobreestimada para el contexto pélvico, donde las vísceras bloquean la migración gaseosa vertical en estadios intermedios. D) 40%: Incluso este valor moderado induciría a error clínico al sugerir que la radiografía es una herramienta moderadamente buena para descartar la perforación, lo cual es clínicamente falso.",
        source: "WGO Practice Guidelines: Enfermedad Diverticular, 2004, Exámenes, p. 633."

    {
        id: 87,
        question: "En el abordaje del paciente que ingresa por sangrado diverticular agudo y masivo a urgencias, ¿cuál de los siguientes parámetros hemodinámicos o de reanimación es una indicación absoluta para realizar una intervención quirúrgica resectiva de emergencia?",
        options: ["Hemoglobina de ingreso de 9.0 g/dl", "Necesidad de transfusión mayor a 2000 ml", "Sangrado con heces de color rojo vinoso", "Leucocitosis asociada mayor a 15,000"],
        answer: 1,
        justification: "Justificación: La mayoría de las hemorragias colónicas ceden mediante hemostasia endógena o intervencionismo angiográfico. Cuando la brecha de la arteria vasa recta es lo suficientemente grande como para desestabilizar el volumen intravascular circulante de manera incesante. De acuerdo GPC de la WGO 2004, superar el equivalente a 6 paquetes globulares indica el fracaso total de la homeostasis, volviéndose imperativa la extirpación del segmento sangrante para salvar la vida.<br><br>Perla Quirúrgica: Las indicaciones para intervención quirúrgica urgente por sangrado diverticular incluyen inestabilidad hemodinámica refractaria, hemorragia recurrente masiva y la necesidad de transfusión sanguínea mayor a 2000 ml (aprox. 6 unidades).<br><br>Análisis de Distractores: A) Hemoglobina de ingreso de 9.0 g/dl: Representa una anemia que requiere evaluación y eventual soporte transfusional estándar, pero no define por sí sola un fracaso hemostático quirúrgico en ausencia de choque. C) Sangrado con heces de color rojo vinoso: La hematoquecia es la manifestación habitual esperada del cuadro; el color de la sangre no dicta la indicación para laparotomía si el paciente está clínicamente compensado. D) Leucocitosis asociada mayor a 15,000: El sangrado es un fenómeno no inflamatorio mecánico puro de la íntima vascular; una leucocitosis reactiva no orienta al nivel de exanguinación o volumen perdido intra-luminal.",
        source: "WGO Practice Guidelines: Enfermedad Diverticular, 2004, Cirugía de urgencia por sangrado, p. 638."
    },
    {
        id: 88,
        question: "¿Cuál es la recomendación actual de las guías internacionales respecto a la colocación rutinaria de stents colónicos autoexpandibles para el manejo definitivo de una estenosis benigna originada por enfermedad diverticular crónica?",
        options: ["Son el tratamiento de elección definitivo", "Se recomiendan solo en pacientes jóvenes", "No se recomiendan de forma rutinaria", "Deben colocarse en todos los pacientes preoperatoriamente"],
        answer: 2,
        justification: "Justificación: A diferencia de la obstrucción maligna (donde el stent franquea el tumor de forma transitoria o paliativa), las estenosis diverticulares se componen de tejido fibrótico asimétrico muy rígido, a menudo angulado. De acuerdo GPC de JAMA 2025 sobre Diverticulitis, intentar dilatar mecánicamente estos embudos fibrosos asocia tasas inaceptables de migración de la malla y riesgo agudo de ruptura parietal.<br><br>Perla Quirúrgica: Debido al alto riesgo de complicaciones como dolor crónico persistente, sangrado masivo, perforación yatrogénica y migración del dispositivo, el uso rutinario de stents colónicos para estenosis diverticulares benignas no está recomendado.<br><br>Análisis de Distractores: A) Son el tratamiento de elección definitivo: La cirugía resectiva (colectomía) con restitución del tránsito mediante tejido sano y complaciente sigue siendo el único estándar de oro curativo aceptado. B) Se recomiendan solo en pacientes jóvenes: La contraindicación técnica biomecánica de forzar una prótesis expansible metálica dentro de un tejido fibrótico es universal y no discrimina grupos de edad. D) Deben colocarse en todos los pacientes preoperatoriamente: Como \"puente a la cirugía\", el stent diverticular fracasa con demasiada frecuencia por la anatomía tortuosa, por lo que la descompresión urgente quirúrgica abierta es preferible si la oclusión es total.",
        source: "JAMA 2025 Diverticulitis A Review, 2025, Stricture, Large Bowel Obstruction, p. E8."
    },
    {
        id: 89,
        question: "Al interrogar sobre modificaciones del estilo de vida a un paciente de 55 años, ¿qué impacto estadístico documentado tiene el tabaquismo activo en la historia natural de la enfermedad diverticular?",
        options: ["Protege contra el sangrado diverticular", "Aumenta el riesgo de perforación en más del doble", "Previene la formación de nuevos divertículos", "Disminuye la incidencia de diverticulitis derecha"],
        answer: 1,
        justification: "Justificación: La nicotina y las toxinas del tabaco inducen vasoconstricción mesentérica local y alteran negativamente los macrófagos tisulares, entorpeciendo la neovascularización y la síntesis de colágeno reparador en la pared colónica. De acuerdo GPC de la ASCRS 2020, cuando se instaura la microperforación diverticular en un fumador, la falta de irrigación local facilita la necrosis tisular acelerada sin contención.<br><br>Perla Quirúrgica: El tabaquismo activo tiene un impacto severo; el riesgo relativo de presentar una complicación mayor (absceso o perforación) alcanza el 2.54 para fumadores actuales en comparación con controles sanos no fumadores.<br><br>Análisis de Distractores: A) Protege contra el sangrado diverticular: El tabaco provoca disfunción endotelial, ateroesclerosis y fragilidad íntima, componentes que potencialmente empeoran el estatus capilar sistémico general. C) Previene la formación de nuevos divertículos: Falso, el tabaco debilita sistémicamente las fibras de colágeno del tejido conectivo, favoreciendo la aparición de hernias pulsionales a través de la capa muscular lisa. D) Disminuye la incidencia de diverticulitis derecha: No se ha demostrado ningún patrón protector selectivo por lateralidad anatómica para la exposición sistémica a la toxina del humo del cigarrillo inhalado.",
        source: "Guías de práctica clínica de la ASCRS para el tratamiento de la diverticulitis colónica del lado izquierdo, 2020, Medical Management, p. 733."
    },
    {
        id: 90,
        question: "En el análisis de morbimortalidad de pacientes inmunosuprimidos sometidos a cirugía electiva de sigmoidectomía por antecedente de diverticulitis, ¿qué complicación operatoria presenta un riesgo incrementado en más del doble (OR 2.69) frente a la población inmunocompetente?",
        options: ["Obstrucción de intestino delgado", "Dehiscencia de la herida quirúrgica", "Fuga anastomótica tardía", "Retención urinaria aguda"],
        answer: 1,
        justification: "Justificación: Los fármacos inmunosupresores (como corticoides o calcineurínicos) paralizan la fase inflamatoria y proliferativa de la cicatrización, retrasando drásticamente el depósito de matriz fibrinoide y tensión tensil de la fascia de la pared abdominal. De acuerdo GPC de la ASCRS 2020, la falla biomecánica del cierre laparotómico o de los puertos es una catástrofe subestimada de altísima incidencia estadística en este nicho poblacional especial.<br><br>Perla Quirúrgica: Los análisis poblacionales NSQIP demuestran que los pacientes inmunosuprimidos sometidos a resección electiva presentan un riesgo de evisceración y dehiscencia de la herida significativamente más alto (OR 2.69) que los inmunocompetentes.<br><br>Análisis de Distractores: A) Obstrucción de intestino delgado: Depende de la manipulación de asas y formación de adherencias intraabdominales por la disección peritoneal, sin estar directamente triplicado por el estatus inmunológico celular circulante. C) Fuga anastomótica tardía: Aunque existe riesgo de fallo en la anastomosis (razón por la cual a menudo se deriva transitoriamente), el marcador estadístico NSQIP independientemente duplicado de mayor impacto parietal es la dehiscencia aponeurótica. D) Retención urinaria aguda: Constituye una complicación disautonómica funcional urológica postoperatoria por bloqueo pélvico o dolor, irrelevante frente al colapso cicatricial fibroblástico inducido por la inmunosupresión sistémica profunda.",
        source: "Guías de práctica clínica de la ASCRS para el tratamiento de la diverticulitis colónica del lado izquierdo, 2020, Elective Surgery for Acute Diverticulitis, p. 737."

    {
        id: 91,
        question: "Durante la realización de una sigmoidectomía electiva por enfermedad diverticular, ¿qué impacto clínico ha demostrado tener la preservación sistemática de la arteria mesentérica inferior (AMI) frente a su ligadura directa desde la raíz aórtica?",
        options: ["Elimina el riesgo de hernia incisional", "Reduce significativamente el tiempo quirúrgico", "Evita la disección del uréter izquierdo", "No demuestra beneficio significativo en prevenir fuga anastomótica"],
        answer: 3,
        justification: "Justificación: Técnicamente, preservar la arteria mesentérica inferior se argumentaba teóricamente para garantizar una irrigación óptima al muñón distal rectal. De acuerdo GPC de la ASCRS 2020, metaanálisis extensos han invalidado esta preocupación vascular purista en enfermedad benigna, ya que la perfusión colateral por la arteria marginal de Drummond y arcadas hemorroidales suple la demanda isquémica sin alterar la cicatrización luminal en diverticulitis de manera medible.<br><br>Perla Quirúrgica: Aunque algunos estudios anatómicos la sugieren, la preservación intencionada del tronco de la arteria mesentérica inferior (y la arteria rectal superior) no ha demostrado beneficio estadísticamente significativo en la disminución de la fuga anastomótica posoperatoria.<br><br>Análisis de Distractores: A) Elimina el riesgo de hernia incisional: Falso; la tracción de los puertos laparoscópicos, extracción de la pieza y la aponeurotomía muscular no guardan relación fisiopatológica alguna con el nivel del control de ligadura vascular profunda. B) Reduce significativamente el tiempo quirúrgico: Esccionar el mesenterio cuidadosamente para disecar y esqueletizar ramas distales preservando el tronco principal toma técnicamente más tiempo que grapar directamente la raíz de la AMI por completo en bloque isquémico. C) Evita la disección del uréter izquierdo: El uréter discurre en el retroperitoneo profundo y cruzado, y debe ser invariablemente identificado y protegido visualmente independientemente de si la arteria vascular mesentérica central se liga alta o baja.",
        source: "Guías de práctica clínica de la ASCRS para el tratamiento de la diverticulitis colónica del lado izquierdo, 2020, Technical Considerations, p. 741."
    },
    {
        id: 92,
        question: "En pacientes con dolor crónico abdominal persistente o enfermedad recurrente prolongada manejada de forma conservadora, ¿cuál es el beneficio comprobado a los 6 meses de someterlos a una sigmoidectomía laparoscópica electiva (Ensayo DIRECT)?",
        options: ["Cese inmediato de evacuaciones diarreicas", "Normalización de marcadores inflamatorios hepáticos", "Mejora significativa en el índice de calidad de vida gastrointestinal", "Prevención absoluta de cáncer colorrectal sincrónico"],
        answer: 2,
        justification: "Justificación: Remitir el foco fibrótico de espasmo, microperforación cíclica e hiperalgesia pélvica erradica el circuito biomecánico del dolor subagudo incapacitante. De acuerdo GPC de la ASCRS 2020, el ensayo holandés validó objetivamente que la cirugía elimina el malestar somático limitante mejor que la resignación a dietas interminables y visitas a urgencias.<br><br>Perla Quirúrgica: En el ensayo DIRECT, el grupo de resección quirúrgica presentó una puntuación en el Índice de Calidad de Vida Gastrointestinal (GIQLI) significativamente superior (14.2 puntos de diferencia) a los 6 meses y a los 5 años en comparación con el manejo conservador.<br><br>Análisis de Distractores: A) Cese inmediato de evacuaciones diarreicas: Muchos pacientes desarrollan un cuadro funcional hiperactivo de tránsito que puede persistir transitoriamente incluso después de extirpar el sigmoides, sin garantizar heces formadas inmediatas. B) Normalización de marcadores inflamatorios hepáticos: Los pacientes con dolor crónico asintomático (SUDD) o enfermedad no activa subclínica suelen tener reactantes de fase aguda en rangos estrictamente normales, por lo que su \"normalización\" no es el endpoint medido. D) Prevención absoluta de cáncer colorrectal sincrónico: La colectomía segmentaria sigmoidea no exime al resto de la mucosa colónica remanente ascendente y transversa de desarrollar una neoplasia de novo futura aislada.",
        source: "Guías de práctica clínica de la ASCRS para el tratamiento de la diverticulitis colónica del lado izquierdo, 2020, Elective Surgery for Acute Diverticulitis, p. 737."

    {
        id: 93,
        question: "En el ensayo DIABOLO sobre el uso de la estrategia de observación sin antibióticos en pacientes con diverticulitis aguda no complicada leve (estadios tempranos), ¿qué criterio estricto de temperatura corporal máxima al ingreso exigía el protocolo para considerar al paciente elegible?",

        justification: "Justificación: La hipertermia extrema denota translocación bacteriana descontrolada, bacteriemia invasiva o un foco purulento no drenado que abruma los sistemas de contención. De acuerdo GPC de la WSES 2020, para omitir antibióticos farmacológicos con seguridad clínica comprobada, el paciente debe manifestar exclusivamente una inflamación sistémica leve somática sin respuesta pirética agresiva evidente.<br><br>Perla Quirúrgica: El tratamiento observacional (sin antibióticos) en el ensayo DIABOLO requería estrictamente que los pacientes mantuvieran estabilidad clínica con una temperatura central basal inferior a los 38.0 °C (100.4 °F).<br><br>Análisis de Distractores: A) Menor a 39.0 °C: Tolerancia pirética excesivamente alta para la seguridad de un abordaje de simple observación natural; una fiebre de 38.9 °C exige cobertura bactericida agresiva frente a inminente choque séptico. C) Menor a 37.5 °C: Cifra demasiado restrictiva asimilable a temperatura normal febrícula leve en sujetos sanos o estrés hídrico, excluyendo injustificadamente a casi todos los pacientes con inflamación focal flemónica clásica de urgencias. D) Menor a 38.5 °C: Aunque se permite en algunos algoritmos intermedios aislados con observación cercana para ancianos, el valor de corte exacto validado mundialmente por el ensayo pivote observacional holandés se fijó en 38.0.",

    {
        id: 94,
        question: "En la evaluación anatómica y técnica de un absceso pélvico originado por diverticulitis, ¿cuál de los siguientes hallazgos tomográficos es un factor predictivo documentado de fracaso al intentar una curación exclusiva mediante drenaje percutáneo?",

    {
        id: 95,
        question: "A nivel anatómico e histológico en poblaciones asiáticas, ¿qué característica diferencial define típicamente a la diverticulitis aguda del colon derecho en contraposición a su homóloga en el colon izquierdo de pacientes occidentales?",
        options: ["Se compone principalmente de pseudodivertículos por pulsión", "Afecta exclusivamente a mujeres multíparas añosas", "Generalmente se presenta como un divertículo solitario", "Muestra alta tasa de fístulas colocutáneas primarias"],
        answer: 2,
        justification: "Justificación: El mecanismo de formación derecho en asiáticos responde a menudo a verdaderas alteraciones congénitas (todas las capas de la pared intestinal) y no a un evento difuso crónico de degeneración segmentaria del colágeno circular por hiperpresiones obstructivas típicas occidentales. De acuerdo GPC de la WSES 2020, esto genera un cuadro clínico focalizado cecal que exige escasa agresividad quirúrgica por su comportamiento extremadamente benigno no estenósico global.<br><br>Perla Quirúrgica: La diverticulitis aguda del colon derecho (DACD) típicamente se presenta como un divertículo solitario verdadero, asocia una baja tasa de complicaciones y en la mayoría de los casos no requiere intervenciones quirúrgicas invasivas de urgencia masiva.<br><br>Análisis de Distractores: A) Se compone principalmente de pseudodivertículos por pulsión: Este es exactamente el mecanismo fisiopatológico predominante de la clásica enfermedad izquierda occidental del colon sigmoides (herniación sin capa muscular). B) Afecta exclusivamente a mujeres multíparas añosas: A diferencia de la enfermedad izquierda occidental en la vejez, la DACD muestra una predilección estadística y epidémica predominante clara por hombres de mediana edad. D) Muestra alta tasa de fístulas colocutáneas primarias: La diverticulitis derecha rara vez penetra crónicamente o fistuliza; es un proceso habitualmente inflamatorio que cede muy rápidamente con antibióticos o diverticulectomía puntual y apendicectomía.",

    {
        id: 96,
        question: "En el análisis epidemiológico y seguimiento longitudinal de pacientes menores de 50 años que sobreviven a un primer ataque de diverticulitis manejado médicamente, ¿cómo se compara su riesgo de requerir cirugía de emergencia a futuro frente a los adultos mayores?",
        options: ["Es tres veces mayor en los jóvenes", "Tienen un riesgo similar de requerir cirugía de emergencia", "El riesgo desaparece por completo en jóvenes", "Es 50% menor debido a su inmunidad robusta"],
        answer: 1,
        justification: "Justificación: Existe el mito histórico de que la enfermedad en jóvenes es tan virulenta que los destina a la bolsa de colostomía inexorablemente y deben ser operados preventivamente de inmediato. De acuerdo GPC de la ASCRS 2020, el análisis estadístico de miles de casos reales derribó este dogma, confirmando que si bien acuden más por dolor y recidivas clínicas (reingresos), su tasa final de presentar peritonitis letal o cirugía urgente general es sorprendentemente idéntica a la de los ancianos.<br><br>Perla Quirúrgica: Aunque los pacientes más jóvenes experimentan mayores tasas de reingreso por recurrencia clínica sintomática, tienen un riesgo estadísticamente similar (no mayor) de requerir cirugía de emergencia a futuro en comparación con los pacientes mayores de 50 años.<br><br>Análisis de Distractores: A) Es tres veces mayor en los jóvenes: Un error clásico fundamentado en bibliografía obsoleta de los años ochenta que justificaba falsamente realizar un gran volumen de sigmoidectomías innecesarias de manera profiláctica universal en este segmento poblacional al momento del alta. C) El riesgo desaparece por completo en jóvenes: Ningún paciente con la arquitectura colónica alterada y pérdida del tono de la pared intestinal está médicamente absuelto y completamente exento de una complicación fecal obstructiva sorpresiva. D) Es 50% menor debido a su inmunidad robusta: La competencia de la respuesta inmune local ayuda a reabsorber abscesos y contener omentalmente, pero la fisiopatología biomecánica de la presión endoluminal esclerosante de obstrucción es similar, equiparando finalmente el requerimiento quirúrgico a la población general.",
        source: "Guías de práctica clínica de la ASCRS para el tratamiento de la diverticulitis colónica del lado izquierdo, 2020, Elective Surgery, p. 736."

    {
        id: 97,
        question: "En la evolución a mediano plazo tras el alta por un episodio de diverticulitis aguda no complicada, ¿qué hallazgo clínico documentado durante la hospitalización inicial actúa como fuerte predictor independiente para el desarrollo de síntomas abdominales crónicos persistentes?",
        options: ["Sangrado microscópico intermitente", "Diámetro del sigmoides superior a 5 cm", "Puntuación de dolor mayor a 8 en el cuadro agudo", "Neutropenia relativa persistente"],
        answer: 2,
        justification: "Justificación: Una intensidad nociceptiva extrema en la fase de estallido inicial induce cambios neuropáticos periféricos locales en los receptores intramurales y sensibilización del plexo mientérico residual en una pelvis hiperreactiva. De acuerdo GPC de la ASCRS 2020, estos pacientes perpetúan una percepción de molestia cólica tipo calambre, encasillándolos a menudo en un espectro limitante posinfeccioso similar a la hipersensibilidad visceral del intestino irritable.<br><br>Perla Quirúrgica: En los subanálisis del ensayo DIABOLO, los pacientes que reportaron una puntuación de dolor (escala visual análoga) mayor o igual a 8 en la presentación inicial tuvieron un riesgo significativamente mayor de desarrollar síntomas abdominales crónicos persistentes.<br><br>Análisis de Distractores: A) Sangrado microscópico intermitente: Un cuadro clínico de diverticulitis no complicada rara vez se sobrepone patológicamente de forma silente con un evento de hemorragia activa o microsangrado crónico predictor, siendo la fisiopatología del dolor netamente neuro-muscular regional. B) Diámetro del sigmoides superior a 5 cm: Constituye un hallazgo de megacolon transitorio o íleo adinámico de asa dilatada de respuesta inflamatoria inespecífica, pero no se ha determinado como factor directo de neuro-programación dolorosa visceral crónica persistente a largo plazo. D) Neutropenia relativa persistente: Este parámetro paraclínico sugeriría más una alteración del recuento de linaje celular inmunológico viral intercurrente que un estado de remodelación dolorosa neuronal inflamatoria de terminales aferentes periféricas del tracto gastrointestinal sigmoideo.",
        source: "Guías de práctica clínica de la ASCRS para el tratamiento de la diverticulitis colónica del lado izquierdo, 2020, Elective Surgery for Acute Diverticulitis, p. 737."

    {
        id: 98,
        question: "En pacientes hospitalizados por diverticulitis aguda no complicada que requieren tratamiento farmacológico pero con antecedente documentado de alergia severa y anafilaxia a la penicilina y cefalosporinas, ¿qué combinación antibiótica constituye una alternativa de primera línea recomendada?",

        justification: "Justificación: En el paciente sin posibilidad de recibir agentes con anillo betalactámico, se requiere una potente acción contra enterobacterias gramnegativas mediante un mecanismo de acción bactericida diferente (inhibición de la topoisomerasa y ADN girasa). De acuerdo GPC de JAMA 2025 sobre Diverticulitis, la fluoroquinolona sumada a la lisis anaeróbica del metronidazol garantiza una excelente penetración tisular intrabdominal esterilizando el flemón pélvico eficientemente.<br><br>Perla Quirúrgica: Cuando el uso de betalactámicos o cefalosporinas está formalmente contraindicado, los regímenes alternativos de primera línea (tanto orales como intravenosos) se basan fuertemente en la combinación de una fluoroquinolona (ciprofloxacino) junto a metronidazol.<br><br>Análisis de Distractores: A) Ceftriaxona combinada con clindamicina: Falso; la ceftriaxona es una cefalosporina de tercera generación y administrarla en un paciente con anafilaxia conocida a esta familia de antibióticos desencadenaría una reacción cruzada potencialmente mortal. B) Imipenem combinado con gentamicina: El imipenem (carbapenémico) asocia una ligera reactividad cruzada en alérgicos estrictos a la penicilina, y la asociación de doble cobertura agresiva con aminoglucósidos es empíricamente excesiva, tóxica e innecesaria de entrada. D) Ampicilina combinada con sulbactam: Pertenece a las aminopenicilinas, siendo absolutamente contraindicada y prohibitiva su administración en pacientes con alergia mayor documentada a este grupo de compuestos por riesgo de shock.",

    {
        id: 99,
        question: "Desde el punto de vista de la estandarización quirúrgica clínica, ¿cuál es el criterio anatomopatológico exacto que marca la transición que diferencia estadísticamente a una diverticulitis aguda no complicada de una complicada?",
        options: ["Aparición de leucocitosis mayor a 12,000", "Extensión del proceso infeccioso más allá del colon", "Presencia de dolor irradiado a la fosa renal", "Formación de divertículos gigantes con aire"],
        answer: 1,
        justification: "Justificación: La inflamación intramural contenida cura invariablemente con la barrera inmunológica local intacta. Cuando se produce la macro o micro-ruptura, permitiendo la diseminación de líquido, bacterias y gas hacia la matriz fascial, la grasa perirrenal o el espacio intrapélvico profundo, la historia natural de curación cambia por completo. De acuerdo GPC de Radiología Cabueñes 2024, esta diseminación es la línea fronteriza que encarece los costos, dispara la estancia media e impone la evaluación para terapia intervencionista focal.<br><br>Perla Quirúrgica: Se considera diverticulitis aguda complicada (escalando la gravedad en las diferentes clasificaciones y estadíos) en el momento biológico o radiológico en el que el proceso inflamatorio o séptico local se extiende más allá de la pared anatómica del colon.<br><br>Análisis de Distractores: A) Aparición de leucocitosis mayor a 12,000: Es una respuesta fisiológica metabólica de fase aguda sistémica compensadora puramente predecible, y no representa por sí sola una disrupción física tisular estructural del estrato muscular hacia tejidos estériles. C) Presencia de dolor irradiado a la fosa renal: Frecuente por proximidad anatómica urológica y contigüidad inflamatoria inespecífica reaccional simpática (irritación retroperitoneal del uréter), pero no dictamina un daño mecánico tisular con perforación formal de grado avanzado. D) Formación de divertículos gigantes con aire: Es una patología extremadamente rara (mecanismo valvular) de presentación fenotípicamente indolora, timpánica masiva y no obedece al concepto de enfermedad obstructiva séptica microperforada purulenta peridiverticular difusa o pél localized clásica.",

        options: ["Fue igual en ambos grupos (5 días)", "Fue significativamente más larga en el grupo observado", "Fue significativamente más corta en el grupo observado", "Requirió ingreso a cuidados intensivos en la mitad de los casos"],
