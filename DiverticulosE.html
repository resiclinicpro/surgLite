    <script>
        // =========================================================
        // =========================================================
        const questionsData = [
    {
        id: 1,
        question: "¿A partir de qué valor de corte de proteína C reactiva existe un riesgo significativamente elevado de presentar diverticulitis aguda complicada que obliga a la realización de una tomografía computarizada?",
        options: ["150 mg/l", "50 mg/l", "100 mg/l", "200 mg/l"],
        answer: 0,
        justification: "Justificación: De acuerdo GPC de la WSES 2020, un valor de proteína C reactiva (PCR) mayor a 150 mg/l actúa como un predictor independiente de gravedad y complicaciones en la enfermedad diverticular, diferenciando clínicamente un cuadro no complicado de uno complicado (ej. absceso o perforación). Este umbral exige la realización sistemática de una tomografía computarizada para estadificación y mapeo anatómico preciso.<br><br>Perla Quirúrgica: Los pacientes con PCR > 150 mg/l tienen mayor riesgo de diverticulitis complicada y deben someterse invariablemente a una tomografía computarizada con contraste intravenoso.<br><br>Análisis de Distractores: B) 50 mg/l: Este nivel puede observarse en diverticulitis leve o no complicada, pero carece de la alta especificidad para predecir complicaciones estructurales graves. C) 100 mg/l: Aunque representa un proceso inflamatorio activo, no alcanza el umbral de máxima discriminación estadística para obligar a la búsqueda de peritonitis o absceso. D) 200 mg/l: Si bien un paciente con este valor probablemente tenga enfermedad complicada, el punto de corte clínico exacto de alarma establecido internacionalmente inicia desde los 150 mg/l.",
        source: "WSES 2020 diverticulitis colónica aguda en urgencias, 2020, Pruebas de Imagen, p. 27."
    },
    {
        id: 2,
        question: "Tras la resolución exitosa de un cuadro de diverticulitis aguda complicada manejada de forma conservadora, ¿cuál es el tiempo óptimo recomendado para realizar una colonoscopia y descartar malignidad oculta?",
        options: ["2 a 4 semanas", "6 a 8 semanas", "10 a 12 semanas", "12 a 14 semanas"],
        answer: 1,
        justification: "Justificación: La inflamación intensa durante un episodio agudo altera la anatomía de la pared colónica, haciéndola edematosa, rígida y altamente susceptible a la perforación iatrogénica por el endoscopio y la insuflación. De acuerdo GPC de la ASCRS 2020, se debe permitir el enfriamiento del proceso inflamatorio mediante un periodo de ventana seguro antes de instrumentar la luz intestinal.<br><br>Perla Quirúrgica: Después de un episodio agudo de diverticulitis, la colonoscopia debe retrasarse de 6 a 8 semanas o hasta la resolución completa de los síntomas agudos, a menos que existan datos de alarma.<br><br>Análisis de Distractores: A) 2 a 4 semanas: Representa un periodo de alto riesgo debido a que la inflamación transmural y la friabilidad tisular aún se encuentran activas, incrementando dramáticamente el riesgo de perforación. C) 10 a 12 semanas: Es un retraso injustificado que podría comprometer el pronóstico oncológico del paciente si la causa subyacente de la microperforación fuera una neoplasia obstructiva. D) 12 a 14 semanas: Retraso clínico inaceptable para establecer un diagnóstico diferencial de malignidad en un paciente de riesgo.",
        source: "Guías de práctica clínica de la ASCRS para el tratamiento de la diverticulitis colónica del lado izquierdo, 2020, Evaluation After Recovery From Acute Diverticulitis, p. 734."
    },
    {
        id: 3,
        question: "En pacientes con antecedentes de enfermedad diverticular, ¿qué grupo farmacológico se asocia de forma independiente con un incremento en el riesgo de recurrencia y complicaciones, por lo que su uso regular debe evitarse?",
        options: ["Estatinas", "Inhibidores de bomba de protones", "Bloqueadores de canales de calcio", "Medicamentos antiinflamatorios no esteroideos"],
        answer: 3,
        justification: "Justificación: Los AINEs inhiben la síntesis de prostaglandinas, reduciendo el flujo sanguíneo de la mucosa y alterando la barrera epitelial del colon. Esto predispone a erosión mucosa, microperforación y sangrado intradiverticular. De acuerdo GPC de la AGA 2022, el uso habitual de estos fármacos aumenta significativamente la incidencia de eventos agudos complicados.<br><br>Perla Quirúrgica: Los pacientes con antecedentes de diverticulitis deben evitar el uso regular (≥ 2 veces por semana) de medicamentos antiinflamatorios no esteroideos, excepto la aspirina prescrita para prevención cardiovascular secundaria.<br><br>Análisis de Distractores: A) Estatinas: No han demostrado un efecto deletéreo en la mucosa colónica; algunos estudios sugieren un rol antiinflamatorio pleiotrópico sin impacto negativo en la diverticulitis. B) Inhibidores de bomba de protones: Alteran el pH gástrico y el microbioma entérico (asociándose a infecciones como C. difficile), pero no están vinculados causalmente con la recurrencia diverticular. C) Bloqueadores de canales de calcio: Producen relajación del músculo liso y pueden asociarse a estreñimiento, pero no son un factor de riesgo farmacológico primario para complicaciones diverticulares.",
        source: "AGA 2022 sobre el tratamiento médico de la diverticulitis colónica, 2022, Best Practice Advice 9, p. 90."
    },
    {
        id: 4,
        question: "¿A partir de qué diámetro se recomienda el drenaje percutáneo guiado por imagen como tratamiento de primera línea en pacientes estables con un absceso diverticular?",
        options: ["Mayor a 1 cm", "Mayor a 5 cm", "Mayor a 7 cm", "Mayor a 3 cm"],
        answer: 3,
        justification: "Justificación: Los abscesos menores suelen carecer de un núcleo licuado extenso y responden favorablemente a la penetración de los antibióticos intravenosos. De acuerdo GPC de JAMA 2024 sobre Diverticulitis, cuando el tamaño del absceso supera los 3 cm, el fracaso del tratamiento médico exclusivo alcanza el 34%, volviéndose mandatorio el control de la fuente séptica mediante intervención intervencionista.<br><br>Perla Quirúrgica: El drenaje percutáneo reduce la recurrencia del absceso y debe ser considerado en todos los pacientes estables con abscesos mayores a 3 cm.<br><br>Análisis de Distractores: A) Mayor a 1 cm: Colecciones de este tamaño se manejan exclusivamente con antibióticos intravenosos por su alta tasa de reabsorción espontánea y la dificultad técnica para canularlas. B) Mayor a 5 cm: Aunque estos abscesos requieren drenaje absoluto, el punto de corte establecido donde el riesgo de falla médica se dispara es desde los 3 cm. C) Mayor a 7 cm: Esperar a que la colección adquiera este tamaño incrementa inaceptablemente el riesgo de ruptura libre hacia la cavidad peritoneal.",
        source: "JAMA 2024 Management-of-Diverticulitis, 2024, Nonoperative Management of Complicated Diverticulitis, p. 697."
    },
    {
        id: 5,
        question: "¿Cuál es el estudio de imagen inicial de elección para confirmar el diagnóstico y descartar complicaciones en adultos no embarazadas con sospecha de diverticulitis aguda?",
        options: ["Ecografía abdominal focalizada", "Tránsito intestinal con bario", "Resonancia magnética nuclear", "Tomografía computarizada de abdomen"],
        answer: 3,
        justification: "Justificación: La evaluación por tomografía computarizada permite visualizar directamente el engrosamiento mural, la infiltración de la grasa pericólica, neumoperitoneo focal y las colecciones encapsuladas. De acuerdo GPC de la IDSA 2024, es el método superior para trazar un abordaje terapéutico inmediato gracias a su alta sensibilidad anatómica.<br><br>Perla Quirúrgica: En adultos no embarazadas con sospecha de diverticulitis aguda, se sugiere la obtención de una tomografía computarizada (TC) de abdomen con contraste intravenoso como modalidad diagnóstica inicial de elección.<br><br>Análisis de Distractores: A) Ecografía abdominal focalizada: Es altamente operador-dependiente, se ve limitada por la interposición de gas y la obesidad abdominal, y tiene menor sensibilidad para complicaciones profundas o perforación pequeña. B) Tránsito intestinal con bario: Totalmente contraindicado en cuadros agudos ante el riesgo de peritonitis por bario si existe perforación subyacente. C) Resonancia magnética nuclear: Tiene excelente definición tisular, pero su disponibilidad en urgencias es limitada, sus tiempos de adquisición son prolongados y su sensibilidad a colecciones aéreas es inferior a la TC.",
        source: "IDSA 2024 Diagnostic Imaging of Suspected Acute Diverticulitis in Adults and Pregnant People, 2024, Recommendation, p. 275."
    },
    {
        id: 6,
        question: "¿Cuál es el riesgo aproximado de identificar un cáncer colorrectal subyacente que simule el cuadro clínico en un paciente que se presenta con diverticulitis aguda complicada?",
        options: ["8%", "2%", "15%", "20%"],
        answer: 0,
        justification: "Justificación: Los carcinomas oclusivos y microperforados del colon pueden mimetizar clínica y radiológicamente una peridiverticulitis o un absceso pélvico. De acuerdo GPC de Antibióticos 2025, la inflamación destructiva y la perforación contenida en un cáncer aumentan estadísticamente su camuflaje, obligando a realizar siempre una colonoscopia diferida.<br><br>Perla Quirúrgica: El riesgo de cáncer colorrectal no complicado es de aproximadamente 0.5%, mientras que el riesgo de cáncer colorrectal oculto simulando una diverticulitis complicada asciende a cerca del 8%.<br><br>Análisis de Distractores: B) 2%: Esta cifra se aproxima a la tasa basal de cáncer oculto observada en pacientes de la población general o en aquellos que presentan cuadros leves puramente no complicados. C) 15%: Es un porcentaje excesivamente alto; si bien el riesgo existe, no llega a esta prevalencia en series globales de diverticulitis complicada tratada. D) 20%: Cifra incompatible con la epidemiología documentada; sobreestimar este riesgo llevaría a intervenciones quirúrgicas radicales y mutilantes de forma prematura.",
        source: "Antibióticos para la diverticulitis aguda 2025, 2025, Context, p. 122."
    },
    {
        id: 7,
        question: "En el sistema de clasificación tomográfica de la WSES 2020, ¿qué hallazgos radiológicos definen específicamente a la diverticulitis aguda complicada estadio 1A?",
        options: ["Líquido difuso sin gas extraluminal a distancia", "Burbujas de gas pericólico a menos de 5 cm", "Absceso pélvico tabicado mayor a 4 cm", "Engrosamiento mural sin alteración de grasa"],
        answer: 1,
        justification: "Justificación: La evolución de las clasificaciones ha permitido separar la simple inflamación de la microperforación contenida localizada. De acuerdo GPC de Radiología Cabueñes 2024, una pequeña burbuja aérea pericólica representa una microperforación diverticular exitosamente sellada por los tejidos adyacentes sin generar peritonitis ni absceso formal.<br><br>Perla Quirúrgica: El estadio 1A de la WSES corresponde a burbujas de gas pericólico o pequeña cantidad de líquido sin absceso (a menos de 5 cm del segmento inflamado).<br><br>Análisis de Distractores: A) Líquido difuso sin gas extraluminal a distancia: Corresponde a un estadio 3 de WSES (peritonitis purulenta difusa), no a una complicación confinada 1A. C) Absceso pélvico tabicado mayor a 4 cm: Esto sitúa al paciente en el estadio 2A de WSES, requiriendo un abordaje mediante drenaje percutáneo agresivo. D) Engrosamiento mural sin alteración de grasa: Representaría un estadio WSES 0 o enfermedad diverticular simple/no complicada sin signos de perforación.",
        source: "Clasificación WSES para el manejo de la diverticulitis aguda, 2024, Tabla 2 Clasificación WSES, p. 30."
    },
    {
        id: 8,
        question: "¿Cuál es el esquema antibiótico oral de primera línea recomendado para el tratamiento ambulatorio de un paciente con diverticulitis aguda no complicada que amerita cobertura farmacológica?",
        options: ["Cefalexina combinada con metronidazol", "Azitromicina combinada con clindamicina", "Levofloxacino combinado con linezolid", "Doxiciclina combinada con gentamicina"],
        answer: 0,
        justification: "Justificación: La microflora colónica implicada en la fisiopatología del padecimiento es típicamente polimicrobiana, incluyendo bacilos gramnegativos entéricos y microorganismos anaerobios como Bacteroides fragilis. De acuerdo GPC de JAMA 2025 sobre Diverticulitis, un esquema sinérgico de betalactámicos con metronidazol cubre eficazmente este nicho bacteriano en casos leves a moderados.<br><br>Perla Quirúrgica: Los antibióticos orales de primera línea para pacientes ambulatorios consisten en amoxicilina/ácido clavulánico o una cefalosporina oral como la cefalexina en combinación con metronidazol durante 4 a 7 días.<br><br>Análisis de Distractores: B) Azitromicina combinada con clindamicina: Los macrólidos no tienen cobertura adecuada para enterobacterias gramnegativas, fallando en el control primario del proceso séptico. C) Levofloxacino combinado con linezolid: El linezolid está reservado para cocos grampositivos resistentes (MRSA, VRE) y no tiene indicación empírica en infecciones intrabdominales comunitarias. D) Doxiciclina combinada con gentamicina: Las tetraciclinas tienen pobre acción contra gramnegativos del colon y anaerobios, y la gentamicina intramuscular u oral no forma parte de la profilaxis ambulatoria estándar.",
        source: "JAMA 2025 Diverticulitis A Review, 2025, Table 2. Oral Antibiotic Regimens, p. 422."
    },
    {
        id: 9,
        question: "¿Cuál es el trayecto fistuloso más frecuente que se presenta como secuela de una diverticulitis aguda complicada, representando el 65% de los casos?",
        options: ["Fístula colovaginal", "Fístula colocutánea", "Fístula colovesical", "Fístula coloentérica"],
        answer: 2,
        justification: "Justificación: El colon sigmoides se apoya anatómicamente sobre el domo vesical; tras múltiples episodios de peridiverticulitis e inflamación crónica, la erosión inflamatoria contigua perfora el plano de separación tisular. De acuerdo GPC de la WGO 2004, esta contigüidad espacial predispone al paciente (especialmente masculino) a la presentación clínica con neumaturia y fecaluria.<br><br>Perla Quirúrgica: La fístula colovesical es la complicación fistulosa más frecuente relacionada con enfermedad diverticular (65%), presentándose comúnmente en hombres o en mujeres con histerectomía previa.<br><br>Análisis de Distractores: A) Fístula colovaginal: Ocupa el segundo lugar en frecuencia (25%), observándose habitualmente en mujeres que han sido sometidas a una histerectomía previa. B) Fístula colocutánea: Es una secuela menos frecuente y típicamente iatrogénica posterior a drenajes percutáneos fallidos o dehiscencia de anastomosis quirúrgica previa. D) Fístula coloentérica: Tiene una incidencia mucho menor (7%) y resulta de la adherencia patológica de las asas de intestino delgado sobre el flemón sigmoideo.",
        source: "WGO Practice Guidelines: Enfermedad Diverticular, 2004, Fístulas, p. 635."
    },
    {
        id: 10,
        question: "¿Cuáles son los valores de rendimiento diagnóstico reportados para la tomografía computarizada de abdomen en la confirmación de diverticulitis aguda?",
        options: ["Sensibilidad 80% y Especificidad 85%", "Sensibilidad 100% y Especificidad 50%", "Sensibilidad 70% y Especificidad 90%", "Sensibilidad 94% y Especificidad 99%"],
        answer: 3,
        justification: "Justificación: La tomografía computarizada con contraste intravenoso y oral permite una evaluación tridimensional de la pared intestinal y estructuras circundantes. De acuerdo GPC de la AHRQ 2021, la evidencia radiológica de trabeculación grasa y divertículos proporciona un escrutinio con casi nulos falsos negativos o positivos.<br><br>Perla Quirúrgica: La tomografía computarizada de abdomen tiene una alta sensibilidad (94%) y una alta especificidad (99%) para establecer el diagnóstico definitivo de diverticulitis aguda.<br><br>Análisis de Distractores: A) Sensibilidad 80% y Especificidad 85%: Subestima el rendimiento diagnóstico de la tomografía moderna de múltiples cortes y contraste dual. B) Sensibilidad 100% y Especificidad 50%: La TC no es tan inespecífica; si bien es muy sensible, su capacidad de descartar falsos positivos también es notablemente alta. C) Sensibilidad 70% y Especificidad 90%: Cifras inaceptablemente bajas que corresponden más al perfil de rendimiento de un enema opaco o ecografía por operador inexperto.",
        source: "2021 Diagnosis and Initial Management of Acute Colonic Diverticulitis, 2021, AHRQ, p. 6."
    },
    {
        id: 11,
        question: "¿Qué intervención quirúrgica de urgencia constituye la técnica de elección en pacientes con peritonitis difusa por perforación diverticular que se encuentran hemodinámicamente inestables y en estado crítico?",
        options: ["Procedimiento de Hartmann", "Resección y anastomosis primaria", "Lavado peritoneal laparoscópico", "Colectomía subtotal con ileostomía"],
        answer: 0,
        justification: "Justificación: Un paciente en choque séptico y acidosis tisular presenta un riesgo inaceptable de dehiscencia anastomótica; la prioridad clínica es el control del foco infeccioso salvando la vida del enfermo. De acuerdo GPC de la WSES 2020, el cierre del muñón rectal y confección de un estoma derivativo evita anastomosis de alto riesgo.<br><br>Perla Quirúrgica: Se recomienda el Procedimiento de Hartmann como técnica segura y de elección para el manejo de la peritonitis generalizada diverticular en pacientes en estado crítico y/o inestables.<br><br>Análisis de Distractores: B) Resección y anastomosis primaria: Constituye una opción viable y recomendada únicamente para pacientes fisiológicamente compensados y sin choque u organofalla asociada. C) Lavado peritoneal laparoscópico: Resulta inapropiado ante peritonitis fecaloidea severa y carece de eficacia de largo plazo para sellar la perforación estructural franca, asociándose a altas tasas de reintervención. D) Colectomía subtotal con ileostomía: Cirugía de morbilidad excesiva e innecesaria dado que la etiología perforada asienta puntualmente en la región rectosigmoidea y no compromete pancolitis isquémica.",
        source: "WSES 2020 diverticulitis colónica aguda en urgencias, 2020, Manejo Quirúrgico, p. 46."
    },
    {
        id: 12,
        question: "Tras la recuperación de un cuadro agudo, ¿cuál es el beneficio clínico principal del uso de mesalazina en el espectro de la enfermedad diverticular?",
        options: ["Prevenir la progresión a fístula", "Disminuir el riesgo de estenosis", "Reducir los síntomas abdominales crónicos", "Evitar la recurrencia de diverticulitis"],
        answer: 2,
        justification: "Justificación: Posterior a un cuadro de peridiverticulitis, el colon mantiene un grado de hipersensibilidad e inflamación mucosa microscópica o subclínica persistente (SUDD). De acuerdo GPC de la ASCRS 2020, si bien los agentes moduladores locales no previenen ataques fulminantes, alivian el malestar inespecífico.<br><br>Perla Quirúrgica: La mesalazina, la rifaximina y los probióticos no se recomiendan para prevenir la recurrencia de la diverticulitis aguda, pero pueden ser eficaces para reducir y controlar los síntomas abdominales crónicos persistentes.<br><br>Análisis de Distractores: A) Prevenir la progresión a fístula: Ningún tratamiento médico de soporte ambulatorio ha demostrado capacidad para revertir el trayecto destructivo peridiverticular que conduce a la fistulización. B) Disminuir el riesgo de estenosis: La estenosis resulta del ciclo repetitivo de cicatrización colágena intensa transmural, mecanismo fisiopatológico donde los 5-ASA no tienen interferencia anatómica sustancial. D) Evitar la recurrencia de diverticulitis: Múltiples metaanálisis han confirmado que no existe beneficio estadístico del uso profiláctico de mesalazina frente a placebo para prevenir nuevos eventos agudos o ingresos hospitalarios.",
        source: "Guías de práctica clínica de la ASCRS para el tratamiento de la diverticulitis colónica del lado izquierdo, 2020, Medical Management of Acute Diverticulitis, p. 733."
    },
    {
        id: 13,
        question: "Según la evidencia epidemiológica en gemelos y hermanos, ¿qué porcentaje aproximado del riesgo total para desarrollar enfermedad diverticular es atribuible a factores genéticos?",
        options: ["50%", "10%", "30%", "90%"],
        answer: 0,
        justification: "Justificación: Las variaciones genéticas que alteran la matriz de colágeno y el sistema neuromuscular mioentérico reducen intrínsecamente la resistencia a las presiones endoluminales. De acuerdo GPC de la AGA 2022, las disrupciones genéticas determinan en gran medida por qué la enfermedad progresa a pesar de modificaciones dietéticas.<br><br>Perla Quirúrgica: Los pacientes deben comprender que aproximadamente entre el 40% y el 50% del riesgo de presentar diverticulitis es fuertemente atribuible a factores genéticos y de herencia familiar.<br><br>Análisis de Distractores: B) 10%: Una estimación tan baja ignoraría el claro componente familiar evidenciado en estudios de asociación de genoma completo (GWAS) y la fisiopatología en afecciones del tejido conectivo (Ehlers-Danlos, Marfan). C) 30%: Si bien existen potentes variables ambientales (obesidad, tabaco, dieta), el papel de la base hereditaria colágeno-muscular ha demostrado estadísticamente un impacto superior en el peso del riesgo global. D) 90%: Esta sobreestimación descartaría el hecho innegable de que la enfermedad exige factores ambientales, anatómicos y de estilo de vida aditivos durante la longevidad para lograr manifestación fenotípica.",
        source: "AGA 2022 sobre el tratamiento médico de la diverticulitis colónica, 2022, Best Practice Advice 10, p. 94."
    },
    {
        id: 14,
        question: "En la estrategia de control de daños para peritonitis generalizada por diverticulitis, ¿en qué rango de tiempo debe realizarse la cirugía de segunda revisión para intentar la restauración del tránsito intestinal?",
        options: ["A las 12 a 24 horas", "A las 24 a 48 horas", "A los 5 a 7 días", "A las 72 a 96 horas"],
        answer: 1,
        justification: "Justificación: El manejo por etapas persigue rescatar al paciente del choque inminente mediante resección exprés, seguido del restablecimiento en la Unidad de Cuidados Intensivos. De acuerdo GPC de JAMA 2024 sobre Diverticulitis, una vez controlada la acidosis, hipotermia y coagulopatía de consumo, la cavidad está preparada para reconstrucciones formales.<br><br>Perla Quirúrgica: La cirugía de control de daños incluye una etapa inicial para el control de la fuente séptica seguida de una cirugía de segunda revisión, la cual debe llevarse a cabo tras una reanimación de 24 a 48 horas para intentar restaurar la continuidad intestinal.<br><br>Análisis de Distractores: A) A las 12 a 24 horas: Un tiempo insuficiente para completar la reanimación hemostática y metabólica integral y revertir la triada letal presente en choque severo. C) A los 5 a 7 días: Un abdomen abierto dejado a su evolución por tanto tiempo predispone indefectiblemente a adherencias firmes o \"hombro congelado\" y fístulas entero-atmosféricas catastróficas. D) A las 72 a 96 horas: Exceder las 48 horas aumenta las comorbilidades del empaquetamiento abdominal temporal (VAC) disminuyendo drásticamente la tasa de éxito de cierre primario diferido y anastomosis viables.",
        source: "JAMA 2024 Management-of-Diverticulitis, 2024, Laparoscopic Lavage and Damage Control Procedures, p. 700."
    },
    {
        id: 15,
        question: "En pacientes con sospecha clínica de diverticulitis aguda en quienes la tomografía computarizada no está disponible o está contraindicada, ¿qué estudio de imagen inicial se sugiere como alternativa diagnóstica segura?",
        options: ["Ecografía abdominal o resonancia magnética", "Tránsito intestinal con bario", "Gammagrafía con eritrocitos marcados", "Radiografía simple de abdomen"],
        answer: 0,
        justification: "Justificación: Ante embarazo, falla renal severa o limitación de infraestructura, se requiere evitar medios de contraste iodados o radiación ionizante manteniendo la objetividad del diagnóstico por imagen transversal. De acuerdo GPC de la IDSA 2024, tanto el ultrasonido experto como la resonancia detectan engrosamiento parietal mural y cambios inflamatorios.<br><br>Perla Quirúrgica: En adultos no embarazadas con sospecha de diverticulitis aguda donde la TC no está disponible o existe contraindicación médica, se sugiere la ecografía (US) o resonancia magnética (RM) como modalidad diagnóstica alternativa.<br><br>Análisis de Distractores: B) Tránsito intestinal con bario: Es de nula utilidad para delinear componentes peridiverticulares extramurales y está formalmente proscrito en fase aguda por posibilidad de contaminación del peritoneo con bario. C) Gammagrafía con eritrocitos marcados: Es un estudio altamente específico utilizado exclusivamente para la localización hemodinámica del sangrado de tubo digestivo bajo, pero no diagnostica inflamación diverticular. D) Radiografía simple de abdomen: Puede detectar secundariamente un íleo reflejo u obstrucción intestinal, pero posee sensibilidad y especificidad irrelevantes para estadificar y confirmar el origen del foco diverticular.",
        source: "IDSA 2024 Diagnostic Imaging of Suspected Acute Diverticulitis in Adults and Pregnant People, 2024, Recommendation, p. 276."
    },
    {
        id: 16,
        question: "¿Cuál es la tasa aproximada de recurrencia a largo plazo en pacientes que ya han presentado un segundo episodio confirmado de diverticulitis aguda no complicada?",
        options: ["15%", "44%", "24%", "80%"],
        answer: 1,
        justification: "Justificación: Con cada episodio subsiguiente de inflamación, las cicatrices murales, espasticidad y dismotilidad residuales facilitan un círculo vicioso biomecánico regional que perpetúa y predispone al atrapamiento fecalilítico recurrente. De acuerdo GPC de Antibióticos 2025, el riesgo histórico de enfrentar un nuevo embate aumenta de manera dramática y casi se triplica.<br><br>Perla Quirúrgica: Las tasas de recurrencia clínica alcanzan aproximadamente el 17% después del primer episodio inicial, pero escalan aceleradamente a cerca de un 44% en pacientes tras sobrevivir a un segundo episodio.<br><br>Análisis de Distractores: A) 15%: Es la cifra base representativa de recurrencia global o tras un primer ataque, no la que el paciente acarrea habiendo tenido una inflamación repetida y fibrótica. C) 24%: Este porcentaje se alinea típicamente con el riesgo longitudinal de pacientes que fueron dados de alta conservadoramente pero presentaron abscesos menores, no la estadística post segundo ataque simple. D) 80%: Si bien la historia de ataques a repetición exacerba la incidencia, es epidemiológicamente falso aseverar que más de las tres cuartas partes cursarán inevitablemente con un tercer episodio fulminante o recurrente.",
        source: "Antibióticos para la diverticulitis aguda 2025, 2025, Context, p. 123."
    },
    {
        id: 17,
        question: "En la epidemiología global de la enfermedad diverticular, ¿en qué grupo poblacional existe un claro predominio de afectación exclusiva del colon derecho con inicio en edades más tempranas?",
        options: ["Población escandinava", "Población afroamericana", "Población latinoamericana", "Población asiática"],
        answer: 3,
        justification: "Justificación: Mientras que la dieta occidental induce el patrón pulsión clásico en el sigmoides de adultos mayores, los factores biológicos y filogenéticos asiáticos determinan la presencia de verdaderos divertículos congénitos (frecuentemente solitarios) cecales o ascendentes. De acuerdo GPC de Radiología Cabueñes 2024, este tipo de variante obliga a descartar como diagnóstico diferencial primario a la apendicitis aguda, debido a su predilección por el hemiclon derecho.<br><br>Perla Quirúrgica: En las poblaciones de origen asiático, la enfermedad diverticular se manifiesta predominantemente en el colon derecho con afectación cecal, en contraposición al patrón obstructivo izquierdo occidental.<br><br>Análisis de Distractores: A) Población escandinava: Países occidentales y de altos ingresos cursan invariablemente con un patrón izquierdo sigmoideo clásico vinculado al bajo aporte fibrilar e hipertrofia de taenia coli. B) Población afroamericana: No muestra una alteración filogenética específica hacia lado derecho; su etiología responde primariamente al prototipo fenotípico occidental adquirido. C) Población latinoamericana: Tiene una mezcla genética y ambiental, pero su enfermedad diverticular mantiene los perfiles anatómicos típicos del continente americano en el eje recto-sigmoideo.",
        source: "Clasificación WSES para el manejo de la diverticulitis aguda, 2024, Epidemiología, p. 22."
    },
    {
        id: 18,
        question: "¿Cuál es la tasa de mortalidad posoperatoria esperada para los pacientes que requieren una colectomía de emergencia por diverticulitis aguda complicada, en comparación con la cirugía electiva?",
        options: ["0.5%", "10.6%", "5.1%", "33.1%"],
        answer: 1,
        justification: "Justificación: Un escenario de cirugía urgente a menudo asocia peritonitis fecal fulminante, respuesta inflamatoria sistémica y falla multiorgánica. De acuerdo GPC de JAMA 2025 sobre Diverticulitis, la mortalidad no es una métrica despreciable, justificando fuertemente el cambio hacia intervenciones menos mórbidas o estrategias conservadoras iniciales de drenaje y \"cooling\".<br><br>Perla Quirúrgica: La mortalidad posoperatoria de la diverticulitis alcanza el 10.6% en el contexto de una resección colónica de urgencia, mientras que en la cirugía electiva planificada la cifra se minimiza a 0.5%.<br><br>Análisis de Distractores: A) 0.5%: Este número corresponde a la mortalidad histórica demostrada en un escenario quirúrgico electivo, donde el paciente optimizado, nutrido y estabilizado se expone a mínimos riesgos sistémicos intraoperatorios. C) 5.1%: Es una cifra que refleja la mortalidad combinada en cohortes más amplias u hospitales de tercer nivel que mezclan procedimientos pero no representa el consolidado exacto en la literatura de revisión global. D) 33.1%: Representaría una letalidad insostenible a nivel global para un cuadro infeccioso quirúrgico de la actualidad, presentándose sólo en subgrupos aislados con comorbilidad severa (ej., edad > 80 y falla renal).",
        source: "JAMA 2025 Diverticulitis A Review, 2025, Postoperative Mortality, p. 435."
    },
    {
        id: 19,
        question: "A nivel mundial, ¿cuál es la entidad clínica responsable de originar entre el 30% y el 50% de todos los casos de sangrado de tubo digestivo bajo masivo en adultos?",
        options: ["Cáncer colorrectal", "Angiodisplasia colónica", "Enfermedad diverticular", "Hemorroides internas"],
        answer: 2,
        justification: "Justificación: En la anatomía de la hernia mucosubmucosa diverticular, los vasa recta quedan tensados y separados de la luz colónica por una delgada capa no muscular. De acuerdo GPC de la WGO 2004, este entorno microtraumático intraluminal facilita la disrupción asimétrica de la íntima arterial en el ápex diverticular de forma abrupta, masiva e indolora.<br><br>Perla Quirúrgica: La enfermedad diverticular es, de manera consistente, la causa etiogénica más común de sangrado de tubo digestivo bajo masivo que requiere transfusión o urgencia hospitalaria.<br><br>Análisis de Distractores: A) Cáncer colorrectal: Típicamente presenta microhemorragias crónicas, goteo hemático escaso detectado en heces fecales o anemia ferropénica insidiosa, y rara vez exanguinación abrupta. B) Angiodisplasia colónica: Se trata de vasos submucosos anormalmente dilatados y tortuosos que causan sangrado intermitente pero usualmente representan entre el 20-30% de los casos totales. D) Hemorroides internas: Frecuentemente asociadas a la deposición del paciente y la proctalgia; sangran con estrías rectorrágicas o goteo final de sangre roja viva (sin ser un choque hemorrágico masivo intraluminal global).",
        source: "WGO Practice Guidelines: Enfermedad Diverticular, 2004, Sangrado, p. 636."
    },
    {
        id: 20,
        question: "En pacientes con síntomas abdominales crónicos posteriores a un episodio de diverticulitis aguda y estudios endoscópicos normales, ¿cuál es el tratamiento farmacológico de elección dirigido a la hipersensibilidad visceral?",
        options: ["Terapia biológica con anti-TNF", "Corticoides sistémicos a dosis bajas", "Antidepresivos tricíclicos a dosis bajas", "Inhibidores de la monoaminooxidasa"],
        answer: 2,
        justification: "Justificación: Muchos pacientes manifiestan dolor recurrente en fosa iliaca izquierda semanas a meses después del cuadro inicial, desarrollando una superposición clínica con el síndrome de intestino irritable. De acuerdo GPC de la AGA 2022, el mecanismo neuropático primario requiere un esquema de modulación de la señal nociceptiva ascendente del plexo entérico local.<br><br>Perla Quirúrgica: En ausencia de inflamación residual, el dolor y molestia subaguda en pacientes con antecedente de diverticulitis aguda se atribuyen a hipersensibilidad visceral y deben ser manejados con antidepresivos tricíclicos a dosis bajas a moderadas.<br><br>Análisis de Distractores: A) Terapia biológica con anti-TNF: Reservada estrictamente para enfermedades del espectro inmunológico severo transmural o mucoso activo como la enfermedad de Crohn y Colitis Ulcerosa. B) Corticoides sistémicos a dosis bajas: Provocan inmunosupresión y pueden ocultar paradójicamente un resurgimiento del proceso agudo perforado, no recomendados a largo plazo. D) Inhibidores de la monoaminooxidasa: A pesar de ser agentes del área neuropsiquiátrica, no son los neuromoduladores preferidos de primera línea en los síndromes de intestino irritable o dolor crónico intestinal.",
        source: "AGA 2022 sobre el tratamiento médico de la diverticulitis colónica, 2022, Best Practice Advice 4, p. 79."
    },
    {
        id: 21,
        question: "En la evaluación ecográfica inicial por un operador experto de un paciente con sospecha de diverticulitis aguda, ¿a partir de qué valor de grosor mural se establece uno de los criterios radiológicos positivos para la enfermedad?",
        options: ["Mayor a 2 mm", "Mayor a 6 mm", "Mayor a 4 mm", "Mayor a 8 mm"],
        answer: 2,
        justification: "Justificación: La ecografía es una herramienta útil y accesible en la evaluación inicial, especialmente en pacientes jóvenes o cuando la tomografía está contraindicada. De acuerdo a la GPC de Radiología Cabueñes 2024, el diagnóstico ecográfico se sustenta en identificar el segmento doloroso con divertículos asociados a un engrosamiento de la pared intestinal que supera los 4 mm, junto con hipoecogenicidad mural y aumento de la ecogenicidad de la grasa pericólica adyacente.<br><br>Perla Quirúrgica: Los hallazgos ecográficos clásicos incluyen presencia de divertículos y engrosamiento mural del segmento doloroso mayor a 4 mm con flemón peridiverticular.<br><br>Análisis de Distractores: A) Mayor a 2 mm: Este es un grosor mural colónico normal cuando el intestino está distendido, por lo que no indica patología inflamatoria. B) Mayor a 6 mm: Aunque este grosor indica inflamación franca, el punto de corte diagnóstico donde se documenta anormalidad mural inicia en > 4 mm. D) Mayor a 8 mm: Representa un engrosamiento muy severo (frecuente en isquemia o neoplasia), pero exigir este valor generaría una alta tasa de falsos negativos en estadios tempranos de diverticulitis.",
        source: "Clasificación WSES para el manejo de la diverticulitis aguda, 2024, Pruebas de Imagen, p. 26."
    },
    {
        id: 22,
        question: "¿Qué grupo de medicamentos se asocia de forma independiente con una mayor incidencia de complicaciones severas, como perforación libre y muerte, en pacientes que cursan con un cuadro de diverticulitis aguda?",
        options: ["Betabloqueadores", "Estatinas", "Inhibidores SGLT2", "Corticosteroides"],
        answer: 3,
        justification: "Justificación: La inmunosupresión farmacológica altera la respuesta inflamatoria local, enmascara los signos clínicos de peritonitis y debilita la matriz de colágeno del tejido conectivo intestinal, facilitando la microperforación hacia la cavidad libre. De acuerdo a la GPC de la AGA 2022, el uso de corticosteroides sistémicos es un factor de riesgo mayor para complicaciones catastróficas, por lo que su presencia exige un umbral bajo para solicitar imagen seccional e iniciar antibióticos.<br><br>Perla Quirúrgica: El uso de corticosteroides es un factor de riesgo para diverticulitis y puede contribuir a complicaciones, incluyendo perforación y muerte, manifestándose a menudo con signos y síntomas más leves que retrasan el diagnóstico.<br><br>Análisis de Distractores: A) Betabloqueadores: Disminuyen la respuesta taquicárdica sistémica ante la sepsis, pero no alteran la arquitectura de la pared colónica ni inducen perforación primaria. B) Estatinas: No incrementan el riesgo de perforación y algunos estudios sugieren posibles propiedades pleiotrópicas antiinflamatorias en el tracto gastrointestinal. C) Inhibidores SGLT2: Fármacos hipoglucemiantes que pueden asociarse a infecciones genitourinarias o cetoacidosis euglucémica, sin impacto directo en la fisiopatología diverticular.",
        source: "AGA 2022 sobre el tratamiento médico de la diverticulitis colónica, 2022, Best Practice Advice 8, p. 89."
    },
    {
        id: 23,
        question: "En un paciente ambulatorio que cursa con un episodio de diverticulitis aguda no complicada, ¿cuál es la intervención dietética inicial recomendada durante la fase de inflamación aguda?",
        options: ["Dieta líquida clara", "Ayuno con nutrición parenteral", "Dieta alta en residuos", "Dieta enteral polimérica"],
        answer: 0,
        justification: "Justificación: La inflamación transmural y el edema pericólico generan cierto grado de obstrucción funcional y anorexia. De acuerdo a la GPC de la AGA 2022, modificar el contenido luminal reduciendo el esfuerzo peristáltico mediante una dieta sin residuos sólidos alivia el dolor y el malestar abdominal, permitiendo el reposo intestinal funcional mientras se resuelve el cuadro.<br><br>Perla Quirúrgica: Se aconseja una dieta líquida clara durante la fase aguda de la diverticulitis no complicada con el objetivo de brindar confort al paciente, debiendo avanzar la dieta a medida que los síntomas mejoran.<br><br>Análisis de Distractores: B) Ayuno con nutrición parenteral: El reposo intestinal absoluto con soporte parenteral está reservado para pacientes hospitalizados con diverticulitis complicada severa, fístulas o peritonitis. C) Dieta alta en residuos: Está indicada para la prevención secundaria a largo plazo una vez resuelto el cuadro agudo, pero exacerba el dolor y la distensión si se indica durante la inflamación activa. D) Dieta enteral polimérica: Contiene un alto aporte calórico y proteico que requiere digestión compleja y estimulación peristáltica, lo cual resulta contraproducente durante la fase sintomática inicial aguda.",
        source: "AGA 2022 sobre el tratamiento médico de la diverticulitis colónica, 2022, Best Practice Advice 5, p. 80."
    },
    {
        id: 24,
        question: "En pacientes que se presentan con peritonitis purulenta por enfermedad diverticular perforada (Hinchey III), ¿qué desventaja clínica principal asocia el abordaje mediante lavado laparoscópico frente a la sigmoidectomía de urgencia?",
        options: ["Mayor incidencia de fístulas", "Mayor tasa de intervenciones secundarias", "Menor preservación del esfínter", "Mayor sangrado transoperatorio"],
        answer: 1,
        justification: "Justificación: El lavado laparoscópico busca controlar el foco séptico aspirando el pus y dejando drenajes sin resecar el colon enfermo. De acuerdo a la GPC de la ASCRS 2020, múltiples ensayos clínicos (LOLA, SCANDIV) han evidenciado que dejar el segmento colónico perforado in situ no sella efectivamente la microperforación, derivando en colecciones residuales y sepsis no controlada.<br><br>Perla Quirúrgica: En pacientes con peritonitis purulenta, se prefiere la colectomía sobre el lavado laparoscópico, ya que el lavado se asocia con tasas significativamente más altas de reintervención quirúrgica secundaria y abscesos intraabdominales recurrentes.<br><br>Análisis de Distractores: A) Mayor incidencia de fístulas: Aunque es un riesgo potencial de dejar el colon enfermo, la principal métrica que contraindica el lavado rutinario es la alta necesidad de reintervenciones tempranas por sepsis persistente. C) Menor preservación del esfínter: La enfermedad asienta típicamente en el sigmoides; ni la resección de urgencia (Hartmann) ni el lavado comprometen el complejo esfinteriano anal. D) Mayor sangrado transoperatorio: Por el contrario, el lavado laparoscópico es un procedimiento técnicamente más rápido y con menor sangrado intraoperatorio inicial que una colectomía formal, pero falla en el control del daño a mediano plazo.",
        source: "Guías de práctica clínica de la ASCRS para el tratamiento de la diverticulitis colónica del lado izquierdo, 2020, Laparoscopic Lavage, p. 740."
    },
    {
        id: 25,

        question: "En el contexto de la prevención secundaria de la enfermedad diverticular, ¿cuál es la postura clínica actual sobre indicar una sigmoidectomía electiva basándose exclusivamente en el antecedente de dos episodios previos de diverticulitis aguda no complicada?",
        options: ["Es indicación quirúrgica absoluta", "Ya no se acepta como indicación absoluta", "Se recomienda solo en mujeres", "Es mandatoria para prevenir fístulas"],

        justification: "Justificación: El dogma quirúrgico antiguo establecía que la morbilidad y el riesgo de perforación libre se disparaba exponencialmente tras el segundo embate inflamatorio, obligando a resecar. De acuerdo a la GPC de la ASCRS 2020 y evidencia longitudinal robusta, se ha demostrado que los episodios subsecuentes rara vez son mortales o catastróficos, y la decisión debe enfocarse en la calidad de vida y morbilidad del paciente.<br><br>Perla Quirúrgica: La indicación histórica de realizar una colectomía electiva profiláctica de forma rutinaria tras 2 episodios de diverticulitis no complicada ya no se acepta; la decisión debe ser totalmente individualizada según síntomas y comorbilidades.<br><br>Análisis de Distractores: A) Es indicación quirúrgica absoluta: Paradigma abandonado desde la última década. Operar rutinariamente a estos pacientes expone a riesgos de fuga anastomótica sin un beneficio de supervivencia claro. C) Se recomienda solo en mujeres: No existe ninguna justificación clínica ni diferencia en la agresividad anatómica que condicione profilaxis quirúrgica basada en género. D) Es mandatoria para prevenir fístulas: La gran mayoría de fístulas ocurren de forma larvada durante el primer cuadro complicado ignorado, no como consecuencia inminente de cuadros repetitivos no complicados manejados correctamente.",

    {
        id: 40,
        question: "Epidemiológicamente, ¿cuál es la incidencia demostrada de desarrollar un estado de sepsis severa durante la hospitalización por diverticulitis aguda en pacientes inmunocomprometidos en comparación con los inmunocompetentes?",

    {

        options: ["Peritonitis purulenta generalizada", "Peritonitis fecaloidea generalizada", "Absceso pélvico mayor a 5 cm", "Flemón con microperforación contenida"],
        answer: 1,
        justification: "Justificación: El lavado laparoscópico fue concebido para evacuar abscesos o líquido seropurulento con una tasa moderada de control. No obstante, en presencia de heces francas diseminadas procedentes de un desgarro grueso de la pared sigmoidea (Hinchey IV), la carga de endotoxinas, bacterias anaerobias y necrosis regional es incontrolable. De acuerdo a la GPC de la ASCRS 2020, en este escenario catastrófico, el abordaje de lavado es ineficaz y abandonar la fístula fecal destapada perpetuará el choque y la mortalidad casi absoluta.<br><br>Perla Quirúrgica: El lavado peritoneal laparoscópico y drenaje está formalmente contraindicado en pacientes con peritonitis fecaloidea generalizada (Hinchey IV) al poseer resultados nulos y fatales; la resección sigmoidea de urgencia debe realizarse sistemáticamente en esta situación clínica.<br><br>Análisis de Distractores: A) Peritonitis purulenta generalizada: Aunque la resección sigue siendo superior, el lavado laparoscópico en este subgrupo (Hinchey III) todavía es considerado como una opción y alternativa técnica factible por algunos cirujanos expertos en ciertas guías selectas. C) Absceso pélvico mayor a 5 cm: Constituye un absceso grande que primariamente se aborda mediante drenaje percutáneo guiado por ecografía o tomografía; no contraindica o amerita en primera instancia ninguna intervención exerética urgente si el paciente asimila los antibióticos. D) Flemón con microperforación contenida: Escenario anatómico típico que dictamina manejo médico inicial exclusivo (antibióticos orales o IV); la intervención quirúrgica directa (de cualquier abordaje) conlleva resecciones iatrogénicas innecesarias.",
        source: "Guías de práctica clínica de la ASCRS para el tratamiento de la diverticulitis colónica del lado izquierdo, 2020, Laparoscopic Lavage, p. 740."
    },
    {
        id: 53,
        question: "En el escrutinio de la mortalidad operatoria aguda en pacientes con peritonitis o absceso grave, ¿cuál es la tasa de mortalidad esperada en el subgrupo de pacientes mayores de 80 años que requieren intervención quirúrgica de urgencia por diverticulitis complicada?",
        options: ["17.8%", "9.7%", "25.4%", "1.6%"],

        justification: "Justificación: El margen homeostático residual para compensar una peritonitis severa y las respuestas adrenérgicas ante la pérdida de sangre y líquidos están fisiológicamente agotadas en el anciano frágil. De acuerdo a la GPC de JAMA 2025 sobre Diverticulitis, la carga aditiva de enfermedades cardiopulmonares predispone intensamente a síndromes de respuesta inflamatoria multisistémica tardíos e isquemia, inflando la mortalidad posoperatoria de manera vertiginosa en los octogenarios frente a controles sanos.<br><br>Perla Quirúrgica: La mortalidad postoperatoria intrahospitalaria tras una cirugía de urgencia por diverticulitis complicada experimenta un incremento drástico escalonado asociado a la edad, alcanzando un 17.8% para los pacientes de 80 años o mayores.<br><br>Análisis de Distractores: B) 9.7%: Este porcentaje representa exactamente la tasa intermedia y global de mortalidad post-urgencia en el segmento etario geriátrico joven de entre 65 y 79 años, pero subestima el riesgo del grupo de edad más extrema. C) 25.4%: Corresponde usualmente a métricas históricas de la era pre-antibiótica de amplio espectro, o de pacientes politraumatizados en estado pre-morten, no siendo el promedio oficial en los octogenarios admitidos para colectomía. D) 1.6%: Es el dato de letalidad mínima asociada a la cirugía quirúrgica de colectomía por perforación diverticular en adultos sanos fisiológicamente robustos que se ubican en edades inferiores a los 65 años.",

    {
        id: 54,
        question: "En el entorno de la sala de emergencias, cuando se emplea de manera guiada el ultrasonido a pie de cama (POCUS) realizado por médicos de urgencias para evaluar un cuadro compatible con dolor de origen diverticular, ¿cuál es su sensibilidad confirmada frente al estándar de referencia tomográfico?",
        options: ["60.5%", "75.3%", "85.1%", "92.7%"],
        answer: 3,
        justification: "Justificación: La capacitación focalizada permite a los médicos de primera línea visualizar directamente el engrosamiento intraintestinal patológico y la grasa ecogénica peri-lesional mientras palpan el cuadrante afectado. De acuerdo a la GPC de la IDSA 2024, estudios prospectivos en centros de urgencia han validado que, al correlacionar el rastreo sónico clínico expedito con la tomografía formal de contraste posterior, su precisión y utilidad como escrutinio agudo triage logran un rendimiento excepcional con mínima latencia y alta rentabilidad.<br><br>Perla Quirúrgica: El ultrasonido a pie de cama clínico y sonográfico (POCUS) realizado por médicos de urgencias para el diagnóstico de diverticulitis demuestra una sensibilidad clínica del 92.7% y una especificidad del 90.9% en comparación con los hallazgos definitivos de la TC.<br><br>Análisis de Distractores: A) 60.5%: Representa una sensibilidad inaceptablemente pobre para una herramienta estandarizada moderna, asimilándose al perfil de rendimiento que brindaba antiguamente una simple radiografía de abdomen en etapas tempranas. B) 75.3%: Es un límite intermedio equivalente a herramientas de evaluación diagnóstica de apendicitis sin contraste (como resonancias rápidas antiguas), pero subestima la capacidad de resolución mural local de las frecuencias sónicas modernas ante un flemón palpable. C) 85.1%: Aunque alto, margina ligeramente el techo diagnóstico del POCUS cuando es aplicado integralmente (examen físico más sonda de compresión graduada) en un cuadro característico con dolor exquisito guiado.",
        source: "IDSA 2024 Diagnostic Imaging of Suspected Acute Diverticulitis in Adults and Pregnant People, 2024, Clinical Presentation and Diagnosis, p. 4."

    {
        id: 55,
        question: "En pacientes con sospecha de diverticulitis aguda que presentan tomográficamente gas pericólico aislado a menos de 5 centímetros de distancia del segmento afectado (WSES 1A) sin ningún absceso u otros datos de perforación libre, ¿cuál es la conducta terapéutica inicial y de escrutinio más adecuada si se encuentran hemodinámicamente estables?",
        options: ["Drenaje percutáneo guiado por ecografía", "Ensayo de tratamiento no operatorio", "Resección con anastomosis primaria", "Lavado peritoneal laparoscópico inmediato"],
        answer: 1,
        justification: "Justificación: La presencia de unas pocas burbujas minúsculas en contacto estrecho con la zona flemónica representa una erosión microscópica sellada eficazmente por adherencias contiguas. De acuerdo a la GPC de la WSES 2020, las microperforaciones contenidas o estadios 1A carecen del componente destructivo voluminoso necesario para generar fracaso inminente ante la observación, curando rutinariamente bajo reposo entérico y agentes antimicrobianos empíricos.<br><br>Perla Quirúrgica: En pacientes hemodinámicamente estables con diverticulitis aguda que muestran exclusivamente gas pericólico extraluminal aislado (a < 5 cm del colon), el ensayo de tratamiento médico no operatorio con antibióticos es la estrategia idónea con alto éxito clínico.<br><br>Análisis de Distractores: A) Drenaje percutáneo guiado por ecografía: Imposible y fútil de realizar dado que la presencia de gas pericólico no representa una colección líquida medible ni encapsulada para puncionar o aspirar volumen de forma intervencionista. C) Resección con anastomosis primaria: Equivaldría a un abordaje sumamente radical y mórbido para extirpar de entrada y por primera vez una etapa de la enfermedad confinada que el organismo ya selló con el omento. D) Lavado peritoneal laparoscópico inmediato: No está indicado; abrir la cavidad laparoscópicamente ante la ausencia radiológica de líquido purulento difuso diseminado u orgánico expondría al paciente a un evento quirúrgico riesgoso, costoso y sin ventaja fisiológica reparadora.",

    {
        id: 56,
        question: "En el abordaje protocolario del abdomen agudo utilizando la clasificación tomográfica WSES 2020 para estandarizar el grado clínico en la diverticulitis aguda complicada, ¿qué hallazgos morfológicos exactos definen la instauración y diagnóstico del estadio 3?",
        options: ["Líquido difuso sin gas libre a distancia", "Gas a distancia mayor a 5 cm del segmento", "Líquido difuso con gas libre a distancia", "Burbujas de gas pericólico sin absceso"],

        justification: "Justificación: La extensión radiológica del líquido séptico a múltiples correderas y correderas pélvicas sin grandes volúmenes de gas extra-luminal evidencia la formación de una peritonitis purulenta franca exudativa en toda la cavidad por derrame colónico previo sin una evisceración masiva y sostenida de la luz fecal. De acuerdo a la GPC de Radiología Cabueñes 2024, esta morfología de imagen encasilla automáticamente al individuo a someterse a técnicas de rescate laparoscópico u operativo urgente debido a la inflamación peritoneal inminente.<br><br>Perla Quirúrgica: En la clasificación tomográfica internacional WSES, el estadio complicado 3 se define de forma precisa como la presencia de abundante líquido libre difuso en la cavidad abdominal sin que exista gas libre a distancia asociado.<br><br>Análisis de Distractores: B) Gas a distancia mayor a 5 cm del segmento: Denota un estadio complicado radiológico 2B (un neumoperitoneo localizado en recesos distales retroperitoneales o supramesocólicos pero aún en ausencia de grandes torrentes líquidos en declive difuso purulento). C) Líquido difuso con gas libre a distancia: Constituye el evento máximo de destrucción colónica con derramamiento libre, conocido tomográficamente como estadio WSES 4, equivalente a la peritonitis fecaloidea generalizada clínica de la antigua clasificación de Hinchey. D) Burbujas de gas pericólico sin absceso: Es el grado primario o más inicial de microperforación focalmente omentalizada clasificado como WSES 1A, sin que el componente inflamatorio difunda líquido extenso generalizado hacia otras regiones intraabdominales o pélvicas.",
        source: "Clasificación WSES para el manejo de la diverticulitis aguda, 2024, Tabla 2 Clasificación WSES, p. 30."

    {
        id: 57,
        question: "En pacientes manejados estrictamente en el entorno hospitalario tras padecer y confirmar tomográficamente un primer episodio de diverticulitis aguda puramente no complicada y que no reciben terapia antibiótica (ensayo DIABOLO), ¿cuál es el tiempo medio estimado de recuperación total según los parámetros clínicos controlados?",
        options: ["5 días", "7 días", "14 días", "21 días"],

        justification: "Justificación: La inflamación colónica inducida por un primer embate diverticular, aunque controlada y focalizada, desencadena un edema local y parálisis segmentaria que tardan un período moderado en recuperar la perfusión de las venas de drenaje y remodelar el endotelio engrosado. De acuerdo a la GPC de Antibióticos 2025 y a ensayos prospectivos, se comprueba empíricamente que la prescripción fútil de antibióticos potentes acorta casi imperceptiblemente este periodo y expone a disbiosis sin acortar la baja laboral de forma significativa (12 contra 14 días).<br><br>Perla Quirúrgica: En el ensayo neerlandés que comparó el uso de antibióticos frente a solo observación en enfermedad no complicada, el tiempo medio de recuperación global fue de alrededor de 14 días en el grupo de pacientes manejados sin terapia antimicrobiana frente a 12 días en los tratados con esta.<br><br>Análisis de Distractores: A) 5 días: Un escenario de recuperación fisiológica post-inflamatoria de 5 días resulta de un lapso de temporalidad inusualmente rápido para las dinámicas inmunes de remodelado en cualquier paciente en una agresión tisular aguda del peritoneo parietal. B) 7 días: Corresponde regularmente al final del curso prescriptivo ideal inicial de antibióticos donde el paciente apenas completa la regresión sintomática mayor y el control febril pero su \"recuperación y vuelta a capacidad total funcional normal\" toma un par de semanas extra. D) 21 días: Tiempo de letargo clínico habitualmente asociado al post-operatorio de un absceso drenado medianamente extenso percutáneamente pero excesivo para una peridiverticulitis catalogada desde el inicio del ataque en urgencias como puramente leve y simple en paciente estable.",

    {
        id: 58,
        question: "Desde la fisiopatología destructiva obstructiva del proceso diverticular crónico, ¿a partir de qué diámetro transversal se clasifica y diagnostica a un verdadero divertículo gigante de colon, una manifestación rarísima originada por mecanismo valvular de aire?",

        source: "WGO Practice Guidelines: Enfermedad Diverticular, 2004, Divertículo Gigante, p. 653."
    },
    {
        id: 59,
        question: "En el marco de la evidencia epidemiológica dietética para disminuir el riesgo de la enfermedad o evitar los cuadros agudos en la prevención primaria, ¿cuál es el impacto causal fisiopatológico clínicamente documentado de la ingesta de nueces, palomitas de maíz o frutas con semillas minúsculas?",
        options: ["Incrementan el riesgo de perforación libre", "No se asocian con un aumento en el riesgo de diverticulitis", "Aumentan significativamente la tasa de recurrencia", "Previenen la formación de nuevos divertículos"],

    {

        options: ["Menor tasa de conversión a cirugía abierta", "Reducción en la incidencia de hernias incisionales", "Menor tiempo quirúrgico total", "Ausencia de fugas anastomóticas"],

        justification: "Justificación: La visualización tridimensional magnificada estéreo y los grados de articulación endo-wrist en 360 grados, sumado a una estabilización de imagen sin temblor de la técnica robótica facilitan enormemente el proceso de disección y movilización esplénica en un terreno indurado, adherido fuertemente en bloques fibróticos pélvicos en mesos isquémicos u hostiles. De acuerdo a la GPC de JAMA 2024 sobre Diverticulitis, un análisis de 128,288 pacientes intervenidos retrospectivamente validó sólidamente esta supremacía técnica sobre la pinza rígida convencional del puerto endoscópico regular.<br><br>Perla Quirúrgica: En el contexto de cirugía por enfermedad diverticular con secuelas fibróticas graves, los estudios demuestran consistentemente que el enfoque asistido por robot proporciona una tasa de conversión a laparotomía abierta significativamente menor (8.3%) en comparación con el abordaje laparoscópico puro (13.6%).<br><br>Análisis de Distractores: B) Reducción en la incidencia de hernias incisionales: Ambas técnicas quirúrgicas requieren extracciones forzadas de piezas resecadas engrosadas u ostomías asociadas a través de mini-laparotomías, sin presentar diferencias biomecánicas a gran escala en evisceraciones postoperatorias de herida frente a frente en reportes de bases de datos mundiales. C) Menor tiempo quirúrgico total: Todo lo contrario; el requerimiento del docking \"acople de brazos\" o configuración intraoperatoria espacial prolonga universal y habitualmente los tiempos efectivos en pabellón transquirúrgico en comparación con la laparoscopia exprés rutinaria fluida. D) Ausencia de fugas anastomóticas: La dehiscencia y fracaso biológico isquémico curativo depende inexorablemente de una sumatoria crítica tisular como el margen sano perfundido, tensión microvascular, comorbilidades del hospedero crónico y viabilidad intestinal sistémica pero no puede ser completamente absuelto o curado meramente por ninguna pinza técnica externa utilizada.",

    {
        id: 61,
        question: "En las complicaciones crónicas de la enfermedad diverticular, la fístula colovesical es la presentación más frecuente. ¿Cuál es la segunda fístula en orden de frecuencia, representando el 25% de los trayectos fistulosos?",

        source: "JAMA 2025 Diverticulitis A Review, 2025, Stricture, Large Bowel Obstruction, or Fistula, p. E8."
    },
    {
        id: 62,
        question: "En una paciente embarazada que acude a urgencias con sospecha clínica de diverticulitis aguda, ¿qué modalidades de imagen se recomiendan como abordaje inicial para confirmar el diagnóstico y evitar la exposición a radiación ionizante?",

        justification: "Justificación: La radiación ionizante y el contraste yodado plantean riesgos teratogénicos para el feto. De acuerdo GPC de la IDSA 2024, las técnicas libres de radiación transversal y sónica son mandatorias en este subgrupo para evaluar el grosor mural y detectar complicaciones pericólicas preservando la seguridad fetal.<br><br>Perla Quirúrgica: En pacientes embarazadas con sospecha de diverticulitis aguda, se sugiere la ecografía o la resonancia magnética (RM) como modalidad inicial de imagen.<br><br>Análisis de Distractores: A) Tomografía por emisión de positrones: Estudio metabólico con radionúclidos contraindicado en el embarazo e inútil en la evaluación anatómica aguda en urgencias. C) Radiografía de abdomen en bipedestación: Expone al feto a radiación sin aportar resolución de tejidos blandos para confirmar el flemón o los divertículos. D) Tomografía computarizada de baja dosis: Aunque emite menos radiación, sigue empleando rayos X y se reserva estrictamente si los métodos libres de radiación no están disponibles o el cuadro amenaza la vida inminentemente.",
        source: "IDSA 2024 Diagnostic Imaging of Suspected Acute Diverticulitis in Adults and Pregnant People, 2024, Recommendation, p. S109."
