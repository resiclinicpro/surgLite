                    Alternar Tema

                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>

                </svg>

    <!-- MODALES -->
    <div id="reset-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-300">
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Reiniciar Simulador</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 mb-6">Se borrará todo tu progreso y respuestas de los casos. ¿Deseas empezar desde cero?</p>
            <div class="flex gap-3">
                <button id="cancel-reset" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Cancelar</button>
                <button id="confirm-reset" class="flex-1 py-2 bg-red-500 text-white rounded-lg text-sm font-bold hover:bg-red-600 transition-colors">Sí, Reiniciar</button>
            </div>
        </div>
    </div>

    <div id="finish-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-300">
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Finalizar Simulador</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 mb-6">¿Estás seguro de que deseas terminar? Se evaluarán todas tus respuestas y se liberará la justificación médica.</p>
            <div class="flex gap-3">
                <button id="cancel-finish" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Seguir contestando</button>
                <button id="confirm-finish" class="flex-1 py-2 bg-emerald-500 text-white rounded-lg text-sm font-bold hover:bg-emerald-600 transition-colors">Sí, Calificar</button>
            </div>
        </div>
    </div>

    <script>

        const casesData = [

{
    id: 96,
    caseText: "Hombre de 65 años acude a urgencias por dolor abdominal de 48 horas de evolución en cuadrante inferior izquierdo, fiebre y constipación. Antecedentes: hipertensión arterial, tabaquismo. Exploración física: TA 130/80 mmHg, FC 98 lpm, FR 18 rpm, temperatura 38.2 °C. Abdomen con resistencia y dolor a la palpación profunda en fosa ilíaca izquierda, sin irritación peritoneal generalizada. Tacto rectal sin alteraciones. Laboratorios: leucocitos 14,000/mm³, proteína C reactiva 12 mg/dl. Se realiza tomografía computarizada con contraste intravenoso que reporta divertículos en sigmoides, engrosamiento de la pared colónica de 6 mm, estriación de la grasa pericólica y un absceso mesocólico de 2 cm de diámetro.",
    source: "52 Colon y Recto, Diverticular Disease - Pathophysiology and Epidemiology, Página 330.",
    questions: [
        {
            question: "De acuerdo con la fisiopatología de la enfermedad actual del paciente, ¿cuál es el sitio anatómico clásico donde se forman las lesiones primarias en la pared colónica?",
            options: [
                "En el borde antimesentérico a nivel de las tenias libres.",
                "En el lado mesentérico donde los vasos rectos atraviesan la capa muscular.",
                "En la submucosa del recto distal por aumento de presión intraluminal.",
                "En la serosa peritoneal adyacente a los apéndices epiploicos."
            ],
            answer: 1,
            justification: "Los divertículos colónicos son falsos divertículos formados por la herniación de la mucosa y submucosa en zonas de debilidad de la capa muscular. Estas áreas coinciden con los puntos de entrada vascular en la pared.<br><br><b>Perla Quirúrgica:</b> Los divertículos se forman clásicamente en el lado mesentérico de la pared colónica en regiones donde los vasos rectos atraviesan la capa muscular para proveer sangre a la mucosa.<br><br><b>Análisis de Distractores:</b> El recto tiene una capa muscular longitudinal completa, por lo que rara vez desarrolla divertículos. El borde antimesentérico no representa un sitio de debilidad vascular primaria. Los apéndices epiploicos están en la serosa, pero la herniación ocurre específicamente en los defectos de los vasos rectos."
        },
        {
            question: "Con base en los hallazgos del estudio de imagen de la tomografía computarizada descrito en el caso, ¿cuál es la estadificación clínica correcta según la clasificación de Hinchey modificada?",
            options: [
                "Estadio Ib",
                "Estadio Ia",
                "Estadio II",
                "Estadio III"
            ],
            answer: 0,
            justification: "La clasificación de Hinchey modificada estratifica la gravedad de la diverticulitis complicada por tomografía. El desarrollo de un absceso mesocólico o pericólico confinado corresponde a un estadio intermedio sin diseminación pélvica.<br><br><b>Perla Quirúrgica:</b> Estadio Ib: Absceso pericólico confinado (dentro del mesocolon sigmoide).<br><br><b>Análisis de Distractores:</b> El estadio Ia corresponde a un flemón con engrosamiento y alteración de la grasa pericólica, pero sin absceso formado. El estadio II implica un absceso pélvico o intraabdominal distante al colon afectado. El estadio III es una emergencia caracterizada por peritonitis purulenta generalizada."
        },
        {
            question: "Para el manejo inicial de la complicación infecciosa específica que presenta este paciente, ¿cuál es la conducta terapéutica de primera elección?",
            options: [
                "Resección de colon con colostomía terminal (Procedimiento de Hartmann).",
                "Resección sigmoidea con anastomosis primaria y derivación.",
                "Drenaje percutáneo guiado por tomografía computarizada.",
                "Terapia antimicrobiana intravenosa exclusiva y observación."
            ],
            answer: 3,
            justification: "Los abscesos pericólicos pequeños (menores a 3 cm) responden adecuadamente al manejo médico con reposo intestinal y cobertura antibiótica de amplio espectro, sin requerir intervencionismo inicial.<br><br><b>Perla Quirúrgica:</b> Los abscesos más pequeños a menudo pueden ser tratados exitosamente solo con antibióticos.<br><br><b>Análisis de Distractores:</b> El de drenaje percutáneo está indicado para abscesos de mayor tamaño (mayores a 3 o 4 cm). La cirugía de urgencia (Hartmann o resección primaria) se reserva para cuadros refractarios al manejo médico, peritonitis purulenta/fecaloide o inestabilidad hemodinámica."
        },
        {
            question: "Tras la resolución exitosa del cuadro agudo y el egreso hospitalario, ¿cuál es la recomendación estandarizada para el de seguimiento a mediano plazo en este paciente?",
            options: [
                "Colectomía electiva profiláctica tras el primer episodio.",
                "Sigmoidoscopia rígida de de control a los 14 días del egreso.",
                "Colonoscopia flexible en 4 a 8 semanas.",
                "Tomografía por emisión de de positrones a los 6 meses."
            ],
            answer: 2,
            justification: "Una vez superado un episodio de diverticulitis complicada, es obligatorio excluir patología neoplásica subyacente que pueda simular radiológicamente el cuadro. Esto se retrasa de 4 a 8 semanas para evitar perforación iatrogénica en el tejido edematizado.<br><br><b>Perla Quirúrgica:</b> Tras la recuperación, se recomienda que los pacientes se sometan a una colonoscopia después de 4 a 8 semanas para excluir malignidad.<br><br><b>Análisis de Distractores:</b> La cirugía profiláctica por número de cuadros ya no es el estándar. Una endoscopia temprana o durante la inflamación aguda está contraindicada por alto riesgo de perforación. La tomografía por emisión de positrones no tiene rol estándar aquí."
        },
        {
            question: "Si este paciente evolucionara tórpidamente con la formación de una fístula secundaria a la inflamación contigua, ¿cuál sería la manifestación clínica cardinal esperada de la comunicación anormal más frecuente en hombres?",
            options: [
                "Diarrea acuosa crónica severa por síndrome de de intestino corto.",
                "Salida de gas y material purulento a través de la uretra.",
                "Obstrucción intestinal de asa cerrada con vómito fecaloide.",
                "Secreción purulenta persistente a través del cordón espermático."
            ],
            answer: 1,
            justification: "La complicación fistulosa más frecuente derivada de un absceso diverticular contiguo en hombres es la comunicación con la cúpula vesical. La presencia de de gas y detritus entéricos en la vía urinaria inferior define su semiología.<br><br><b>Perla Quirúrgica:</b> El tipo más común, especialmente en hombres, es una fístula colovesical hacia el domo de la vejiga. Los pacientes presentarán infecciones del tracto urinario recurrentes, neumaturia y fecaluria también pueden estar presentes.<br><br><b>Análisis de Distractores:</b> La obstrucción de asa cerrada ocurre en un vólvulo sigmoideo o cáncer obstructivo. Una fístula ileosigmoidea podría generar diarrea, pero es mucho menos frecuente que la colovesical y es más típica de la enfermedad de Crohn. No hay involucro del cordón espermático."
        }
    ]
},
{
    id: 97,
    caseText: "Mujer de 68 años acude a urgencias por dolor abdominal súbito tipo cólico en el cuadrante inferior izquierdo de 12 horas de evolución, seguido de episodios de hematoquecia y tenesmo intenso. Antecedentes de fibrilación auricular crónica e insuficiencia cardíaca congestiva. A la exploración física: TA 100/60 mmHg, FC 110 lpm, FR 20 rpm, temperatura 37.8 °C. Abdomen distendido, doloroso a la palpación media y profunda en fosa ilíaca izquierda, sin datos francos de irritación peritoneal. Tacto rectal con abundante sangre roja brillante. Laboratorios: leucocitos 13,000/mm³, lactato 1.8 mmol/L. La tomografía computarizada abdominal reporta engrosamiento de la pared del colon izquierdo, estriación de la grasa pericólica y signo de impresión dactilar, sin gas portal ni neumoperitoneo.",
    source: "52 Colon y Recto, Other Colonic Infections Ischemic Colitis (Anatomic Considerations), Página 117.",
    questions: [
        {
            question: "De acuerdo con la fisiopatología de esta enfermedad, ¿cuál es el sitio anatómico de mayor vulnerabilidad isquémica conocido clásicamente como el punto de Sudeck?",
            options: [
                "La flexura hepática dependiente de la anastomosis de la arteria cólica derecha y media.",
                "La unión rectosigmoidea irrigada por ramas terminales de la arteria mesentérica inferior.",
                "La flexura esplénica donde confluyen los territorios de la arteria mesentérica superior e inferior.",
                "La válvula ileocecal irrigada por las ramas terminales de la arteria mesentérica superior."
            ],
            answer: 1,
            justification: "La colitis isquémica se presenta comúnmente en las áreas de cuenca donde la circulación colateral es anatómicamente más débil y vulnerable a estados de bajo flujo. El punto de Sudeck se localiza en la unión rectosigmoidea.<br><br><b>Perla Quirúrgica:</b> La otra región divisoria se encuentra en la unión rectosigmoidea (punto de Sudeck). Esta región recibe su irrigación de la arteria hemorroidal superior y las ramas sigmoideas distales, ambas ramas terminales de la arteria mesentérica inferior y propensas a cambios ateroscleróticos.<br><br><b>Análisis de Distractores:</b> La flexura esplénica corresponde al punto de Griffith, otra área de alto riesgo isquémico pero no responde al epónimo de Sudeck. La flexura hepática y la válvula ileocecal raramente sufren isquemia focal aislada por estados de bajo flujo."
        },
        {
            question: "Para confirmar el diagnóstico y evaluar la severidad de la mucosa en esta paciente (sin evidencia actual de peritonitis), ¿cuál es el estudio de primera elección (estándar de oro) que debe realizarse tempranamente?",
            options: [
                "Angiografía mesentérica por tomografía computarizada.",
                "Enema con contraste hidrosoluble fluoroscópico.",
                "Endoscopia flexible (colonoscopia).",
                "Resonancia magnética pélvica dinámica."
            ],
            answer: 2,
            justification: "En ausencia de peritonitis o perforación, la visualización directa de la mucosa es imperativa para confirmar la isquemia, cuantificar su extensión y descartar otros procesos inflamatorios. Suele revelar una mucosa edematosa y eritematosa.<br><br><b>Perla Quirúrgica:</b> El estándar de oro para el diagnóstico de la colitis isquémica es la endoscopia flexible. La colonoscopia temprana debe realizarse (dentro de las 48 horas), excepto en casos de peritonitis aguda o sospecha de isquemia transmural severa.<br><br><b>Análisis de Distractores:</b> La angiografía mesentérica está indicada ante sospecha de isquemia mesentérica aguda proximal (trombosis de vasos mayores). El enema con contraste ha quedado obsoleto y conlleva de riesgo de perforación. La resonancia magnética pélvica no tiene un rol agudo establecido."
        },
        {
            question: "Con base en la presentación clínica y los hallazgos de imagen, ¿cuál es el tratamiento médico inicial de elección para esta paciente?",
            options: [
                "Administración de glucocorticoides intravenosos a dosis altas.",
                "Resección segmentaria urgente con colostomía tipo Hartmann.",
                "Revascularización endovascular de la arteria mesentérica inferior.",
                "Reposo intestinal, líquidos intravenosos y antibióticos de amplio espectro."
            ],
            answer: 3,
            justification: "Cerca del 80% de los pacientes con colitis isquémica de espesor parcial responderán a un tratamiento médico de soporte para mejorar la perfusión global y tratar la translocación bacteriana generada por el daño de la barrera epitelial.<br><br><b>Perla Quirúrgica:</b> El pilar del tratamiento incluye reposo intestinal, líquidos intravenosos y antibióticos de amplio espectro. Se prescriben antibióticos empíricos de amplio espectro contra bacterias coliformes aerobias y anaerobias en la colitis isquémica para cubrir la flora bacteriana normal.<br><br><b>Análisis de Distractores:</b> Los glucocorticoides están contraindicados ya que pueden enmascarar signos de alarma. La resección quirúrgica urgente está reservada solo para necrosis transmural, inestabilidad o peritonitis franca. La revascularización endovascular no está indicada pues la fisiopatología es microvascular."
        },
        {
            question: "Tras la resolución exitosa del episodio agudo con manejo conservador, ¿cuál es la complicación crónica a mediano plazo que requeriría una de resección quirúrgica electiva si se vuelve sintomática?",
            options: [
                "Estenosis crónica del segmento afectado.",
                "Formación de fístula colovesical.",
                "Incontinencia fecal por disfunción de la anatomía del de esfínter.",
                "Megacolon tóxico refractario."
            ],
            answer: 0,
            justification: "El tejido colónico que sufre isquemia transitoria pero logra sobrevivir suele iniciar un proceso de de reparación inflamatoria y cicatrización fibrótica profunda que reestructura la arquitectura tubular, provocando estenosis.<br><br><b>Perla Quirúrgica:</b> Algunos pacientes que se recuperan inicialmente de una colitis isquémica de espesor parcial eventualmente desarrollarán una estenosis crónica en el segmento involucrado. Los pacientes sintomáticos o aquellos en los que no se puede excluir malignidad deben someterse a resección electiva.<br><br><b>Análisis de Distractores:</b> La fístula colovesical es una secuela clásica de la enfermedad diverticular complicada. La incontinencia fecal se debe típicamente a daños obstétricos. El megacolon tóxico es una emergencia fulminante aguda de colitis infecciosa o EEI."
        },
        {
            question: "Durante la evolución intrahospitalaria, la paciente presenta de deterioro clínico. ¿Qué hallazgo radiológico específico en una nueva tomografía computarizada es un signo ominoso que indica necrosis transmural e intervención quirúrgica de urgencia?",
            options: [
                "Adelgazamiento severo de la de capa muscular propia.",
                "Dilatación del ciego mayor a 12 centímetros.",
                "Presencia de gas venoso portal.",
                "Pérdida de las haustras colónicas basales."

                    const caseIdx = Math.floor((globalId - 1) / QUESTIONS_PER_CASE);
                    const qIdx = (globalId - 1) % QUESTIONS_PER_CASE;
                    const cData = casesData[caseIdx];
                    
                    if(!cData) return;
                    
                    const qData = cData.questions[qIdx];
                    const matchText = cData.caseText.toLowerCase().includes(term) || qData.question.toLowerCase().includes(term);
                    box.style.display = (term === '' || matchText || globalId.toString() === term) ? 'flex' : 'none';
                });

        function navigateCase(currentCaseId, direction) {
            let targetCaseId = currentCaseId;
            if (direction === 'prev' && currentCaseId > 1) {
                targetCaseId = currentCaseId - 1;
            } else if (direction === 'next' && currentCaseId < casesData.length) {
                targetCaseId = currentCaseId + 1;
            } else {
                displayQuestion(null); 
                return;
            }
            const targetGlobalQId = (targetCaseId - 1) * QUESTIONS_PER_CASE + 1;
            displayQuestion(targetGlobalQId);
        }

        function getQBoxClass(globalId, isActive) {
            let base = "q-box-item flex items-center justify-center aspect-square rounded-md font-bold text-[10px] sm:text-xs cursor-pointer transition-all select-none border ";
            if (isActive) base += "ring-4 ring-blue-500 shadow-md z-10 border-blue-500 dark:border-blue-400 ";

            const state = userProgress[globalId];
            const caseIdx = Math.floor((globalId - 1) / QUESTIONS_PER_CASE);
            const qIdx = (globalId - 1) % QUESTIONS_PER_CASE;
            const cData = casesData[caseIdx];
            
            if (!cData) return base + "bg-slate-100 text-slate-300";

            if (!examState.isFinished) {
                if (!state || !state.answered) {
                    return base + "bg-slate-50 text-slate-400 border-slate-200 hover:bg-slate-200 dark:bg-slate-800/50 dark:text-slate-500 dark:border-slate-700/50 dark:hover:bg-slate-700";
                } else {
                    return base + "bg-slate-600 text-white border-slate-700 dark:bg-slate-700 dark:border-slate-600 shadow-inner";
                }
            } 
            else {
                if (!state || !state.answered) {
                    return base + "bg-slate-100 text-slate-400 border-slate-200 dark:bg-slate-800 dark:text-slate-500 dark:border-slate-700";
                } else {
                    const isCorrect = state.selectedOption === cData.questions[qIdx].answer;
                    if (isCorrect) {
                        return base + "bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-900/30 dark:text-emerald-400 dark:border-emerald-800";
                    } else {
                        return base + "bg-rose-100 text-rose-700 border-rose-300 dark:bg-rose-900/30 dark:text-rose-400 dark:border-rose-800";
                    }
                }
            }
        }

                boxes.push(`<div class="${getQBoxClass(i, i === isActiveIdContext)}" data-id="${i}" onclick="displayQuestion(${i})">${i}</div>`);
            }
            return boxes.join('');
        }

        function displayQuestion(globalId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = globalId ? parseInt(globalId) : null;
                
                if (currentQuestionId) {
                    localStorage.setItem('EFISER3LastQId', currentQuestionId);
                } else {
                    localStorage.removeItem('EFISER3LastQId');
                }

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                if (window.innerWidth >= 1024) {
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');
                    dashboardBtn.classList.add('lg:left-[22rem]');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const caseIdx = Math.floor((currentQuestionId - 1) / QUESTIONS_PER_CASE);
                const cData = casesData[caseIdx];
                
                if (!cData) return displayQuestion(null);
                
                renderCaseLayout(cData, currentQuestionId);
                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                setTimeout(() => {
                    const targetCard = document.getElementById(`q-card-${currentQuestionId}`);
                    if (targetCard) {
                        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    }
                }, 50);

            }, 150); 
        }

                            <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 text-[10px] text-slate-400 font-bold uppercase tracking-widest">
                                <span class="text-slate-500">Bibliografía GPC:</span> ${cData.source}
                            </div>
                        ` : ''}
                    </div>

                    <!-- COLUMNA: BLOQUE DE LAS 5 PREGUNTAS ASOCIADAS -->
                    <div class="w-full space-y-5">
            `;

            cData.questions.forEach((q, idx) => {
                const globalQId = (cData.id - 1) * QUESTIONS_PER_CASE + idx + 1;
                const qState = userProgress[globalQId];
                const hasAnswered = qState && qState.answered;
                const userAnswer = hasAnswered ? qState.selectedOption : null;
                
                let cardStyle = "border-slate-200 dark:border-slate-800/80";
                if (globalQId === activeGlobalId) {
                    cardStyle = "border-blue-500 dark:border-blue-500 ring-2 ring-blue-500/10";
                }
                if (examState.isFinished && hasAnswered) {
                    cardStyle = (userAnswer === q.answer) ? "border-l-4 border-emerald-500" : "border-l-4 border-rose-500";
                }

                html += `
                    <div id="q-card-${globalQId}" class="bg-white dark:bg-slate-900 p-5 sm:p-6 rounded-2xl shadow-sm border ${cardStyle} transition-all">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-[9px] font-bold bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-2 py-0.5 rounded border border-slate-200 dark:border-slate-700">
                                PREGUNTA ${globalQId}
                            </span>
                        </div>
                        <h3 class="text-sm sm:text-base font-bold text-slate-800 dark:text-slate-100 mb-4 leading-snug">${q.question}</h3>
                        <form id="q-form-${globalQId}" class="space-y-2.5">
                `;

                q.options.forEach((opt, i) => {
                    if (examState.isFinished) {
                        let optClasses = "flex items-start p-3 border rounded-xl text-xs sm:text-sm ";
                        let icon = "";
                        
                        if (i === q.answer) {
                            optClasses += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 font-semibold";
                            icon = `<svg class="w-4 h-4 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;
                        } else if (i === userAnswer) {
                            optClasses += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                            icon = `<svg class="w-4 h-4 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                        } else {
                            optClasses += "bg-slate-50 border-slate-100 dark:bg-slate-800/30 dark:border-slate-800/50 opacity-50 text-slate-400";
                        }

                        html += `
                            <div class="${optClasses}">
                                <span class="leading-snug pr-3">${opt}</span>
                                ${icon}
                            </div>
                        `;
                    } else {
                        const checkedStr = (hasAnswered && userAnswer === i) ? 'checked' : '';
                        html += `
                            <label class="flex items-start p-3 border border-slate-200 dark:border-slate-800 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/40 has-[:checked]:bg-blue-50/80 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/20 text-xs sm:text-sm shadow-sm" onclick="autoSaveAnswer(${globalQId})">
                                <input type="radio" name="option" value="${i}" ${checkedStr} class="mt-0.5 h-3.5 w-3.5 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-700 cursor-pointer">
                                <span class="ml-2.5 text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `;
                    }
                });

                html += `</form>`;

                if (examState.isFinished) {
                    html += `
                        <div class="bg-blue-50/60 dark:bg-slate-800/50 border border-blue-100/50 dark:border-slate-800 rounded-xl p-4 text-xs sm:text-sm mt-4">
                            <h4 class="font-bold text-blue-800 dark:text-blue-400 mb-1 flex items-center gap-1 uppercase tracking-wider text-[10px]">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Justificación Médica GPC
                            </h4>
                            <p class="text-slate-600 dark:text-slate-300 leading-relaxed">${q.justification}</p>
                        </div>
                    `;
                }

                html += `</div>`;
            });

            const isLastCase = cData.id === casesData.length;

            html += `
                        <!-- CONTROLES DE FLUJO EN CASOS -->
                        <div class="flex justify-between items-center pt-4 mt-6 border-t border-slate-200 dark:border-slate-800">
                            <button onclick="navigateCase(${cData.id}, 'prev')" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                                Caso Anterior
                            </button>
                            
                            ${examState.isFinished ? `
                                ${!isLastCase ? `
                                    <button onclick="navigateCase(${cData.id}, 'next')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 px-6 rounded-xl transition-colors text-xs uppercase tracking-wider flex items-center gap-1.5 shadow-sm">
                                        Siguiente Caso <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                                    </button>
                                ` : `
                                    <button onclick="displayQuestion(null)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-6 rounded-xl transition-colors text-xs uppercase tracking-wider shadow-sm">
                                        Ver Calificaciones
                                    </button>
                                `}
                            ` : `
                                <button onclick="navigateCase(${cData.id}, 'next')" class="bg-blue-600 dark:bg-blue-500 text-white font-bold py-2.5 px-6 rounded-xl shadow-md hover:bg-blue-700 dark:hover:bg-blue-400 transition-colors text-xs uppercase tracking-wider flex items-center gap-1.5">
                                    Siguiente Caso <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('module-display').innerHTML = html;
        }

        function autoSaveAnswer(globalId) {
            if(examState.isFinished) return;
            const form = document.getElementById(`q-form-${globalId}`);
            if (!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (selected) {
                userProgress[globalId] = { answered: true, selectedOption: parseInt(selected.value) };
                saveState();
                updateProgressBar();
                renderSidebarGrid();
            }
        }

        function updateProgressBar() {
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = totalQuestions > 0 ? Math.round((ans / totalQuestions) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; 
            }
        }

        function saveState() {
            try { localStorage.setItem('EFISER3Progress', JSON.stringify(userProgress)); } catch(e) {}
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('EFISER3Progress');
                userProgress = saved ? JSON.parse(saved) : {};
                const savedState = localStorage.getItem('EFISER3ExamState');
                if (savedState) examState = JSON.parse(savedState);
            } catch(e) { userProgress = {}; examState = { isFinished: false }; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>
</body>
</html>
