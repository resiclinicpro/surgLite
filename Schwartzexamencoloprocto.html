        </div>

    <script>
        const questionsData = [

    {
        id: 1,
        question: "¿Cuál es la rama arterial principal encargada de la irrigación del colon descendente?",
        options: ["Arteria mesentérica superior", "Arteria mesentérica inferior", "Arteria ilíaca interna", "Arteria pudenda interna"],
        answer: 1,
        justification: "Justificación: De acuerdo al libro de Principios de Cirugía Schwartz, el colon izquierdo y el colon descendente reciben su irrigación principal de la arteria mesentérica inferior, la cual se debe ligar en su origen durante resecciones oncológicas curativas del colon izquierdo.<br><br>Perla Quirúrgica: Curative resection of a colorectal cancer is usually best accomplished by performing a proximal mesenteric vessel ligation...<br><br>Análisis de Distractores: La arteria mesentérica superior (A) irriga el colon derecho y el colon transverso proximal. La arteria ilíaca interna (C) y la pudenda interna (D) irrigan el recto medio y distal, así como el canal anal, no el colon descendente.",
        source: "Principios de Cirugía de Schwartz, 11 edición, Consideraciones Quirúrgicas Generales, Página 24."
    },
    {
        id: 2,
        question: "En la fisiología normal del intestino grueso, ¿cuál es la capacidad máxima de absorción de agua que posee el colon diariamente?",
        options: ["1000 ml", "2000 ml", "5000 ml", "8000 ml"],
        answer: 2,
        justification: "Justificación: De acuerdo al libro de Principios de Cirugía Schwartz, aunque en condiciones normales el colon absorbe aproximadamente del 90% del líquido ileal (1000 a 2000 ml al día), su capacidad absortiva máxima permite recuperar una cantidad significativamente mayor para prevenir la deshidratación severa.<br><br>Perla Quirúrgica: Under normal circumstances, approximately 90% of the water contained in ileal fluid is absorbed in the colon (1000–2000 mL/d), but up to 5000 mL of fluid can be absorbed daily.<br><br>Análisis de Distractores: Los volúmenes de 1000 ml (A) y 2000 ml (B) corresponden a la absorción basal diaria, no a la capacidad máxima de adaptación. Un volumen de 8000 ml (D) excede por completo la capacidad fisiológica de absorción colónica.",
        source: "Principios de Cirugía de Schwartz, 11 edición, Fisiología Normal, Página 7."
    },
    {
        id: 3,
        question: "Para establecer el diagnóstico de estreñimiento por tránsito lento, ¿qué porcentaje de retención de marcadores radiopacos se debe observar al quinto día del estudio radiológico?",
        options: ["≥ 5%", "≥ 10%", "≥ 15%", "≥ 20%"],
        answer: 3,
        justification: "Justificación: De acuerdo al libro de Principios de Cirugía Schwartz, los estudios de tránsito colónico implican la ingesta de marcadores radiopacos y seguimiento radiográfico por 5 días. La retención significativa de estos marcadores establece el diagnóstico de inercia colónica.<br><br>Perla Quirúrgica: Retention of 20% or greater of these markers in the colon demonstrated slow transit.<br><br>Análisis de Distractores: Porcentajes de retención menores como 5% (A), 10% (B) o 15% (C) al quinto día se consideran dentro de rangos normales de evacuación y descartan el diagnóstico patológico de estreñimiento por tránsito lento.",
        source: "Principios de Cirugía de Schwartz, 11 edición, Evaluación Clínica (Constipation), Página 14."
    },
    {
        id: 4,
        question: "Durante el abordaje diagnóstico del estreñimiento crónico, ¿cuál estudio funcional es capaz de detectar la ausencia del reflejo inhibitorio anorrectal sugestivo de enfermedad de Hirschsprung?",
        options: ["Manometría anorrectal", "Defecografía por resonancia", "Tránsito colónico con marcadores", "Electromiografía del piso pélvico"],
        answer: 0,
        justification: "Justificación: De acuerdo al libro de Principios de Cirugía Schwartz, la manometría anorrectal evalúa las presiones de los esfínteres y los reflejos neurales. La falla del esfínter anal interno para relajarse tras la distensión rectal es patognomónica de la aganglionosis congénita.<br><br>Perla Quirúrgica: The absence of an anorectal inhibitory reflex suggests Hirschsprung’s disease and may prompt a rectal mucosal biopsy.<br><br>Análisis de Distractores: La defecografía (B) identifica prolapsos o intususcepciones. El tránsito con marcadores (C) diagnostica inercia colónica global. La electromiografía (D) detecta la falta de relajación del músculo puborrectal (disinergia), pero no el reflejo autonómico inhibitorio liso.",
        source: "Principios de Cirugía de Schwartz, 11 edición, Evaluación Clínica (Constipation), Página 14."
    },
    {
        id: 5,
        question: "En el desarrollo etiopatogénico de la enfermedad inflamatoria intestinal, ¿qué mutación genética se asocia fuertemente con la enfermedad de Crohn y el desarrollo de reservoritis severa posterior a cirugía?",
        options: ["Mutación en gen APC", "Mutación en gen NOD2", "Inactivación del gen p53", "Activación del gen K-ras"],
        answer: 1,
        justification: "Justificación: De acuerdo al libro de Principios de Cirugía Schwartz, existen variantes genéticas de la función inmune innata implicadas en la enfermedad inflamatoria intestinal. La mutación en el gen NOD2 (cromosoma 16) altera la respuesta inflamatoria a microbios intestinales.<br><br>Perla Quirúrgica: This genetic variant is arguably the most strongly associated with IBD, being strongly connected with Crohn’s disease, although it is also associated with severe pouchitis...<br><br>Análisis de Distractores: Las alteraciones en el gen APC (A), p53 (C) y K-ras (D) conforman la secuencia clásica de la adenogénesis y carcinogénesis colorrectal esporádica descrita en el síndrome de poliposis, no el defecto inmunológico primario de la enfermedad inflamatoria.",
        source: "Principios de Cirugía de Schwartz, 11 edición, Enfermedad Inflamatoria Intestinal, Página 33."
    },
    {
        id: 6,
        question: "¿Cuál manifestación extraintestinal dermatológica de la enfermedad inflamatoria intestinal presenta el fenómeno de patergia, donde la severidad de la lesión empeora por la creación de estomas quirúrgicos?",
        options: ["Uveítis anterior aguda", "Colangitis esclerosante primaria", "Eritema nodoso", "Pioderma gangrenoso"],
        answer: 3,
        justification: "Justificación: De acuerdo al libro de Principios de Cirugía Schwartz, el pioderma gangrenoso es una lesión ulcerativa, necrótica y dolorosa. El trauma del tejido durante procedimientos quirúrgicos exacerba masivamente la inflamación de la zona (patergia).<br><br>Perla Quirúrgica: One of the challenges in managing pyoderma is that this manifestation of IBD exhibits pathergy, where the disease will manifest and have its severity exacerbated by the creation of surgical-sites.<br><br>Análisis de Distractores: El eritema nodoso (C) y la uveítis anterior (A) suelen mejorar espontáneamente con el control médico de la inflamación intestinal subyacente. La colangitis esclerosante (B) es una afección biliar irreversible intratable con cirugía colorrectal.",
        source: "Principios de Cirugía de Schwartz, 11 edición, Enfermedad Inflamatoria Intestinal, Página 34."
    },
    {
        id: 7,
        question: "En pacientes con diagnóstico de colitis ulcerosa crónica inespecífica, ¿cuál es el procedimiento quirúrgico de elección catalogado como el 'estándar de oro' para el tratamiento definitivo electivo?",
        options: ["Proctocolectomía total con ileostomía terminal", "Colectomía subtotal con anastomosis ileorrectal", "Proctocolectomía con bolsa continente de Kock", "Resección anterior baja con colostomía"],
        answer: 0,
        justification: "Justificación: De acuerdo al libro de Principios de Cirugía Schwartz, la extirpación completa de toda la mucosa en riesgo (colon y recto) asegura la erradicación del componente inflamatorio y oncológico. La derivación en estoma terminal es segura y evita complicaciones funcionales pélvicas mayores.<br><br>Perla Quirúrgica: Total proctocolectomy with end ileostomy has been the 'gold standard' for treating patients with chronic ulcerative colitis.<br><br>Análisis de Distractores: La anastomosis ileorrectal (B) no extirpa la mucosa distal, perpetuando el riesgo de proctitis y malignidad. La bolsa de Kock (C) cursa con una alta tasa de complicaciones valvulares. La resección anterior baja (D) abandona la totalidad del colon proximal enfermo de forma inútil.",
        source: "Principios de Cirugía de Schwartz, 11 edición, Enfermedad Inflamatoria Intestinal, Página 37."
    },
    {
        id: 8,
        question: "Tras someter a un paciente a una proctocolectomía restauradora con anastomosis bolsa ileal-anal por colitis ulcerosa, ¿cuál es la complicación inflamatoria a largo plazo que afecta a casi el 50% de los casos?",
        options: ["Estenosis de la anastomosis", "Obstrucción de intestino delgado", "Reservoritis aguda o crónica", "Fístula rectovaginal profesa"],
        answer: 2,
        justification: "Justificación: De acuerdo al libro de Principios de Cirugía Schwartz, la inflamación inespecífica de la bolsa ileal neoformada (reservoritis o pouchitis) es la complicación funcional dominante. Obliga al uso de antimicrobianos sistémicos o tópicos debido al aumento en la frecuencia evacuatoria y aparición de sangrado.<br><br>Perla Quirúrgica: Pouchitis... occurs in nearly 50% of patients who undergo the operation for chronic ulcerative colitis.<br><br>Análisis de Distractores: La obstrucción de intestino delgado (B), la estenosis anastomótica (A) y las fístulas adquiridas (D) son complicaciones mecánicas documentadas del procedimiento, sin embargo, su incidencia clínica es sustancialmente menor en la estadística global.",
        source: "Principios de Cirugía de Schwartz, 11 edición, Consideraciones Quirúrgicas Generales (Functional Results), Página 30."
    },
    {
        id: 9,
        question: "Según el sistema de clasificación de Hinchey para la estadificación de la diverticulitis aguda complicada, ¿qué grado patológico corresponde al hallazgo tomográfico de un absceso pélvico o retroperitoneal distante?",
        options: ["Estadio I", "Estadio II", "Estadio III", "Estadio IV"],
        answer: 1,
        justification: "Justificación: De acuerdo al libro de Principios de Cirugía Schwartz, el avance de la contaminación dictamina la gravedad pronóstica. El estadio I es confinado a la grasa pericólica, el II se extiende formando abscesos tabicados distantes (pelvis), el III denota derrame purulento libre y el IV implica estallamiento fecal difuso.<br><br>Perla Quirúrgica: ...stage II includes colonic inflammation with a retroperitoneal or pelvic abscess.<br><br>Análisis de Distractores: El estadio I (A) designa abscesos pequeños puramente mesocólicos o pericólicos. El estadio III (C) designa una fase peritonítica supurativa purulenta libre. El estadio IV (D) corresponde a la contaminación masiva fecaloidea difusa por perforación libre.",
        source: "Principios de Cirugía de Schwartz, 11 edición, Enfermedad Diverticular, Página 43."
    },
    {
        id: 10,
        question: "En un paciente quirúrgico gravemente comprometido a consecuencia de peritonitis purulenta o fecaloidea difusa por enfermedad diverticular, ¿cuál es el abordaje quirúrgico que garantiza la máxima seguridad de supervivencia?",
        options: ["Colectomía sigmoidea con anastomosis primaria", "Resección ileocecal con ostomía terminal", "Colectomía sigmoidea con procedimiento de Hartmann", "Lavado peritoneal laparoscópico y drenaje"],
        answer: 2,
        justification: "Justificación: De acuerdo al libro de Principios de Cirugía Schwartz, frente a la extrema inestabilidad sistémica y un campo intraabdominal gravemente aséptico (Hinchey III o IV), la resección del foco originario acoplada al cierre del muñón rectal y a una derivación terminal elimina el inaceptable riesgo letal de cualquier filtración anastomótica.<br><br>Perla Quirúrgica: Among patients with larger abscesses, peritoneal soiling, or peritonitis, sigmoid colectomy with end colostomy and Hartmann’s pouch is the most commonly used procedure.<br><br>Análisis de Distractores: La anastomosis primaria (A) cursa con un índice prohibitivo de dehiscencia en sepsis. La resección ileocecal (B) no extirpa la anatomía afectada habitual (el sigmoides). El mero lavado laparoscópico (D) no elimina el defecto de víscera hueca persistente.",
        source: "Principios de Cirugía de Schwartz, 11 edición, Enfermedad Diverticular, Página 44."
    },
    {
        id: 11,
        question: "Durante la evolución temporal progresiva de episodios infecciosos recurrentes por diverticulitis complicada, ¿cuál es la localización topográfica de la fístula que se desarrolla con mayor frecuencia?",
        options: ["Fístula colovesical", "Fístula colovaginal", "Fístula coloentérica", "Fístula colocutánea"],
        answer: 0,
        justification: "Justificación: De acuerdo al libro de Principios de Cirugía Schwartz, el proceso destructivo e inflamatorio crónico de un absceso de colon sigmoides encuentra su ruta de drenaje de menor resistencia hacia la cúpula y pared posterior de la vejiga, exteriorizándose con neumaturia y fecaluria.<br><br>Perla Quirúrgica: Colovesical fistulas are most common, followed by colovaginal and coloenteric fistulas.<br><br>Análisis de Distractores: Las lesiones colovaginales (B) y coloentéricas (C) ocurren con una densidad estadística comprobada mucho menor. Las fístulas de colon a la piel abdominal (D) son excepcionalmente inusuales de forma espontánea sin iatrogenia quirúrgica previa.",
        source: "Principios de Cirugía de Schwartz, 11 edición, Enfermedad Diverticular, Página 45."
    },
    {
        id: 12,
        question: "En el paciente diagnosticado formalmente con colitis ulcerosa crónica inespecífica tipo pancolitis, ¿a partir de qué año de duración ininterrumpida de la enfermedad debe implementarse el protocolo de vigilancia colonoscópica con múltiples biopsias?",
        options: ["A los 3 años", "A los 5 años", "A los 15 años", "A los 8 años"],
        answer: 3,
        justification: "Justificación: De acuerdo al libro de Principios de Cirugía Schwartz, la probabilidad de transformación maligna a partir de displasia plana se acelera sustancialmente tras la primera década de la afección. La colonoscopia estricta es esencial para detectar neoplasia intraepitelial precoz.<br><br>Perla Quirúrgica: Surveillance is recommended annually after 8 years in patients with pancolitis, and annually after 15 years in patients with left-sided colitis.<br><br>Análisis de Distractores: Retrasar el monitoreo a 15 años (C) aplica únicamente a cuadros limitados de colitis izquierda. Protocolos prematuros de 3 años (A) o 5 años (B) no aportan beneficio diagnóstico costo-efectivo validado oncológicamente en el tamizaje universal.",
        source: "Principios de Cirugía de Schwartz, 11 edición, Enfermedad Inflamatoria Intestinal, Página 37."
    },
    {
        id: 13,
        question: "¿Cuál variante histológica macroscópica de pólipo colónico representa fisiopatológicamente la reparación de úlceras mucosas tras episodios destructivos de enterocolitis severa?",
        options: ["Pólipo adenomatoso tubular", "Pseudopólipo inflamatorio", "Pólipo hiperplásico", "Pólipo velloso sésil"],

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-blue-600 dark:hover:bg-blue-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-cyan-600 hover:to-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('colonyrectocamerunProgress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('colonyrectocamerunLastQId', currentQuestionId);
                else localStorage.removeItem('colonyrectocamerunLastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('colonyrectocamerunProgress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>

</body>
</html>
