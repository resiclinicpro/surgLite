    <!-- MODAL REINICIAR -->
    <div id="reset-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-300">
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Reiniciar Examen</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 mb-6">Se borrará tu progreso actual. ¿Deseas continuar?</p>
            <div class="flex gap-3">
                <button id="cancel-reset" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Cancelar</button>
                <button id="confirm-reset" class="flex-1 py-2 bg-red-500 text-white rounded-lg text-sm font-bold hover:bg-red-600 transition-colors">Sí, Reiniciar</button>
            </div>
        </div>
    </div>

    <script>
        // =========================================================
        // =========================================================
        const questionsData = [
    {
        id: 1,
        question: "¿Cuál es el objetivo principal al realizar una reparación quirúrgica biliar definitiva?",
        options: ["Drenaje percutáneo prolongado", "Reconstrucción vascular inmediata", "Anastomosis sana libre de tensión", "Anastomosis con tensión moderada"],
        answer: 2,
        justification: "Justificación: De acuerdo al Estudio de Reconstrucción Biliar, la restitución del flujo exige un entorno adecuado para asegurar la viabilidad del injerto y evitar fracasos anatómicos.<br><br>Perla Quirúrgica: La reparación quirúrgica tiene como objetivo lograr una anastomosis sana y libre de tensión entre un tejido biliar vascularizado y flexible y un segmento del yeyuno.<br><br>Análisis de Distractores: El drenaje percutáneo es una medida temporal o puente, no el objetivo definitivo. La reconstrucción vascular solo aplica en casos muy específicos de isquemia arterial documentada. Una anastomosis con tensión es el principal factor de riesgo para dehiscencia y estenosis posoperatoria, por lo que debe evitarse.",
        source: "Analysis of outcomes of biliary reconstruction, 2021, Introduction, p. 1542."
    },
    {
        id: 2,
        question: "¿Cuál es la tasa de mortalidad global reportada para la anastomosis bilioentérica asociada a una lesión de la vía biliar?",
        options: ["0.1% a 1.5%", "10% a 15%", "15% a 20%", "1.7% a 9%"],
        answer: 3,
        justification: "Justificación: De acuerdo al Estudio de Reconstrucción Biliar, aunque la supervivencia ha mejorado en centros especializados, las intervenciones mayores en una vía biliar inflamada conllevan riesgos sistémicos intrínsecos.<br><br>Perla Quirúrgica: La mortalidad global de la anastomosis bilioentérica asociada a lesión de la vía biliar varía entre 1.7% y 9%.<br><br>Análisis de Distractores: Las opciones A, B y C son estimaciones incorrectas que subestiman o sobrestiman el riesgo real de un procedimiento complejo en pacientes que frecuentemente presentan sepsis o colangitis previa.",
        source: "Analysis of outcomes of biliary reconstruction, 2021, Introduction, p. 1542."
    },
    {
        id: 3,
        question: "¿Qué hallazgos clínicos y de laboratorio definen un resultado Grado C según los criterios de McDonald?",
        options: ["Asintomático con función hepática normal", "Síntomas leves con pruebas alteradas", "Colangitis con dolor y fiebre", "Colangitis que requiere intervención"],
        answer: 2,
        justification: "Justificación: De acuerdo al Estudio de Reconstrucción Biliar, la estratificación del éxito a largo plazo se clasifica según la recurrencia de síntomas biliares y alteraciones enzimáticas.<br><br>Perla Quirúrgica: Los resultados Grado C en los criterios de McDonald se constituyen por colangitis con dolor, fiebre y alteración en las pruebas de función hepática.<br><br>Análisis de Distractores: La opción A corresponde al Grado A (excelente). La opción B corresponde al Grado B (bueno). La opción D corresponde al Grado D (pobre), el cual implica falla terapéutica inminente que obliga a instrumentar nuevamente la vía biliar.",
        source: "Analysis of outcomes of biliary reconstruction, 2021, Methods, p. 1543."
    },
    {
        id: 4,
        question: "¿Cuál fue la incidencia de estenosis biliar recurrente posterior a una hepaticoyeyunostomía definitiva en esta cohorte?",
        options: ["6.7%", "1.9%", "16%", "28%"],
        answer: 0,
        justification: "Justificación: De acuerdo al Estudio de Reconstrucción Biliar, la formación de estenosis tardías es la complicación a largo plazo más temida y depende directamente de la técnica y el terreno isquémico.<br><br>Perla Quirúrgica: La incidencia de estenosis biliar recurrente después de una hepaticoyeyunostomía quirúrgica definitiva fue del 6.7%.<br><br>Análisis de Distractores: 1.9% corresponde a los resultados Grado C. 16% fue la incidencia de fuga biliar temprana. 28% fue el total global de pacientes que presentaron algún tipo de complicación a corto plazo.",
        source: "Analysis of outcomes of biliary reconstruction, 2021, Abstract, p. 1542."
    },
    {
        id: 5,
        question: "¿Cuál fue el procedimiento inicial más común utilizado para el manejo de un biloma antes de la reparación definitiva?",
        options: ["Laparotomía con lavado", "Drenaje guiado por ultrasonido", "Colangiografía transhepática percutánea", "Colangiopancreatografía endoscópica"],
        answer: 1,
        justification: "Justificación: De acuerdo al Estudio de Reconstrucción Biliar, el control del foco infeccioso y la derivación de la bilis son imperativos de primera línea antes de siquiera planear un abordaje quirúrgico formal.<br><br>Perla Quirúrgica: Los pacientes con biloma fueron sometidos primariamente a drenaje percutáneo guiado por ultrasonido para formar una fístula controlada antes de la reparación diferida.<br><br>Análisis de Distractores: La laparotomía se reservó para casos de peritonitis biliar difusa. La colangiografía transhepática y la CPRE se usaron principalmente como métodos diagnósticos o en fístulas persistentes, no como primer paso ante un biloma no controlado en la mayoría de los pacientes.",
        source: "Analysis of outcomes of biliary reconstruction, 2021, Methods, p. 1543."
    },
    {
        id: 6,
        question: "¿En qué periodo cicatrizan típicamente las fístulas biliares externas para formar una estenosis en pacientes con manejo conservador?",
        options: ["1 a 2 semanas", "8 a 10 semanas", "4 a 6 semanas", "12 a 14 semanas"],
        answer: 2,
        justification: "Justificación: De acuerdo al Estudio de Reconstrucción Biliar, el trayecto fistuloso generado tras una lesión biliar tiende a obliterarse gradualmente a medida que la reacción inflamatoria se estabiliza.<br><br>Perla Quirúrgica: La mayoría de las fístulas biliares externas cicatrizan para formar una estenosis a lo largo de 4 a 6 semanas.<br><br>Análisis de Distractores: A la semana 1 o 2, la fístula se encuentra en fase aguda y activa. Más allá de 8 o 12 semanas, la obliteración ya ha concluido y el paciente suele cursar con cuadros de colangitis de repetición o ictericia obstructiva.",
        source: "Analysis of outcomes of biliary reconstruction, 2021, Methods, p. 1543."
    },
    {
        id: 7,
        question: "¿A partir de qué límite de tiempo se consideró una reparación quirúrgica como \"tardía\" en el contexto de estas lesiones biliares?",
        options: ["> 1 mes", "> 6 meses", "> 12 meses", "> 3 meses"],
        answer: 3,
        justification: "Justificación: De acuerdo al Estudio de Reconstrucción Biliar, la temporalidad de la reconstrucción es crítica para permitir la resolución del daño tisular y favorecer bordes sanos.<br><br>Perla Quirúrgica: La reparación tardía se realizó de manera predominante, definiéndose como aquella intervención llevada a cabo > 3 meses después de ocurrida la lesión.<br><br>Análisis de Distractores: Intervenir al mes 1 suele coincidir con la fase de mayor inflamación periductal. Retrasar hasta los 6 o 12 meses aumenta innecesariamente el riesgo de cirrosis biliar secundaria sin otorgar beneficios adicionales sobre la inflamación aguda.",
        source: "Analysis of outcomes of biliary reconstruction, 2021, Results, p. 1544."
    },
    {
        id: 8,
        question: "¿Qué variable demostró ser un predictor independiente asociado al desarrollo de complicaciones posoperatorias a corto plazo?",
        options: ["Fístula coledocoduodenal", "Edad > 50 años", "Colecistectomía laparoscópica", "Fuga biliar preoperatoria"],
        answer: 0,
        justification: "Justificación: De acuerdo al Estudio de Reconstrucción Biliar, las comunicaciones aberrantes con el tracto digestivo incrementan drásticamente la carga bacteriana en un sistema biliar ya vulnerable.<br><br>Perla Quirúrgica: En el análisis multivariado, el tipo de estenosis y la presencia de fístula coledocoduodenal se asociaron de manera independiente con el desarrollo de complicaciones a corto plazo.<br><br>Análisis de Distractores: La edad y el tipo de colecistectomía inicial (laparoscópica frente a abierta) no mostraron significancia estadística. La fuga biliar preoperatoria es una forma clásica de presentación, pero per se no fue un predictor independiente comparada con la infección ascendente facilitada por fístulas duodenales.",
        source: "Analysis of outcomes of biliary reconstruction, 2021, Results, p. 1544."
    },
    {
        id: 9,
        question: "¿Cuál fue la complicación posoperatoria a corto plazo más frecuente tras la reconstrucción bilioentérica?",
        options: ["Infección del sitio quirúrgico", "Colección intraabdominal", "Colangitis posoperatoria", "Fuga biliar anastomótica"],
        answer: 3,
        justification: "Justificación: De acuerdo al Estudio de Reconstrucción Biliar, a pesar de los esfuerzos por realizar uniones libres de tensión, el endotelio biliar iatrogénicamente isquémico presenta vulnerabilidad temprana.<br><br>Perla Quirúrgica: Durante el posoperatorio temprano, la dehiscencia anastomótica con fuga biliar resultó ser la complicación más común, ocurriendo en el 16% de los pacientes.<br><br>Análisis de Distractores: La infección del sitio quirúrgico y la colangitis ocuparon el segundo y tercer lugar respectivamente. Las colecciones intraabdominales graves fueron estadísticamente raras (2%).",
        source: "Analysis of outcomes of biliary reconstruction, 2021, Results, p. 1544."
    },
    {
        id: 10,
        question: "¿Qué sistema de clasificación anatómica se utilizó para estratificar la lesión biliar mediante estudios de imagen?",
        options: ["Clavien-Dindo", "Criterios de McDonald", "Sistema de Strasberg-Bismuth", "Escala de Bismuth-Corlette"],
        answer: 2,
        justification: "Justificación: De acuerdo al Estudio de Reconstrucción Biliar, es mandatorio mapear el nivel exacto del daño para planear el asa en Y de Roux y la disección portal requerida.<br><br>Perla Quirúrgica: La lesión del conducto biliar se clasificó universalmente según el sistema de Strasberg-Bismuth definido por diferentes modalidades de imagen.<br><br>Análisis de Distractores: Clavien-Dindo evaluó morbilidad posquirúrgica. McDonald midió éxito clínico a largo plazo. Bismuth-Corlette es específico para colangiocarcinoma perihiliar y no rige las lesiones iatrogénicas benignas en este contexto.",
        source: "Analysis of outcomes of biliary reconstruction, 2021, Methods, p. 1543."
    },
    {
        id: 11,
        question: "¿Qué porcentaje de los fracasos terapéuticos en términos de re-estenosis ocurrieron dentro de los primeros 5 años de seguimiento?",
        options: ["20%", "50%", "66%", "80%"],
        answer: 3,
        justification: "Justificación: De acuerdo al Estudio de Reconstrucción Biliar, la cicatrización fibrótica progresiva de una anastomosis bilioentérica requiere un periodo prolongado de vigilancia clínica antes de declarar la curación definitiva.<br><br>Perla Quirúrgica: La mediana de seguimiento es vital ya que dos tercios de los fracasos ocurren en los primeros 3 años y el 80% se presentan dentro de los 5 años iniciales.<br><br>Análisis de Distractores: 20% es el porcentaje de fallas atípicas que ocurren después del quinto año. 66% representa las fallas tempranas en los primeros 3 años.",
        source: "Analysis of outcomes of biliary reconstruction, 2021, Discussion, p. 1546."
    },
    {
        id: 12,
        question: "¿Qué variable se identificó como predictor independiente para la formación de estenosis biliar tardía posoperatoria?",
        options: ["Colangitis posoperatoria", "Nivel de bilirrubina > 10 mg/dl", "Tipo de colecistectomía inicial", "Absceso intraabdominal"],
        answer: 0,
        justification: "Justificación: De acuerdo al Estudio de Reconstrucción Biliar, la infección recurrente en el epitelio biliar detona un proceso fibrótico cíclico que culmina en reducción de la luz anastomótica.<br><br>Perla Quirúrgica: En el análisis multivariado, la colangitis posoperatoria y el tipo de lesión biliar resultaron estar independientemente asociados con estenosis biliar tardía.<br><br>Análisis de Distractores: Los niveles altos de bilirrubina reflejan severidad al momento de presentación pero no predicen falla estructural futura. La colecistectomía inicial (abierta vs laparoscópica) no tuvo impacto, ni tampoco el antecedente aislado de un absceso intraabdominal.",
        source: "Analysis of outcomes of biliary reconstruction, 2021, Results, p. 1545."
    },
    {
        id: 13,
        question: "Durante la hepaticoyeyunostomía en Y de Roux, ¿En qué estructura se realiza rutinariamente la extensión del estoma?",
        options: ["Conducto cístico remanente", "Conducto hepático común", "Sistema ductal derecho", "Sistema ductal izquierdo"],
        answer: 3,
        justification: "Justificación: De acuerdo al Estudio de Reconstrucción Biliar, el abordaje hiliar exige maximizar la apertura de una mucosa biliar sana. La anatomía del conducto izquierdo ofrece una porción extrahepática más larga y constante para este propósito.<br><br>Perla Quirúrgica: Todos los pacientes se sometieron a una hepaticoyeyunostomía en Y de Roux con extensión del estoma en el sistema ductal izquierdo.<br><br>Análisis de Distractores: El cístico y el hepático común suelen estar comprometidos o resecados debido a la lesión inflamatoria primaria. El sistema ductal derecho tiene un trayecto intrahepático rápido, lo que dificulta una anastomosis segura en comparación con el acceso izquierdo.",
        source: "Analysis of outcomes of biliary reconstruction, 2021, Methods, p. 1543."
    },
    {
        id: 14,
        question: "¿Qué patrón anatómico de lesión se asoció de manera más fuerte con el desarrollo de re-estenosis posoperatoria?",
        options: ["Estenosis biliar hiliar", "Estenosis del colédoco distal", "Fístulas biliares externas", "Lesiones del conducto cístico"],
        answer: 0,
        justification: "Justificación: De acuerdo al Estudio de Reconstrucción Biliar, a mayor proximidad hacia la bifurcación, más compleja es la exposición del tejido sano y mayor el riesgo de isquemia microvascular y falla anastomótica.<br><br>Perla Quirúrgica: Los pacientes con lesiones biliares hiliares experimentaron más fracasos después de la cirugía, ubicándose la estenosis proximal a la bifurcación biliar.<br><br>Análisis de Distractores: El colédoco distal y el conducto cístico son de fácil acceso extrahepático y su reparación directa o derivación inferior tienen tasas altísimas de éxito sin re-estenosis.",
        source: "Analysis of outcomes of biliary reconstruction, 2021, Discussion, p. 1546."
    },
    {
        id: 15,
        question: "¿Qué pacientes con complicación biliar poscolecistectomía fueron excluidos directamente del análisis por considerarse lesiones menores?",
        options: ["Fugas del lecho vesicular", "Sección del conducto hepático", "Ligadura total del colédoco", "Sección de conductos segmentarios"],
        answer: 0,
        justification: "Justificación: De acuerdo al Estudio de Reconstrucción Biliar, las soluciones de continuidad del conducto de Luschka o pequeños defectos biliares son auto-limitados o ceden a manejo endoscópico rutinario sin requerir reconstrucción mayor.<br><br>Perla Quirúrgica: Los pacientes con fugas menores del conducto cístico o del lecho vesicular, que podían manejarse de manera conservadora, fueron excluidos del análisis.<br><br>Análisis de Distractores: Las lesiones estructurales mayores como sección de la vía biliar principal, ligadura de colédoco o sección de ductos hepáticos segmentarios conforman las lesiones complejas núcleo de este estudio de reconstrucción biliar.",

                return base + "bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-900/30 dark:text-emerald-400 dark:border-emerald-800";

                                        <p class="text-2xl sm:text-3xl font-black">${ans}<span class="text-xs sm:text-sm text-slate-500">/${total}</span></p>
                                    </div>
                                    <div>
                                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Correctas</p>
                                        <p class="text-2xl sm:text-3xl font-black text-emerald-300">${correct}</p>
                                    </div>
                                    <div class="px-2">
                                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Rendimiento</p>
                                        <p class="text-2xl sm:text-3xl font-black text-yellow-300">${successRate}%</p>

                    <!-- TABLERO VISIBLE Y SCROLLABLE -->
                    <div class="bg-white dark:bg-slate-900 rounded-[2rem] shadow-sm border border-slate-200/60 dark:border-slate-800 p-6 md:p-8">
                        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                <svg class="w-5 h-5 text-pink-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                                Tablero General
                            </h2>
                            <div class="flex gap-4 text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"></div> Pendiente</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-emerald-100 dark:bg-emerald-900/40 border border-emerald-300 dark:border-emerald-800"></div> Correcta</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-rose-100 dark:bg-rose-900/40 border border-rose-300 dark:border-rose-800"></div> Incorrecta</div>
                            </div>
                        </div>
                        
                        <div class="grid gap-2 sm:gap-3 grid-cols-[repeat(auto-fill,minmax(42px,1fr))] sm:grid-cols-[repeat(auto-fill,minmax(48px,1fr))] p-1">
                            ${renderGridHTML(null)}
                        </div>
                    </div>

                    <!-- SIGUIENTE LINK -->
                    <div class="mt-4 pt-6 border-t border-slate-200 dark:border-slate-800 flex justify-end pb-8">
                        <a href="BS06308GYOE.html" class="bg-slate-800 dark:bg-slate-800 hover:bg-slate-900 dark:hover:bg-slate-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-colors flex items-center gap-2">
                            Siguiente EXAMEN 
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                </div>
            `;
        }

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-pink-50 dark:bg-pink-900/20 text-pink-600 dark:text-pink-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-pink-100 dark:border-pink-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-pink-50 has-[:checked]:border-pink-400 dark:has-[:checked]:bg-pink-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-pink-600 focus:ring-pink-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-pink-600 dark:hover:bg-pink-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-pink-600 to-rose-600 hover:from-rose-600 hover:to-pink-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('gyoAProgress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('gyoALastQId', currentQuestionId);
                else localStorage.removeItem('gyoALastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('gyoAProgress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>
