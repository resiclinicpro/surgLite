    <!-- MODAL REINICIAR -->
    <div id="reset-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-300">
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Reiniciar Examen</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 mb-6">Se borrará tu progreso actual. ¿Deseas continuar?</p>
            <div class="flex gap-3">
                <button id="cancel-reset" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Cancelar</button>
                <button id="confirm-reset" class="flex-1 py-2 bg-red-500 text-white rounded-lg text-sm font-bold hover:bg-red-600 transition-colors">Sí, Reiniciar</button>
            </div>
        </div>
    </div>

    <script>
        const questionsData = [
    {
        id: 1,
        question: "En la manometría esofágica de la Enfermedad por Reflujo Gastroesofágico, ¿cuál es el valor de presión basal media que define a un esfínter esofágico inferior mecánicamente defectuoso?",
        options: ["Mayor a 26 mmHg", "Entre 10 y 15 mmHg", "Menor a 6 mmHg", "Menor a 30 mmHg"],
        answer: 2,
        justification: "Justificación: El tono basal del esfínter esofágico inferior es el componente primordial de la barrera antirreflujo. De acuerdo al libro de Principios de Cirugía, un esfínter permanentemente defectuoso e incapaz de prevenir el reflujo retrógrado de ácido se caracteriza por una caída drástica de la presión en reposo, perdiendo la contención del gradiente toracoabdominal. Las cifras normales medias se sitúan cerca de 13.8 mmHg.<br><br>Perla Quirúrgica: Un esfínter mecánicamente defectuoso se identifica por tener... una presión promedio del esfínter esofágico inferior menor a 6 mmHg.<br><br>Análisis de Distractores: La opción A define el límite inferior para considerar un esfínter hipertenso (como en la acalasia). La opción B representa el rango normal de presión de un esfínter esofágico competente. La opción D hace referencia a los parámetros de falla de contracción del cuerpo esofágico (motilidad ineficaz), no al tono basal del esfínter anatómico.",
        source: "Capítulo 25. Esófago y hernia diafragmática, Evaluación de la función esofágica, Página 18."
    },
    {
        id: 2,
        question: "En la evaluación topográfica de la Enfermedad por Reflujo Gastroesofágico, ¿qué longitud intraabdominal se considera criterio de esfínter esofágico inferior permanentemente defectuoso?",
        options: ["Mayor a 5 cm", "Menor a 3.6 cm", "Mayor a 2 cm", "Menor a 1 cm"],
        answer: 3,
        justification: "Justificación: La resistencia esfinteriana depende de la exposición del segmento muscular a la presión intraabdominal positiva. Cuando el esfínter migra hacia el tórax o se acorta, pierde este soporte extrínseco. De acuerdo al libro de Principios de Cirugía, la reducción de esta longitud por debajo del percentil crítico anula la competencia del cardias, constituyendo la causa más frecuente de defecto esfinteriano.<br><br>Perla Quirúrgica: Un esfínter permanentemente defectuoso se define por... una longitud intraabdominal del esfínter menor a 1 cm.<br><br>Análisis de Distractores: La opción A refleja una envoltura excesiva posterior a una funduplicatura hipercorrectora. La opción B corresponde a la longitud global promedio de un esfínter normal, no al segmento abdominal crítico. La opción C es la longitud intraabdominal normal recomendada que previene la disfunción antirreflujo.",
        source: "Capítulo 25. Esófago y hernia diafragmática, Enfermedad por reflujo gastroesofágico, Página 32."
    },
    {
        id: 3,
        question: "En la historia natural de las hernias hiatales, ¿cuál es la alteración anatómica catastrófica que caracteriza a la etapa terminal o estadio final de los tipos I y II?",
        options: ["Migración exclusiva del cardias gástrico", "Rotación gástrica de 180 grados", "Herniación de colon transverso", "Formación de anillo de Schatzki"],
        answer: 1,
        justification: "Justificación: Las hernias hiatales progresan ensanchando progresivamente el anillo crural. En su etapa definitiva, logran que todo el estómago migre hacia el tórax torciéndose sobre su propio eje, lo que predispone a una urgencia quirúrgica por vólvulo y estrangulación. De acuerdo al libro de Principios de Cirugía, el estómago se vuelve intratorácico al fijarse los puntos cardial y pilórico.<br><br>Perla Quirúrgica: La etapa final de las hernias tipo I y tipo II ocurre cuando todo el estómago migra hacia el tórax girando 180 grados alrededor de su eje longitudinal.<br><br>Análisis de Distractores: La opción Aclara únicamente a la hernia hiatal por deslizamiento temprana (tipo I). La opción C clasifica estrictamente a la hernia hiatal tipo IV, donde otros órganos abdominales se incorporan al defecto. La opción D es una alteración mucosa submucosa anular que genera disfagia, pero no representa el colapso anatómico gástrico final.",
        source: "Capítulo 25. Esófago y hernia diafragmática, Hernias diafragmáticas gigantes, Página 55."
    },
    {
        id: 4,
        question: "En el abordaje diagnóstico de la Acalasia clásica mediante manometría esofágica de alta resolución, ¿cuál es el criterio de presión basal del esfínter esofágico inferior?",
        options: ["Mayor o igual a 26 mmHg", "Menor o igual a 6 mmHg", "Mayor o igual a 180 mmHg", "Menor a 10 mmHg"],
        answer: 0,
        justification: "Justificación: La patogenia principal de la acalasia radica en la falla inhibitoria mientérica, generando una contracción tónica incesante del esfínter que actúa como obstrucción funcional al tracto de salida. De acuerdo al libro de Principios de Cirugía, la hipertonía en reposo se define al sobrepasar el límite superior de presiones normales.<br><br>Perla Quirúrgica: Características manométricas de la acalasia: presión del esfínter esofágico inferior elevada mayor o igual a 26 mmHg.<br><br>Análisis de Distractores: La opción B diagnostica incompetencia esfinteriana asociada a reflujo grave. La opción C es el umbral para establecer esófago en cascanueces, evaluando el cuerpo y no el esfínter. La opción D es el objetivo terapéutico de presión posoperatoria para aliviar la disfagia tras una miotomía de Heller exitosa.",
        source: "Capítulo 25. Esófago y hernia diafragmática, Trastornos de motilidad, Página 70."
    },
    {
        id: 5,
        question: "En los trastornos primarios de motilidad, ¿qué amplitud peristáltica distal promedio se requiere para establecer el diagnóstico manométrico de Esófago en Cascanueces?",
        options: ["Menor a 30 mmHg", "Mayor o igual a 26 mmHg", "Mayor o igual a 180 mmHg", "Entre 100 y 150 mmHg"],
        answer: 2,
        justification: "Justificación: El síndrome clínico de esófago en cascanueces (\"nutcracker esophagus\") preserva la secuencia de peristalsis propagada normal, pero cursa con ondas contráctiles de intensidad patológica que originan dolor torácico severo. De acuerdo al libro de Principios de Cirugía, esta contracción hipertensiva se objetiva tras promediar múltiples degluciones de agua en la evaluación de alta resolución.<br><br>Perla Quirúrgica: Esófago en cascanueces: Amplitud peristáltica media en el esófago distal mayor o igual a 180 mmHg.<br><br>Análisis de Distractores: La opción A define a la motilidad esofágica ineficaz. La opción B corresponde al límite para considerar al esfínter inferior como hipertenso, no evaluando la amplitud de la onda propulsiva distal. La opción D refleja la amplitud de contracciones enclavas normales o levemente elevadas, sin cumplir el criterio diagnóstico mayor.",
        source: "Capítulo 25. Esófago y hernia diafragmática, Trastornos de motilidad, Página 70."
    },
    {
        id: 6,
        question: "En la vigilancia epidemiológica del Esófago de Barrett documentado, ¿cuántas veces se incrementa el riesgo futuro de desarrollar adenocarcinoma en comparación con la población sana?",
        options: ["Menos de 5 veces", "Más de 10 veces", "Más de 100 veces", "Más de 40 veces"],
        answer: 3,
        justification: "Justificación: La transformación epitelial del esófago distal confiere una inestabilidad genómica agresiva. Este riesgo es estadísticamente equivalente al que posee un fumador crónico pesado para desarrollar neoplasia pulmonar. De acuerdo al libro de Principios de Cirugía, el escrutnio endoscópico rutinario es imperativo ante esta escalada del riesgo oncológico.<br><br>Perla Quirúrgica: La detección del esófago de Barrett mediante endoscopia y biopsia aumenta el riesgo futuro de cáncer en más de 40 veces.<br><br>Análisis de Distractores: La opción A minimiza la gravedad de la lesión precancerosa. La opción B subestima la magnitud del riesgo relativo establecido por los consensos oncológicos. La opción C sobreestima estadísticamente la incidencia, ya que la acalasia y los cáusticos confieren un riesgo similar para carcinoma epidermoide, pero no alcanzan 100 veces en la población general para el adenocarcinoma.",
        source: "Capítulo 25. Esófago y hernia diafragmática, Puntos Clave, Página 11."
    },
    {
        id: 7,
        question: "Durante la exploración endoscópica sistemática de una hernia paraesofágica gigante sintomática, ¿qué lesión mucosa isquémica debe excluirse intencionadamente dentro del saco herniario?",
        options: ["Úlceras de Cameron", "Anillo de Schatzki", "Úlceras de Cushing", "Desgarro de Mallory-Weiss"],
        answer: 0,
        justification: "Justificación: El roce mecánico crónico y la microangiopatía isquémica provocada por la compresión del estómago incarcerado contra los pilares hiatales generan erosiones lineales insidiosas en la mucosa. Como se orienta de acuerdo a la GPC para descartar sangrado oculto, su localización intrasacular obliga a realizar maniobras de retroflexión. De acuerdo al libro de Principios de Cirugía, son la causa primaria de anemia asociada a hernias grandes.<br><br>Perla Quirúrgica: Cuando se observa una hernia paraesofágica, se presta especial atención a excluir úlceras gástricas (de Cameron) dentro de la bolsa.<br><br>Análisis de Distractores: La opción B es un pliegue fibroso distal asociado a hernia por deslizamiento, causante de impactación pero no de úlceras. La opción C corresponde a erosiones de estrés por neurotrauma e hipertensión intracraneal. La opción D ocurre secundario a vómitos de repetición induciendo estiramiento y laceración en la unión, no por defecto compresivo crónico.",
        source: "Capítulo 25. Esófago y hernia diafragmática, Evaluación de la función esofágica, Página 18."
    },
    {
        id: 8,
        question: "En el estudio histopatológico del Esófago de Barrett, ¿qué hallazgo microscópico es la característica distintiva patognomónica que confirma la metaplasia intestinal?",
        options: ["Infiltrado linfocítico denso", "Células caliciformes intestinales", "Hiperplasia de capa basal", "Células escamosas atípicas"],
        answer: 1,
        justification: "Justificación: El potencial preneoplásico de la enfermedad por reflujo se consolida cuando la mucosa de revestimiento altera su fenotipo y adquiere propiedades de barrera absortiva y secretora. De acuerdo al libro de Principios de Cirugía, la confirmación de la verdadera metaplasia 'especializada' descansa absolutamente en el hallazgo tintorial de mucina caliciforme.<br><br>Perla Quirúrgica: La característica distintiva de la metaplasia intestinal es la presencia de células caliciformes intestinales.<br><br>Análisis de Distractores: La opción A indica respuesta inmune inflamatoria crónica genérica. La opción C es el marcador histológico temprano de la esofagitis péptica por acidez prolongada, sin indicar metaplasia. La opción D representa cambios morfológicos que orientan hacia displasia o carcinoma epidermoide en mucosa proximal.",
        source: "Capítulo 25. Esófago y hernia diafragmática, Enfermedad por reflujo gastroesofágico, Página 51."
    },
    {
        id: 9,
        question: "En el protocolo manométrico de un paciente con disfagia, ¿qué porcentaje mínimo de contracciones simultáneas se requiere para diagnosticar el Espasmo Esofágico Difuso?",
        options: ["Mayor al 50 %", "Menor al 5 %", "Mayor al 20 %", "Exactamente 100 %"],
        answer: 2,
        justification: "Justificación: El espasmo difuso es una alteración motora primaria caracterizada por despolarización desordenada de la musculatura lisa del cuerpo esofágico. De acuerdo al libro de Principios de Cirugía, no todas las ondas son anómalas; la presencia de ondas peristálticas sanas intercaladas es lo que lo diferencia funcional y terapéuticamente de la acalasia.<br><br>Perla Quirúrgica: Espasmo esofágico difuso: contracciones simultáneas (not peristálticas) en más del 20 % de las degluciones húmedas.<br><br>Análisis de Distractores: La opción A excede el criterio diagnóstico establecido, requiriendo un porcentaje menor para iniciar tratamiento. La opción B representa fluctuaciones de baja relevancia clínica. La opción D corresponde al patrón motor de la acalasia clásica, donde se pierde absolutamente la peristalsis primaria.",
        source: "Capítulo 25. Esófago y hernia diafragmática, Trastornos de motilidad, Página 70."
    },
    {
        id: 10,
        question: "En el espectro de los trastornos motores, ¿qué amplitud máxima de la peristalsis esofágica define formalmente al trastorno de motilidad esofágica ineficaz?",
        options: ["Mayor a 26 mmHg", "Menor a 6 mmHg", "Mayor a 180 mmHg", "Menor a 30 mmHg"],
        answer: 3,
        justification: "Justificación: Una depuración o 'aclaramiento' esofágico ineficaz expone de forma crónica a la mucosa distal a la acidez, lo que agrava la lesión por reflujo. De acuerdo al libro de Principios de Cirugía, la presión contráctil que falla en empujar adecuadamente el bolo hacia el estómago establece el límite del trastorno ineficaz.<br><br>Perla Quirúrgica: Trastornos de motilidad ineficaz: amplitud disminuida o ausente de la peristalsis esofágica menor a 30 mmHg.<br><br>Análisis de Distractores: La opción A determina el umbral inferior diagnóstico para esfínter inferior hipertenso. La opción B evalúa incompetencia absoluta del esfínter basal, mas no la amplitud contráctil propulsiva. La opción C establece el extremo de hipercontractilidad que define al esófago en cascanueces.",
        source: "Capítulo 25. Esófago y hernia diafragmática, Trastornos de motilidad, Página 70."
    },
    {
        id: 11,
        question: "En el abordaje quirúrgico estandarizado para una hernia paraesofágica gigante sintomática, ¿cuál es la técnica operatoria primaria de elección actual?",
        options: ["Esofagectomía transhiatal radical", "Dilatación neumática fluoroscópica", "Reparación laparoscópica con funduplicatura", "Miotomía de Heller modificada"],
        answer: 2,
        justification: "Justificación: Las hernias que causan retención intratorácica masiva exigen corrección anatómica para prevenir vólvulo gástrico y estrangulación. La fijación del órgano al abdomen mediante un anclaje antirreflujo previene recaídas y resuelve complicaciones crónicas. De acuerdo al libro de Principios de Cirugía, la vía mínimamente invasiva es hoy en día el estándar de oro.<br><br>Perla Quirúrgica: La hernia hiatal gigante debe repararse... La reparación laparoscópica de la hernia con funduplicatura es el abordaje más común.<br><br>Análisis de Distractores: La opción A es un tratamiento extremo para displasia grave o invasión no resecable endoscópicamente, no para alteraciones de la continencia anatómica. La opción B está diseñada para distender esfínteres miopáticos cerrados (acalasia). La opción D secciona las fibras musculares circulares del esfínter inferior, lo cual agravaría una herniación existente.",
        source: "Capítulo 25. Esófago y hernia diafragmática, Puntos Clave, Página 11."
    },
    {

    {

        question: "En la endoscopia superior de un paciente con disfagia intermitente a sólidos, ¿en qué límite anatómico específico se forma clásicamente el anillo mucoso de Schatzki?",

    },
    {
        id: 16,

    {

    },
    {
        id: 18,
        question: "En la incidencia epidemiológica de los trastornos espásticos primarios, ¿cuál es la proporción de diagnóstico clínico del Espasmo Esofágico Difuso en relación con la Acalasia?",

    {

    },
    {
        id: 20,

        source: "Capítulo 25. Esófago y hernia diafragmática, Trastornos de motilidad, Página 55."
    },
    {
        id: 21,
        question: "En el seguimiento longitudinal de la metaplasia intestinal esofágica, ¿cuál es la tasa de incidencia anual estimada para la progresión hacia un adenocarcinoma invasivo?",

        source: "Capítulo 25. Esófago y hernia diafragmática, Complicaciones asociadas con la enfermedad por reflujo, Página 38."
    },
    {
        id: 22,
        question: "En la evaluación anatómica funcional de un esfínter esofágico inferior competente en sujetos sanos, ¿cuál es el valor promedio de la presión basal de reposo?",

        source: "Capítulo 25. Esófago y hernia diafragmática, Evaluación de la función, Tabla 25-1, Página 20."
    },
    {
        id: 23,
        question: "En la clasificación endoscópica de la unión esofagogástrica, ¿qué sistema de medición se emplea para graduar el deterioro estructural de la válvula antirreflujo mediante la maniobra de retroflexión?",

        source: "Capítulo 25. Esófago y hernia diafragmática, Evaluación de la función, Página 18."
    },
    {
        id: 24,
        question: "En el modelo mecánico fisiológico de la deglución y el vaciamiento faríngeo, ¿cuáles son las tres estructuras anatómicas que conforman las válvulas de contención del cilindro proximal?",
        options: ["Paladar blando, epiglotis y músculo cricofaríngeo", "Úvula, constrictor faríngeo medio y esfínter inferior", "Lengua, cartílago tiroides y constrictor superior", "Cuerdas vocales falsas, esfínter superior y valécula"],

        source: "Capítulo 25. Esófago y hernia diafragmática, Fisiología de la deglución, Página 14."
    },
    {
        id: 25,
        question: "En el diagnóstico clínico diferencial de los síndromes eméticos, ¿cuál es el mecanismo biofísico exacto responsable de originar el Síndrome de Mallory-Weiss?",
        options: ["Relajación incompleta esfinteriana con espasmo secundario distal", "Isquemia subepitelial aguda por estiramiento de hernias tipo III", "Aumento agudo de presión intraabdominal contra glotis cerrada", "Tracción fibrosa transmural por inflamación de ganglios mediastinales"],

        source: "Capítulo 25. Esófago y hernia diafragmática, Síndrome de Mallory-Weiss, Página 78."
    },
    {
        id: 26,
        question: "En la esclerodermia sistémica severa con esofagitis refractaria al tratamiento médico, ¿cuál es la técnica quirúrgica de elección para evitar empeorar la disfagia aperistáltica?",
        options: ["Funduplicatura total de Nissen laparoscópica", "Resección de la unión esofagogástrica con ascenso gástrico total", "Dilatación neumática repetida con abordaje fluoroscópico", "Funduplicatura parcial anterior o posterior laparoscópica"],

        source: "Capítulo 25. Esófago y hernia diafragmática, Trastornos secundarios, Página 76."
    },
    {
        id: 27,

        answer: 1,
        justification: "Justificación: El proóstico de supervivencia y estenosis tardía depende de la profundidad de necrosis en las mucosas orofaríngea, esofágica y gástrica. Se precisa inspección visual directa urgente sin sobreinsuflación para mapear las quemaduras y guiar el manejo. Esta premisa se consolida de acuerdo al libro de Principios de Cirugía para toda causticación antes de la aparición de tejido de granulación friable.<br><br>Perla Quirúrgica: Algoritmo: Ingestión de agente cáustico -> Esofagoscopia (Dentro de las primeras 12 horas).<br><br>Análisis de Distractores: La opción A oscurece permanentemente la visión de un futuro abordaje endoscópico, arriesgando además broncoaspiración o fuga mediastínica por perforación aguda. La opción C se indica empíricamente sólo ante perforación franca clínica. La opción D carece de utilidad en el evento agudo corrosivo, pues el dolor y el espasmo reactivo invalidarían cualquier trazo fisiológico.",
        source: "Capítulo 25. Esófago y hernia diafragmática, Lesión cáustica, Algoritmo 25-78, Página 118."
    },
    {

        options: ["Crecimiento neoplásico que abarque 40 % de la circunferencia esofágica", "Parálisis del nervio laríngeo recurrente o fístula broncoesofágica", "Disfagia intermitente para alimentos sólidos secos", "Ausencia total de ganglios periesofágicos aumentados de tamaño"],

        justification: "Justificación: La curabilidad quirúrgica del carcinoma esofágico exige resección con bordes libres (R0). Cuando el tumor penetra la adventicia e infiltra el árbol traqueobronquial o las vainas nerviosas mayores locales (ronquera, aspiración), la ventana de rescate se ha cerrado biológicamente. La futilidad de una disección agresiva se dictamina de acuerdo al libro de Principios de Cirugía basándose en una morbilidad prohibitiva y nula sobrevida.<br><br>Perla Quirúrgica: Algoritmo de Estadificación Clínica: Paliación si hay parálisis del nervio recurrente, síndrome de Horner, formación de fístula o derrame pleural maligno.<br><br>Análisis de Distractores: La opción A describe un tumor que, aunque es oclusivo focal, sigue considerándose confinado y técnicamente manejable con terapia neoadyuvante inicial. La opción C es el dato pivote más precoz de oclusión luminal que exige etapificación, no el criterio de exclusión. La opción D denota un tumor local temprano favorable para intento curativo quirúrgico con esofagectomía.",

    {

        options: ["Disfagia progresiva secundaria a crecimiento tumoral escamoso intraepitelial", "Alivio sostenido e inmediato del dolor tras la dilatación neumática del esfínter", "Falta de respuesta terapéutica al ensayo clínico con inhibidores de bomba de protones", "Resolución permanente de las quejas tras una funduplicatura parcial de Toupet"],

    {

        justification: "Justificación: El proceso inmunoalérgico mural engrosa y vuelve inelástica la submucosa, formando anillos traquealizados rígidos ('esófago felino'). El paso de bujías sobre un diámetro inelástico propicia disrupciones incontrolables del tubo digestivo. Los cirujanos deben evitar ser agresivos empíricamente y limitar sus fuerzas, guiados por precauciones severas de acuerdo al libro de Principios de Cirugía sobre su fragilidad tisular.<br><br>Perla Quirúrgica: Se debe tener gran cuidado, ya que la mucosa se desgarra fácilmente y se ha informado de perforación esofágica (laceración de espesor total) con la dilatación.<br><br>Análisis de Distractores: La opción A sugiere una destrucción funcional intencional típica del post-operatorio temprano de dilataciones fallidas. La opción B advierte sobre la injuria endoscópica en hipertensión portal descompensada no advertida, carente de asociación con el depósito eosinofílico. La opción D ocurre secundario a defectos estructurales primarios de los pilares crurales ensanchados (hernias tipo III gigantes).",

    {

    {

        question: "En un paciente cursando con patología en los músculos estriados cervicales primarios por asimetría obstructiva en la relajación del cricofaríngeo superior, ¿cuál es la complicación evitable típica de estas altas presiones de tracción y falla mecánica?",

            menuToggle.addEventListener('click', () => {
                if (window.innerWidth >= 1024) {
                    sidebar.classList.toggle('lg:translate-x-0');
                    mainContent.classList.toggle('lg:ml-80');
                    
                    // Reposicionar el botón del tablero dependiendo de si el sidebar está abierto
                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    sidebar.classList.toggle('-translate-x-full');
                    overlay.classList.toggle('hidden');
                }
            });
            
            overlay.addEventListener('click', () => {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            });

            document.getElementById('dark-mode-toggle').addEventListener('click', toggleDarkMode);
        }

        // Navegar a pregunta anterior
        function goToPreviousQuestion(currentId) {
            const currentIndex = questionsData.findIndex(q => q.id === currentId);
            if (currentIndex > 0) {
                displayQuestion(questionsData[currentIndex - 1].id);
            } else {
                displayQuestion(null);
            }
        }

        function getQBoxClass(qId, isActive) {
            let base = "q-box-item flex items-center justify-center aspect-square rounded-md font-bold text-sm cursor-pointer transition-all select-none border ";
            
            if (isActive) base += "ring-4 ring-blue-500 shadow-md z-10 border-blue-500 dark:border-blue-400 ";

            const state = userProgress[qId];
            if (!state || !state.answered) {
                return base + "bg-slate-100 text-slate-500 border-slate-200 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-400 dark:border-slate-700 dark:hover:bg-slate-700";
            } else if (state.isCorrect) {
                return base + "bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-900/30 dark:text-emerald-400 dark:border-emerald-800";
            } else {
                return base + "bg-rose-100 text-rose-700 border-rose-300 dark:bg-rose-900/30 dark:text-rose-400 dark:border-rose-800";
            }
        }

        function renderGridHTML(isActiveIdContext = null) {
            return questionsData.map(q => 
                `<div class="${getQBoxClass(q.id, q.id === isActiveIdContext)}" data-id="${q.id}" onclick="displayQuestion(${q.id})">${q.id}</div>`
            ).join('');
        }

        function renderSidebarGrid() {
            document.getElementById('sidebar-q-grid').innerHTML = renderGridHTML(currentQuestionId);
        }

        // --- PANTALLAS ---

        function displayWelcomeScreen() {
            // Ocultar botones flotantes en la pantalla de inicio
            document.getElementById('dashboard-button').classList.add('hidden');
            document.getElementById('menu-toggle').classList.add('hidden');
            
            const displayArea = document.getElementById('module-display');
            const total = questionsData.length;
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const correct = Object.keys(userProgress).filter(id => userProgress[id].isCorrect).length;
            const successRate = total > 0 && ans > 0 ? Math.round((correct / ans) * 100) : 0;
            const isAllCompleted = ans === total && total > 0;
            
            let firstUncompletedId = questionsData.find(q => !userProgress[q.id]?.answered)?.id;
            
            let actionBtn = isAllCompleted 
                ? `<button onclick="document.getElementById('reset-modal').classList.remove('hidden')" class="w-full md:w-auto bg-white/20 hover:bg-white/30 text-white border border-white/30 px-8 py-3 rounded-xl font-bold transition-colors shadow-sm">Reiniciar Examen</button>`
                : `<button onclick="displayQuestion(${firstUncompletedId})" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-blue-600 hover:to-cyan-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-blue-900/30 transition-transform hover:-translate-y-0.5">Continuar Aprendiendo</button>`;

            // Lógica para cambiar a estado de finalizado
            let blur1 = isAllCompleted ? "bg-emerald-500/30" : "bg-cyan-900/40";
            let blur2 = isAllCompleted ? "bg-teal-500/30" : "bg-cyan-900/30";
            let badgeText = isAllCompleted ? "¡100% Completado! Schwartz" : "Schwartz";
            let badgeClass = isAllCompleted ? "bg-emerald-500/20 border-emerald-500/30 text-emerald-300" : "bg-white/10 border-white/10 text-white";
            let titleText = isAllCompleted ? "¡Examen Finalizado!" : "Esófago y hernia diafragmática";
            let descText = isAllCompleted 
                ? "Has completado con éxito todas las preguntas. Revisa tus respuestas correctas/incorrectas en el tablero." 
                : "Capítulo 25. Esófago y hernia diafragmática";

            displayArea.innerHTML = `
                <div class="flex flex-col gap-6 max-w-6xl mx-auto lg:mt-0">
                    
                    <!-- BREADCRUMB (Centrado en móvil, no hay botones flotantes interrumpiendo) -->
                    <div class="flex justify-center sm:justify-start items-center mb-1 mt-4 lg:mt-0">
                        <a href="login.html" class="inline-flex items-center gap-2 text-slate-500 hover:text-blue-600 dark:text-slate-400 dark:hover:text-blue-400 font-semibold transition-colors text-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                            </svg>
                            Regresar al Panel
                        </a>
                    </div>

                    <!-- HERO DYNAMIC -->
                    <div class="relative bg-slate-900 dark:bg-slate-950 rounded-[2rem] p-8 md:p-12 shadow-xl text-white overflow-hidden border border-slate-800 transition-colors duration-500 ${isAllCompleted ? 'ring-2 ring-emerald-500/50' : ''}">
                        <div class="absolute top-0 right-0 w-64 h-64 ${blur1} rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none transition-colors duration-500"></div>
                        <div class="absolute bottom-0 left-0 w-48 h-48 ${blur2} rounded-full blur-3xl -ml-10 -mb-10 pointer-events-none transition-colors duration-500"></div>
                        
                        <div class="relative z-10 flex flex-col lg:flex-row justify-between items-center gap-8">
                            <div class="text-center lg:text-left">
                                <span class="inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest mb-4 border ${badgeClass} transition-colors duration-500">
                                    ${badgeText}
                                </span>
                                <h1 class="text-3xl md:text-4xl lg:text-4xl font-extrabold tracking-tight mb-3 transition-colors duration-500 ${isAllCompleted ? 'text-emerald-400 drop-shadow-md' : ''}">${titleText}</h1>
                                <p class="text-slate-300 text-base md:text-lg font-medium max-w-lg mx-auto lg:mx-0 transition-colors duration-500">${descText}</p>
                                
                                <div class="mt-8 flex justify-center lg:justify-start">
                                    ${actionBtn}
                                </div>
                            </div>
                            
                            <!-- Tarjeta de Estadísticas Modificada -->
                            <div class="flex-shrink-0 bg-slate-800/50 backdrop-blur-md border border-slate-700/50 rounded-2xl p-6 flex flex-col sm:flex-row items-center shadow-2xl w-full lg:max-w-md">
                                <div class="grid grid-cols-3 gap-2 sm:gap-4 divide-x divide-white/20 w-full text-center">
                                    <div>
                                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Respondidas</p>
                                        <p class="text-2xl sm:text-3xl font-black">${ans}<span class="text-xs sm:text-sm text-slate-500">/${total}</span></p>
                                    </div>
                                    <div>
                                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Correctas</p>
                                        <p class="text-2xl sm:text-3xl font-black text-emerald-300">${correct}</p>
                                    </div>
                                    <div class="px-2">
                                        <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-1">Rendimiento</p>
                                        <p class="text-2xl sm:text-3xl font-black text-yellow-300">${successRate}%</p>
                                        <p class="text-[8px] text-slate-400 mt-1 leading-tight">Aciertos vs Respondidas</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TABLERO VISIBLE Y SCROLLABLE -->
                    <div class="bg-white dark:bg-slate-900 rounded-[2rem] shadow-sm border border-slate-200/60 dark:border-slate-800 p-6 md:p-8">
                        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                <svg class="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                                Tablero General
                            </h2>
                            <div class="flex gap-4 text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"></div> Pendiente</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-emerald-100 dark:bg-emerald-900/40 border border-emerald-300 dark:border-emerald-800"></div> Correcta</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-rose-100 dark:bg-rose-900/40 border border-rose-300 dark:border-rose-800"></div> Incorrecta</div>
                            </div>
                        </div>
                        
                        <div class="grid gap-2 sm:gap-3 grid-cols-[repeat(auto-fill,minmax(42px,1fr))] sm:grid-cols-[repeat(auto-fill,minmax(48px,1fr))] p-1">
                            ${renderGridHTML(null)}
                        </div>
                    </div>

                    <!-- SIGUIENTE LINK -->
                    <div class="mt-4 pt-6 border-t border-slate-200 dark:border-slate-800 flex justify-end pb-8">
                        <a href="login.html" class="bg-slate-800 dark:bg-slate-800 hover:bg-slate-900 dark:hover:bg-slate-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-colors flex items-center gap-2">
                            Siguiente EXAMEN 
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                </div>
            `;
        }

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-blue-100 dark:border-blue-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-blue-600 dark:hover:bg-blue-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-cyan-600 hover:to-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('hiatoschartrsProgress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('hiatoschartrsLastQId', currentQuestionId);
                else localStorage.removeItem('hiatoschartrsLastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('hiatoschartrsProgress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>

</body>
</html>
