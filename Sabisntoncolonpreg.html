                <button id="confirm-reset" class="flex-1 py-2 bg-red-500 text-white rounded-lg text-sm font-bold hover:bg-red-600 transition-colors">Sí, Reiniciar</button>
            </div>

    <script>
        const questionsData = [

    {
        id: 1,
        question: "¿Qué estructura nerviosa autonómica se lesiona con mayor frecuencia al realizar la ligadura alta de la arteria mesentérica inferior, provocando disfunción simpática manifestada como eyaculación retrógrada?",
        options: ["Plexo hipogástrico superior", "Plexo periprostático", "Nervios erigentes", "Plexo sacro inferior"],
        answer: 0,
        justification: "Justificación: De acuerdo al libro de 52 Colon y Recto, la inervación simpática del recto deriva de los nervios que salen a nivel de L1-L3 y forman el plexo hipogástrico superior, el cual se divide cerca del promontorio sacro. La ligadura alta de la arteria mesentérica inferior puede lesionar este plexo y originar disfunción sexual simpática en el hombre.<br><br>Perla Quirúrgica: Una ligadura alta de la arteria mesentérica inferior que lesione el plexo hipogástrico superior o seccione los nervios hipogástricos cerca del promontorio sacro puede resultar en disfunción simpática caracterizada por eyaculación retrógrada en los hombres.<br><br>Análisis de Distractores: El plexo periprostático (B) y los nervios erigentes (C) (plexo pélvico) proporcionan inervación parasimpática; su lesión causa disfunción eréctil o vejiga atónica, pero se lesionan típicamente en la disección anterior o lateral baja. El plexo sacro inferior (D) es un término anatómico impreciso en este contexto de lesión vascular alta.",
        source: "52 Colon y Recto, Anatomy of the Colon, Rectum, and Pelvic Floor, Página 17."
    },
    {
        id: 2,
        question: "En un paciente con falla renal crónica que mantiene concentraciones séricas normales de potasio, ¿qué hormona promueve la secreción colónica compensatoria de este ion?",
        options: ["Renina", "Vasopresina", "Aldosterona", "Angiotensina II"],
        answer: 2,
        justification: "Justificación: De acuerdo al libro de 52 Colon y Recto, el colon tiene un papel fisiológico crucial en la secreción de potasio frente a estados de retención. Los pacientes urémicos compensan la falta de filtración renal con un aumento de la secreción colónica mediada específicamente por la aldosterona.<br><br>Perla Quirúrgica: La aldosterona promueve la secreción colónica de potasio, y este efecto es bloqueado por la espironolactona.<br><br>Análisis de Distractores: La vasopresina (B) regula la reabsorción de agua libre en los conductos colectores renales, no la secreción de potasio en el colon. La renina (A) y la angiotensina II (D) son pasos previos en el eje neurohumoral, pero la hormona efectora final sobre los canales epiteliales de potasio colónicos es la aldosterona.",
        source: "52 Colon y Recto, Physiology of the Colon (Secretion), Página 20."
    },
    {
        id: 3,
        question: "¿Cuál es la evidencia actual respecto al beneficio del uso rutinario de antibióticos en pacientes con diverticulitis aguda no complicada manejados de forma ambulatoria?",
        options: ["Aceleran el tiempo de recuperación", "No han demostrado acelerar la recuperación", "Previenen la necesidad de cirugía", "Disminuyen el riesgo de abscesos"],
        answer: 1,
        justification: "Justificación: De acuerdo al libro de 52 Colon y Recto, el tratamiento contemporáneo de la diverticulitis no complicada se basa en analgésicos y modificación dietética transitoria. Múltiples metaanálisis han cuestionado el dogma del uso rutinario de antimicrobianos al no encontrar ventajas clínicas.<br><br>Perla Quirúrgica: Una revisión sistemática y metaanálisis que evaluó el efecto de la administración de antibióticos en pacientes con diverticulitis no complicada no ha demostrado que el uso de antibióticos acierte la recuperación o prevenga complicaciones o cirugías subsecuentes.<br><br>Análisis de Distractores: Los estudios no evidencian que los antibióticos acorten la sintomatología o recuperación (A), eviten que progrese a un absceso o complicación (D) ni que alteren la tasa de intervención quirúrgica a futuro (C) en la enfermedad no complicada.",
        source: "52 Colon y Recto, Diverticular Disease (Uncomplicated Diverticulitis), Página 54."
    },
    {
        id: 4,
        question: "¿Cuál es el tratamiento inicial de elección para un paciente que se presenta con obstrucción en asa cerrada por un vólvulo sigmoideo sin datos clínicos de peritonitis ni isquemia?",
        options: ["Resección sigmoidea con anastomosis primaria", "Procedimiento de Hartmann de urgencia", "Cecostomía con tubo descompresivo", "Descompresión endoscópica con sonda rectal"],
        answer: 3,
        justification: "Justificación: De acuerdo al libro de 52 Colon y Recto, el vólvulo sigmoideo representa una obstrucción en asa cerrada que puede causar compromiso vascular rápido. Si el paciente se encuentra estable y sin signos peritoneales, la descompresión endoscópica detorsiona el segmento afectado de forma inmediata y permite planear una cirugía electiva.<br><br>Perla Quirúrgica: En pacientes con vólvulo sigmoideo, la descompresión endoscópica a menudo es exitosa utilizando un sigmoidoscopio rígido o flexible con la colocación de un tubo rectal proximal al punto de torsión.<br><br>Análisis de Distractores: La resección primaria (A) o el procedimiento de Hartmann (B) se reservan para cuando la descompresión endoscópica falla, o si hay evidencia de necrosis/perforación. La cecostomía (C) no tiene utilidad en la obstrucción distal por vólvulo sigmoideo.",
        source: "52 Colon y Recto, Large Bowel Obstruction (Treatment), Página 64."
    },
    {
        id: 5,
        question: "En el síndrome de Ogilvie (pseudoobstrucción colónica aguda), ¿a partir de qué diámetro cecal se considera un signo inminente de isquemia colónica o perforación que requiere intervención?",
        options: ["≥ 12 cm", "≥ 10 cm", "≥ 8 cm", "≥ 6 cm"],
        answer: 0,
        justification: "Justificación: De acuerdo al libro de 52 Colon y Recto, la pseudoobstrucción cursa con una dilatación masiva del marco colónico por un disbalance autonómico. La tensión sobre la pared cecal compromete la perfusión microvascular cuando el diámetro supera los 12 cm.<br><br>Perla Quirúrgica: La sensibilidad abdominal, leucocitosis, fiebre y dilatación cecal de más de 12 cm son signos que pueden ser indicativos de isquemia colónica, perforación o perforación inminente.<br><br>Análisis de Distractores: Diámetros de 6, 8 o 10 cm (B, C, D) representan ectasia o dilatación patológica, pero el valor de corte crítico y universal para riesgo máximo de ruptura cecal en la pseudoobstrucción es de 12 cm.",
        source: "52 Colon y Recto, Colonic Pseudo-Obstruction (Diagnosis), Página 69."
    },
    {
        id: 6,
        question: "¿Cuál es el fármaco y posología de primera línea indicado para el tratamiento de un primer episodio de infección por Clostridium difficile de severidad no fulminante?",
        options: ["Fidaxomicina oral 200 mg cada 12 horas", "Vancomicina oral 125 mg cada 6 horas", "Metronidazol intravenoso 500 mg cada 8 horas", "Rifaximina oral 400 mg cada 12 horas"],
        answer: 1,
        justification: "Justificación: De acuerdo al libro de 52 Colon y Recto, las guías actuales priorizan la terapia dirigida a la luz colónica con mínima absorción sistémica. La vancomicina oral ha reemplazado al metronidazol como primera línea debido a mejores tasas de curación y menor recurrencia.<br><br>Perla Quirúrgica: Tratamiento para el primer episodio: 1. Vancomicina oral 125 mg 4 veces al día O 2. Fidaxomicina 200 mg dos veces al día por 10 días.<br><br>Análisis de Distractores: La fidaxomicina (A) es una opción válida, pero la vancomicina oral (B) es el estándar clásico de primera línea listado como opción primordial. El metronidazol intravenoso (C) es adyuvante solo en enfermedad fulminante con íleo. La rifaximina (D) se usa en recurrencias crónicas, no como terapia de primera línea.",
        source: "52 Colon y Recto, Infectious Colitis (Table 52.4), Página 110."
    },
    {
        id: 7,
        question: "¿Qué alteración molecular específica caracteriza a la vía supresora de inestabilidad cromosómica responsable del síndrome de poliposis adenomatosa familiar (FAP)?",
        options: ["Mutación del gen BRAF", "Inactivación del gen TP53", "Mutación del oncogén KRAS", "Mutación del gen APC"],
        answer: 3,
        justification: "Justificación: De acuerdo al libro de 52 Colon y Recto, la carcinogénesis colorrectal sigue vías distintas. El síndrome clásico de poliposis adenomatosa familiar es impulsado por la alteración germinal del gen APC, el evento iniciador en la vía de inestabilidad cromosómica.<br><br>Perla Quirúrgica: Los eventos moleculares involucrados incluyen mutaciones tempranas del gen APC (adenomatous polyposis coli), mutaciones activadoras subsecuentes en el oncogén KRAS, así como mutaciones resultando en la inactivación del gen supresor tumoral TP53.<br><br>Análisis de Distractores: Las mutaciones de KRAS (C) y la inactivación de TP53 (B) ocurren como pasos tardíos en la misma vía, no como el evento germinal fundacional del síndrome. Las mutaciones de BRAF (A) están típicamente asociadas a la vía de pólipos aserrados, no a la poliposis clásica.",
        source: "52 Colon y Recto, Neoplasia (Genetics), Página 124."
    },
    {
        id: 8,
        question: "¿Qué criterio tumoral anatómico es un requisito estricto para considerar la escisión local transanal en el abordaje quirúrgico de un adenocarcinoma de recto temprano?",
        options: ["Tamaño tumoral < 3 cm", "Invasión a la muscularis propia", "Afección > 50% de la circunferencia", "Presencia de invasión linfovascular"],
        answer: 0,
        justification: "Justificación: De acuerdo al libro de 52 Colon y Recto, la preservación radical de órgano sin linfadenectomía (escisión local) exige tumores con riesgo mínimo de metástasis ganglionares. El tumor debe ser pequeño y móvil.<br><br>Perla Quirúrgica: Criterios para la Exéresis Local de Neoplasia Rectal: Características del Tumor: T0 o T1, < 3 cm de diámetro, < 30% de la circunferencia del lumen, Móvil a la exploración, cN0 en la imagen de etapificación.<br><br>Análisis de Distractores: La invasión a la muscularis propia (B) es contraindicación para la técnica estándar. La afección circunferencial debe ser menor al 30% (C es un exceso). La invasión linfovascular (D) es un hallazgo histopatológico de alto riesgo que contraindica la escisión local por su alta asociación con afección ganglionar.",
        source: "52 Colon y Recto, Rectal Cancer (Local Excision, Box 1), Página 392."
    },
    {
        id: 9,
        question: "En el tratamiento de la fisura anal mediante denervación química con toxina botulínica tipo A, ¿en qué sitio anatómico específico se infiltra el medicamento?",
        options: ["En la base de la hemorroide centinela", "En el lecho cruento de la úlcera mucosa", "En el surco interesfintérico", "En el margen anal externo subcutáneo"],
        answer: 2,
        justification: "Justificación: De acuerdo al libro de Management of Fissure-In-Ano, el objetivo de la toxina es paralizar temporalmente el músculo esfínter anal interno para romper el espasmo y mejorar el flujo sanguíneo. Para lograrlo anatómicamente, se dirige la aguja a través del surco interesfintérico.<br><br>Perla Quirúrgica: Se inyectan dosis divididas en el surco interesfintérico dirigidas hacia el esfínter anal interno (IAS) en cuatro cuadrantes.<br><br>Análisis de Distractores: La base de la hemorroide centinela (A) y el lecho de la úlcera (B) son tejidos inflamados y fibróticos, no tejido muscular liso diana. El tejido subcutáneo del margen anal externo (D) dispersaría el fármaco sin efecto sobre el esfínter interno.",
        source: "Management of Fissure-In-Ano, Chemical Denervation, Página 291."
    },
    {
        id: 10,
        question: "Según la anatomía de los espacios anorrectales, ¿qué estructura ligamentaria divide el espacio postanal en los compartimentos superficial y profundo?",
        options: ["Músculo puborrectal", "Fascia de Waldeyer", "Músculo esfínter externo", "Ligamento anococcígeo"],
        answer: 3,
        justification: "Justificación: De acuerdo al libro de Management of Anorectal Abscess and Fistula, la diseminación de la sepsis ocurre a través de planos de menor resistencia. El espacio postanal (común en abscesos en herradura) está biseccionado por tejido fibroso que une el ano al cóccix.<br><br>Perla Quirúrgica: El espacio postanal se divide en los espacios postanal superficial y profundo por la presencia del ligamento anococcígeo.<br><br>Análisis de Distractores: El músculo puborrectal (A) forma el anillo anorrectal superior. La fascia de Waldeyer (B) se sitúa más cefálica en el compartimento retrorectal profundo. El esfínter externo (C) marca el límite caudal del espacio profundo, pero no lo divide directamente en estos subcompartimentos.",
        source: "Management of Anorectal Abscess and Fistula, Anorectal Abscess (Etiology), Página 245."
    },
    {
        id: 11,
        question: "De acuerdo con la regla de Goodsall en la fístula perianal, si un orificio fistuloso externo se localiza anterior a la línea transversal del ano, ¿cuál es el trayecto predecible hacia la cripta infectada?",
        options: ["Curvo hacia la línea media posterior", "Recto y radial hacia el orificio interno", "Curvo hacia la línea media anterior", "En herradura hacia el lado contralateral"],
        answer: 1,
        justification: "Justificación: De acuerdo al libro de Management of Anorectal Abscess and Fistula, la regla anatómica predice que las fístulas anteriores drenan directamente al canal anal más cercano, mientras que las posteriores trazan trayectos curvos hacia la cripta de la línea media posterior.<br><br>Perla Quirúrgica: La regla de Goodsall predice que un orificio externo posterior a una línea transversal a través del ano drena a un orificio interno en la línea media posterior, mientras que aquellos que se abren anterior a la línea tienen cursos cortos y radiales hacia el orificio interno.<br><br>Análisis de Distractores: Los trayectos curvos hacia la línea media posterior (A) corresponden a fístulas con orificio externo posterior. El trayecto en herradura (D) ocurre en procesos complejos posteriores. Un trayecto curvo anterior (C) no sigue el patrón clásico de Goodsall.",
        source: "Management of Anorectal Abscess and Fistula, Fistula-in-Ano (Diagnosis), Página 269."
    },
    {
        id: 12,
        question: "En la evaluación proctológica, ¿qué hallazgo clínico patognomónico define a las hemorroides internas de grado 3?",
        options: ["Prolapso que reduce espontáneamente", "Sangrado sin protrusión de tejido", "Prolapso que requiere reducción manual", "Prolapso encarcerado irreductible"],
        answer: 2,

        question: "En el esquema actual modificado para el manejo de curación con preservación del esfínter en el cáncer de células escamosas del canal anal, ¿cuál es la dosis de radiación pélvica mínima que se administra en concurrencia con la quimioterapia?",

        justification: "Justificación: De acuerdo al libro de Management of Tumors of the Anal Region, el epitelio y tejido glandular subyacente que reviste fístulas perpetuadas a lo largo de los años en procesos transmurales autoinmunes sufre una transición neoplásica hacia la morfología de glándulas mucinosas penetrantes.<br><br>Perla Quirúrgica: El tipo de glándula del canal anal tiende a estar asociado con tractos de fístula anal crónica que se ven con mayor frecuencia en pacientes con la enfermedad de Crohn.<br><br>Análisis de Distractores: El melanoma (A) es un tumor agresivo derivado de melanocitos distales, no de inflamación supurativa crónica. El Sarcoma de Kaposi (C) es una entidad definitoria de SIDA y coinfección por HHV-8. Los GIST (D) surgen de las células de Cajal del mesénquima, sin relación etiológica directa con las fístulas.",

    {

        answer: 1,

    {

        options: ["Radiación previa a la región pélvica de 50 Gy", "Edad biológica del paciente mayor a 65 años", "Presencia de atrofia muscular o neuropatía motora", "Historial repetido de cirugía anorrectal fallida"],

                        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                <svg class="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                                Tablero General
                            </h2>
                            <div class="flex gap-4 text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"></div> Pendiente</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-emerald-100 dark:bg-emerald-900/40 border border-emerald-300 dark:border-emerald-800"></div> Correcta</div>
                                <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-rose-100 dark:bg-rose-900/40 border border-rose-300 dark:border-rose-800"></div> Incorrecta</div>
                            </div>
                        </div>
                        
                        <div class="grid gap-2 sm:gap-3 grid-cols-[repeat(auto-fill,minmax(42px,1fr))] sm:grid-cols-[repeat(auto-fill,minmax(48px,1fr))] p-1">
                            ${renderGridHTML(null)}
                        </div>
                    </div>

                    <!-- SIGUIENTE LINK -->
                    <div class="mt-4 pt-6 border-t border-slate-200 dark:border-slate-800 flex justify-end pb-8">
                        <a href="LINKI.html" class="bg-slate-800 dark:bg-slate-800 hover:bg-slate-900 dark:hover:bg-slate-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-colors flex items-center gap-2">
                            Siguiente EXAMEN 
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                </div>
            `;
        }

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-blue-100 dark:border-blue-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-400 dark:has-[:checked]:bg-blue-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-blue-600 dark:hover:bg-blue-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-cyan-600 hover:to-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('colonyrectocamerunpregProgress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('colonyrectocamerunpregLastQId', currentQuestionId);
                else localStorage.removeItem('colonyrectocamerunpregLastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('colonyrectocamerunpregProgress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>

</body>
</html>
