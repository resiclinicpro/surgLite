        const questionsData = [

    {
        id: 1, 
        question: "De acuerdo a la GPC, en Hernia Inguinal, ¿cuál es el riesgo estimado de presentar esta patología a lo largo de la vida en hombres y mujeres, respectivamente?", 
        options: ["27% y 3%", "15% y 5%", "40% y 10%", "50% y 15%"], 
        answer: 0, 
        justification: "Justificación: El riesgo a lo largo de la vida de desarrollar una hernia inguinal difiere ampliamente entre géneros debido a factores anatómicos de la pelvis. De acuerdo al libro de Schwartz Principios de Cirugía, la debilidad inherente de la ingle masculina resulta en que el 27% de los hombres la presentará en su vida frente a solo el 3% de las mujeres, justificando que el 90% de las cirugías se realicen en varones.<br><br>Perla Quirúrgica: Aproximadamente el 75% de las hernias de la pared abdominal ocurren en la ingle. De las reparaciones de hernia inguinal, el 90% se realizan en hombres y el 10% en mujeres. Se piensa que esto se debe a que el riesgo de hernia inguinal a lo largo de la vida es del 27% en hombres y del 3% en mujeres.<br><br>Análisis de Distractores: Las opciones B, C y D proponen cifras estimadas de prevalencia incorrectas que no corresponden con la epidemiología documentada en los textos de referencia.", 
        source: "Schwartz's Principles of Surgery, 11e, 2019, Capítulo 37: Hernias Inguinales, Página 3." 
    },
    {
        id: 2, 
        question: "De acuerdo a la GPC, en Hernia Inguinal, ¿cuál es la longitud promedio aproximada del conducto inguinal en un paciente adulto?", 
        options: ["2 a 3 cm", "4 a 6 cm", "8 a 10 cm", "11 a 12 cm"], 
        answer: 1, 
        justification: "Justificación: El conducto inguinal es un espacio que conecta la cavidad peritoneal con el exterior de la cavidad abdominal. De acuerdo al libro de Schwartz Principios de Cirugía, su trayecto se extiende en sentido oblicuo por una longitud de 4 a 6 cm, albergando el cordón espermático en el hombre o el ligamento redondo en la mujer.<br><br>Perla Quirúrgica: El conducto inguinal es una región con forma de cono de aproximadamente 4 a 6 cm de largo situada en la porción anterior de la pelvis.<br><br>Análisis de Distractores: Las opciones A, C y D sugieren longitudes que subestiman o sobreestiman significativamente las dimensiones anatómicas normales de este trayecto en la población adulta.", 
        source: "Schwartz's Principles of Surgery, 11e, 2019, Capítulo 37: Hernias Inguinales, Página 3." 
    },
    {
        id: 3, 
        question: "De acuerdo a la GPC, en Hernia Inguinal, ¿qué estructura anatómica constituye el límite anterior del conducto inguinal?", 
        options: ["Fascia transversalis", "Músculo oblicuo interno", "Aponeurosis del oblicuo externo", "Ligamento inguinal"], 
        answer: 2, 
        justification: "Justificación: La anatomía del conducto inguinal se define por límites precisos en sus cuatro paredes. De acuerdo al libro de Schwartz Principios de Cirugía, la aponeurosis del músculo oblicuo externo forma la pared anterior en toda su extensión, proporcionando la principal cobertura superficial a este espacio.<br><br>Perla Quirúrgica: Los límites del conducto inguinal son la aponeurosis del oblicuo externo en la parte anterior, el músculo oblicuo interno en la parte lateral, la fascia transversalis y el músculo transverso del abdomen en la parte posterior, el músculo oblicuo interno y el transverso del abdomen en la parte superior, y el ligamento inguinal (de Poupart) en la parte inferior.<br><br>Análisis de Distractores: La opción A es el límite posterior, B constituye la pared superior y lateral, y D forma la pared inferior o piso del conducto.", 
        source: "Schwartz's Principles of Surgery, 11e, 2019, Capítulo 37: Hernias Inguinales, Página 3." 
    },
    {
        id: 4, 
        question: "De acuerdo a la GPC, en Hernia Inguinal, ¿cuál es el límite superolateral del triángulo de Hesselbach?", 
        options: ["Borde lateral del músculo recto del abdomen", "Vasos epigástricos inferiores", "Ligamento inguinal", "Tracto iliopúbico"], 
        answer: 1, 
        justification: "Justificación: El triángulo de Hesselbach es la zona de debilidad anatómica por donde protruyen las hernias directas. De acuerdo al libro de Schwartz Principios de Cirugía, el límite superololateral está determinado por los vasos epigástricos inferiores, los cuales separan el espacio medial (directo) del lateral (indirecto).<br><br>Perla Quirúrgica: Los límites del triángulo son el ligamento inguinal en la parte inferior, el borde lateral de la vaina del recto en la parte medial y los vasos epigástricos inferiores en la parte superolateral.<br><br>Análisis de Distractores: La opción A define la frontera medial del triángulo, C representa el límite inferior del mismo, y D no forma parte de las fronteras anatómicas clásicas de este espacio.", 
        source: "Schwartz's Principles of Surgery, 11e, 2019, Capítulo 37: Hernias Inguinales, Página 3." 
    },
    {
        id: 5, 
        question: "De acuerdo a la GPC, en la clasificación de Nyhus para Hernia Inguinal, ¿cuál es la categoría correspondiente a una hernia indirecta con anillo interno dilatado, sin compromiso del piso inguinal y que no desciende al escroto?", 
        options: ["Tipo I", "Tipo II", "Tipo IIIA", "Tipo IIIB"], 
        answer: 1, 
        justification: "Justificación: La clasificación de Nyhus define los defectos inguinales según su localización y tamaño. De acuerdo al libro de Schwartz Principios de Cirugía, el Tipo II describe específicamente a las hernias indirectas donde el anillo inguinal profundo ya se encuentra agrandado, pero la pared posterior permanece intacta y no hay extensión escrotal.<br><br>Perla Quirúrgica: Tipo II: Hernia indirecta; anillo abdominal interno agrandado sin invasión del piso del conducto inguinal; no se extiende al escroto.<br><br>Análisis de Distractores: La opción A representa hernias indirectas con anillo interno normal (típicamente pediátricas), C corresponde a hernias directas de cualquier tamaño, y D a hernias indirectas que destruyen la pared posterior (deslizantes, en pantalón o escrotales).", 
        source: "Schwartz's Principles of Surgery, 11e, 2019, Capítulo 37: Hernias Inguinales, Página 3." 
    },
    {
        id: 6, 
        question: "De acuerdo a la GPC, en Hernia Inguinal, ¿cómo se denomina a la porción más medial del espacio preperitoneal localizada directamente superior a la vejiga?", 
        options: ["Espacio de Bogros", "Orificio de Fruchaud", "Espacio de Retzius", "Triángulo de Doom"], 
        answer: 2, 
        justification: "Justificación: En los abordajes posteriores laparoscópicos, el espacio preperitoneal se subdivide para una disección ordenada. De acuerdo al libro de Schwartz Principios de Cirugía, el área medial que yace directamente sobre la vejiga urinaria se conoce como espacio de Retzius, la cual debe disecarse para exponer la sínfisis del pubis.<br><br>Perla Quirúrgica: El aspecto más medial del espacio preperitoneal, aquel que se encuentra superior a la vejiga, se conoce como espacio de Retzius.<br><br>Análisis de Distractores: La opción A es la porción lateral del espacio preperitoneal, B es el orificio miopectíneo global, y D es la zona delimitada por el conducto deferente y vasos gonadales que contiene vasos iliacos.", 
        source: "Schwartz's Principles of Surgery, 11e, 2019, Capítulo 37: Hernias Inguinales, Página 3." 
    },
    {
        id: 7, 
        question: "De acuerdo a la GPC, en Hernia Inguinal, ¿cuál es el límite medial del triángulo del desastre (Triangle of Doom) durante un abordaje posterior laparoscópico?", 
        options: ["Vasos gonadales", "Tracto iliopúbico", "Vasos iliacos externos", "Conducto deferente"], 
        answer: 3, 
        justification: "Justificación: El triángulo del desastre contiene vasos de gran calibre y requiere una fijación de malla extremadamente cuidadosa para evitar hemorragias graves. De acuerdo al libro de Schwartz Principios de Cirugía, este triángulo se delimita medialmente por el conducto deferente (en el varón) y lateralmente por los vasos gonadales.<br><br>Perla Quirúrgica: El triángulo del desastre está limitado medialmente por el conducto deferente y lateralmente por los vasos del cordón espermático.<br><br>Análisis de Distractores: La opción A es el límite lateral de este triángulo, B delimita el límite superior del triángulo del dolor, y C constituye el contenido vascular crítico del triángulo del desastre, mas no su límite.", 
        source: "Schwartz's Principles of Surgery, 11e, 2019, Capítulo 37: Hernias Inguinales, Página 7." 
    },
    {
        id: 8, 
        question: "De acuerdo a la GPC, en Hernia Inguinal, ¿cuál de los siguientes nervios se localiza dentro del triángulo del dolor (Triangle of Pain)?", 
        options: ["Nervio ilioinguinal", "Nervio iliohipogástrico", "Nervio cutáneo femoral lateral", "Nervio obturador"], 
        answer: 2, 
        justification: "Justificación: El triángulo del dolor es un espacio delimitado por el tracto iliopúbico y los vasos gonadales. De acuerdo al libro de Schwartz Principios de Cirugía, en esta zona transcurren nervios sensitivos mayores como el cutáneo femoral lateral, el nervio femoral y la rama femoral del genitofemoral, por lo que está prohibido colocar tachuelas mecánicas en este sitio para prevenir atrapamientos postoperatorios.<br><br>Perla Quirúrgica: El triángulo del dolor es una región bordeada por el tracto iliopúbico y los vasos gonadales, y abarca los nervios cutáneo femoral lateral, la rama femoral del genitofemoral y el nervio femoral.<br><br>Análisis de Distractores: Las opciones A y B discurren en el plano anterior de la pared abdominal (por encima del oblicuo interno); D transcurre profundo por el canal obturador, alejado del triángulo de dolor posterior.", 
        source: "Schwartz's Principles of Surgery, 11e, 2019, Capítulo 37: Hernias Inguinales, Página 7." 
    },
    {
        id: 9, 
        question: "De acuerdo a la GPC, en Hernia Inguinal, ¿qué signo clínico durante la maniobra de oclusión inguinal es sugestivo del diagnóstico de una hernia inguinal directa?", 
        options: ["Control completo del impulso al toser", "Persistencia de la herniación al toser", "Impulso palpable en la punta del dedo evaluador", "Reducción espontánea en decúbito lateral"], 
        answer: 1, 
        justification: "Justificación: La prueba de oclusión diferencia el origen del saco herniario. De acuerdo al libro de Schwartz Principios de Cirugía, al bloquear el anillo inguinal interno con el dedo, si el saco continúa protruyendo con la maniobra de Valsalva, se clasifica como directa (ya que emerge medial al anillo interno, a través de la pared posterior del triángulo de Hesselbach).<br><br>Perla Quirúrgica: La prueba de oclusión inguinal consiste en que el examinador bloquee el anillo inguinal interno con un dedo mientras se le pide al paciente que tosa. Un impulso controlado sugiere una hernia indirecta, mientras que la herniación persistente sugiere una hernia directa.<br><br>Análisis de Distractores: Las opciones A y C son características de hernias inguinales indirectas; D no es un hallazgo específico que diferencie hernias directas de indirectas clínicamente.", 
        source: "Schwartz's Principles of Surgery, 11e, 2019, Capítulo 37: Hernias Inguinales, Página 15." 
    },
    {
        id: 10, 
        question: "De acuerdo a la GPC, en Hernia Inguinal asintomática, ¿cuál es el porcentaje acumulado de pacientes bajo vigilancia estrecha que presentará síntomas y requerirá cirugía en un seguimiento a 7.5 años?", 
        options: ["25%", "50%", "72%", "90%"], 
        answer: 2, 
        justification: "Justificación: El manejo conservador (watchful waiting) es seguro en asintomáticos, pero tiene una tasa de conversión quirúrgica significativa a mediano plazo. De acuerdo al libro de Schwartz Principios de Cirugía, un 72% de los pacientes que inicialmente eligen vigilancia desarrollarán dolor o molestias que justificarán la reparación electiva a los 7.5 años de seguimiento.<br><br>Perla Quirúrgica: Una revisión de 2012 encontró que el 72% de los pacientes con hernia inguinal asintomática desarrollaron síntomas y se sometieron a reparación quirúrgica dentro de los 7.5 años posteriores al diagnóstico.<br><br>Análisis de Distractores: Las opciones A, B y D son porcentajes que no reflejan la tasa real de conversión de manejo médico a quirúrgico reportada en el seguimiento longitudinal.", 
        source: "Schwartz's Principles of Surgery, 11e, 2019, Capítulo 37: Hernias Inguinales, Página 15." 
    },
    {
        id: 11, 
        question: "De acuerdo a la GPC, en Hernia Inguinal, ¿qué estructura nerviosa se divide intencionadamente de forma rutinaria durante la disección del cordón en la técnica de Shouldice?", 
        options: ["Rama genital del genitofemoral", "Nervio cutáneo femoral lateral", "Nervio iliohipogástrico", "Rama femoral del genitofemoral"], 
        answer: 0, 
        justification: "Justificación: La reparación tisular imbricada de Shouldice requiere una movilización extensa del cordón espermático. De acuerdo al libro de Schwartz Principios de Cirugía, la sección rutinaria de la rama genital del genitofemoral facilita esta movilización, provocando anestesia o hipoestesia residual en el escroto o labios mayores ipsolaterales.<br><br>Perla Quirúrgica: Durante la disección del cordón, la rama genital del nervio genitofemoral se divide de manera rutinaria, lo que resulta en la pérdida ipsolateral de sensibilidad en el escroto en hombres o en el monte de Venus y el labio mayor en mujeres.<br><br>Análisis de Distractores: La opción B se encuentra en el espacio preperitoneal lateral y no se toca; C se sitúa en el plano anterior sobre el oblicuo interno; D inerva el triángulo femoral y no se diseca en esta técnica.", 
        source: "Schwartz's Principles of Surgery, 11e, 2019, Capítulo 37: Hernias Inguinales, Página 15." 
    },
    {
        id: 12, 
        question: "De acuerdo a la GPC, en Hernia Inguinal, ¿en qué estructura de la pared abdominal se realiza la incisión de relajación para disminuir la tensión de la sutura hacia el ligamento de Cooper en la técnica de McVay?", 
        options: ["Aponeurosis del oblicuo externo", "Hoja anterior de la vaina del recto del abdomen", "Fascia transversalis", "Hoja posterior de la vaina del recto del abdomen"], 
        answer: 1, 
        justification: "Justificación: Al aproximar el tendón conjunto al ligamento de Cooper, la tensión puede provocar dehiscencias o dolor excesivo. De acuerdo al libro de Schwartz Principios de Cirugía, la realización de una incisión de relajación vertical de 2 a 4 cm en la vaina anterior del recto es un paso obligatorio y crítico para el éxito del procedimiento de McVay.<br><br>Perla Quirúrgica: Se realiza una incisión de relajación de 2 a 4 cm en la vaina anterior del recto verticalmente desde el tubérculo púbico. Esta incisión es esencial para reducir la tensión en la reparación...<br><br>Análisis de Distractores: La opción A es la capa superficial abierta al inicio; C es la fascia transversalis que se abre para entrar al espacio preperitoneal; D no se incide debido al riesgo de eventración o daño a estructuras profundas.", 
        source: "Schwartz's Principles of Surgery, 11e, 2019, Capítulo 37: Hernias Inguinales, Página 15."

        options: ["0.5 a 1 cm", "1.5 a 2 cm", "3 a 4 cm", "4.5 a 5 cm"], 
        answer: 1, 
        justification: "Justificación: La colocación inadecuada de la malla es una de las causas más frecuentes de recurrencia. De acuerdo al libro de Schwartz Principios de Cirugía, el borde medial de la prótesis debe fijarse cruzando y sobrepasando el tubérculo púbico por 1.5 a 2 cm para prevenir la falla medial ante el aumento de la presión intraabdominal.<br><br>Perla Quirúrgica: El borde medial de la malla se fija a la vaina anterior del recto de tal manera que se superponga al tubérculo púbico de 1.5 a 2 cm. Este refinamiento de la técnica original de Lichtenstein minimiza la recurrencia medial.<br><br>Análisis de Distractores: La opción A propone una distancia insuficiente que eleva el riesgo de recidivas mediales; C y D implican un exceso de material protésico innecesario que puede causar molestias postoperatorias y dolor crónico.",

        options: ["Incrementa el riesgo relativo a 1.20", "Disminuye el riesgo relativo a 0.61", "Carece de impacto estadísticamente significativo", "Reduce la recidiva con un riesgo relativo de 0.35"],

        answer: 1, 
        justification: "Justificación: El \"círculo de la muerte\" (o círculo vascular anastomosis de corona mortis) es una intrincada red arterial y venosa en el aspecto posterior de la pelvis. De acuerdo al libro de Schwartz Principios de Cirugía, la comunicación directa de estos vasos arteriales y venosos forma un anillo continuo de alto flujo que puede desgarrarse gravemente si se realiza una fijación con grapas o suturas agresivas en la vecindad del ligamento de Cooper.<br><br>Perla Quirúrgica: El círculo de la muerte es una continuación vascular formada por los vasos ilíaco común, ilíaco interno, obturador, epigástrico inferior e ilíaco externo.<br><br>Análisis de Distractores: Las opciones A, C y D proponen asociaciones vasculares que no constituyen la continuidad del circuito pélvico posterior clasificado críticamente con este epónimo quirúrgico.",

        options: ["Músculo oblicuo interno, transverso del abdomen y fascia transversalis", "Aponeurosis del oblicuo externo y vaina anterior del recto", "Tendón conjunto y ligamento pectíneo de Cooper", "Fascia transversalis y tracto iliopúbico"], 
        answer: 0, 
        justification: "Justificación: La técnica tisular pionera descrita por Edoardo Bassini revolucionó la cirugía de hernia al proponer una reconstrucción fisiológica en tres planos. De acuerdo al libro de Schwartz Principios de Cirugía, la aproximación del borde inferior de las fibras musculofasciales profundas (oblicuo interno, transverso y fascia transversalis) hacia el ligamento inguinal crea una nueva barrera de contención posterior que sustituye el piso debilitado.<br><br>Perla Quirúrgica: Reparación de Bassini... Reconstrucción de la pared posterior suturando la fascia transversalis, el músculo transverso del abdomen y el músculo oblicuo interno medialmente al ligamento inguinal lateralmente.<br><br>Análisis de Distractores: La opción B involucra capas superficiales que no participan en el plano de reconstrucción posterior; C corresponde al plano de reconstrucción de la técnica de McVay; D representa elementos fasciales preperitoneales posteriores no suturados de forma conjunta en Bassini.", 
        source: "Schwartz's Principles of Surgery, 11e, 2019, Capítulo 37: Hernias Inguinales, Página 15." 
    },
    {
        id: 31, 
        question: "De acuerdo a la GPC, en la hernioplastia de Hernia Inguinal abierta, ¿cuál es la razón de momios de recidiva de la técnica de Shouldice en comparación con las reparaciones que utilizan mallas protésicas?", 
        options: ["1.50", "2.25", "3.65", "4.80"], 
        answer: 2, 
        justification: "Justificación: A pesar de ser la técnica anatómica autóloga más exitosa debido a sus cuatro líneas de imbricación de sutura continua, no iguala los resultados a largo plazo de las técnicas libres de tensión. De acuerdo al libro de Schwartz Principios de Cirugía, la ausencia de una prótesis incrementa de forma significativa el riesgo relativo de recidiva (OR de 3.65) al someter a tensión mecánica a los tejidos nativos suturados.<br><br>Perla Quirúrgica: En comparación con las reparaciones con malla, la técnica de Shouldice se asoció con tasas significativamente más altas de recurrencia (OR 3.65, IC 1.79–7.47); sin embargo, es la reparación basada en tejidos más eficaz cuando la malla no está disponible o está contraindicada.<br><br>Análisis de Distractores: Las opciones A, B y D son razones de momios subestimadas o incorrectas respecto al análisis estadístico formal publicado en los metaanálisis de referencia global de hernias.", 
        source: "Schwartz's Principles of Surgery, 11e, 2019, Capítulo 37: Hernias Inguinales, Página 40."

    {
        id: 32, 
        question: "De acuerdo a la GPC, en el tratamiento de la Hernia Femoral, además de los escenarios donde el uso de material protésico está contraindicado, ¿en qué otra indicación quirúrgica se prefiere la técnica abierta de McVay?", 
        options: ["Hernia femoral", "Hernia directa recidivante", "Hernia inguinal indirecta estrangulada", "Hernia inguinal en pantalón gigante"], 
        answer: 0, 
        justification: "Justificación: La técnica de McVay asocia el tendón conjunto al ligamento de Cooper, permitiendo cerrar mecánicamente el conducto crural. De acuerdo al libro de Schwartz Principios de Cirugía, esta característica anatómica convierte a la técnica de McVay en la opción tisular clásica de elección para la reparación definitiva de las hernias de tipo femoral sin uso de malla.<br><br>Perla Quirúrgica: La reparación de McVay aborda los defectos tanto del conducto inguinal como del anillo femoral. Esta técnica está indicada para hernias femorales y en casos donde el uso de material protésico está contraindicado.<br><br>Análisis de Distractores: Las opciones B, C y D representan variedades de defectos de la ingle que se benefician de mallas de gran tamaño o abordajes preperitoneales, no teniendo indicación de McVay de primera línea.",

    {
        id: 33, 
        question: "De acuerdo a la GPC, en la técnica de Lichtenstein para Hernia Inguinal, ¿qué tipo de sutura se indica para la fijación del borde inferior de la malla a lo largo del ligamento inguinal?", 
        options: ["Multifilamento absorbible a corto plazo", "Trenzado sintético absorbible a largo plazo", "Monofilamento sintético permanente", "Seda trenzada natural no absorbible"], 
        answer: 2, 
        justification: "Justificación: La fijación de la prótesis en el suelo inguinal debe soportar la presión del abdomen de por vida para evitar el colapso medial del material. De acuerdo al libro de Schwartz Principios de Cirugía, la fijación inferior de la malla a la porción reflejada del ligamento inguinal requiere el uso obligatorio de una sutura de monofilamento sintético no absorbible (como el polipropileno) para asegurar una durabilidad tensil permanente.<br><br>Perla Quirúrgica: Para la fijación del margen inferior de la malla, se utiliza una sutura permanente, sintética y monofilamento, teniendo cuidado de evitar colocar suturas directamente en el periostio del tubérculo púbico.<br><br>Análisis de Distractores: Las opciones A y B proponen suturas absorbibles cuya degradación prematura causaría el desprendimiento de la malla y recidiva; D es un material orgánico trenzado que induce una respuesta inflamatoria persistente indeseable sobre el trayecto vascular y nervioso adyacente.", 
        source: "Schwartz's Principles of Surgery, 11e, 2019, Capítulo 37: Hernias Inguinales, Página 15."

    {

        question: "De acuerdo a la GPC, en la técnica de tapón y parche para Hernia Inguinal, ¿quiénes popularizaron esta técnica de reparación?", 
        options: ["Bassini y Halsted", "Nyhus y Condon", "Shouldice y Glassow", "Rutkow y Robbins"], 
        answer: 3, 
        justification: "Justificación: La técnica de Tapón y Parche (Plug and Patch) agilizó los tiempos quirúrgicos al rellenar el defecto del anillo interno directamente. De acuerdo al libro de Schwartz Principios de Cirugía, posterior a la descripción original de Gilbert de una reparación sin sutura, los cirujanos Ira Rutkow y Alan Robbins popularizaron y estandarizaron el uso de tapones tridimensionales de polipropileno preconformados a nivel mundial.<br><br>Perla Quirúrgica: Una modificación de la reparación de Lichtenstein, la técnica de tapón y parche, fue desarrollada por Gilbert y posteriormente popularizada por Rutkow y Robbins.<br><br>Análisis de Distractores: La opción A son pioneros históricos de la reparación abierta anatómica clásica; B son anatomistas y cirujanos que propusieron clasificaciones y abordajes posteriores; C desarrollaron la técnica tisular de Shouldice basada en imbricación de capas.",

    {
        id: 35, 
        question: "De acuerdo a la GPC, en la orquitis isquémica postoperatoria secundaria a hernioplastia de Hernia Inguinal, ¿cuál es la lesión anatómica que con mayor frecuencia causa esta complicación?", 
        options: ["Lesión del plexo pampiniforme", "Transección accidental de la arteria testicular", "Atrapamiento intraaponeurótico del conducto deferente", "Sección del ligamento suspensorio del testículo"], 
        answer: 0, 
        justification: "Justificación: La orquitis isquémica es una entidad dolorosa que suele presentarse tras disecciones agresivas o traumatismos directos sobre los elementos del cordón espermático. De acuerdo al libro de Schwartz Principios de Cirugía, la causa fisiopatológica primaria es la trombosis venosa retrógrada originada por lesión del plexo pampiniforme durante la movilización del saco, y no la oclusión de la arteria testicular principal, la cual cuenta con abundante circulación colateral.<br><br>Perla Quirúrgica: La lesión de las estructuras del cordón espermático puede provocar orquitis isquémica o atrofia testicular. La orquitis isquémica es causada con mayor frecuencia por una lesión del plexo pampiniforme y no de la arteria testicular.<br><br>Análisis de Distractores: La opción B causa atrofia testicular a largo plazo pero no necrosis aguda gracias a la irrigación colateral de las arterias cremasteriana y deferencial; C y D lesionan componentes no vasculares del cordón, lo que puede provocar dolor o infertilidad, mas no congestión venosa ni isquemia testicular aguda.",

        options: ["Tomografía computarizada axial de alta resolución", "Ultrasonido Doppler testicular", "Resonancia magnética pélvica contrastada", "Gammagrafía testicular con tecnecio-99m"],

        justification: "Justificación: Diferenciar la inflamación e isquemia congestiva de la necrosis tisular irreversible es vital para evitar cirugías innecesarias de pérdida testicular. De acuerdo al libro de Schwartz Principios de Cirugía, el ultrasonido con análisis de flujo Doppler a color es el estudio de primera elección que documenta con precisión la permeabilidad y perfusión de los vasos testiculares e intraparenquimatosos.<br><br>Perla Quirúrgica: El ultrasonido demostrará el flujo sanguíneo testicular para diferenciar entre isquemia y necrosis. La orquiectomía de urgencia sólo es necesaria en caso de necrosis.<br><br>Análisis de Distractores: Las opciones A y C son costosas, consumen tiempo valioso y no aportan mayor sensibilidad que el Doppler a color a pie de cama; D es un método alternativo de medicina nuclear útil pero poco disponible en la urgencia hospitalaria comparada con el ultrasonido Doppler.", 
        source: "Schwartz's Principles of Surgery, 11e, 2019, Capítulo 37: Hernias Inguinales, Página 37."

    {

        options: ["Orquidopexia urgente transescrotal bilateral", "Orquiectomía radical ipsolateral de urgencia", "Terapia trombolítica local intraarterial", "Medidas de soporte, analgésicos y antiinflamatorios no esteroideos"],

    {

        source: "Schwartz's Principles of Surgery, 11e, 2019, Capítulo 37: Hernias Inguinales, Página 37."

                        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">

                                Tablero General
                            </h2>
                            <div class="flex gap-4 text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">

                        <div class="grid gap-2 sm:gap-3 grid-cols-[repeat(auto-fill,minmax(42px,1fr))] sm:grid-cols-[repeat(auto-fill,minmax(48px,1fr))] p-1">

                        </div>
                    </div>

                    <!-- SIGUIENTE LINK -->
                    <div class="mt-4 pt-6 border-t border-slate-200 dark:border-slate-800 flex justify-end pb-8">
                        <a href="BS06308GYOE.html" class="bg-slate-800 dark:bg-slate-800 hover:bg-slate-900 dark:hover:bg-slate-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-colors flex items-center gap-2">

                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>

        }

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-pink-50 dark:bg-pink-900/20 text-pink-600 dark:text-pink-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-pink-100 dark:border-pink-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-pink-50 has-[:checked]:border-pink-400 dark:has-[:checked]:bg-pink-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-pink-600 focus:ring-pink-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-pink-600 dark:hover:bg-pink-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-pink-600 to-rose-600 hover:from-rose-600 hover:to-pink-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('SchwartaherniaProgress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('SchwartaherniaLastQId', currentQuestionId);
                else localStorage.removeItem('SchwartaherniaLastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('SchwartaherniaProgress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>
