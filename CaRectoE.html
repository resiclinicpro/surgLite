    <script>
        // =========================================================
        // =========================================================
        const questionsData = [
    {
        id: 1,
        question: "Paciente con diagnóstico de cáncer de recto localizado a 4 cm del margen anal. Se planea resección quirúrgica con intención curativa. ¿Cuál es el margen distal en la pared intestinal clínicamente aceptable en este escenario?",
        options: ["> 5 cm", "1 a 2 cm", "> 10 mm", "3 a 4 cm"],
        answer: 1,
        justification: "Justificación: De acuerdo a la GPC de NCCN Cáncer Rectal, para lograr una escisión mesorrectal adecuada, el estándar es un margen de 4 a 5 cm por debajo del borde distal del tumor. Sin embargo, en tumores del recto distal que se encuentran a menos de 5 cm del margen anal, la exigencia anatómica disminuye para permitir la preservación de los esfínteres.<br><br>Perla ENARM: En cáncer de recto distal, un margen distal negativo en la pared del intestino de 1 a 2 cm es oncológicamente aceptable.<br><br>Análisis de Distractores: A) > 5 cm es el margen ideal general para tumores de recto medio o superior, pero no exigido en recto distal. C) > 10 mm corresponde al margen requerido para lesiones tempranas manejadas mediante escisión local transanal, no para resección transabdominal. D) 3 a 4 cm es una medida arbitraria que no figura como punto de corte en la estratificación anatómica.",
        source: "NCCN Clinical Practice Guidelines in Oncology for Rectal Cancer, 2026, Principles of Surgery and Locoregional Therapies, REC-C 2 de 9."
    },
    {
        id: 2,
        question: "Durante la resección oncológica de un adenocarcinoma de colon transverso completamente peritonizado, ¿qué estructura anatómica constituye el único margen circunferencial quirúrgico evaluable?",
        options: ["Margen mesentérico", "Superficie serosa", "Fascia de Gerota", "Peritoneo parietal"],
        answer: 0,
        justification: "Justificación: La superficie serosa peritoneal no se considera un margen quirúrgico en la evaluación patológica. De acuerdo a la GPC de NCCN Cáncer de Colon, en los segmentos del colon que están completamente envueltos por peritoneo, la única zona de fijación retroperitoneal es la raíz del mesenterio.<br><br>Perla ENARM: El margen de resección mesentérico es el único margen circunferencial relevante en segmentos colónicos completamente peritonizados.<br><br>Análisis de Distractores: B) La superficie serosa no representa el margen circunferencial, ya que corresponde a la capa más externa libre en cavidad. C) La fascia de Gerota rodea los riñones y no es un margen estándar para el colon transverso. D) El peritoneo parietal no es parte del bloque de resección visceral directa en ausencia de invasión contigua.",
        source: "NCCN Clinical Practice Guidelines in Oncology for Colon Cancer, 2026, Principles of Pathologic and Molecular Review, COL-B 2 de 9."
    },
    {
        id: 3,
        question: "Paciente con carcinoma escamoso del margen anal etapa T1N0. Se decide manejo quirúrgico conservador mediante escisión local. ¿Qué margen quirúrgico lateral de tejido sano se requiere como objetivo principal?",
        options: ["2 mm", "5 mm", "1 cm", "3 cm"],
        answer: 2,
        justification: "Justificación: Las lesiones tempranas del margen perianal o anal bien seleccionadas pueden prescindir de terapias radicales si logran resecarse por completo. De acuerdo a la GPC de NCCN Cáncer Anal, el abordaje conservador es viable siempre y cuando se respete el margen oncológico.<br><br>Perla ENARM: El carcinoma escamoso del margen anal T1N0 puede ser tratado adecuadamente mediante escisión local con un margen quirúrgico de 1 cm.<br><br>Análisis de Distractores: A) 2 mm es el margen considerado como positivo o inadecuado para extirpaciones locales en el canal anal. B) 5 mm es un margen insuficiente y aumenta la tasa de recurrencia local. D) 3 cm obligaría a un defecto extenso que típicamente requeriría colgajos o comprometería severamente la anatomía perianal sin justificación oncológica.",
        source: "NCCN Clinical Practice Guidelines in Oncology for Anal Carcinoma, 2026, Principles of Surgery, ANAL-A 1 de 2."
    },
    {
        id: 4,
        question: "En una proctectomía total con intención curativa por cáncer de recto medio, ¿cuántos centímetros por debajo del borde distal del tumor debe extenderse la disección para asegurar una escisión total del mesorrecto adecuada?",
        options: ["1 a 2 cm", "2 a 3 cm", "4 a 5 cm", "> 10 cm"],
        answer: 2,
        justification: "Justificación: La erradicación de los ganglios linfáticos y depósitos tumorales intramesorrectales es el objetivo central de la cirugía. De acuerdo a la GPC de NCCN Cáncer Rectal, la técnica de disección debe englobar todo el tejido adiposo perirrectal hasta su terminación anatómica en el piso pélvico para los tumores de tercio medio e inferior.<br><br>Perla ENARM: Para lograr una escisión mesorrectal adecuada, la resección debe extenderse de 4 a 5 cm por debajo del borde distal del tumor.<br><br>Análisis de Distractores: A) 1 a 2 cm es el margen de pared intestinal aceptable para recto distal, no la longitud de extensión de la fascia mesorrectal a resecar en recto medio. B) 2 a 3 cm subestima la propagación linfática distal intrínseca del mesorrecto en tumores medios. D) > 10 cm es anatómicamente imposible en el hueco pélvico dado que la longitud total del recto es de aproximadamente 15 cm.",
        source: "NCCN Clinical Practice Guidelines in Oncology for Rectal Cancer, 2026, Principles of Surgery and Locoregional Therapies, REC-C 2 de 9."
    },
    {
        id: 5,
        question: "Para asegurar una estadificación patológica precisa que determine la necesidad de quimioterapia adyuvante en cáncer de colon, ¿cuál es la cantidad mínima de ganglios linfáticos que deben examinarse en el espécimen quirúrgico?",
        options: ["6 ganglios", "10 ganglios", "15 ganglios", "12 ganglios"],
        answer: 3,
        justification: "Justificación: La disección ganglionar impacta directamente la supervivencia y el estadio de la enfermedad. De acuerdo a la GPC de NCCN Cáncer de Colon, la falla en alcanzar el conteo nodal mínimo infraestadifica al paciente y aumenta el riesgo de recurrencia no tratada.<br><br>Perla ENARM: La recolección de <12 ganglios linfáticos se considera un criterio de alto riesgo y 12 ganglios es el estándar mínimo para estadificación.<br><br>Análisis de Distractores: A) 6 ganglios es una resección ganglionar insuficiente que clasifica la cirugía como inadecuada. B) 10 ganglios es un número subóptimo, común tras neoadyuvancia en recto, pero insuficiente como meta estándar en colon. C) 15 ganglios es un número ideal y frecuentemente alcanzado, pero el límite inferior establecido por consenso internacional es 12.",
        source: "NCCN Clinical Practice Guidelines in Oncology for Colon Cancer, 2026, Principles of Pathologic and Molecular Review, COL-B 6 de 9."
    },
    {
        id: 6,
        question: "Paciente con adenocarcinoma de recto sometido a quimiorradioterapia neoadyuvante. Posteriormente, se realiza resección quirúrgica. ¿Qué margen de resección distal es considerado oncológicamente aceptable debido al efecto del tratamiento previo?",
        options: ["< 1 cm", "> 2 cm", "> 5 cm", "< 2 mm"],
        answer: 0,
        justification: "Justificación: El encogimiento tumoral secundario a la radiación altera los requerimientos anatómicos distales. De acuerdo a la GPC de ESMO Cáncer Rectal, en la ausencia de tratamiento preoperatorio se prefiere un margen de 1 cm, pero las modificaciones tisulares post-radiación justifican un manejo más conservador de la longitud intestinal.<br><br>Perla ENARM: Cuando el paciente ha recibido terapia neoadyuvante, un margen de resección distal < 1 cm puede considerarse aceptable.<br><br>Análisis de Distractores: B) > 2 cm es la regla para tumores en segmentos cólicos o rectales sin neoadyuvancia, pero no es el umbral mínimo aceptado post-tratamiento. C) > 5 cm es la regla para el margen de resección del mesorrecto, no para la pared distal del tubo digestivo tras radiación. D) < 2 mm se define como un margen estrecho o francamente positivo (amenazado) en disecciones locales o evaluaciones de fascia, no es un objetivo quirúrgico.",
        source: "ESMO Clinical Practice Guideline on localised rectal cancer, 2025, Surgery, Página 11."
    },
    {
        id: 7,
        question: "En el abordaje quirúrgico por adenocarcinoma de recto, ¿para qué localización anatómica exclusiva está indicada oncológicamente la realización de una escisión parcial del mesorrecto (PME)?",
        options: ["Canal anal", "Tercio medio", "Tercio superior", "Tercio inferior"],
        answer: 2,
        justification: "Justificación: La extensión de la resección depende estrictamente de la relación del tumor con la reflexión peritoneal. De acuerdo a la GPC de ESMO Cáncer Rectal, las lesiones proximales tienen un patrón de diseminación linfática predominantemente ascendente, haciendo innecesaria la morbilidad de una disección pélvica profunda.<br><br>Perla ENARM: La PME es el procedimiento oncológicamente adecuado exclusivamente para tumores del recto superior.<br><br>Análisis de Distractores: A) El canal anal requiere disecciones radicales distales o resección abdominoperineal (APR). B) El tercio medio exige obligatoriamente una escisión total del mesorrecto (TME) debido al alto riesgo de recurrencia lateral y distal. D) El tercio inferior también es una indicación estricta para TME o amputación abdominoperineal.",
        source: "ESMO Clinical Practice Guideline on localised rectal cancer, 2025, Management of localised disease, Página 3 y 11."
    },
    {
        id: 8,
        question: "Tras la administración de tratamiento neoadyuvante en un paciente con cáncer de recto avanzado, ¿a partir de qué diámetro de eje corto medido por imagen se recomienda la resección quirúrgica de los ganglios linfáticos laterales?",
        options: ["≥ 10 mm", "≥ 7 mm", "≥ 5 mm", "≥ 3 mm"],
        answer: 1,
        justification: "Justificación: La persistencia de adenopatías en el compartimento pélvico lateral después de la neoadyuvancia es un alto predictor de falla locorregional. De acuerdo a la GPC de ESMO Cáncer Rectal, estos ganglios (ilíacos internos y obturatrices) deben considerarse enfermedad metastásica regional activa y extirparse en el mismo tiempo de la TME.<br><br>Perla ENARM: Los ganglios linfáticos laterales con un eje corto de ≥ 7 mm deben resecarse después del tratamiento neoadyuvante.<br><br>Análisis de Distractores: A) ≥ 10 mm es un tamaño que representa enfermedad macroscópica masiva, pero el corte quirúrgico de intervención se establece más bajo. C) ≥ 5 mm se considera reactivo o inflamatorio residual en muchos casos, sin obligar sistemáticamente a morbilidad quirúrgica adicional. D) ≥ 3 mm entra en la categoría de microganglios de comportamiento indeterminado, cuyo manejo es observación.",
        source: "ESMO Clinical Practice Guideline on localised rectal cancer, 2025, Recommendations, Página 15."
    },
    {
        id: 9,
        question: "Paciente con antecedente de cáncer escamoso anal manejado con quimiorradioterapia. Acude por recurrencia tumoral aislada en un ganglio inguinal, confirmada por biopsia. ¿Cuál es la intervención quirúrgica primaria recomendada en este escenario clínico?",
        options: ["Resección abdominoperineal sola", "Disección de ganglios inguinales", "Escisión local amplia", "Braquiterapia de rescate"],
        answer: 1,
        justification: "Justificación: Las recurrencias linfáticas aisladas cambian el algoritmo de supervivencia. De acuerdo a la GPC de NCCN Cáncer Anal, si la enfermedad recae en el territorio inguinal en un paciente que previamente alcanzó dosis máximas de radiación regional, el manejo mecánico es el único curativo disponible.<br><br>Perla ENARM: Para pacientes que presentan una recurrencia inguinal y ya han recibido radiación en la ingle, se debe realizar una disección de ganglios inguinales.<br><br>Análisis de Distractores: A) La resección abdominoperineal (APR) es el tratamiento para la recurrencia local/persistencia del tumor primario en el canal anal, no para rescate inguinal aislado. C) La escisión local amplia no erradica el lecho linfático amenazado, dejando ganglios metastásicos residuales. D) La braquiterapia es una técnica de radiación, la cual está contraindicada o fuertemente limitada si la región ya fue irradiada previamente con dosis plenas.",
        source: "NCCN Clinical Practice Guidelines in Oncology for Anal Carcinoma, 2026, Principles of Surgery, ANAL-A 2 de 2."
    },
    {
        id: 10,
        question: "En la estadificación imagenológica inicial, ¿qué límite anatómico óseo define por resonancia magnética la transición superior del recto, separándolo del colon sigmoides?",
        options: ["Sínfisis del pubis", "Cóccix", "Segunda vértebra sacra", "Promontorio sacro"],
        answer: 3,
        justification: "Justificación: La definición radiológica es crucial para categorizar la enfermedad y decidir indicaciones de neoadyuvancia. De acuerdo a la GPC de NCCN Cáncer Rectal, este hito anatómico marca la reflexión peritoneal anterior y es el estándar oro en la semiología quirúrgica.<br><br>Perla ENARM: El recto se localiza por debajo de una línea virtual desde el promontorio sacro hasta el borde superior de la sínfisis púbica, determinado por resonancia magnética.<br><br>Análisis de Distractores: A) La sínfisis del pubis es el margen óseo anterior inferior que traza el ángulo de la línea virtual, no el origen espinal superior. B) El cóccix es una estructura demasiado inferior que dejaría gran parte del recto superior fuera de la definición. C) La segunda vértebra sacra es un límite quirúrgico clásico antiguo para la transición rectosigmoidea, pero la resonancia magnética estandarizada actual utiliza el promontorio sacro.",
        source: "NCCN Clinical Practice Guidelines in Oncology for Rectal Cancer, 2026, Clinical Presentation, REC-2."
    },
    {
        id: 11,
        question: "Durante una colonoscopia de tamizaje, se extirpa un pólipo sésil. El reporte histopatológico revela adenocarcinoma. ¿A qué distancia del límite de corte endoscópico se clasifica definitivamente un margen positivo (amenazado)?",
        options: ["≤ 10 mm", "≤ 5 mm", "≤ 1 mm", "≤ 2 mm"],
        answer: 2,
        justification: "Justificación: La evaluación del margen en un pólipo maligno dicta la necesidad de someter al paciente a una resección colónica formal. De acuerdo a la GPC de NCCN Cáncer de Colon, la proximidad de células neoplásicas a la zona de diatermia aumenta drásticamente el riesgo de recurrencia en el lecho.<br><br>Perla ENARM: En pólipos malignos, un margen positivo se define como la presencia de células tumorales a ≤ 1 mm del margen de transección.<br><br>Análisis de Distractores: A) ≤ 10 mm es un margen quirúrgico excelente para seguridad local, no representa positividad patológica. B) ≤ 5 mm es considerado un margen libre y adecuado en resecciones mucosas endoscópicas. D) ≤ 2 mm es el corte de positividad para excisiones locales de lesiones en el canal anal, pero el estándar estricto histológico para pólipos es 1 milímetro.",
        source: "NCCN Clinical Practice Guidelines in Oncology for Colon Cancer, 2026, Principles of Pathologic and Molecular Review, COL-B 1 de 9."
    },
    {
        id: 12,
        question: "En el reporte de patología tras una proctectomía radical, ¿cuál es la distancia de penetración tumoral a la fascia mesorrectal que define universalmente un margen circunferencial (CRM) positivo?",
        options: ["≤ 1 mm", "≤ 2 mm", "≤ 5 mm", "≤ 10 mm"],
        answer: 0,

        justification: "Justificación: El cáncer escamoso anal no es biológicamente un cáncer gastrointestinal clásico, por lo que responde al protocolo Nigro modificado. De acuerdo a la GPC de NCCN Cáncer Anal, esta dupla farmacológica es superior en lograr respuestas patológicas completas y preservar el esfínter anal frente al tratamiento quirúrgico primario.<br><br>Perla ENARM: La enfermedad locorregional de cáncer anal (± ganglios paraaórticos) debe tratarse con quimiorradioterapia concurrente basada en Fluorouracilo y Mitomicina o Capecitabina y Mitomicina.<br><br>Análisis de Distractores: A) FOLFIRINOX es un régimen altamente tóxico exclusivo para adenocarcinomas de páncreas o colorrectales metastásicos, ineficaz en histología escamosa anal. B) Cisplatino y paclitaxel conforman esquemas utilizados en líneas avanzadas o carcinomas escamosos de cabeza y cuello/cérvix. C) Capecitabina combinada con oxaliplatino (CAPEOX) es pilar de la terapia colorrectal, no el estándar oro anal de preservación orgánica inicial.",
        source: "NCCN Clinical Practice Guidelines in Oncology for Anal Carcinoma, 2026, Primary Treatment, ANAL-2 y ANAL-B 2 de 5."

    {
        id: 30,
        question: "Paciente con adenocarcinoma de colon que presenta una metástasis hepática aislada. ¿Para qué tamaño máximo de lesión se considera que la ablación térmica ofrece resultados oncológicos y de supervivencia equivalentes a la resección quirúrgica?",

        answer: 0,
        justification: "Justificación: La destrucción tisular generada por calor tiene límites físicos radiológicos de penetración efectiva antes de originar un fenómeno de disipación (\"heat sink\"). De acuerdo a la GPC de NCCN Cáncer de Colon, la evidencia de ensayos aleatorizados recientes (COLLISION) valida el cambio de paradigma hacia abordajes menos invasivos.<br><br>Perla ENARM: Para metástasis hepáticas pequeñas de cáncer colorrectal (≤ 3 cm), la ablación térmica es equivalente a la resección quirúrgica en términos de supervivencia y toxicidad.<br><br>Análisis de Distractores: B) Las metástasis de 5 cm tienen altas tasas de progresión local tras la ablación térmica debido al calentamiento incompleto del borde periférico y requieren resección formal. C) ≤ 1 cm es un tamaño donde la ablación es excelente, pero el umbral máximo validado de equivalencia de no-inferioridad se extiende más allá. D) Lesiones > 5 cm (como 7 cm) tienen una indicación absoluta de abordaje resectivo si el remanente hepático lo permite.",

    {
        id: 31,
        question: "En el plan de seguimiento de un paciente con cáncer de recto que recibió tratamiento curativo, ¿para qué subgrupo está indicado exclusivamente realizar proctoscopia con ultrasonido endoscópico cada 3 a 6 meses?",

    {

    },
    {

        question: "Durante el estadiaje pélvico por resonancia magnética de un paciente con cáncer de recto tercio medio, se identifica invasión tumoral de la fascia mesorrectal (MRF amenazada). ¿Qué estrategia de tratamiento sistémico es mandatoria en este escenario?",

    {

        question: "En el reporte histopatológico de un espécimen de adenocarcinoma colorrectal, se describe el fenómeno microscópico de gemación tumoral (\"tumor budding\"). ¿A partir de qué número de yemas celulares en un área específica se clasifica de alto grado?",

    {

        question: "En el tratamiento de enfermedad metastásica irresecable por cáncer de colon, ¿qué combinación simultánea de fármacos biológicos está estrictamente contraindicada por incremento de toxicidad sin beneficio de supervivencia?",

    {

        question: "Como parte de la vigilancia postoperatoria de un paciente asintomático tras la resección de un cáncer de colon etapa III, ¿cuál es la periodicidad recomendada para realizar la tomografía computarizada de tórax, abdomen y pelvis?",

    },
    {

        question: "De acuerdo con la GPC, en pacientes seleccionados con adenocarcinoma de recto en el tercio medio (cT3), ¿qué criterio radiológico por RM permite la omisión segura de la quimiorradioterapia neoadyuvante clásica?",

    {
        id: 40,
        question: "Durante el análisis de un espécimen colónico, el patólogo no identifica metástasis en los 14 ganglios linfáticos aislados (pN0), pero detecta depósitos tumorales aislados en la grasa del mesenterio. ¿Cómo se clasifica oncológicamente este hallazgo en la subclasificación N?",

        justification: "Justificación: Los nódulos de tejido perivascular con atipia celular, sin estructura linfoide organizada remanente, reflejan diseminación angiolinfática desestructurada o extensión contigua masiva. De acuerdo a la GPC de NCCN Cáncer de Colon, la simple presencia de estos focos escala al paciente del grado II al grado III de riesgo adyuvante.<br><br>Perla ENARM: Se clasifica como N1c cuando no existen ganglios linfáticos regionales positivos, pero hay presencia de depósitos tumorales en la subserosa, mesenterio o tejido pericolónico no peritonizado.<br><br>Análisis de Distractores: A) N2a corresponde a la afectación tumoral probada en el interior de 4 a 6 verdaderos ganglios linfáticos regionales. C) N1a se define estrictamente por la presencia de infiltración neoplásica en un único (1) ganglio linfático regional documentado. D) N1b abarca el hallazgo morfológico celular afirmativo en el parénquima de 2 a 3 ganglios linfáticos regionales aislados en la disección.",

    {

        question: "En el escrutinio de una pieza de hemorroidectomía se diagnostica incidentalmente un carcinoma escamoso superficialmente invasivo (SISCCA). Para que esta lesión temprana sea candidata a escisión local exclusiva con intención curativa, ¿cuál es el criterio estricto de invasión de la membrana basal?",

        source: "NCCN Clinical Practice Guidelines in Oncology for Anal Carcinoma, 2026, Principles of Surgery, ANAL-A 1 de 2."
    },
    {
        id: 42,
        question: "¿Cuál es la intervención quirúrgica estándar en el cáncer de recto medio e inferior que requiere la extirpación en bloque de las estructuras linfáticas, fascia y tejido adiposo pélvico para disminuir las tasas de recurrencia local y márgenes radiales positivos?",

    },
    {

        question: "Para un adenocarcinoma del tercio superior del recto, se decide realizar una Escisión Parcial del Mesorrecto (PME). Para asegurar un beneficio oncológico equivalente a la TME en esta topografía, ¿cuántos centímetros por debajo del borde distal del tumor debe transeccionarse el mesorrecto?",

        question: "Durante la cirugía oncológica por cáncer de colon, el margen radial es crucial para el pronóstico. Para evitar errores de estadificación patológica en las áreas del colon que carecen de serosa peritoneal, ¿qué acción transoperatoria se recomienda al cirujano?",

    },
    {

        question: "Al evaluar la técnica quirúrgica para cáncer de colon en estadios I a III, la evidencia reciente respalda la Escisión Mesocólica Completa (CME). En comparación con la resección convencional, ¿qué beneficio oncológico ha demostrado esta técnica en la supervivencia?",
        options: ["Menor tasa de sangrado quirúrgico", "Recuperación de la motilidad intestinal", "Mayor supervivencia libre de enfermedad", "Ausencia de dehiscencia anastomótica"],

    {

        question: "Paciente diagnosticado con cáncer de colon distal sincrónico que se presenta al servicio de urgencias con datos de obstrucción intestinal inminente. El tumor es localmente avanzado. ¿Cuál es el abordaje intervencionista de elección que evita la cirugía de urgencia y permite una colectomía electiva posterior?",

        options: ["Displasia de bajo grado superficial", "Focos de inflamación linfocítica", "Márgenes laterales microscópicos menores a 5 mm", "Invasión linfovascular y gemación tumoral"],
        answer: 3,
        justification: "Justificación: La microinvasión de capilares y la desagregación epitelial en la submucosa rectal incrementan astronómicamente la migración de microtrombos celulares a los ganglios pélvicos pararectales que el endoscopista no extirpa. De acuerdo a la GPC de NCCN Cáncer Rectal, cuando estos rasgos están presentes (o hay un tumor pobremente diferenciado), la preservación orgánica del recto deja de ser oncológicamente segura.<br><br>Perla ENARM: La resección de lesiones rectales con ESD se considera curativa cuando presenta márgenes profundos y circunferenciales negativos, profundidad < 1000 µm, y ausencia absoluta de invasión linfovascular o gemación tumoral de alto grado.<br><br>Análisis de Distractores: A) La displasia que corona la lesión mucosa ya fue extraída en bloque por la técnica y no influye biológicamente en la curabilidad profunda. B) La inflamación peritumoral es una respuesta inmune del huésped local que puede reflejar pronóstico variable, pero no cancela la radicalidad de la escisión (a veces es favorable, como en MSI-H). C) Mientras el margen microscópico sea negativo (R0, tejido sano interpuesto, sin tumor en borde diatérmico), una distancia estricta de 5 mm laterales en mucosa no dictamina que la cirugía fracasó, la penetración vertical y vascular sí.",
        source: "NCCN Clinical Practice Guidelines in Oncology for Rectal Cancer, 2026, Principles of Surgery and Locoregional Therapies, REC-C 7 de 9."
    },
    {
        id: 61,
        question: "Para determinar la viabilidad de una resección quirúrgica o un protocolo de preservación de órgano, ¿cuál es la triada de estudios normada para realizar la reestadificación clínica de un paciente con cáncer de recto tras concluir la terapia neoadyuvante?",
        options: ["Ultrasonido endorrectal, colonoscopia y antígeno carcinoembrionario", "Resonancia magnética pélvica, endoscopia y tacto rectal", "Tomografía por emisión de positrones, tacto rectal y biopsia escisional", "Tomografía axial computarizada pélvica, rectosigmoidoscopia y biopsia"],
        answer: 1,
        justification: "Justificación: La evaluación post-tratamiento exige una caracterización morfológica, mucosa y clínica directa del lecho tumoral residual. De acuerdo a la GPC de ESMO Cáncer Rectal, la biopsia sistemática no se aconseja por inflamación actínica, y la tomografía carece de resolución tisular pélvica.<br><br>Perla ENARM: La reestadificación antes de la cirugía o para determinar la preservación del órgano debe comprender resonancia magnética, endoscopia y examen digital del recto (tacto rectal).<br><br>Análisis de Distractores: A) El ultrasonido endorrectal es inferior a la resonancia magnética posterior a la radiación por la distorsión fibrótica y no está recomendado para reestadificar. C) El PET-CT tiene alta tasa de falsos positivos inflamatorios y la biopsia rutinaria no es obligatoria si los tres pilares son congruentes con respuesta completa. D) La tomografía pélvica subestadifica los planos mesorrectales y el estatus del margen circunferencial en comparación a la resonancia.",
        source: "ESMO Clinical Practice Guideline on localised rectal cancer, 2025, Restaging before surgery or organ preservation, Página 11."
    },
    {
        id: 62,
        question: "En un paciente que fue sometido a quimiorradioterapia preoperatoria por adenocarcinoma rectal, ¿a las cuántas semanas de haber concluido la radiación se concentra la mayor probabilidad cronológica de alcanzar una respuesta patológica completa (pCR)?",
        options: ["A las 4 semanas", "A las 10 semanas", "A las 16 semanas", "A los 6 meses"],
        answer: 1,
        justification: "Justificación: El tejido neoplásico irradiado experimenta una regresión paulatina que continúa mucho después del cese de la radiación. De acuerdo a la GPC de NCCN Cáncer Rectal, operar prematuramente sacrifica el máximo encogimiento tumoral, mientras que retrasar excesivamente puede precipitar una fibrosis pélvica densa.<br><br>Perla ENARM: El mejor momento para alcanzar la respuesta patológica completa se reporta a las 10 semanas después de la quimiorradioterapia neoadyuvante, lapso en el que ocurre el 95% de los eventos de pCR.<br><br>Análisis de Distractores: A) A las 4 semanas el edema inflamatorio por mucositis y daño vascular es máximo, con persistencia celular tumoral que posteriormente morirá por apoptosis retardada. C) A las 16 semanas el tejido entra en una fase de fibrosis severa que incrementa la morbilidad quirúrgica en la disección de los planos avasculares. D) Esperar 6 meses sin evidencia clínica de respuesta completa (cCR) se considera una negligencia que expone al paciente a diseminación metastásica y progresión local inoperable.",
        source: "NCCN Clinical Practice Guidelines in Oncology for Rectal Cancer, 2026, Principles of Surgery, MS-12."
    },
    {
        id: 63,
        question: "En el abordaje quirúrgico del cáncer de recto distal que no logró preservación esfinteriana tras neoadyuvancia, se indica una Resección Abdominoperineal (APR). Para evitar recidivas, esta intervención debe incorporar obligatoriamente:",
        options: ["Escisión Parcial del Mesorrecto", "Disección exclusiva submucosa", "Escisión Total del Mesorrecto", "Anastomosis coloanal ultrabaja"],
        answer: 2,
        justification: "Justificación: La amputación del piso pélvico no exime la erradicación del compartimento linfático primario. De acuerdo a la GPC de NCCN Cáncer Rectal, la técnica APR debe ser anatómica y circunferencial, logrando un aclaramiento pélvico idéntico al de una resección anterior pero con cierre perineal definitivo.<br><br>Perla ENARM: Los principios generales para la resección abdominoperineal (APR) incluyen la remoción en bloque del rectosigmoides, recto y ano, y la incorporación obligatoria de la Escisión Total del Mesorrecto (TME).<br><br>Análisis de Distractores: A) La escisión parcial (PME) deja un muñón de mesorrecto inferior el cual en este escenario estaría masivamente infiltrado por la enfermedad. B) La disección submucosa es un procedimiento endoscópico para pólipos o tumores T1 tempranos, no aplicable en una resección pélvica radical mutilante. D) La anastomosis coloanal es fisiológicamente imposible en una APR, ya que el esfínter es extirpado y el paciente requiere una colostomía terminal permanente.",
        source: "NCCN Clinical Practice Guidelines in Oncology for Rectal Cancer, 2026, Principles of Surgery and Locoregional Therapies, REC-C 2 de 9."
    },
    {
        id: 64,
        question: "En la cirugía por cáncer de colon, a diferencia del recto, gran parte de la víscera está peritonizada. ¿Cómo se define el margen circunferencial o radial en aquellos segmentos colónicos que están completamente envueltos por la cavidad peritoneal?",
        options: ["La serosa visceral anterior", "El tejido adiposo epicólico", "El margen de resección mesentérico", "La fascia de Gerota posterior"],
        answer: 2,
        justification: "Justificación: La cavidad libre no opone barrera anatómica resecable para el patólogo en tumores colonicos. De acuerdo a la GPC de NCCN Cáncer de Colon, la única zona de fijación retroperitoneal en segmentos móviles es la lámina que transporta los vasos sanguíneos.<br><br>Perla ENARM: En segmentos colónicos completamente encajados por el peritoneo, el margen de resección mesentérico es el único margen circunferencial relevante para el patólogo.<br><br>Análisis de Distractores: A) La serosa visceral corresponde al peritoneo expuesto libre; si el tumor la perfora es T4a, pero la serosa per se no se clasifica como margen quirúrgico transversal. B) El tejido epicólico (apéndices epiploicos) viaja con la pared intestinal pero no delimita el borde radial profundo de extracción en bloque. D) La fascia de Gerota es el límite retroperitoneal para el abordaje posterior, aplicable solo a colon ascendente y descendente (no peritonizados circunferencialmente).",
        source: "NCCN Clinical Practice Guidelines in Oncology for Colon Cancer, 2026, Principles of Pathologic and Molecular Review, COL-B 2 de 9."
    },
    {
        id: 65,
        question: "Paciente con adenocarcinoma rectal que recibe Terapia Neoadyuvante Total (TNT) con radioterapia de curso corto (SCRT) seguida de quimioterapia. Si se contempla vigilancia no operatoria, ¿en qué momento se debe realizar la primera reestadificación clínica para buscar respuesta completa (cCR)?",
        options: ["A las 4 semanas del inicio de la RT", "A las 12 semanas del inicio de la RT", "A las 8 semanas del inicio de la RT", "A las 24 semanas del inicio de la RT"],
        answer: 1,
        justification: "Justificación: El esquema de curso corto concentra la toxicidad radiorbiológica de forma rápida, pero el aclaramiento tumoral luminal toma tiempo. De acuerdo a la GPC de ESMO Cáncer Rectal, evaluar antes de este umbral genera falsas alarmas de persistencia tumoral y conduce a proctectomías precipitadas e innecesarias.<br><br>Perla ENARM: Para determinar la respuesta clínica completa hacia un abordaje de \"observar y esperar\", la reestadificación está recomendada a las 12 semanas después de iniciar la RT de curso corto (SCRT) o quimiorradioterapia clásica.<br><br>Análisis de Distractores: A) 4 semanas es el tiempo para reevaluar la persistencia aguda o toxicidad tisular si se planeaba cirugía temprana (en abordajes antiguos), no para buscar remisión completa histológica. C) 8 semanas es el tiempo aplicable para evaluar el fin de la quimioterapia de consolidación, pero el reloj general corre desde el impacto de la radiación. D) 24 semanas es el intervalo indicado para la reevaluación secundaria exclusiva de pacientes tratados con inmunoterapia anti-PD1 (dostarlimab) o como consolidación tardía en TNT, pero el primer corte es a las 12 semanas.",
        source: "ESMO Clinical Practice Guideline on localised rectal cancer, 2025, Recommendations, Página 21."
    },
    {
        id: 66,
        question: "En un paciente con cáncer de recto superior sin involucro de la reflexión peritoneal, se decide evitar la Escisión Total del Mesorrecto (TME). ¿Cuál es la principal justificación fisiopatológica para realizar una Escisión Parcial del Mesorrecto (PME) con un margen distal de 5 cm?",
        options: ["Disminuye el riesgo de fístula estercorácea", "Acelera la recuperación del tránsito intestinal", "El drenaje linfático predominante es ascendente", "Evita el uso de radioterapia preoperatoria"],
        answer: 2,
        justification: "Justificación: La agresividad pélvica de la cirugía debe equilibrar la biología oncológica local. De acuerdo a la GPC de ESMO Cáncer Rectal, los tumores ubicados intraperitonealmente rara vez generan metástasis retrógradas (descendentes) en la grasa mesorrectal inferior que se aloja en el piso pélvico.<br><br>Perla ENARM: La PME es oncológicamente suficiente para cáncer de recto superior porque la disección linfática preserva el mesorrecto distal sano, reduciendo morbilidad innecesaria, manteniendo un margen oncológico mesorrectal distal de ≥ 5 cm.<br><br>Análisis de Distractores: A) Las tasas de fístula o dehiscencia anastomótica dependen de la tensión y la isquemia del muñón colónico, no exclusivamente de la PME. B) El tránsito intestinal depende de la manipulación sistémica, del plexo mientérico y la técnica ERAS, no de la preservación de grasa mesorrectal distal estéril. D) La radioterapia preoperatoria se determina por estadios T3/T4 o márgenes amenazados, no por la técnica quirúrgica descendente seleccionada intraoperatoriamente.",
        source: "ESMO Clinical Practice Guideline on localised rectal cancer, 2025, Management of localised disease, Página 3."
    },
    {
        id: 67,
        question: "En una resección anterior baja por un tumor del recto medio, el cirujano evalúa el tejido intestinal sano distal al tumor. ¿Qué longitud de margen distal intramural (pared intestinal) es oncológicamente aceptable si el paciente recibió quimiorradioterapia preoperatoria?",
        options: ["≥ 5 cm", "≥ 2 cm", "< 1 cm", "≥ 3 cm"],
        answer: 2,
        justification: "Justificación: La inducción de muerte celular por la radioterapia esteriliza la pared intestinal microscópicamente y permite anastomosis pélvicas más profundas sin sacrificar la curabilidad. De acuerdo a la GPC de ESMO Cáncer Rectal, la antigua regla de los grandes márgenes de pared ha sido sustituida por cortes más precisos orientados a salvaguardar la continencia.<br><br>Perla ENARM: En ausencia de tratamiento preoperatorio se recomienda un margen de resección distal ≥ 1 cm; después de la terapia neoadyuvante, un margen de resección distal < 1 cm puede considerarse aceptable.<br><br>Análisis de Distractores: A) ≥ 5 cm es la exigencia para el margen mesorrectal distal (la grasa perirrectal extirpada por debajo del tumor), no para la pared intestinal. B) ≥ 2 cm era la regla histórica en tumores no irradiados de recto bajo, pero es excesivamente punitiva post-radiación. D) ≥ 3 cm obligaría casi sistemáticamente a realizar resecciones abdominoperineales en pacientes que podrían haber salvado el esfínter.",
        source: "ESMO Clinical Practice Guideline on localised rectal cancer, 2025, Recommendations, Página 21 y 22."
    },
    {
        id: 68,
        question: "Tras la resección local de un carcinoma del margen anal (perianal) T1N0, el reporte patológico confirma márgenes inadecuados. Si la re-escisión anatómica fallara o estuviese contraindicada, ¿qué abordaje oncológico alternativo establece la evidencia para esterilizar el lecho tumoral?",
        options: ["Quimioterapia exclusiva con FOLFOX", "Radioterapia pélvica más quimioterapia concurrente", "Resección abdominoperineal electiva", "Braquiterapia de alta tasa de dosis aislada"],
        answer: 1,
        justification: "Justificación: La falla en el margen local del carcinoma perianal compromete la supervivencia pero no obliga a una resección mutilante de primera intención. De acuerdo a la GPC de NCCN Cáncer de Ano, el tejido microscópico residual escamoso responde predeciblemente al esquema radiotóxico sensibilizado.<br><br>Perla ENARM: Si los márgenes de una escisión local perianal son inadecuados, la re-escisión es preferida; como alternativa se puede considerar radioterapia local con fluorouracilo/mitomicina o capecitabina/mitomicina.<br><br>Análisis de Distractores: A) La quimioterapia sistémica sola (FOLFOX es para adenocarcinomas, no carcinomas escamosos) no asegura el control espacial local en la zona de disección. C) La resección abdominoperineal (APR) es una cirugía de salvamento para recurrencia o persistencia tras quimiorradiación radical, no es una alternativa inmediata ante un margen microscópico positivo local. D) La braquiterapia puede utilizarse como refuerzo (boost), pero el tratamiento estándar de rescate primario dictamina radioterapia externa acompañada obligatoriamente de agentes quimioterapéuticos radiosensibilizadores.",
        source: "NCCN Clinical Practice Guidelines in Oncology for Anal Carcinoma, 2026, Clinical Presentation, ANAL-1."
    },
    {
        id: 69,
        question: "Durante la reestadificación a las 12 semanas de un paciente que recibió quimiorradiación por cáncer de recto, se identifica un nódulo mucoso irregular menor de 5 mm y leve eritema, congruente con una respuesta \"casi completa\" (near cCR). Si se desea preservar el órgano, ¿en qué intervalo de tiempo se indica la siguiente evaluación clínica?",
        options: ["Después de 16 a 20 semanas", "Después de 4 a 8 semanas adicionales", "Después de 12 a 16 semanas adicionales", "Al año posterior a la evaluación"],
        answer: 1,
        justification: "Justificación: La consolidación tisular tardía es común y puede convertir un lecho en aparente recaída leve en una escara fibrótica verdadera. De acuerdo a la GPC de ESMO Cáncer Rectal, no se debe intervenir agresivamente un tejido en este estado de transición sin darle una oportunidad fisiológica breve para su cicatrización total.<br><br>Perla ENARM: En pacientes con respuesta clínica casi completa (near cCR) documentada a las 12 semanas, se recomienda una reestadificación adicional después de 4 a 8 semanas para consolidar el protocolo de \"observar y esperar\".<br><br>Análisis de Distractores: A) Retrasar la evaluación de 16 a 20 semanas en un tumor posiblemente activo aumenta el riesgo de crecimiento incontrolable en el intersticio de vigilancia. C) 12 a 16 semanas adicionales se considera un tiempo ciego inaceptable ante un lecho sospechoso nodular que requiere diferenciación temprana entre cicatriz o recidiva aguda. D) Una evaluación al año sería negligencia oncológica, propiciando el desarrollo irrestricto de enfermedad locorregional mortal o escape sistémico ganglionar.",
        source: "ESMO Clinical Practice Guideline on localised rectal cancer, 2025, Recommendations, Página 21."
    },
    {
        id: 70,
        question: "En la patología de un paciente con cáncer de recto que fue catalogado de \"alto riesgo\" clínico (cT4b) y programado para cirugía, la GPC actual indica que la utilización de radioterapia de curso corto (SCRT) frente a la quimiorradioterapia estándar se asocia con un mayor riesgo de:",
        options: ["Recurrencia locorregional a 5 años", "Metástasis pulmonares aisladas", "Muerte secundaria a toxicidad hematológica", "Obstrucción intestinal aguda postoperatoria"],
        answer: 0,
        justification: "Justificación: Las modificaciones recientes en las guías NCCN están dictadas por el seguimiento maduro del estudio RAPIDO. De acuerdo a la GPC de NCCN Cáncer Rectal, los esquemas ultra fraccionados en grandes masas neoplásicas pélvicas fallan en esterilizar adecuadamente el tejido perirrectal, incrementando las recaídas pélvicas laterales y pre-sacras inoperables.<br><br>Perla ENARM: Para el cáncer de recto de alto riesgo (cT4, ganglios laterales o invasión a fascia), el seguimiento a 5 años indica una tasa estadísticamente mayor de recurrencia locorregional con radioterapia de curso corto (SCRT) en comparación con el esquema largo estándar.<br><br>Análisis de Distractores: B) La incidencia de metástasis a distancia es dictada principalmente por la biología del tumor inicial (GEM, estatus RAS/BRAF), y los ensayos no demostraron que SCRT las empeorara en comparación a quimiorradiación. C) La SCRT acorta los días de terapia pero la toxicidad sistémica letal no difiere abruptamente del fraccionamiento largo. D) Las oclusiones por adherencias (bridas) están ligadas a la proctectomía en sí, sin evidencia de que la SCRT genere bridas quirúrgicas agudas superiores a la CRT larga.",
        source: "NCCN Clinical Practice Guidelines in Oncology for Rectal Cancer, 2026, Staging and Treatment, REC-3 y REC-6."
    },
    {
        id: 71,
        question: "Para que la Escisión Total del Mesorrecto (TME) demuestre su máximo beneficio oncológico durante una resección anterior baja, la técnica quirúrgica debe realizarse mediante disección cortante a través de un plano avascular específico para no fragmentar el \"paquete tumoral\". ¿Qué estructura anatómica rige este plano y debe preservarse intacta envolviendo la grasa mesorrectal?",
        options: ["Fascia de Waldeyer", "Peritoneo parietal posterior", "Fascia mesorrectal (fascia propia)", "Músculo elevador del ano"],
        answer: 2,
        justification: "Justificación: La rotura mecánica de esta membrana disemina nidos glandulares latentes por toda la pelvis ósea. De acuerdo a la GPC de NCCN Cáncer Rectal, el patólogo califica la calidad de la TME basándose exclusivamente en la integridad de la fascia, siendo una TME completa aquella con fascia prístina sin desgarros.<br><br>Perla ENARM: La TME requiere la remoción en bloque del mesorrecto, las estructuras linfáticas y la fascia mesorrectal envolvente, manteniendo este plano intacto mediante disección cortante para preservar los nervios autonómicos.<br><br>Análisis de Distractores: A) La fascia de Waldeyer es una condensación fibrosa inferior presacra (fascia rectosacra), no la envoltura total mesentérica rectoscópica circunferencial. B) El peritoneo parietal tapiza la pared abdominal posterior superior y lateral; el recto extraperitoneal carece de peritoneo limitante inferiormente. D) Los músculos elevadores actúan como el límite del tercio inferior y determinan las resecciones extra-elevadoras en un APR, pero no envuelven al mesorrecto en el recto medio superior.",
        source: "NCCN Clinical Practice Guidelines in Oncology for Rectal Cancer, 2026, Principles of Pathologic and Molecular Review, REC-B 1 y 2."
    },
    {
        id: 72,
        question: "Se analiza la resonancia magnética pélvica de un paciente con cáncer rectal recién diagnosticado. El radiólogo reporta la presencia de invasión vascular extramural (EMVI+). ¿Qué implicación terapéutica fundamental tiene este hallazgo para el abordaje sistémico antes de cualquier intervención quirúrgica?",
        options: ["Se clasifica como enfermedad sistémica metastásica y no se opera", "Se clasifica como criterio de alto riesgo que indica Terapia Neoadyuvante Total", "Condiciona una resección abdominoperineal primaria obligatoria", "Obliga a prescribir bevacizumab más quimioterapia de inducción"],
        answer: 1,
        justification: "Justificación: La penetración celular en la macro-vascularización submucosa profunda es un indicador feroz de micro-metástasis silentes y falla pélvica inminente. De acuerdo a la GPC de ESMO Cáncer Rectal, la presencia de invasión vascular extramural detectada por RM exige intensificar el control local y sistémico temprano, relegando las opciones conservadoras.<br><br>Perla ENARM: Los criterios de alto riesgo reportados por resonancia magnética incluyen tumor cT4, fascia mesorrectal involucrada (MRF+) e invasión vascular extramural positiva (EMVI+), todos indicaciones estrictas para Terapia Neoadyuvante Total (TNT).<br><br>Análisis de Distractores: A) La EMVI indica alta probabilidad biológica de micrometástasis, pero en ausencia de lesiones macroscópicas M1 en tomografía, sigue considerándose enfermedad locorregional curable. C) La técnica de resección pélvica (RAB o APR) se decide por la distancia al esfínter y la preservación funcional inferior, no por el tropismo vascular mesorrectal del tumor. D) Los agentes biológicos angiogénicos (bevacizumab) no están indicados en el escenario neoadyuvante de la enfermedad localizada etapificada como etapa II-III pélvica, debido al riesgo de complicaciones sin mejora en la sobrevida libre de enfermedad.",
        source: "ESMO Clinical Practice Guideline on localised rectal cancer, 2025, Staging and Risk Assessment, Página 4 y 11."
    },
    {
        id: 73,
        question: "Paciente con adenocarcinoma de recto con deficiencia en la reparación de desajustes (dMMR), en protocolo de inmunoterapia neoadyuvante con dostarlimab. Tras el inicio del medicamento, la primera reestadificación se programa a las 12 semanas. ¿En qué momento se debe realizar la segunda reestadificación clínica de escrutinio para consolidar la estrategia \"observar y esperar\"?",
        options: ["A las 16 semanas del inicio", "A las 24 semanas del inicio", "A las 48 semanas del inicio", "A las 36 semanas del inicio"],
        answer: 1,
        justification: "Justificación: La erradicación mediada por el rescate linfocitario citotóxico exhibe un patrón de contracción tumoral que, de ser exitoso, borra toda la neoplasia macroscópica en un curso semestral estricto. De acuerdo a la GPC de ESMO Cáncer Rectal, la calendarización para esta etiología molecular es imperativa para evitar cirugías ante respuestas inmunes pseudoprogresivas o tardías.<br><br>Perla ENARM: En pacientes con tumores dMMR o MSI-H tratados con inmunoterapia, se recomiendan reestadificaciones seriadas a las 12 y a las 24 semanas tras el inicio del tratamiento con dostarlimab.<br><br>Análisis de Distractores: A) 16 semanas es el margen superior de respuesta a quimiorradiación clásica estándar, no para el umbral largo validado en estudios como OPRA o dostarlimab dMMR. C) Retrasar la valoración crítica hasta las 48 semanas perdería la ventana de rescate quirúrgico en caso de fallo primario de la inmunoterapia o pseudoresistencia no identificada. D) 36 semanas es el tiempo de valoración post-terapia de consolidación (TNT) para tumores pMMR/MSS según protocolos alternativos, no para esquemas exclusivos de inmunoterapia anti-PD1.",
        source: "ESMO Clinical Practice Guideline on localised rectal cancer, 2025, Recommendations, Página 21."
    },
    {
        id: 74,
        question: "Dentro del ensayo clínico multicéntrico (PROSPECT), ¿qué porcentaje mínimo de reducción tumoral evaluada por sigmoidoscopia post-quimioterapia (tras 12 a 16 semanas) es requerido para omitir por completo la quimiorradioterapia pélvica previa a la cirugía transabdominal en cáncer rectal de riesgo intermedio?",
        options: ["> 10%", "> 50%", "> 20%", "> 30%"],
        answer: 2,

                        </a>
                    </div>
                </div>
            `;
        }

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

        function renderActiveQuestion(qData) {
            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0">
                    
                    <div class="flex mb-4">
                        <span class="inline-block bg-pink-50 dark:bg-pink-900/20 text-pink-600 dark:text-pink-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-pink-100 dark:border-pink-800/50">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <form id="q-form-${qData.id}" class="space-y-3">
                        ${qData.options.map((opt, i) => `
                            <label class="flex items-start p-3 sm:p-4 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 has-[:checked]:bg-pink-50 has-[:checked]:border-pink-400 dark:has-[:checked]:bg-pink-900/10 shadow-sm hover:shadow">
                                <input type="radio" name="option" value="${i}" class="mt-0.5 h-4 w-4 text-pink-600 focus:ring-pink-500 border-slate-300 dark:border-slate-600 cursor-pointer">
                                <span class="ml-3 text-sm sm:text-[15px] text-slate-700 dark:text-slate-200 font-medium leading-snug">${opt}</span>
                            </label>
                        `).join('')}
                        
                        <div class="pt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 mt-6">
                            <button type="button" onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-pink-600 dark:hover:bg-pink-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-pink-600 to-rose-600 hover:from-rose-600 hover:to-pink-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('CarectoTxProgress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('CarectoTxLastQId', currentQuestionId);
                else localStorage.removeItem('CarectoTxLastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('CarectoTxProgress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>
