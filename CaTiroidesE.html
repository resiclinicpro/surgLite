        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid y ATA, un cuello operado sufre destrucción masiva de tejido fascial volviendo hostil anatómica y fisiológicamente abordar niveles erradicados. Se autoriza por tanto una extirpación dirigida microscópica centrada exclusivamente en localizar la adenopatía resistente extirpando el bloque tisular específico circundante inmediato para lograr salvataje cervical sin destrozar la viabilidad venosa local.<br><br>Perla ENARM: \"Clinically significant nodal recurrence detected in a previously dissected nodal basin may be treated with a more focused dissection of the region containing the metastatic disease.\"<br><br>Análisis de Distractores: La opción A incrementa dramáticamente y con total letalidad los riesgos reoperatorios de sangrado del gran vaso y parálisis sin beneficio comprobable contra rescates enfocados anatómicos dirigidos en la imagen. La opción D ataca un relevo fascial intermedio central indemne ajeno al sitio metastásico principal laterocervical de recaída actual. La opción C es una medida paliativa para estadios terminales no resecables encajados e invasores musculares macizos que rehusan al control del cirujano hemostático oncológico hábil con curetaje.", 
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Discussion Surgical Management, Página MS-13." 
    },
    {
        id: 56, 
        question: "Músculo cervical referencial usado topográficamente en cortes axiales que permite dividir de forma exacta al nivel linfático submentoniano (Ia) del nivel submandibular (Ib).", 
        options: ["Músculo esternocleidomastoideo", "Vientre anterior del músculo digástrico", "Músculo omohioideo", "Músculo milohioideo profundo"],

        justification: "Justificación: De acuerdo al documento Niveles ganglionares por TAC, ambos vientres anteriores asientan superficialmente por el mentón definiendo de forma clara el margen de división linfática; al centro descansa el bloque submentoniano dependiente del labio inferior, y a los costados de dicha barrera muscular nacen los triángulos glandulares salivales Ib de metástasis transversa superior del macizo facial de cabeza y cuello.<br><br>Perla ENARM: \"Si el ganglio corresponde al nivel I debemos localizar el vientre anterior del músculo digástrico. Si se encuentra medial al mismo, es el nivel Ia; mientras que si se encuentra lateral, corresponde al nivel Ib.\"<br><br>Análisis de Distractores: La opción A demarca la gran vía laterocervical y límite de niveles II/III/IV/V sin interceder en piso de boca. La opción C separa subniveles fasciales peritraqueales bajos pretiroideos anatómicos y límite clínico superior yugular de poca aplicación actual radiológica. La opción D forma verdaderamente el piso muscular oral sin fungir de pilar topográfico divisor estándar axial en estudios de imagenología tumoral por TAC del cuello nivel I superficial y cutáneo nodular primario anterior.", 
        source: "Niveles ganglionares por TAC, 2018, Región superior, Página 120." 
    },
    {
        id: 57, 
        question: "Límite topográfico superior tomográfico y quirúrgico inamovible que delimita el techo de los subniveles cervicales ganglionares correspondientes al Nivel I.", 
        options: ["Sínfisis y cuerpo de la mandíbula", "Borde inferior del hueso hioides", "Vientre anterior del músculo digástrico", "Base del cráneo posterior faríngeo"], 
        answer: 0, 
        justification: "Justificación: De acuerdo al documento Niveles ganglionares por TAC, anatómicamente el compartimento submentoniano y submandibular cuelga del esqueleto facial óseo maxilar de la boca. En una imagenología el borde de hueso dental basal dictamina que todo ganglio debajo nace de la fascia profunda I del área cefálica sin ser parte del encéfalo, yéndose en barrido hasta topar abajo con la corbata muscular del hioides.<br><br>Perla ENARM: \"Se encuentra delimitado hacia superior por la sínfisis mandibular... hacia superior por el cuerpo de la mandíbula.\"<br><br>Análisis de Distractores: La opción B representa el piso o límite inferior que marca el fin anatómico de este compartimento de drenaje para ceder a las estaciones II yugulares o VI prelaringeas medias profundas. La opción C funge como pared vertical septal para dividirlo internamente, no como techo facial óseo craneal anatómico verdadero global para los tumores de cavidad bucal labio y encía. La opción D es la cúpula retrofaríngea alta nivel VII superior para nasofaringe, ajena a este relevo maxilofacial linfático anterógrado primario para ganglios Ib bucales.", 
        source: "Niveles ganglionares por TAC, 2018, Tabla I, Página 119." 
    },
    {
        id: 58, 
        question: "Característica histopatológica que forma parte de los \"Criterios de Turín\" empleada obligatoriamente para diagnosticar un Carcinoma Pobremente Diferenciado de Tiroides.", 
        options: ["Ausencia de características nucleares de carcinoma papilar", "Presencia de células foliculares hiperplásicas benignas", "Formación abundante de estructuras papilares fibrovasculares", "Extensión macroscópica de musculatura infrahioidea"], 
        answer: 0,

        source: "American Thyroid Association Management Guidelines for Adult Patients with Differentiated Thyroid Cancer, 2025, Pathology, Página 849." 
    },
    {
        id: 59, 
        question: "Indicación terapéutica para el control agudo de una hemorragia masiva esperada previo a la resección ósea de una metástasis vertebral dolorosa de carcinoma tiroideo.", 
        options: ["Ablación por yodo radiactivo altas dosis prequirúrgico", "Supresión aguda de TSH con altas dosis levotiroxina", "Embolización preoperatoria selectiva del lecho óseo", "Radioterapia pélvica paliativa aislada profiláctica"], 
        answer: 2, 
        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid, los depósitos sistémicos oseos metastásicos acarrean un hiper-aflujo vascular intratumoral dramático. Intervenir ortopédicamente un hueso friable saturado sin ocluir los canales arteriales aferentes previamente, condena a una exanguinación descontrolada quirúrgica masiva mortal para el paciente diseminado. Por ello la terapia regional intervencionista es el pilar central pre-quirúrgico fundamental preparatorio vital en lesiones portadoras de carga y medulares.<br><br>Perla ENARM: \"Embolization prior to surgical resection of bone metastases should be considered to reduce the risk of hemorrhage.\"<br><br>Análisis de Distractores: La opción A produce lisis de tejido y exacerbación vascular inflamatoria temporal inicial, inútil para estabilizar mecánicamente una vértebra hipervascularizada antes del quirófano. Las opciones B y D carecen de poder vaso-oclusivo rápido para frenar los plexos veno-arteriales neo-formados agresivos que asaltan a un abordaje abierto osteolítico directo agudo en quirófano de forma inminente prequirurgica percutanea transarterial.", 
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Papillary Carcinoma, Página PAP-10."

    {

        question: "Variante del gen RET mutado germinal que permite retrasar la tiroidectomía profiláctica total infantil ante evidencia de calcitonina sérica normal en síndrome MEN2A.",

        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Medullary Carcinoma, Página MEDU-4."

    {
        id: 61,
        question: "Estructura anatómica que define el plano vertical necesario para separar los subniveles ganglionares IIa y IIb en la tomografía computada de cuello.",

        justification: "Justificación: De acuerdo al documento Niveles ganglionares por TAC, el nivel II yugular superior se subdivide empleando el trayecto del nervio accesorio espinal como frontera vertical radiológica y quirúrgica. Todo ganglio situado por delante de este nervio es IIa, y los situados en el receso graso posterior son IIb.<br><br>Perla Quirúrgica: IIa: Está limitado hacia anterior por el músculo estilohioideo y hacia posterior por un plano vertical definido por el nervio accesorio. IIb: Se halla por detrás del plano vertical definido por el nervio accesorio y por delante del borde lateral del músculo esternocleidomastoideo.<br><br>Análisis de Distractores: La opción A marca el límite superior anatómico que separa el compartimento submandibular del yugular superior. La opción B define el margen posterior final del triángulo lateral (Nivel V). La opción D representa la barrera muscular anterior paramediana de los niveles viscerales centrales.",
        source: "Niveles ganglionares por TAC, 2018, Tabla I, Página 119."
    },
    {
        id: 62,
        question: "Edad límite estandarizada para ejecutar obligatoriamente la tiroidectomía profiláctica radical en pacientes con síndrome MEN2B y mutación M918T.",
        options: ["Antes del primer año de vida", "Antes de los cinco años", "En la adolescencia temprana", "Exclusivamente en la edad adulta"],
        answer: 0,
        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid, la mutación M918T en el gen RET delinea el fenotipo MEN2B que conlleva el riesgo más letal y precoz de carcinoma medular de tiroides. Su agresividad biológica exige extirpar la glándula en fase neonatal, invariablemente antes de cumplir los 12 meses de edad para intentar una verdadera curación.<br><br>Perla Quirúrgica: Multiple endocrine neoplasia type 2B (MEN2B) (RET PV): Total thyroidectomy during childhood or at diagnosis. Surgery is recommended during the first year of life for patients with M918T mutation.<br><br>Análisis de Distractores: La opción B (antes de los 5 años) es el umbral para las mutaciones RET de alto riesgo típicas del síndrome MEN2A (ej. A883F o mutaciones del codón 634). Las opciones C y D abandonan al paciente a un desarrollo metastásico regional y sistémico inevitable e inoperable dada la penetrancia del 100% de la enfermedad.",
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Medullary Carcinoma, Página MEDU-3."
    },
    {
        id: 63,
        question: "Marcador tumoral genómico específico que justifica la prescripción de terapia inmunológica con Pembrolizumab en un carcinoma de tiroides refractario a yodo.",
        options: ["Carga mutacional tumoral ≥ 10 mut/Mb", "Reordenamiento cromosómico RET/PTC", "Fusión de los genes NTRK 1 y 3", "Presencia de la mutación BRAF V600E"],
        answer: 0,
        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid, en aquellos tumores irresecables donde han fallado las terapias primarias, la identificación de una inestabilidad microsatelital alta (MSI-H) o una elevada Carga Mutacional Tumoral (TMB-H ≥ 10 mut/Mb) convierte al tumor en candidato ideal para el bloqueo del punto de control PD-1 con pembrolizumab.<br><br>Perla Quirúrgica: Pembrolizumab is also an option for patients with TMB-H (≥10 mut/Mb) disease, based on results of the phase II KEYNOTE-158 trial... Pembrolizumab is also recommended for MSI-H or dMMR tumors that have progressed.<br><br>Análisis de Distractores: Las opciones B, C y D identifican blancos moleculares accionables pero para inhibidores de tirosina cinasa altamente específicos (como pralsetinib para RET, larotrectinib para NTRK y dabrafenib/trametinib para BRAF), no para un anticuerpo monoclonal inmunomodulador directo.",
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Discussion, Página MS-26."
    },
    {
        id: 64,
        question: "Opción de interposición nerviosa empleada primariamente para restaurar el tono de las cuerdas vocales tras el sacrificio quirúrgico por invasión del nervio laríngeo recurrente.",
        options: ["Anastomosis con el nervio frénico", "Anastomosis con el asa cervical", "Ramas del nervio accesorio espinal", "Reubicación del nervio hipogloso"],
        answer: 1,
        justification: "Justificación: De acuerdo al documento Guía ATA 2025, frente a la invasión neoplásica masiva que obliga a amputar el nervio recurrente (parálisis flácida ipsilateral), la rehabilitación foniátrica de rescate intraoperatorio dicta injertar el cabo distal del nervio seccionado conectándolo a la rama motora local del asa cervical (ansa cervicalis), manteniendo volumen y disminuyendo broncoaspiración.<br><br>Perla Quirúrgica: In cases of nerve sacrifice, primary anastomosis is ideal if feasible. Otherwise ansa cervicalis nerve anastomosis to the distal segment may be performed.<br><br>Análisis de Distractores: Las opciones A, C y D corresponden a nervios motores mayores cuya sección yatrogénica crearía déficits torácicos (diafragma), de cintura escapular (hombro) o del habla y deglución severos (lengua) absolutamente desproporcionados e injustificables para una simple medialización laríngea.",
        source: "American Thyroid Association Management Guidelines for Adult Patients with Differentiated Thyroid Cancer, 2025, Initial Management of Thyroid Cancer, Página 870."
    },
    {
        id: 65,
        question: "Criterio diagnóstico de malignidad en neoplasias foliculares que resulta biológicamente imposible de determinar mediante la biopsia por aspiración con aguja fina.",
        options: ["Presencia de células oncocíticas de Hürthle", "Invasión a la cápsula fibrosa y vasos", "Proliferación celular densa microfolicular", "Ausencia de coloide macroscópico denso"],
        answer: 1,
        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid y Bethesda 2023, la citología de una neoplasia folicular (Bethesda IV) solo evalúa la arquitectura celular interna. La distinción entre un adenoma folicular benigno y un carcinoma folicular maligno exige obligatoriamente constatar la ruptura perimetral de la cápsula del tumor o invasión al lumen vascular, lo cual requiere visualizar el tejido intacto bajo el microscopio tras lobectomía.<br><br>Perla Quirúrgica: The diagnosis of follicular carcinoma or oncocytic carcinoma requires evidence of either vascular or capsular invasion, which cannot be determined by FNA.<br><br>Análisis de Distractores: Las opciones A, C y D son los hallazgos microscópicos celulares típicos que precisamente arrojan el diagnóstico incierto de la categoría Bethesda IV, confirmando alta celularidad y ausencia de coloide, pero sin poder dictaminar si el tumor ya escapó al torrente sanguíneo, limitando la conducta a intervenciones diagnósticas formales.",
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Papillary Carcinoma, Página THYR-1."
    },
    {
        id: 66,
        question: "Concentración sérica umbral de hormona estimulante de tiroides requerida para optimizar la captación del yodo radiactivo durante la ablación postoperatoria.",
        options: ["Mayor a 10 mUI/L", "Mayor a 30 mUI/L", "Menor a 0.1 mUI/L", "Menor a 5 mUI/L"],
        answer: 1,
        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid y ATA 2025, la fisiología de los transportadores simportadores de sodio-yodo (NIS) en el remanente tiroideo exige estar sometida a un estrés bioquímico severo que los hiperestimule. Lograr este umbral mayor a 30 mUI/L, ya sea mediante supresión hormonal endógena de 4-8 semanas o inyección alfa recombinante, es vital para evitar el fracaso del radiofármaco.<br><br>Perla Quirúrgica: Patients may be withdrawn from thyroid hormone to allow adequate elevation of TSH (>30 mU/L)... TSH levels should be sufficiently elevated (>30) in 3–6 weeks.<br><br>Análisis de Distractores: La opción A es un valor de hipotiroidismo leve incapaz de lograr captación ablativa yódo ávida efectiva a nivel celular. Las opciones C y D representan las metas de freno y control postoperatorio estándar a largo plazo en pacientes libres de enfermedad o de riesgo intermedio, no las cifras inductivas.",
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Principles of Radiation, Página THYR-C 4 de 5."
    },
    {
        id: 67,
        question: "Morbilidad médica severa y letalidad a largo plazo asociada directamente a la complicación quirúrgica del hipoparatiroidismo definitivo permanente.",
        options: ["Mayor riesgo de insuficiencia hepática", "Mayor mortalidad y evento cardiovascular", "Deterioro acelerado de la agudeza visual", "Inmunosupresión y sepsis por gramnegativos"],
        answer: 1,
        justification: "Justificación: De acuerdo al documento Guía ATA 2025, extirpar o devascularizar inadvertidamente de manera definitiva las glándulas paratiroides durante el vaciamiento del Nivel VI somete al paciente a una rigidez de las paredes vasculares e hipocalcemia persistente. Se ha documentado científicamente que esta alteración condiciona insuficiencia renal prematura, elevación de paros isquémicos y mayor muerte comparado a poblaciones euparatoideas.<br><br>Perla Quirúrgica: Bergenfelz et al. have reported that patients experiencing permanent hypoparathyroidism after total thyroidectomy for benign disease are at an increased risk for renal insufficiency and a cardiovascular event... the risk of death was significantly higher.<br><br>Análisis de Distractores: Las opciones A, C y D son comorbilidades dramáticas desvinculadas por completo del metabolismo fosfocálcico y de la hormona PTH; representan distractores médicos de toxicidad farmacológica sistémica ajena a la lesión iatrogénica de la línea media cervical.",
        source: "American Thyroid Association Management Guidelines for Adult Patients with Differentiated Thyroid Cancer, 2025, Cancer Survivorship, Página 930."
    },
    {
        id: 68,
        question: "Clasificación pronóstica clínica correcta y definitiva que se asigna obligatoriamente a todo carcinoma anaplásico de tiroides que debuta con enfermedad metastásica a distancia.",
        options: ["Estadio IVA", "Estadio IVB", "Estadio IVC", "Estadio IIIC"],
        answer: 2,
        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid (y sistema AJCC), por su altísima y fulminante letalidad biológica, todo cáncer indiferenciado o anaplásico asume un diagnóstico inicial basal en Estadio IV. Aquellos con depósito sistémico a distancia o carga pulmonar documentada se catalogan directamente en el máximo peldaño global de mortalidad: Estadio IVC.<br><br>Perla Quirúrgica: Anaplastic T N M: Stage IVA T1‑T3a N0/NX M0... Stage IVB T1‑T3a N1 M0... Stage IVC Any T Any N M1.<br><br>Análisis de Distractores: La opción A incluye la enfermedad fúngica puramente resecable limitada a la propia glándula. La opción B incluye afección del lecho linfático local pero sin escape sistémico. La opción D no existe en el sistema anaplásico dado que el piso inicial de letalidad arranca universalmente en nivel cuatro sin contemplaciones previas.",
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Staging, Página ST-1."
    },
    {
        id: 69,
        question: "Subniveles ganglionares que no se extirpan rutinariamente durante un vaciamiento lateral terapéutico cervical, a menos que exista evidencia macroscópica u oncológica de enfermedad directa.",
        options: ["Niveles IIa, III y IV", "Niveles III, IV y Vb", "Niveles I, IIb y Va", "Niveles VI y VII pretraqueales"],
        answer: 2,
        justification: "Justificación: De acuerdo al documento Guía ATA 2025, el vaciamiento compartimental lateral estandarizado para cáncer tiroideo abarca el bloque central neurovascular compuesto por IIa, III, IV y Vb. Las regiones anatómicas submandibulares (I), el hueco posterior espinal alto (IIb) y el triángulo espinal superior craneal (Va) están exentos del abordaje profiláctico rutinario por su lejana irrigación linfática de salto tiroidea.<br><br>Perla Quirúrgica: Full compartment dissection of the lateral cervical neck lymph nodes in Levels IIA, III, IV, and VB... Dissection of Levels I, IIB, and VA are not regularly performed but can be considered based on findings suggestive of metastatic disease in these compartments.<br><br>Análisis de Distractores: Las opciones A y B abarcan las dianas obligatorias de resección primordiales para extirpar la yugular interna y la zona inferior espinal. La opción D abarca los territorios centrales propios del abordaje de primer relevo nodal visceral peritraqueal, dictaminando pautas de exéresis quirúrgica por separado y no puramente laterales.",
        source: "American Thyroid Association Management Guidelines for Adult Patients with Differentiated Thyroid Cancer, 2025, Definitions, Página 847."
    },
    {
        id: 70,
        question: "Escala histórica de pronóstico en cáncer diferenciado de tiroides que evalúa las variables: Metástasis, Edad, Resección, Invasión y Tamaño.",
        options: ["Escala TNM", "Sistema MACIS", "Criterios de Turín", "Sistema Bethesda"],
        answer: 1,
        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid, en el transcurso de las décadas se establecieron sistemas formales biológicos para agrupar el grado de letalidad en cáncer diferenciado. El sistema MACIS (Metastasis, Age, Completeness of resection, Invasion, Size) estratifica por puntaje la supervivencia a 20 años prediciendo desenlaces mortales precisos si los umbrales superan el valor de 8.<br><br>Perla Quirúrgica: With incrementally worsening MACIS (Metastasis, Age, Completeness of resection, Invasion, and Size) scores of less than 6, 6 to 6.99, 7 to 7.99, and 8+, however, the 20-year survival rates were 99%, 89%, 56%, and 24%, respectively.<br><br>Análisis de Distractores: La opción A se reserva a la delineación macroscópica estándar americana global (AJCC) basada predominantemente en tumor ganglionar y ganglio, no abarcando resección intrínseca. La opción C diagnostica arquitecturalmente a la variante pobremente diferenciada en microscopio. La opción D categoriza la aspiración celular percutánea para riesgo inicial.",
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Discussion, Página MS-5."
    },
    {
        id: 71,
        question: "Condición fisiológica del paciente que proscribe categóricamente y suspende obligatoriamente de forma temporal la administración de yodo radiactivo postoperatorio sistémico.",
        options: ["Lactancia materna activa", "Índice de masa corporal mayor a 35", "Edad superior a los 65 años", "Alergia cutánea al contraste yodado"],
        answer: 0,
        justification: "Justificación: De acuerdo al documento Guía ATA 2025, la administración ablativa del radioisótopo atraviesa fluidos fisiológicos secretores, yugulando la salud neonatal. Su paso al tejido glandular mamario y leche concentra toxicidad pediátrica masiva que induce daño sistémico infantil grave, por lo cual amamantar debe interrumpirse absolutamente para recibir el isótopo.<br><br>Perla Quirúrgica: Breastfeeding and lactation must cease prior to treatment. In general, release to home is preferred; release to hotel is discouraged.<br><br>Análisis de Distractores: La opción B requerirá calibración dosimétrica corporal total pero sin vetar a la intervención principal. La opción C es de hecho un grupo oncológicamente en extrema necesidad pronóstica para recibir dosis destructivas agresivas por senescencia letal. La opción D no genera reacciones cruzadas autoinmunes fatales con los isótopos inorgánicos no iónicos usados endovenosamente en ablación molecular nuclear pura.",
        source: "American Thyroid Association Management Guidelines for Adult Patients with Differentiated Thyroid Cancer, 2025, Long Term Management, Página 890."
    },
    {
        id: 72,
        question: "Alteración bioquímica laboratorial predominante que se manifiesta en los ensayos inmunométricos rutinarios secundarios a la presencia en sangre de anticuerpos antitiroglobulina (TgAb).",
        options: ["Niveles de tiroglobulina falsamente bajos", "Elevación logarítmica de la hormona TSH", "Niveles de tiroglobulina falsamente altos", "Supresión irreversible de hormona T3 libre"],
        answer: 0,
        justification: "Justificación: De acuerdo al documento Guía ATA 2025, el andamiaje del anticuerpo del paciente se acopla competitivamente bloqueando las áreas de antígeno de la tiroglobulina secretada por el remanente de cáncer, impidiendo que el ensayo del laboratorio logre enlazar sus pruebas fluorescentes; derivando en lectura subclínica falsa \"indetectable\", ocultando metástasis en curso activo.<br><br>Perla Quirúrgica: Immunometric assays are prone to interference from TgAb, which commonly cause falsely low serum Tg measurements.<br><br>Análisis de Distractores: La opción C (falsamente altos) suele ocurrir exclusivamente en interferencia atípica por anticuerpos heterófilos o factor reumatoide, pero de ninguna manera rige el engaño destructivo negativo de las masas de TgAb. Las opciones B y D rigen ejes metabólicos intrínsecos no afectados por este anticuerpo periférico proteico tumoral inerte secretor.",
        source: "American Thyroid Association Management Guidelines for Adult Patients with Differentiated Thyroid Cancer, 2025, Long-term Management, Página 897."
    },
    {
        id: 73,
        question: "Nivel sérico de calcitonina preoperatorio en el carcinoma medular de tiroides que justifica irrefutablemente indicar estudios tomográficos transversales completos del tórax, cuello y hepáticos.",
        options: ["Mayor o igual a 50 pg/mL", "Mayor o igual a 10 pg/mL", "Mayor o igual a 150 pg/mL", "Mayor o igual a 5 pg/mL"],
        answer: 2,
        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid, los volúmenes de enfermedad se correlacionan biológicamente a las métricas del polipéptido sérico. Una carga corporal inferior a este rango implica una probabilidad casi nula de presentar micrometástasis extranodales sistémicas, pero sobrepasando los 150 pg/mL, o más aún 500 pg/mL, se obliga al clínico al escrutinio tomográfico hepático mediastinal ante altas incidencias metastásicas pulmonares silenciosas mortales previas.<br><br>Perla Quirúrgica: Imaging may be indicated based on high burden of disease, calcitonin ≥150 pg/mL, or elevated CEA levels... It is unlikely that there will be radiographic evidence of disease outside of the neck when calcitonin is <150 pg/mL.<br><br>Análisis de Distractores: Las opciones A, B y D son marcadores de enfermedad microfocal temprana paratraqueal sin poder estadístico tumoral biológico para someter rutinariamente a un enfermo asintomático a la radiación invasiva tóxica y costosa de estudios corporales de rastreo multiorgánicos globales oncológicos.",
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Medullary Carcinoma, Página MEDU-5."
    },
    {
        id: 74,
        question: "Región anatómica de la tiroides que representa un remanente embriológico vertical derivado del descenso del conducto tirogloso y asienta tumores papilares frecuentemente asociados al ganglio de Delphian.",
        options: ["Tubérculo de Zuckerkandl posterior", "Lóbulo piramidal", "Istmo inferior", "Ligamento de Berry"],
        answer: 1,
        justification: "Justificación: De acuerdo al documento Guía ATA 2025, esta lengüeta fibromuscular cónica descansa sobre la pared laringotraqueal naciendo del istmo superior. Está presente en casi el 50% de las glándulas sanas y representa el cordón migratorio inmaduro; cualquier carcinoma papilar alojado en el lóbulo piramidal demanda su extirpación franca oncológica.<br><br>Perla Quirúrgica: Almost 50% of all thyroid glands exhibit a pyramidal lobe (a remnant of the inferior portion of a TGD), which extends superiorly from the isthmus and can be connected to the hyoid bone with fibrous tissue. A carcinoma arising in the pyramidal lobe should be staged as usual.<br><br>Análisis de Distractores: La opción A es un engrosamiento topográfico posterolateral folicular íntimamente allegado al nervio recurrente. La opción C conecta transversalmente los polos. La opción D envuelve fascialmente la pared posterior a los anillos de la vía aérea en el surco, anclando firme y peligrosamente la tiroides media baja a la tráquea central inferior.",
        source: "American Thyroid Association Management Guidelines for Adult Patients with Differentiated Thyroid Cancer, 2025, Initial Management of Thyroid Cancer, Página 865."
    },
    {
        id: 75,
        question: "Complicación técnica quirúrgica limitante que incrementa dramáticamente su incidencia durante el vaciamiento cervical central de rescate por recurrencia, si la adenopatía enferma supera los 15 mm.",
        options: ["Necrosis del cartílago traqueal", "Fístula linfática del conducto torácico", "Lesión del nervio laríngeo recurrente", "Rotura de la cúpula pleural apical"],
        answer: 2,
        justification: "Justificación: De acuerdo al documento Guía ATA 2025, la agresión fibrótica en un tejido ya disecado eleva la morbilidad; específicamente, cuando una recidiva ganglionar pretraqueal del nivel VI crece más allá del margen de 15 mm se adhiere y engloba de manera estrecha al parénquima subyacente y nervio recurrente elevando con firmeza la morbilidad yuguladora de parálisis ipsilateral de cuerda transitoria o permanente inminente post-operatoria durante la exéresis obligada ablatoria del rescate quirúrgico focal del cirujano de cuello avanzado.<br><br>Perla Quirúrgica: Those patients with disease >15 mm had a significantly higher incidence of recurrent laryngeal nerve involvement and a higher rate of temporary, but not permanent, vocal cord paresis.<br><br>Análisis de Distractores: Las opciones A y D son incidentes mecánicos por imprudencia masiva, irreales o excepcionales y no documentadas como métricas crecientes asociadas a carga ganglionar linfática. La opción B rige exclusivamente el lecho caudal yugulosubclavio espinal en la base izquierda del compartimento de los vaciamientos venosos nivel IV laterales bajos anatómicos.",
        source: "American Thyroid Association Management Guidelines for Adult Patients with Differentiated Thyroid Cancer, 2025, Advanced Management, Página 905."
    },
    {
        id: 76,
        question: "Condición clínica que típicamente genera falsos positivos durante la medición de tiroglobulina en el lavado de la aguja fina (FNA-Tg) de ganglios cervicales de sospecha.",
        options: ["Presencia en cuello de la glándula tiroides nativa", "Uso de altas dosis de levotiroxina sérica", "Infiltración folicular ganglionar quística", "Pacientes con diagnóstico de NIFTP puro"],
        answer: 0,
        justification: "Justificación: De acuerdo al documento Guía ATA 2025, al existir la propia glándula en la región central del cuello, cualquier trayecto percutáneo de aspiración o derrame intrínseco contamina la cuenca de lavado ecográfica, arrojando valores de tiroglobulina abismales sin que esto confirme siempre el anidamiento microscópico linfoide por tejido primario extirpable.<br><br>Perla Quirúrgica: False positive Tg washout may occur, particularly in lymph nodes in the central compartment when the thyroid gland is still present.<br><br>Análisis de Distractores: La opción B reduce transitoriamente por freno el flujo basal hormonal, no creando picos biológicos irreales. La opción C es de hecho el escenario de oro y justificación ineludible estandarizada para solicitar el lavado molecular con el objeto de frenar fallas citológicas. La opción D al ser indolente encapsulado intraórgano reduce el paso periférico del tejido diseminado.",
        source: "American Thyroid Association Management Guidelines for Adult Patients with Differentiated Thyroid Cancer, 2025, Initial Management of Thyroid Cancer, Página 857."
    },
    {
        id: 77,
        question: "Variantes de tipo histológico en el carcinoma papilar de tiroides descritas por las guías que marcan alto grado de agresividad clínica exigiendo uso postoperatorio sistemático de yodo radiactivo.",
        options: ["Variante clásica y folicular encapsulada", "Variante trabecular y morular cribiforme", "Variante de Warthin-like y oncocítica", "Células altas, hobnail y esclerosante difusa"],
        answer: 3,
        justification: "Justificación: De acuerdo al documento Guía ATA 2025 y NCCN Thyroid, las morfologías tumorales como la variante de células altas (\"Tall Cell\"), la arquitectura destructora difusa esclerosante y la variante en clavo (\"Hobnail\"), rompen rápidamente el lecho microvascular linfático propiciando letalidad clínica locorregional a gran escala, forzando invariablemente terapias sistémicas radicales ablativas químicas.<br><br>Perla Quirúrgica: RAI selectively recommended (if any present)... High-risk subtypes (eg, tall cell, columnar cell, hobnail, diffuse sclerosing, solid/trabecular).<br><br>Análisis de Distractores: Las opciones A y C representan los fenotipos de mejor tasa de contención y curación, muchos de manejo puramente unilateral. La opción B acarrea un manejo sistémico preventivo genético intrafamiliar por su alta asociación a poliposis múltiple sistémica adenomatosa familiar, mas no la extrema indicación yodada inminente de diseminación letal regional de la respuesta correcta.",
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Papillary Carcinoma, Página PAP-6."
    },
    {
        id: 78,
        question: "Recomendación formal estandarizada respecto a la toma rutinaria preoperatoria de niveles bioquímicos de Tiroglobulina o sus anticuerpos para tamizaje de nódulos tiroideos.",
        options: ["Imprescindible para descartar malignidad nodular", "Requerida ante un Bethesda III indeterminado", "Omisión de la medición rutinaria preoperatoria", "Obligatoria en tumores mayores a 4 centímetros"],
        answer: 2,
        justification: "Justificación: De acuerdo al documento Guía ATA 2025, la alta prevalencia de bocios o enfermedad incidental inflamatoria folicular benigna eleva exponencialmente los niveles del coloide; su cuantificación es totalmente inútil e infructífera para poder alertar si un tumor es benigno o un carcinoma agresivo intratiroideo asintomático inicial clínico en el paciente pre-quirúrgico.<br><br>Perla Quirúrgica: Routine preoperative measurement of serum Tg or TgAb levels is not recommended.<br><br>Análisis de Distractores: Las opciones A, B y D fomentan falsamente someter al enfermo a sobre-escrutinio carente del respaldo científico mundial, confundiendo el comportamiento pasivo tisular linfoideo reaccional fisiológico basal normal en la consulta prequirúrgica.",
        source: "American Thyroid Association Management Guidelines for Adult Patients with Differentiated Thyroid Cancer, 2025, Initial Management of Thyroid Cancer, Página 857."
    },
    {
        id: 79,
        question: "Categoría clínica u oncológica en las características de estadificación (TNM 8va edición) para catalogar al carcinoma anaplásico que está localmente limitado a la glándula y no presenta adenopatías.",
        options: ["Estadio Clínico IA", "Estadio Clínico IVA", "Estadio Clínico II", "Estadio Clínico IIIC"],
        answer: 1,
        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid, en el tumor indiferenciado de rápida división celular y de peor mortalidad humana mundial de cabeza, cualquier foco temprano por pequeño que sea y circunscrito totalmente libre en las cápsulas, ingresa forzosamente como Estadio IV resecable y mortal (IVA), para asegurar agresividad desde primer contacto médico sistémico local actínico.<br><br>Perla Quirúrgica: Anaplastic T N M: Stage IVA T1‑T3a N0/NX M0.<br><br>Análisis de Distractores: Las opciones A y C representan cohortes favorables propios y exclusivos del paciente con cáncer diferenciado por debajo del rango de edad crítico, ignorado en el anaplásico. La opción D categorizaba en sistemas antiguos (7ma edición) masas letales agresivas con escape paratraqueal sin saltos distantes que han sido agrupados actualmente en cohortes superiores IV.",
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Staging, Página ST-1."
    },
    {
        id: 80,
        question: "Hallazgo de escrutinio infantil que permite éticamente y médicamente retrasar la tiroidectomía radical primaria preescolar en un síndrome MEN2A con mutación de riesgo alto.",
        options: ["Carga de tumor mutacional negativa", "Función intacta de cuerdas vocales", "Calcitonina basal normal y ecografía libre", "Ausencia de feocromocitoma en TAC"],
        answer: 2,
        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid, si un niño porta en la sangre herencia letal \"Alta\" no extrema (Ej. no codón 634, no MEN2B), las asociaciones médicas eximen al infante de una disección ablativa del cuello temprana solo sí y estricta y únicamente sí la calcitonina se mantiene bioquímicamente indetectable inferior en sangre y su imagen ecográfica pretraqueal del lóbulo es inmaculada.<br><br>Perla Quirúrgica: High-risk (all other PVs): Prophylactic thyroidectomy may be delayed, provided the annual basal calcitonin measurement is normal, the annual ultrasound is unremarkable, and there is no history of aggressive MTC in the family.<br><br>Análisis de Distractores: Las opciones A y B evalúan complicaciones y secuelas adquiridas irreversibles posteriores no predictivas. La opción D exige extirpación suprarrenal primaria curativa antes del quirófano laríngeo para evitar un colapso arrítmico anestésico peroperatorio prequirúrgico mortal, pero su ausencia sistémica sana por sí misma no previene ni retrasa biológicamente el daño medular del cuello que avanza.",
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Medullary Carcinoma, Página MEDU-4."
    },
    {
        id: 81,
        question: "Conducta clínica recomendada para un paciente con un nódulo tiroideo clasificado como Neoplasia Folicular (Bethesda IV) en el cual el análisis molecular reporta un perfil negativo o benigno.",
        options: ["Tiroidectomía total sistemática", "Terapia ablativa con radioyodo", "Vigilancia ecográfica activa", "Lobectomía tiroidea diagnóstica"],
        answer: 2,
        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid, cuando el escrutinio citológico resulta indeterminado pero las pruebas genómicas moleculares indican un fenotipo benigno, el riesgo de malignidad se equipara al de un nódulo Bethesda II (aproximadamente ≤ 4%). Esto exime al paciente de la exploración quirúrgica y justifica la monitorización pasiva del nódulo.<br><br>Perla Quirúrgica: If molecular testing, in conjunction with clinical and ultrasound features, predicts a risk of malignancy comparable to the risk of malignancy seen with a benign FNA cytology (approximately ≤4%), consider nodule surveillance.<br><br>Análisis de Distractores: Las opciones A y D someten al paciente a riesgos quirúrgicos (parálisis neural, hipocalcemia) por un tejido cuya firma genética ha demostrado un comportamiento biológico inocuo. La opción B está proscrita en patología no confirmada como maligna y carece de avidez garantizada sin diagnóstico histológico previo.",
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Nodule Evaluation, Página THYR-2."
    },
    {
        id: 82,
        question: "Escrutinio preoperatorio sistémico obligatorio que debe realizarse antes de intervenir quirúrgicamente a un paciente con Carcinoma Medular de Tiroides para prevenir un evento vascular letal en el quirófano.",
        options: ["Gammagrafía de paratiroides con tecnecio sestamibi", "Resonancia magnética cerebral con gadolinio", "Escrutinio bioquímico de feocromocitoma", "Niveles séricos de tiroglobulina basal"],
        answer: 2,
        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid, el carcinoma medular tiene una altísima asociación genética con la Neoplasia Endocrina Múltiple tipo 2 (MEN2). Ingresar a un paciente a anestesia general sin descartar un feocromocitoma concomitante puede desencadenar una crisis hipertensiva arrítmica mortal inducida por la intubación o el estrés quirúrgico.<br><br>Perla Quirúrgica: Evidence of pheochromocytoma should be evaluated and addressed appropriately before proceeding to the next step on the pathway in patients for whom results from RET PV testing have not yet been received.<br><br>Análisis de Distractores: La opción A evalúa hiperparatiroidismo primario que, aunque es parte del MEN2A, no representa una urgencia de letalidad hemodinámica inmediata en la mesa de operaciones. Las opciones B y D carecen de utilidad biológica en este tipo de tumor derivado de las células parafoliculares (C) productoras de calcitonina.",
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Medullary Carcinoma, Página MEDU-3."
    },
    {

        question: "Fármaco sistémico recomendado para reducir el riesgo de morbilidad mecánica y eventos relacionados al esqueleto en pacientes con metástasis óseas por carcinoma de tiroides.",
        options: ["Denosumab intravenoso o bisfosfonatos", "Calcitonina sintética recombinante", "Teriparatida subcutánea diaria", "Infusión de calcio a altas dosis"],
        answer: 0,
        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid, la enfermedad metastásica osteolítica genera una destrucción estructural masiva con alto riesgo de fracturas patológicas y dolor incapacitante. El uso de moduladores del recambio óseo como los bisfosfonatos intravenosos o el denosumab logra estabilizar la mineralización y frenar la actividad osteoclástica del nido tumoral.<br><br>Perla Quirúrgica: Treatment of metastatic RAI-refractory disease... Consider intravenous bisphosphonate or denosumab.<br><br>Análisis de Distractores: La opción B carece de potencia terapéutica para frenar lesiones metastásicas macizas. La opción C es un agente anabólico contraindicado en presencia de malignidad ósea activa debido al riesgo de proliferación. La opción D agravaría el desequilibrio metabólico sin aportar soporte a la matriz ósea destruida.",
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Papillary Carcinoma, Página FOLL-8."

    {

        question: "Escenario oncológico formal en el que se recomienda emplear la tomografía por emisión de positrones con 18FDG (18FDG-PET/CT) durante el manejo del cáncer diferenciado de tiroides.",
        options: ["Sospecha inicial de nódulos Bethesda III", "Niveles de tiroglobulina elevados con rastreo yodo negativo", "Pacientes de bajo riesgo en vigilancia post-lobectomía", "Evaluación preoperatoria de microcarcinoma papilar"],
        answer: 1,
        justification: "Justificación: De acuerdo al documento Guía ATA 2025, el síndrome de Tiroglobulina Elevada con Gammagrafía Negativa (TENIS) refleja la desdiferenciación celular del tumor, donde pierde la capacidad de captar yodo pero incrementa su metabolismo glucolítico agresivo (efecto Warburg), volviéndose intensamente ávido e identificable en el PET con fluorodesoxiglucosa.<br><br>Perla Quirúrgica: Imaging using 18FDG-PET/CT scanning may be performed in patients with DTC at high risk of recurrence with elevated serum Tg levels, particularly in patients with OTC or aggressive histologies and in patients who have a history of negative RAI imaging.<br><br>Análisis de Distractores: Las opciones A, C y D corresponden a estadios indolentes y metabólicamente inactivos o microscópicos que carecen de captación glucolítica significativa, por lo que el uso de radiación sistémica de positrones generaría un gasto inútil y falsos negativos abundantes.",

    },
    {

        options: ["No se recomienda su uso rutinario preventivo", "Disminuye significativamente el riesgo de hematoma", "Previene el desarrollo de hipoparatiroidismo", "Acorta los días de estancia intrahospitalaria"],
        answer: 0,
        justification: "Justificación: De acuerdo al documento Guía ATA 2025, el uso de drenajes en el cuello posterior a una extirpación glandular limpia no previene la colección sanguínea aguda (hematoma sofocante); por el contrario, prolonga el internamiento, aumenta las tasas de infección del sitio quirúrgico y condiciona dolor local sin aportar ventajas oncológicas.<br><br>Perla Quirúrgica: Under most circumstances, drainage of the thyroidectomy bed is not recommended; it is associated with increased length of stay, may increase infections, and does not reduce the incidence of hematoma.<br><br>Análisis de Distractores: Las opciones B y D exponen las creencias quirúrgicas históricas erróneas que han sido refutadas categóricamente mediante ensayos aleatorizados recientes. La opción C es un absurdo anatómico, ya que el drenaje físico no mejora el suplemento sanguíneo capilar de las glándulas paratiroides conservadas.",

    {

        question: "Estrategia quirúrgica intraoperatoria indicada al constatar el retiro o la desvascularización irreversible de una glándula paratiroides durante el vaciamiento del nivel VI.",
        options: ["Crioterapia de la glándula in situ", "Autotransplante en músculo esternocleidomastoideo", "Resección y desecho del tejido isquémico", "Ligadura del pedículo vascular superior tiroideo"],
        answer: 1,
        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid, salvar el metabolismo fosfocálcico del paciente es imperativo. Cuando la paratiroides pierde su pedículo irrigador se debe fragmentar en cortes milimétricos y reimplantarse en bolsillos musculares vecinos (esternocleidomastoideo) para permitir su revascularización por neovascularización capilar en las siguientes semanas.<br><br>Perla Quirúrgica: During primary operative procedure and parathyroid exploration: If multiglandular disease, autotransplant or leave the equivalent mass of one normal parathyroid gland.<br><br>Análisis de Distractores: La opción A somete al tejido a necrosis por frío sin viabilidad de rescate endocrino. La opción C condena al enfermo al hipoparatiroidismo permanente yatrogénico y a complicaciones neuromusculares graves. La opción D asfixia el aporte circulatorio cefálico acelerando la necrosis de las paratiroides superiores sanas restantes.",

    {

        question: "Actividad administrada (dosis) de yodo radiactivo de primera línea sugerida para la ablación exitosa del remanente en pacientes con carcinoma diferenciado clasificados como T1b/T2 cN0.",
        options: ["150 a 200 mCi", "10 a 20 mCi", "30 a 50 mCi", "200 a 250 mCi"],
        answer: 2,
        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid, en el contexto de ablación preventiva de remanente para destruir tejido sano posterior a la cirugía en pacientes de riesgo bajo e intermedio-bajo (ausencia de ganglios masivos o invasión extratiroidea), el uso de bajas dosis ha demostrado ser no inferior al uso de dosis destructivas, minimizando el riesgo de neoplasias secundarias.<br><br>Perla Quirúrgica: If RAI ablation is used in T1b/T2 (1–4 cm), clinical N0 disease, in the absence of other adverse pathologic, laboratory, or imaging features, 30–50 mCi of iodine-131 is recommended.<br><br>Análisis de Distractores: La opción A representa el espectro de dosificación radical para enfermedad metastásica a distancia documentada estructuralmente o afección ganglionar extracapsular voluminosa masiva. La opción D sobrepasa los umbrales de seguridad hematológica empírica. La opción B corresponde a dosis de rastreo diagnóstico obsoleto, sin capacidad citotóxica real ablativa.",
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Principles of Radiation, Página THYR-C 1 de 5."
    },
    {
        id: 88,
        question: "Terapia molecular dirigida de primera línea con nivel de evidencia alto recomendada para tumores sólidos tiroideos avanzados portadores de la fusión del gen NTRK.",

        answer: 2,
        justification: "Justificación: De acuerdo al documento Guía ATA 2025, el descubrimiento del driver oncogénico neurotrófico tirosina cinasa (NTRK) revolucionó la oncología de precisión. Larotrectinib (y Entrectinib) son inhibidores sumamente selectivos para esta alteración genómica agnóstica que logran respuestas dramáticas y duraderas en masas tumorales progresivas inoperables y refractarias a yodo.<br><br>Perla Quirúrgica: In patients with progressive RAIR DTC harboring an oncogenic NTRK fusion, NTRK-targeted therapy (e.g., larotrectinib or entrectinib) is recommended in the first line.<br><br>Análisis de Distractores: La opción B ataca exclusivamente a las fusiones del gen RET. La opción A inhibe mutaciones puntuales en el dominio de BRAF V600E. La opción D es un inhibidor multiciansa (VEGFR) no selectivo usado de manera empírica como terapia sistémica de amplio espectro cuando no existen dianas accionables genómicas puras detectadas en secuenciación profunda.",

        options: ["Quimioterapia intensiva con doxorrubicina", "Terapia neoadyuvante con dabrafenib y trametinib", "Radioterapia paliativa en cuello exclusiva", "Traqueostomía profiláctica aislada urgente"],
        answer: 1,
        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid, en el carcinoma más letal conocido (Anaplásico), constatar la presencia del gen BRAF mutado permite utilizar la combinación de inhibidores de quinasa para reducir el volumen tumoral masivo, transformando un escenario inoperable y fatal a corto plazo en un lecho anatómicamente citorreductible y quirúrgicamente limpio para rescate locorregional posterior (neoadyuvancia).<br><br>Perla Quirúrgica: Neoadjuvant dabrafenib/trametinib for BRAF V600E-mutated ATC may be considered for patients with resectable disease.<br><br>Análisis de Distractores: La opción A posee tasas de respuesta precarias (<15%) ante la biología agresiva indiferenciada. Las opciones C y D condenan al paciente a la asfixia estructural inevitable a corto plazo por abandono de estrategias citorreductoras formales, aceptando meramente la asfixia locorregional invasiva como evento terminal natural sin intención de rescate farmacológico oncológico curativo.",
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Anaplastic Carcinoma, Página ANAP-3 y MS-40."

        options: ["Respuesta excelente", "Respuesta estructuralmente incompleta", "Respuesta indeterminada", "Respuesta bioquímicamente incompleta"],
        answer: 2,
        justification: "Justificación: De acuerdo al documento Guía ATA 2025, en la reclasificación dinámica de riesgo, los hallazgos subcentimétricos no biopsiables o la pura presencia de anticuerpos que no se elevan de forma logarítmica sugieren detritos inflamatorios en aclaramiento, sin que puedan categorizarse categóricamente como enfermedad maligna franca persistente ni como curación prístina.<br><br>Perla Quirúrgica: Indeterminate response: nonspecific biochemical or structural findings, which cannot be confidently classified as either benign or malignant. This includes patients with stable or declining TgAb levels without definitive structural evidence of disease.<br><br>Análisis de Distractores: La opción A exige tiroglobulina basal y anticuerpos indetectables universalmente. La opción B define enfermedad macroscópica visible en imagen o biopsia de recaída ganglionar o metastásica. La opción D implica que el biomarcador (Tg o TgAb) se encuentra en curva ascendente proliferativa comprobada que dicta recurrencia inminente pero aún microscópica invisible en imagen estructural.",
        source: "American Thyroid Association Management Guidelines for Adult Patients with Differentiated Thyroid Cancer, 2025, Long-term Management, Página 881."

        answer: 1,
        justification: "Justificación: De acuerdo al documento Guía ATA 2025, el tejido salival concentra fisiológicamente el radioyodo provocando inflamación estéril de los conductos (sialadenitis y xerostomía crónica). La dilatación y lavado con esteroides intraconductuales o extracción de tapones fibrosos a través de endoscopios submilimétricos representa la terapia de salvamento estructural de elección conservadora más eficaz.<br><br>Perla Quirúrgica: Interventional sialendoscopy for treatment of radioiodine-induced sialadenitis... Therapeutic sialendoscopy for the management of radioiodine sialadenitis.<br><br>Análisis de Distractores: La opción A suma daño actínico letal a una glándula ya fibrosada y quemada por isótopos. La opción C es el manejo endocrino del primario del cuello sin injerencia fisiológica periférica salival excretora oral. La opción D asume un abordaje radical quirúrgico abierto externo injustificable por morbilidad neural y cicatricial estética ante una estenosis canalicular benigna tratable intrabucal.",
        source: "American Thyroid Association Management Guidelines for Adult Patients with Differentiated Thyroid Cancer, 2025, RAI Therapy, Página 963."

    {

        question: "Rasgo ecográfico morfológico en la matriz sólida del nódulo tiroideo que confiere el puntaje más alto de agresividad (3 puntos) dentro del sistema estratificador ACR TI-RADS.",
        options: ["Anillo de calcificación periférica fina", "Macrocalcificaciones con sombra acústica posterior", "Artefactos grandes refringentes en cola de cometa", "Focos ecogénicos punteados"],

        justification: "Justificación: De acuerdo al documento ACR TI-RADS, la presencia de calcificaciones submilimétricas brillantes sin sombra se correlaciona con la visualización patológica de cuerpos de psamoma intralesionales, siendo uno de los predictores independientes más altos y ominosos de carcinoma papilar infiltrante estructural.<br><br>Perla Quirúrgica: Punctate echogenic foci are smaller than macro-calcifications and are nonshadowing. In the solid components of thyroid nodules, they may correspond to the psammomatous calcifications associated with papillary cancers and are therefore considered highly suspicious... Punctate echogenic foci (3 points).<br><br>Análisis de Distractores: La opción A abarca fenómenos de esclerosis encapsulada reaccional sumando solo 2 puntos. La opción B rinde 1 punto en la estratificación por su débil correlación maligna aislada pura intrínseca. La opción C representa detritos de coloide gelatinoso microquístico que descartan rotundamente la malignidad restando peso oncológico sospechoso por completo a la arquitectura del nódulo (0 puntos).",
        source: "ACR Thyroid Imaging, Reporting and Data System (TI-RADS): White Paper of the ACR TI-RADS Committee, 2017, Echogenic Foci, Página 591."
    },
    {
        id: 93,
        question: "Referencia anatómica fisiológica vertical precisa que demarca la finalización del compartimento glótico y el inicio del compartimento subglótico en la laringe.",

        answer: 2,
        justification: "Justificación: De acuerdo al documento MD Anderson, la laringe es segmentada oncológicamente en tres pisos por diferencias de drenaje linfático. La zona cordal verdadera que conforma la glotis se extiende caudalmente exactamente un centímetro distal desde la unión del vértice ventricular; traspasar esa línea imaginaria implica invasión al espacio de mucosa de la subglotis respiratoria pura, alterando el abordaje y el riesgo linfático traqueal.<br><br>Perla Quirúrgica: La glotis incluye la mitad inferior del ventrículo, las cuerdas vocales, incluidas las comisuras anterior y posterior, y la zona que se extiende 1 cm por debajo del vértice del ventrículo.<br><br>Análisis de Distractores: La opción A pertenece enteramente al complejo digestivo límite de la supraglotis superior y faringe posterior libre. La opción B define el final definitivo y el escape oncológico extracartilaginoso hacia la tráquea membranosa cervical, finalizando allí por completo el órgano laríngeo y la disección subglótica caudal del tumor masivo.",
        source: "Cáncer de Cabeza y Cuello, MD Anderson Cáncer de Tiroides y Neoplasias de las Glándulas Paratiroides, Laringe, Página 170."
    },
    {
        id: 94,
        question: "Conducta de seguimiento recomendada para un nódulo ecográficamente clasificado como de alta sospecha de malignidad (TR5) que mide únicamente 0.6 cm en su diámetro máximo.",
        options: ["Biopsia por aspiración con aguja fina inmediata", "Alta clínica oncológica ante el bajo riesgo", "Seguimiento ecográfico anual por 5 años", "Resección endoscópica preventiva transoral"],
        answer: 2,
        justification: "Justificación: De acuerdo al documento ACR TI-RADS, las lesiones sospechosas subcentimétricas (menores a 1 cm) no justifican punción debido al nulo impacto en supervivencia temprana, por lo cual se integran a un protocolo de vigilancia estricto anual durante un quinquenio para documentar si expresan latencia inofensiva prolongada o crecimiento milimétrico acelerado que justifique ablación eventual de rescate.<br><br>Perla Quirúrgica: For a TR5 lesion, we recommend scans every year for up to 5 years. For a TR4 lesion, scans should be done at 1, 2, 3, and 5 years.<br><br>Análisis de Distractores: La opción A está contraindicada por la inmensa letalidad de sobrediagnósticos poblacionales microquirúrgicos sin repercusión biológica mortal en cuellos vírgenes T1a N0. La opción B expone negligentemente al enfermo a que la neoplasia incremente su tamaño evadiendo control de su oncólogo, comprometiendo nervios y vasos silentes en la década siguiente locorregional.",
        source: "ACR Thyroid Imaging, Reporting and Data System (TI-RADS): White Paper of the ACR TI-RADS Committee, 2017, Timing of Follow-up Sonograms, Página 593."

    {
        id: 95,
        question: "Intervalo de tiempo fisiológico requerido para mantener suspendida la levotiroxina postoperatoria, con el objetivo de elevar la TSH por arriba de >30 mUI/L previo a terapia con radioyodo.",
        options: ["Retiro hormonal por 1 a 2 semanas", "Retiro hormonal por 3 a 6 semanas", "Suspensión temporal aguda por 3 días", "Supresión ininterrumpida sin retiro de levotiroxina"],
        answer: 1,
        justification: "Justificación: De acuerdo al documento Guía NCCN Thyroid, la vía metabólica endógena para estimular el transportador de yodo de membrana exige privar al paciente de su suplencia hormonal oral hasta sumirlo en un hipotiroidismo profundo franco. Lograr este umbral meta fisiológico celular eficaz de TSH estimulante requiere sistemáticamente una depuración biológica sanguínea no inferior a las 3 a 6 semanas.<br><br>Perla Quirúrgica: Patients may be withdrawn from thyroid hormone to allow adequate elevation of TSH (>30 mU/L)... TSH levels should be sufficiently elevated (>30) in 3–6 weeks.<br><br>Análisis de Distractores: La opción A es insuficiente, la vida media biológica de la tiroxina periférica unida a proteínas rige los 7 días séricos impidiendo despuntes rápidos de la hipófisis craneal. La opción C no brinda aclaramiento basal metabólico del receptor nuclear celular. La opción D obligaría a utilizar imperativamente el recurso costoso de la hormona estimulante recombinante (rhTSH) alfa inyectada intramuscular exógena, sin retiro fisiológico verdadero.",
        source: "NCCN Clinical Practice Guidelines in Oncology: Thyroid Carcinoma Version 1.2026, Principles of Radiation, Página THYR-C 4 de 5."
    },
    {
        id: 96,
        question: "Estructura fibroelástica anatómica de la laringe subglótica que funge biológicamente como una fuerte barrera de contención contra la diseminación lateral del carcinoma primario intraluminal invasor.",
        options: ["Cartílago epiglótico y banda ventricular", "Ligamento cricotiroideo y cartílago aritenoides", "Cono elástico", "Músculo constrictor inferior y fascia faringobasilar"],
        answer: 2,
        justification: "Justificación: De acuerdo al documento MD Anderson, la región glótica e infraglótica se anclan internamente desde el anillo del cartílago cricoides hasta las cuerdas vocales verdaderas mediante esta aponeurosis tisular rígida. Esta firmeza fibro-ligamentaria blinda al estuche respiratorio interno, bloqueando el escape del cáncer mucoso linfoide y explicando las altísimas tasas de rescate curativo parcial de cuerda en estadios incipientes locales anatómicos.<br><br>Perla Quirúrgica: El cono elástico se extiende desde el borde superior del cartílago cricoides hasta la superficie inferior de las cuerdas vocales para unirse con el ligamento vocal. Esta estructura es una fuerte barrera para la extensión lateral del cáncer desde la glotis y la subglotis y también explica la relativa escasez de drenaje linfático en la zona.<br><br>Análisis de Distractores: Las opciones A y B representan el andamiaje supraglótico superior alto hipervascular y perforado, siendo zonas de altísima laxitud tisular que promueven invasión ganglionar bilateral cervical temprana. La opción D delimita la musculatura posterior del esófago y pared deglutoria hipofaríngea externa, ajena a la laringe cartilaginosa estricta interna cordal glótica de las cuerdas falsas y verdaderas oncológicas.",
        source: "Cáncer de Cabeza y Cuello, MD Anderson Cáncer de Tiroides y Neoplasias de las Glándulas Paratiroides, Laringe, Página 170."
    },
    {
        id: 97,
        question: "Conducta terapéutica inicial recomendada para un nódulo que presenta un resultado citopatológico compatible con Sospechoso de Malignidad (Bethesda V) en la punción por aguja fina.",

        function setupEventListeners() {

                    const id = parseInt(box.dataset.id);
                    const qObj = questionsData.find(q => q.id === id);
                    if(!qObj) return;
                    const matchText = qObj.question.toLowerCase().includes(term);
                    box.style.display = (term === '' || matchText || id.toString() === term) ? 'flex' : 'none';
                });
            });

            });
            document.getElementById('confirm-reset').addEventListener('click', () => {

                localStorage.removeItem('CATIROIDESLastQId');
                window.location.reload();

            let base = "q-box-item flex items-center justify-center aspect-square rounded-md font-bold text-sm cursor-pointer transition-all select-none border ";
            
            if (isActive) base += "ring-4 ring-pink-500 shadow-md z-10 border-pink-500 dark:border-pink-400 ";

            const state = userProgress[qId];
            if (!state || !state.answered) {
                return base + "bg-slate-100 text-slate-500 border-slate-200 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-400 dark:border-slate-700 dark:hover:bg-slate-700";
            } else if (state.isCorrect) {
                return base + "bg-emerald-100 text-emerald-700 border-emerald-300 dark:bg-emerald-900/30 dark:text-emerald-400 dark:border-emerald-800";
            } else {
                return base + "bg-rose-100 text-rose-700 border-rose-300 dark:bg-rose-900/30 dark:text-rose-400 dark:border-rose-800";
            }
        }

            ).join('');

        function displayQuestion(qId) {
            const displayArea = document.getElementById('module-display');
            const progressContainer = document.getElementById('progress-container');
            const dashboardBtn = document.getElementById('dashboard-button');
            const menuToggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            if (!displayArea) return;
            
            displayArea.classList.add('opacity-0');

            setTimeout(() => {
                currentQuestionId = qId ? parseInt(qId) : null;
                saveProgress();

                if (!currentQuestionId) {
                    progressContainer.classList.add('hidden');
                    dashboardBtn.classList.add('hidden');
                    menuToggle.classList.add('hidden');
                    
                    // Asegurar que el sidebar se oculte en la pantalla de inicio en escritorio
                    sidebar.classList.remove('lg:translate-x-0');
                    document.getElementById('main-content').classList.remove('lg:ml-80');
                    
                    renderSidebarGrid();
                    displayWelcomeScreen();
                    displayArea.classList.remove('opacity-0');
                    document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                // Mostrar botones superiores (Izquierda y Derecha) al entrar a la pregunta
                dashboardBtn.classList.remove('hidden');
                menuToggle.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                
                // Alineación del botón dashboard según si el sidebar está abierto
                if (window.innerWidth >= 1024) {
                    // Desplegar automáticamente la barra al entrar a contestar en escritorio
                    sidebar.classList.add('lg:translate-x-0');
                    document.getElementById('main-content').classList.add('lg:ml-80');

                    if (sidebar.classList.contains('lg:translate-x-0')) {
                        dashboardBtn.classList.add('lg:left-[22rem]');
                        dashboardBtn.classList.remove('lg:left-8');
                    } else {
                        dashboardBtn.classList.remove('lg:left-[22rem]');
                        dashboardBtn.classList.add('lg:left-8');
                    }
                } else {
                    // Ocultar Sidebar en Móvil al entrar a la pregunta
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
                
                const qData = questionsData.find(q => q.id === currentQuestionId);
                if (!qData) return displayQuestion(null);
                
                const qState = userProgress[currentQuestionId];
                if (qState && qState.answered) renderAnsweredQuestion(qData, qState);
                else renderActiveQuestion(qData);

                renderSidebarGrid();
                displayArea.classList.remove('opacity-0');
                
                document.getElementById('main-content').scrollTo(0, 0);
            }, 150); 
        }

                                Atrás
                            </button>
                            <button type="button" onclick="submitAnswer(${qData.id})" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-pink-600 dark:hover:bg-pink-500 dark:hover:text-white transition-colors text-sm uppercase tracking-wider">
                                Validar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function renderAnsweredQuestion(qData, qState) {
            const isCorrect = qState.isCorrect;
            const userAnswer = qState.selectedOption;
            const currentIndex = questionsData.findIndex(q => q.id === qData.id);
            const nextQuestion = currentIndex + 1 < questionsData.length ? questionsData[currentIndex + 1] : null;

            let html = `
                <div class="bg-white dark:bg-slate-900 p-5 sm:p-8 rounded-[1.5rem] shadow-sm border-t-[5px] border-b border-l border-r border-slate-200 dark:border-slate-800 max-w-4xl mx-auto mt-0 ${isCorrect ? '!border-t-emerald-500' : '!border-t-rose-500'}">
                    
                    <div class="flex items-start mb-4">
                        <span class="inline-block bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-3 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold tracking-widest uppercase border border-slate-200 dark:border-slate-700">
                            Pregunta ${qData.id}
                        </span>
                    </div>

                    <h2 class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mb-6 leading-snug">${qData.question}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${qData.options.map((opt, i) => {
                            let classes = "flex items-start p-3 sm:p-4 border rounded-xl ";
                            let icon = "";
                            
                            if (i === qData.answer) {
                                classes += "bg-emerald-50 border-emerald-300 dark:bg-emerald-900/20 dark:border-emerald-700 shadow-sm";
                                icon = `<svg class="w-5 h-5 text-emerald-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
                            } else if (i === userAnswer) {
                                classes += "bg-rose-50 border-rose-200 dark:bg-rose-900/20 dark:border-rose-800 opacity-90";
                                icon = `<svg class="w-5 h-5 text-rose-500 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            } else {
                                classes += "bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-50";
                            }

                            return `
                                <div class="${classes}">
                                    <span class="text-sm sm:text-[15px] font-medium leading-snug pr-4 ${i === qData.answer ? 'text-emerald-800 dark:text-emerald-200' : (i === userAnswer ? 'text-rose-800 dark:text-rose-200' : 'text-slate-600 dark:text-slate-400')}">${opt}</span>
                                    ${icon}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- JUSTIFICACIÓN -->
                    <div class="bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700 rounded-xl p-4 sm:p-5 mb-6">
                        <h4 class="font-bold text-blue-900 dark:text-blue-400 mb-2 text-[11px] uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Justificación Clínica
                        </h4>
                        <p class="text-slate-700 dark:text-slate-300 text-xs sm:text-sm leading-relaxed mb-3">${qData.justification}</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest border-t border-blue-200/50 dark:border-slate-700 pt-3">
                            <span class="font-bold">Fuente:</span> ${qData.source}
                        </p>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-800 mt-6">
                        <button onclick="goToPreviousQuestion(${qData.id})" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 text-sm font-bold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Atrás
                        </button>
                        ${nextQuestion ? `
                            <button onclick="displayQuestion(${nextQuestion.id})" class="bg-gradient-to-r from-pink-600 to-rose-600 hover:from-rose-600 hover:to-pink-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                                Siguiente
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        ` : `
                            <button onclick="displayQuestion(null)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors text-sm uppercase tracking-wider">
                                Finalizar
                            </button>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('module-display').innerHTML = html;
        }

        function submitAnswer(qId) {
            const form = document.getElementById(`q-form-${qId}`);
            if(!form) return;
            const selected = form.querySelector('input[name="option"]:checked');
            if (!selected) return;

            const val = parseInt(selected.value);
            const qData = questionsData.find(q => q.id === qId);

            userProgress[qId] = {
                answered: true,
                selectedOption: val,
                isCorrect: val === qData.answer
            };

            saveProgress();
            updateProgressBar();
            renderAnsweredQuestion(qData, userProgress[qId]);
            renderSidebarGrid();
            document.getElementById('main-content').scrollTo(0, 0);
        }

        function updateProgressBar() {
            const total = questionsData.length; 
            const ans = Object.keys(userProgress).filter(id => userProgress[id].answered).length;
            const pct = total > 0 ? Math.round((ans / total) * 100) : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) { 
                bar.style.width = pct + '%'; 
                bar.textContent = pct > 0 ? pct + '%' : ''; // Solo muestra el número si es mayor a 0
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('CATIROIDESProgress', JSON.stringify(userProgress));
                if(currentQuestionId) localStorage.setItem('CATIROIDESLastQId', currentQuestionId);
                else localStorage.removeItem('CATIROIDESLastQId');
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('CATIROIDESProgress');
                userProgress = saved ? JSON.parse(saved) : {};
            } catch(e) { userProgress = {}; }
            updateProgressBar();
        }

        function loadTheme() {
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
                document.getElementById('sun-icon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        }
    </script>
